# With this in place, choosing Kubernetes over OpenShift is a patch instead of
# "delete the Route block from the shared file", which is the sort of local edit
# that ends up committed by accident. It also lets ArgoCD manage the directory
# without anyone hand-editing manifests.yaml per environment.
#
#   oc apply -k deploy/                          # OpenShift, Route included
#   kubectl apply -k deploy/overlays/kubernetes  # once you add that overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - manifests.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: pennant
      app.kubernetes.io/part-of: pennant

images:
  - name: pennant
    newTag: 0.14.0
