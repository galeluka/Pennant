<!-- Pennant repository logo. Copyright (c) 2026 Luka Gale. MIT licence.

     Mark, wordmark, descriptor. Fixed black and red rather than currentColor,
     because GitHub renders README images on both light and dark backgrounds and
     an inherited colour would vanish on one of them. The mast is dark grey, not
     pure black, so it survives dark mode without a second file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 112" width="520" height="112"
     role="img" aria-label="Pennant — knowledge engineering studio">
  <title>Pennant — knowledge engineering studio</title>

  <!-- mast, drawn: bowed, with a foot -->
  <path d="M30 16 C 36 44, 34 66, 28 92" fill="none" stroke="#3A3A3C"
        stroke-width="4.4" stroke-linecap="round"/>
  <path d="M14 95 C 30 88, 46 90, 62 94" fill="none" stroke="#3A3A3C"
        stroke-width="3.8" stroke-linecap="round"/>

  <!-- two pennants: the gale warning. One alone is a small craft advisory, so
       the count is the meaning. -->
  <path d="M33 22 L 150 26 L 33 50 Z" fill="#D40000"/>
  <path d="M31 58 L 148 62 L 31 86 Z" fill="#D40000" opacity=".5"/>

  <!-- the mesh the flag is cut from -->
  <g fill="#D2D4D5">
    <circle cx="170" cy="30" r="2"/><circle cx="186" cy="30" r="2"/>
    <circle cx="170" cy="46" r="2"/><circle cx="186" cy="46" r="2"/>
    <circle cx="170" cy="62" r="2"/><circle cx="186" cy="62" r="2"/>
    <circle cx="170" cy="78" r="2"/><circle cx="186" cy="78" r="2"/>
  </g>

  <text x="216" y="52" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="30" font-weight="800" letter-spacing="9" fill="#3A3A3C">PENNANT</text>
  <text x="218" y="76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="10.5" font-weight="700" letter-spacing="3.4" fill="#8E8E93">KNOWLEDGE ENGINEERING STUDIO</text>
</svg>
