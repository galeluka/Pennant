}

function docPurpose(m){ return (m && DOC_PURPOSE[m.docPurpose]) ? m.docPurpose : null; }

const OPEN_RESOLVES = {
  person : { label:'A person handles it',        icon:'fa-user',
             hint:'A named human, outside anything this model describes. The handoff is the fact worth recording.' },
  system : { label:'Another system handles it',  icon:'fa-server',
             hint:'Something outside the model boundary. Name it; do not model it.' },
  model  : { label:'Another knowledge model',    icon:'fa-cubes',
             hint:'This point is described in full somewhere else. Pick the model and the link is the resolution.' },
  ask    : { label:'Ask at this point',          icon:'fa-wand-magic-sparkles',
             hint:'Deliberately left to whoever is reading. The export tells the model to ask rather than assume.' },
  unknown: { label:'Not decided yet',            icon:'fa-circle-question',
             hint:'Honestly open. Still better than an absence, because an absence looks like an oversight.' }
};
const OPEN_RESOLVE_IDS = Object.keys(OPEN_RESOLVES);

/* One reader for both carriers. A graph node keeps it under props because props
   is what a node has; a logic step keeps it as a field because a step has no
   props. Same object either way, so everything downstream reads one shape. */
function openOf(x){
  if(!x) return null;
  const o = x.kind !== undefined && x.props ? x.props.open : x.open;
  if(!o || typeof o !== 'object') return null;
  return { owner:o.owner || '', resolves: OPEN_RESOLVES[o.resolves] ? o.resolves : 'unknown',
           ref:o.ref || '', note:o.note || '' };
}
function isOpen(x){ return !!openOf(x); }
/* What an open point resolves to, in words, with a model id turned into the name
   of the model it points at. A dangling reference is reported as dangling rather
   than rendered as an id nobody can read. */
function openTarget(o){
  if(!o) return '';
  if(o.resolves === 'model'){
    const t = (state.models || []).find(x => x.id === o.ref);
    return t ? t.name : (o.ref ? 'a model that is not in this workspace' : 'no model chosen');
  }
  return o.ref || '';
}
function openPoints(m){
  if(!m) return [];
  const out = (m.nodes || []).filter(isOpen)
    .map(n => ({ id:n.id, label:n.label, where:'node',
                 kindLabel:(KINDS[n.kind]||{}).label || n.kind, open:openOf(n) }));
  const L = m.logic || {};
  (L.steps || []).filter(isOpen).forEach(st => out.push({ id:st.id, label:st.name, where:'step',
    kindLabel:(STEP_KINDS[st.kind]||{}).label || st.kind, open:openOf(st) }));
  return out;
}
/* Only meaningful for resolves:'model'. Kept separate because "which models does
   this one lean on" is a different question from "what is unfinished here", and
   answering both from one list is how a page ends up saying neither. */
function knowledgeLinks(m){
  return openPoints(m).filter(p => p.open.resolves === 'model')
    .map(p => ({ ...p, target:(state.models || []).find(x => x.id === p.open.ref) || null }));
}
function isDocModel(m){
  return !!m && (m.nodes||[]).some(n => n.kind === 'document' || n.kind === 'chapter');
}

/* Chapters carry a sequence because reading order is meaning. Everything else in
   a layer is an unordered set, as in any other model. Nodes created before this
   field existed sort by their position in the array, which is creation order —
   wrong but stable, and fixable by dragging once. */
function chapterSeq(n, i){ return typeof n.seq === 'number' ? n.seq : (i + 1) * 10; }

function docModel(m){
  const N = m.nodes || [], E = m.edges || [];
  const of  = k => N.filter(n => n.kind === k);
  const out = (id, rel) => E.filter(e => e.from === id && e.rel === rel)
                            .map(e => N.find(n => n.id === e.to)).filter(Boolean);
  const inn = (id, rel) => E.filter(e => e.to === id && e.rel === rel)
                            .map(e => N.find(n => n.id === e.from)).filter(Boolean);

  const chapters = of('chapter')
    .map((n, i) => ({ ...n, _seq: chapterSeq(n, i) }))
    .sort((a, b) => a._seq - b._seq);

  /* A claim reached through its chapter, so the same claim asserted by two
     chapters appears once with both origins — which is itself worth seeing. */
  const claims = of('claim').map(c => ({
    node      : c,
    from      : inn(c.id, 'ASSERTS'),
    evidence  : out(c.id, 'EVIDENCED_BY'),
    obligations: out(c.id, 'IMPOSES'),
    checkedBy : inn(c.id, 'CHECKS')
  }));

  return {
    doc       : of('document')[0] || null,
    chapters,
    claims,
    obligations: of('obligation'),
    evidence  : of('evidence'),
    analyzers : of('analyzer').map(a => ({ node:a, checks: out(a.id, 'CHECKS') })),
    orphanClaims: claims.filter(c => !c.from.length),
    claimOf   : id => claims.find(c => c.node.id === id)
  };
}

/* ── coverage ───────────────────────────────────────────────────────────────
   Arithmetic over the graph, in the same spirit as the Logic validator. Every
   line here is checkable without asking anybody's opinion. */
function docCoverage(m){
  const d = docModel(m), out = [];
  /* The open-point guard, and the reason it can be one line rather than seven.
     Every finding this function produces is about a gap in the node it names —
     an unowned obligation, an unchecked claim, a silent chapter. So if that node
     has been declared open, the gap has been declared with it and there is
     nothing left to report. The open points are not swallowed: openPoints(m)
     lists them, and the pages that show coverage show that count beside it.

     Findings with no nodeId are structural rather than about a node, so they
     pass through untouched. */
  const push = (sev, code, msg, fix, nodeId) => {
    if(nodeId && isOpen(nodeById(m, nodeId))) return;
    out.push({ sev, code, msg, fix, nodeId });
  };

  d.claims.filter(c => !c.checkedBy.length).forEach(c => push('blocker','unchecked',
    'Nothing checks "' + c.node.label + '".',
    'You have asserted it and no analyzer is responsible for it. Bind a check, or accept that this claim goes out unverified.',
    c.node.id));

  d.claims.filter(c => !c.evidence.length).forEach(c => push('warn','noevidence',
    '"' + c.node.label + '" has no evidence attached.',
    'A claim with nothing behind it cannot be settled. Name the number, the system of record or the signature that would.',
    c.node.id));

  d.analyzers.filter(a => !a.checks.length).forEach(a => push('warn','idlecheck',
    '"' + a.node.label + '" checks nothing.',
    'It exists but points at no claim, so it will never fire. Bind it to what it is responsible for, or remove it.',
    a.node.id));

  /* The mirror of the 'silent' note below, from the side the fix is on. docModel
     has computed orphanClaims since it was written and nothing read it: a claim
     with no ASSERTS edge is counted in the header, listed under Who checks what,
     and appears in no row of the table, because every row is built outwards from
     a chapter. Saying only "this section asserts nothing" leaves the reader to
     work out that the claims exist and are simply unattached. */
  d.orphanClaims.forEach(c => push('warn','orphanclaim',
    'No section asserts "' + c.node.label + '".',
    'It exists, but nothing says which part of the document commits to it, so it appears in no row above. ' +
    'Bind it to the section that makes it — or move it out of this document.',
    c.node.id));

  d.chapters.forEach(ch => {
    const asserts = (m.edges||[]).some(e => e.from === ch.id && e.rel === 'ASSERTS');
    if(!asserts) push('note','silent',
      '"' + ch.label + '" asserts nothing.',
      'Either the section is genuinely decorative, or the claims it makes have not been modelled yet.',
      ch.id);
  });

  d.obligations.forEach(o => {
    const p = o.props || {};
    if(!p.owner) push('blocker','noowner',
      '"' + o.label + '" has no owner.',
      'An obligation nobody owns is a wish. Name the person or the role.', o.id);
    if(!p.due) push('warn','nodue',
      '"' + o.label + '" has no date.',
      'Without one there is nothing to be late against.', o.id);
  });

  d.orphanClaims.forEach(c => push('note','floating',
    '"' + c.node.label + '" is not asserted by any section.',
    'Link it to the chapter that makes it, or it will not appear in reading order.',
    c.node.id));

  const order = { blocker:0, warn:1, note:2 };
  return out.sort((a,b) => order[a.sev] - order[b.sev]);
}

/* ═══════════════════════════════════════════════════════════════════════════
   REVIEW AGAINST A TEMPLATE

   The act the whole tool was built for and did not do. DOC_PURPOSE has said
   since it was written that a reference template is "a yardstick other
   documents are reviewed against" and that it is "reusable: one template
   reviews many documents". Both true, and there was no way to name which
   documents, let alone run the comparison. The templates directory was a
   library of yardsticks nobody could hold up against anything.

   This walks a template over a document and reports what is missing, in the
   same finding shape docCoverage() returns — { sev, code, msg, fix, nodeId }.
   Same shape on purpose: it means the result drops into the coverage list, the
   DocCritique colouring and the export with no adapter anywhere.

   FOUR DECISIONS, each a place this could have produced confident nonsense.

   1. MATCHING IS BY NORMALISED LABEL, AND THAT IS A COMPROMISE. Ids are unique
      per model, so a template's chapter id means nothing in the document. There
      is no shared key. Labels are what a human would compare, so labels are
      what this compares — lowercased, punctuation and spacing removed. It will
      miss "Risk & rollback" against "Risk and rollback"... it will not, that
      case is handled, but it will certainly miss a section somebody renamed to
      say the same thing in different words. So every match this makes is shown
      in a table rather than assumed, and an unmatched pair is reported as
      unmatched rather than silently scored.

   2. EXTRA SECTIONS ARE NOT DEFECTS. The build already had this opinion,
      written into an analyzer prompt: additional structure the author added is
      not a defect. So a section the template does not name is an INFO note, not
      a gap. A review that punishes people for writing more than the form asked
      for teaches them to write less.

   3. NOTHING IS MANDATORY UNLESS THE TEMPLATE SAYS SO, AND NO SHIPPED TEMPLATE
      SAYS SO. No chapter node in this build carries a single prop — there is no
      required flag anywhere. So every section the template names is treated as
      expected, and the severity reflects that honestly: a missing section is a
      blocker because the template named it, not because anything declared it
      mandatory. When chapters grow a `required` prop this is the one function
      that has to change.

   4. THE LINK IS NOT IN THE MODEL FILE. Which template a document is reviewed
      against is kept in the workspace store, keyed by model id — not as an edge
      in the model, because an edge pointing at a node in another file breaks
      every assumption the import validator makes and would need SCHEMA 1.2.
      The models both stay portable and 1.1-clean. The cost is that the pairing
      does not travel with an exported bundle, which is the right trade for a
      first cut and is stated on the page rather than hidden.
   ═══════════════════════════════════════════════════════════════════════════ */

const REVIEW_KEY = 'reviewTpl:';
/* "Risk & rollback" and "Risk and rollback" are the same section. Beyond that
   this does not try to be clever: no stemming, no synonyms, no edit distance. A
   near-miss that silently matches is worse than a miss that is reported. */
function normLabel(s){
  return String(s || '').toLowerCase()
    .replace(/&/g, ' and ')
    .replace(/[^a-z0-9]+/g, '');
}
function reviewTemplateId(modelId){ return store.get(REVIEW_KEY + modelId, null); }
function setReviewTemplate(modelId, tplId){
  if(tplId) store.set(REVIEW_KEY + modelId, tplId);
  else store.set(REVIEW_KEY + modelId, null);
}
/* Any other document model in the workspace can act as the yardstick. Filtered
   to document models because a system model has no chapters to compare, and to
   "not this one" because reviewing a document against itself returns a clean
   sheet and teaches nothing.

   Sorted so anything the author actually marked as a reference template comes
   first, and labelled in the picker so the distinction is visible. Not filtered
   to those, deliberately: docPurpose is asked interactively and no shipped model
   carries it, so a strict filter would show an empty list on a fresh workspace
   and look broken. The field is used to rank and to label, which is all it can
   honestly support until it is set more often than not. */
function candidateTemplates(m){
  return (state.models || [])
    .filter(x => x && x.id !== (m||{}).id && isDocModel(x))
    .sort((a, b) => (b.docPurpose === 'template') - (a.docPurpose === 'template'));
}
function templateLabel(x){
  return x.name + (x.docPurpose === 'template' ? '  \u2014 reference template'
                 : x.docPurpose === 'knowledge' ? '  \u2014 knowledge source' : '');
}

function reviewAgainstTemplate(tpl, doc){
  const out = { findings:[], matched:[], missing:[], extra:[], tplName:(tpl||{}).name || '' };
  if(!tpl || !doc) return out;
  const T = docModel(tpl), D = docModel(doc);
  const push = (sev, code, msg, fix, nodeId) => out.findings.push({ sev, code, msg, fix, nodeId });

  const dByNorm = {};
  D.chapters.forEach(c => { dByNorm[normLabel(c.label)] = c; });
  const usedD = new Set();

  /* Analyzer identity across two files. analyzerId if the node carries one —
     that is a library reference and is the same string in every model — and the
     normalised label otherwise. */
  const anId = n => (n.props || {}).analyzerId || normLabel(n.label);
  const anName = n => {
    const meta = INSPECTOR_META[(n.props || {}).analyzerId];
    return (meta && meta.alias) || n.label;
  };
  /* Which analyzers the template points at each of its chapters, resolved the
     same way DocCritique resolves them: straight at the chapter, or at a claim
     the chapter asserts. */
  const analyzersOn = (mm, MM, chId) => {
    const N = mm.nodes || [], E = mm.edges || [];
    const claimIds = E.filter(e => e.from === chId && e.rel === 'ASSERTS').map(e => e.to);
    const targets = new Set([chId, ...claimIds]);
    return N.filter(n => n.kind === 'analyzer' &&
      E.some(e => e.from === n.id && e.rel === 'CHECKS' && targets.has(e.to)));
  };

  T.chapters.forEach(tc => {
    const key = normLabel(tc.label);
    const dc  = dByNorm[key];
    if(!dc){
      out.missing.push(tc);
      push('blocker', 'tpl-missing-section',
        'The template names a section this document does not have: "' + tc.label + '".',
        'Either add the section, or if it genuinely does not apply, say so in the document rather than leaving it absent — an absent section and a deliberately empty one read the same from outside.',
        tc.id);
      return;
    }
    usedD.add(dc.id);
    out.matched.push({ tpl:tc, doc:dc });

    /* The template's section asserts something and the document's does not. Not
       a blocker: the section exists and may simply not have been modelled yet,
       which is a different problem from it being absent. */
    if(tc.asserts && !dc.asserts) { /* asserts is not on the chapter object */ }
    const tAsserts = (tpl.edges || []).filter(e => e.from === tc.id && e.rel === 'ASSERTS').length;
    const dAsserts = (doc.edges || []).filter(e => e.from === dc.id && e.rel === 'ASSERTS').length;
    if(tAsserts && !dAsserts){
      push('warn', 'tpl-no-claim',
        '"' + dc.label + '" asserts nothing, and the template expects it to make ' + tAsserts +
        ' claim' + (tAsserts === 1 ? '' : 's') + '.',
        'The section is present but says nothing checkable. Model what it actually claims, or accept that this part of the document goes out unverified.',
        dc.id);
    }

    /* Coverage gap: the template holds this section to a check the document does
       not apply to it. This is the finding the whole exercise exists for. */
    const tAn = analyzersOn(tpl, T, tc.id);
    const dAn = analyzersOn(doc, D, dc.id).map(anId);
    tAn.forEach(a => {
      if(dAn.includes(anId(a))) return;
      push('warn', 'tpl-no-check',
        'The template checks "' + tc.label + '" with ' + anName(a) + '. Nothing checks "' + dc.label + '" that way here.',
        'Add that analyzer and bind it to this section, or record why this document does not need that check.',
        dc.id);
    });
  });

  /* Extras. Reported, never penalised — see decision 2 above. */
  D.chapters.filter(c => !usedD.has(c.id)).forEach(c => {
    out.extra.push(c);
    push('note', 'tpl-extra-section',
      '"' + c.label + '" is not a section the template names.',
      'Additional structure is not a defect. Noted so you can see where this document goes beyond the yardstick.',
      c.id);
  });

  /* An analyzer the template relies on that this model does not contain at all.
     Distinct from the per-section gap above: that one says the binding is
     missing, this one says the checker is. */
  const dHas = new Set((doc.nodes || []).filter(n => n.kind === 'analyzer').map(anId));
  (tpl.nodes || []).filter(n => n.kind === 'analyzer').forEach(a => {
    if(dHas.has(anId(a))) return;
    push('warn', 'tpl-no-analyzer',
      'The template relies on ' + anName(a) + '. This model has no such analyzer.',
      'Add it from the Analyzers library and point it at what it is responsible for.',
      null);
  });

  const order = { blocker:0, warn:1, note:2 };
  out.findings.sort((a, b) => order[a.sev] - order[b.sev]);
  out.score = out.findings.length
    ? Math.max(0, 100 - out.findings.reduce((n, f) =>
        n + (f.sev === 'blocker' ? 18 : f.sev === 'warn' ? 7 : 0), 0))
    : 100;
  return out;
}

/* ── the section on the Document page ─────────────────────────────────────── */
function templateReviewSection(m){
  const cands = candidateTemplates(m);
  const tplId = reviewTemplateId(m.id);
  const tpl   = tplId ? (state.models || []).find(x => x.id === tplId) : null;

  const picker = `
    <div class="row" style="margin-bottom:10px;align-items:center;gap:8px;flex-wrap:wrap;">
      <label class="f" style="font-size:10px;">Yardstick</label>
      <select class="in" id="trPick" style="max-width:340px;">
        <option value=""${tpl ? '' : ' selected'}>— none —</option>
        ${cands.map(x => `<option value="${esc(x.id)}"${tpl && x.id === tpl.id ? ' selected' : ''}>${esc(templateLabel(x))}</option>`).join('')}
      </select>
      ${tpl ? '<button class="linkbtn" id="trClear">stop reviewing</button>' : ''}
    </div>`;

  if(!cands.length) return `
    <div class="section-rule">Reviewed against a template</div>
    <div class="empty"><i class="fas fa-ruler-combined"></i><b>No other document model to compare against</b>
      <p>A review needs a second model to act as the yardstick. Open or import a reference template \u2014 the
         worked example <b>Document template \u2014 chapters and analyzers</b> is one \u2014 and it appears here.</p></div>`;

  if(!tpl) return `
    <div class="section-rule">Reviewed against a template</div>
    <p class="lede" style="margin-bottom:8px;">A reference template is a yardstick: the sections a document of
      this type must have, and the checks each one is held to. Pick one and this walks it over the document
      above, then lists what is missing.</p>
    ${picker}
    <p class="fineprint">The pairing is kept in this workspace, not in either model file, so nothing about
      either document changes and neither export gains a dependency on the other.</p>`;

  const r = reviewAgainstTemplate(tpl, m);
  const tone = r.score >= 85 ? 'var(--green)' : r.score >= 60 ? 'var(--amber)' : 'var(--brand)';
  const blockers = r.findings.filter(f => f.sev === 'blocker').length;
  return `
    <div class="section-rule">Reviewed against a template</div>
    ${picker}
    <div class="verdict">
      <div><div class="vs" style="color:${tone};">${r.score}</div>
        <span style="font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);">of 100</span></div>
      <div style="flex:1;min-width:200px;">
        <div class="vv" style="color:${tone};">${blockers ? blockers + ' section' + (blockers===1?'':'s') + ' missing' : r.findings.length ? 'Complete, with gaps' : 'Meets the template'}</div>
        <div style="font-size:10.5px;color:var(--muted);margin-top:3px;">
          against <b>${esc(tpl.name)}</b> \u00b7 ${r.matched.length} of ${r.matched.length + r.missing.length}
          section${(r.matched.length + r.missing.length)===1?'':'s'} matched
          ${r.extra.length ? ' \u00b7 ' + r.extra.length + ' beyond the template' : ''}</div></div>
    </div>

    ${r.findings.length ? r.findings.map(f => `
      <div class="note ${f.sev==='blocker'?'bad':(f.sev==='warn'?'warn':'')}" style="margin-bottom:8px;">
        <b>${f.sev==='blocker'?'Missing':(f.sev==='warn'?'Thin':'Note')}.</b> ${esc(f.msg)}<br>
        <span style="opacity:.8;">${esc(f.fix)}</span></div>`).join('')
      : `<div class="note"><b>Nothing missing.</b> Every section the template names is present, asserts
          something, and carries the checks the template holds it to.</div>`}

    ${r.matched.length ? `<div class="op-sub" style="margin-top:14px;">How the sections were matched</div>
      <table class="t"><thead><tr><th>In the template</th><th>In this document</th></tr></thead><tbody>
      ${r.matched.map(x => `<tr><td style="font-size:11px;">${esc(x.tpl.label)}</td>
        <td style="font-size:11px;">${esc(x.doc.label)}</td></tr>`).join('')}
      </tbody></table>
      <p style="font-size:10.5px;color:var(--muted);margin:7px 0 0;line-height:1.7;">Matched on the section
        name, with case, punctuation and spacing ignored. There is no shared identifier between two model
        files, so this is the only honest join available \u2014 which is why every pair it made is listed here
        rather than assumed. A section renamed to say the same thing in different words will show as missing
        on one side and extra on the other.</p>` : ''}`;
}

/* ── the view ───────────────────────────────────────────────────────────── */
function viewDocument(root){
  const m = model();
  if(!m) return noModel(root, 'doc', 'Seeing a document as a structure');
  if(!isDocModel(m)){
    root.innerHTML = page('doc', `
      <div class="eyebrow">Document</div>
      <h1>This model has no document in it.</h1>
      <p class="lede">This page draws a document as a structure \u2014 sections in reading order, the claims
        each one makes, what would settle them, and which check is responsible for what. It needs at least
        one node of kind <b>Document</b> or <b>Chapter</b> to have something to draw.</p>
      <p class="lede">Add them on Structure, or load the worked example from Knowledge models: a change
        proposal modelled as twenty-one nodes rather than read as prose.</p>
      <div class="row" style="margin-top:20px;display:flex;gap:8px;">
        <button class="btn brand" data-nav="/structure" style="width:auto;padding:10px 22px;margin:0;">
          <i class="fas fa-sitemap"></i> Structure</button>
        <button class="btn ghost" data-nav="/models" style="width:auto;padding:10px 22px;margin:0;">
          Load an example</button>
      </div>`);
    wireChrome(root); return;
  }

  if(!docPurpose(m)){
    root.innerHTML = page('doc', `
      <div class="eyebrow">Document</div>
      <h1>What is this document for?</h1>
      <p class="lede">The same structure serves two entirely different purposes, and everything downstream
        depends on which one this is — what the export says, what a check means, and whether this model
        describes a standard or a single artefact. It is asked once and can be changed later.</p>
      <div class="grid c2" style="margin-top:22px;">
        ${Object.keys(DOC_PURPOSE).map(k => { const P = DOC_PURPOSE[k]; return `
          <div class="opt"><div class="oh"><i class="fas ${P.icon}"></i> ${esc(P.label)}</div>
            <p><b>${esc(P.short)}</b></p>
            <p>${esc(P.long)}</p>
            <div class="oe">${esc(P.exports)}</div>
            <div class="row"><button class="btn sm brand" data-purpose="${esc(k)}">
              Use this</button></div></div>`; }).join('')}
      </div>`);
    wireChrome(root);
    on('[data-purpose]','click', e => {
      markChange('set document purpose');
      m.docPurpose = e.currentTarget.dataset.purpose;
      saveModels(); render();
    }, root);
    return;
  }
  const P = DOC_PURPOSE[m.docPurpose];
  const d = docModel(m);
  const cov = docCoverage(m);
  const gapFor = id => cov.filter(c => c.nodeId === id);
  const worst  = id => { const g = gapFor(id); return g.length ? g[0].sev : null; };
  const counts = { blocker: cov.filter(c=>c.sev==='blocker').length,
                   warn:    cov.filter(c=>c.sev==='warn').length,
                   note:    cov.filter(c=>c.sev==='note').length };

  /* Claims are laid out beside the chapter that asserts them, in that chapter's
     reading position, so the eye follows the document rather than the graph. */
  const rows = [];
  d.chapters.forEach(ch => {
    const cl = d.claims.filter(c => c.from.some(f => f.id === ch.id));
    rows.push({ chapter: ch, claims: cl.length ? cl : [null] });
  });
  if(d.orphanClaims.length) rows.push({ chapter:null, claims:d.orphanClaims });

  const chip = sev => sev
    ? `<span class="dgap ${sev}">${sev === 'blocker' ? 'unchecked' : sev === 'warn' ? 'thin' : 'note'}</span>` : '';

  const claimCard = c => {
    if(!c) return `<div class="dcard dempty">asserts nothing</div>`;
    const sev = worst(c.node.id);
    return `<div class="dcard dclaim ${sev||''}" data-dnode="${esc(c.node.id)}" id="dc_${esc(c.node.id)}">
      <div class="dc-h"><span class="dc-k">Claim</span>${chip(sev)}</div>
      <b>${esc(c.node.label)}</b>
      ${c.node.note ? `<p>${esc(c.node.note)}</p>` : ''}
      ${c.obligations.length ? `<div class="dobl">${c.obligations.map(o => {
        const p = o.props||{};
        return `<span class="dob ${worst(o.id)||''}" data-dnode="${esc(o.id)}"><i class="fas fa-gavel"></i>
          ${esc(o.label)}${p.owner ? ' \u00b7 ' + esc(p.owner) : ''}</span>`; }).join('')}</div>` : ''}
      <div class="dc-f">${c.checkedBy.length
        ? c.checkedBy.map(a => `<span class="dchk"><i class="fas fa-vial"></i> ${esc(a.label)}</span>`).join('')
        : `<span class="dchk none"><i class="fas fa-triangle-exclamation"></i> nothing checks this</span>`}</div>
    </div>`;
  };

  /* The fourth column. Binding a check to the claim it is responsible for is the
     decision this page exists to record, so it belongs beside the claim rather
     than in a modal reached from the bottom of the page. */
  const chkCol = (c, chapter) => {
    if(!c) return `<div class="dcard dempty">nothing to check</div>`;
    return `<div class="dchkcol" id="dk_${esc(c.node.id)}">
      ${c.checkedBy.map(a => `
        <div class="dcard dachk" data-dnode="${esc(a.id)}">
          <div class="dc-k">Check</div><b>${esc(a.label)}</b>
          ${a.note ? `<p>${esc(a.note)}</p>` : ''}
          <button class="dunbind" data-unbind="${esc(a.id)}|${esc(c.node.id)}"
            title="Unbind this check">&times;</button>
        </div>`).join('')}
      <button class="dadd" data-bindto="${esc(c.node.id)}">
        <i class="fas fa-plus"></i> ${c.checkedBy.length ? 'another check' : 'bind a check'}</button>
    </div>`;
  };

  const evCards = c => {
    if(!c) return '';
    if(!c.evidence.length)
      return `<div class="dcard devid none" id="de_${esc(c.node.id)}">
        <i class="fas fa-circle-question"></i> no evidence named</div>`;
    return `<div class="devgroup" id="de_${esc(c.node.id)}">${c.evidence.map(e =>
      `<div class="dcard devid" data-dnode="${esc(e.id)}">
        <div class="dc-k">Evidence</div><b>${esc(e.label)}</b>
        ${e.note ? `<p>${esc(e.note)}</p>` : ''}</div>`).join('')}</div>`;
  };

  root.innerHTML = page('doc', `
    <div class="eyebrow">Document \u00b7 ${esc(P.label)}</div>
    <h1>${esc(d.doc ? d.doc.label : m.name)}</h1>
    <p class="lede">${esc(d.doc && d.doc.note ? d.doc.note :
      'Sections in reading order, what each one asserts, and what would settle it.')}</p>
    <div class="note"><b><i class="fas ${P.icon}"></i> ${esc(P.label)}.</b> ${esc(P.long)}
      ${esc(P.exports)}
      <button class="lnk" id="dPurp" style="margin-left:6px;">Change this</button></div>

    <div class="dstats">
      <div><b>${d.chapters.length}</b><span>sections</span></div>
      <div><b>${d.claims.length}</b><span>claims</span></div>
      <div><b>${d.obligations.length}</b><span>obligations</span></div>
      <div><b>${d.evidence.length}</b><span>evidence</span></div>
      <div class="${counts.blocker?'bad':''}"><b>${counts.blocker}</b><span>blocking gaps</span></div>
      <div class="${counts.warn?'warn':''}"><b>${counts.warn}</b><span>thin</span></div>
    </div>

    <div class="dwrap">
      <svg class="dlines" id="dlines" aria-hidden="true"></svg>
      <div class="dhead">
        <div>The document</div><div>What it commits to</div><div>What would settle it</div>
        <div>Who checks it</div>
      </div>
      ${rows.map((r, ri) => `
        <div class="drow">
          <div class="dcol">
            ${r.chapter ? `
              <div class="dcard dchap ${worst(r.chapter.id)||''}" data-dnode="${esc(r.chapter.id)}"
                   id="dh_${esc(r.chapter.id)}">
                <div class="dnum">${ri + 1}</div>
                <div class="dch-b"><b>${esc(r.chapter.label)}</b>
                  ${r.chapter.note ? `<p>${esc(r.chapter.note)}</p>` : ''}</div>
              </div>`
              : `<div class="dcard dchap floating"><div class="dch-b">
                   <b>Not in any section</b><p>Claims nothing asserts.</p></div></div>`}
          </div>
          <div class="dcol">${r.claims.map(claimCard).join('')}</div>
          <div class="dcol">${r.claims.map(evCards).join('')}</div>
          <div class="dcol">${r.claims.map(c => chkCol(c, r.chapter)).join('')}</div>
        </div>`).join('')}
    </div>

    <div class="section-rule">Who checks what</div>
    ${d.analyzers.length ? `<div class="dchecks">
      ${d.analyzers.map(a => `
        <div class="dcheck ${a.checks.length ? '' : 'idle'}" data-dnode="${esc(a.node.id)}">
          <i class="fas fa-vial"></i>
          <div><b>${esc(a.node.label)}</b>
            <p>${a.checks.length
              ? 'responsible for ' + a.checks.map(c => '\u201c' + esc(c.label) + '\u201d').join(', ')
              : 'bound to nothing \u2014 this will never fire'}</p></div>
        </div>`).join('')}
      </div>` : `<div class="note"><b>No checks defined.</b> An analyzer node bound to a claim with a
        <code>CHECKS</code> relationship is what makes a claim verifiable rather than merely stated.</div>`}
    <div class="row" style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn sm brand" id="dBind"><i class="fas fa-link"></i> Bind a check to a claim</button>
      <!-- The other half of the chain, and the one that was missing. A claim with
           no section behind it renders in no row of the table above, so on a model
           built claims-first this page looks empty while the counters say
           otherwise. -->
      <button class="btn sm ghost" id="dAssert"><i class="fas fa-link"></i> Bind a claim to a section</button>
    </div>

    <div class="section-rule">Coverage</div>
    ${cov.length ? cov.map(c => `
      <div class="note ${c.sev==='blocker'?'bad':(c.sev==='warn'?'warn':'')}" style="margin-bottom:8px;">
        <b>${c.sev==='blocker'?'Blocks':(c.sev==='warn'?'Thin':'Note')}.</b> ${esc(c.msg)}<br>
        <span style="opacity:.8;">${esc(c.fix)}</span></div>`).join('')
      : `<div class="note"><b>Nothing outstanding.</b> Every claim has a checker and evidence, every
          obligation has an owner and a date, and every section asserts something. That says the model is
          complete \u2014 not that the document is true.</div>`}

    ${openPointsHTML(m)}

    ${templateReviewSection(m)}
  `);
  wireChrome(root);
  const tp = $('trPick');
  if(tp) tp.onchange = () => { setReviewTemplate(m.id, tp.value || null); render(); };
  const tc = $('trClear');
  if(tc) tc.onclick = () => { setReviewTemplate(m.id, null); render(); };
  on('[data-dnode]','click', e => openNode(e.currentTarget.dataset.dnode), root);
  $('dPurp').onclick = () => {
    markChange('change document purpose'); delete m.docPurpose; saveModels(); render();
  };
  $('dBind').onclick = () => openBind();
  $('dAssert').onclick = () => openAssert();
  on('[data-bindto]','click', e => openBind(e.currentTarget.dataset.bindto), root);
  on('[data-unbind]','click', e => {
    const [a, c] = e.currentTarget.dataset.unbind.split('|');
    markChange('unbind check');
    m.edges = m.edges.filter(x => !(x.from === a && x.to === c && x.rel === 'CHECKS'));
    saveModels(); render();
  }, root);
  afterLayout(() => drawDocLines(m));
}

/* Connectors are drawn after layout by measuring the cards, because the columns
   are ordinary flow content and their positions are not known until then. A
   curve rather than a straight line: with several claims against one chapter,
   straight lines converge into an unreadable fan. */
function drawDocLines(m){
  const svg = document.getElementById('dlines'); if(!svg) return;
  const wrap = svg.parentElement;
  const box = wrap.getBoundingClientRect();
  if(box.width < 20) return;
  svg.setAttribute('width', box.width);
  svg.setAttribute('height', wrap.scrollHeight);
  svg.setAttribute('viewBox', '0 0 ' + box.width + ' ' + wrap.scrollHeight);

  const d = docModel(m);
  const at = id => {
    const el = document.getElementById(id); if(!el) return null;
    const r = el.getBoundingClientRect();
    return { top:r.top - box.top, bottom:r.bottom - box.top, left:r.left - box.left,
             right:r.right - box.left, midY:(r.top + r.bottom)/2 - box.top };
  };
  const curve = (a, b, colour, dash) => {
    if(!a || !b) return '';
    const x1 = a.right, y1 = a.midY, x2 = b.left, y2 = b.midY;
    const dx = Math.max(24, (x2 - x1) * 0.55);
    return `<path d="M${x1} ${y1} C${x1+dx} ${y1} ${x2-dx} ${y2} ${x2} ${y2}"
      fill="none" stroke="${colour}" stroke-width="1.6" ${dash?'stroke-dasharray="4 4"':''}
      opacity=".8"/>`;
  };
  let out = '';
  d.claims.forEach(c => {
    c.from.forEach(f => { out += curve(at('dh_'+f.id), at('dc_'+c.node.id), 'var(--line-strong)'); });
    const ev = at('de_'+c.node.id);
    if(ev) out += curve(at('dc_'+c.node.id), ev,
      c.evidence.length ? 'var(--line-strong)' : 'var(--amber)', !c.evidence.length);
    /* Evidence to check, so the row reads left to right as one sentence:
       section asserts claim, claim settled by evidence, evidence verified by check. */
    const ck = at('dk_'+c.node.id);
    if(ev && ck) out += curve(ev, ck,
      c.checkedBy.length ? 'var(--line-strong)' : 'var(--red)', !c.checkedBy.length);
  });
  svg.innerHTML = out;
}

/* Binding is the action this page exists for: saying which check is responsible
   for which claim. It is a CHECKS edge like any other, but reaching it through
   the generic relationship editor meant choosing from 23 relationship types and
   every node in the model. */
function openBind(preselectClaim){
  const m = model(), d = docModel(m);
  if(!d.claims.length){ showBig('Bind a check', `<div class="note">There are no claims to check yet.
    A claim is something the document asserts that could be false.</div>`); return; }
  const analyzers = (m.nodes||[]).filter(n => n.kind === 'analyzer');
  showBig('Who checks what', `
    <div class="note">A check bound to a claim is what makes that claim verifiable rather than merely
      stated. Pick one of each. Unbound claims are listed first, since those are the ones going out
      unverified.</div>
    <div class="row" style="margin-top:14px;flex-wrap:wrap;gap:8px;">
      <select class="in" id="bkA">
        ${analyzers.length
          ? analyzers.map(a => `<option value="${esc(a.id)}">${esc(a.label)}</option>`).join('')
          : '<option value="">no analyzer nodes yet</option>'}
      </select>
      <span style="font-size:11px;color:var(--muted);align-self:center;">checks</span>
      <select class="in" id="bkC">
        ${d.claims.slice().sort((a,b) => a.checkedBy.length - b.checkedBy.length)
          .map(c => `<option value="${esc(c.node.id)}" ${c.node.id === preselectClaim ? 'selected' : ''}>${c.checkedBy.length ? '' : '\u26a0 '}${esc(c.node.label)}</option>`).join('')}
      </select>
      <button class="btn sm brand" id="bkGo" ${analyzers.length?'':'disabled'}>Bind</button>
    </div>
    <div id="bkErr" style="font-size:11px;color:var(--red);margin-top:8px;"></div>
    ${analyzers.length ? '' : `<p style="font-size:11.5px;color:var(--muted);margin-top:10px;">
      Add a node of kind <b>Analyzer</b> on Structure first \u2014 one specific check, not
      \u201creviews the document\u201d.</p>`}`);
  const go = $('bkGo');
  if(go) go.onclick = () => {
    const a = $('bkA').value, c = $('bkC').value;
    if(!a || !c) return;
    if((m.edges||[]).some(e => e.from === a && e.to === c && e.rel === 'CHECKS')){
      $('bkErr').textContent = 'That check is already bound to that claim.'; return;
    }
    markChange('bind check');
    m.edges.push({ id: uid('e'), from:a, to:c, rel:'CHECKS', note:'' });
    saveModels(); closeModals(); render();
  };
}

/* The first link: which section commits to which claim. Deliberately a mirror of
   openBind() rather than a generalised edge editor - the Structure page is the
   generalised edge editor, and it is the wrong tool here because it asks you to
   pick a relationship name out of twenty-three when the answer on this page is
   always ASSERTS.

   Unattached claims sort first and carry a warning mark, the same way unbound
   claims do in openBind, because those are the ones missing from the table. */
function openAssert(preselectClaim){
  const m = model(), d = docModel(m);
  if(!d.claims.length){ showBig('Bind a claim to a section', `<div class="note">There are no claims yet.
    A claim is something the document asserts that could be false.</div>`); return; }
  if(!d.chapters.length){ showBig('Bind a claim to a section', `<div class="note"><b>There are no sections
    yet.</b> Add a node of kind <b>Chapter</b> on Structure first — this page reads the document outwards
    from its sections, so without one there is nothing for a claim to hang from.</div>`); return; }
  showBig('Which section makes it', `
    <div class="note">A claim belongs to the part of the document that commits to it. Until it does, it is
      counted in the header and shown in no row of the table, because every row is built outwards from a
      section. Claims nothing asserts are listed first.</div>
    <div class="row" style="margin-top:14px;flex-wrap:wrap;gap:8px;">
      <select class="in" id="asC">
        ${d.claims.slice().sort((a,b) => a.from.length - b.from.length)
          .map(c => `<option value="${esc(c.node.id)}" ${c.node.id === preselectClaim ? 'selected' : ''}>${
            c.from.length ? '' : '\u26a0 '}${esc(c.node.label)}</option>`).join('')}
      </select>
      <span style="font-size:11px;color:var(--muted);align-self:center;">is asserted by</span>
      <select class="in" id="asCh">
        ${d.chapters.map(ch => `<option value="${esc(ch.id)}">${esc(ch.label)}</option>`).join('')}
      </select>
      <button class="btn sm brand" id="asGo">Bind</button>
    </div>
    <div id="asErr" style="font-size:11px;color:var(--red);margin-top:8px;"></div>`);
  const go = $('asGo');
  if(go) go.onclick = () => {
    const c = $('asC').value, ch = $('asCh').value;
    if(!c || !ch) return;
    if((m.edges||[]).some(e => e.from === ch && e.to === c && e.rel === 'ASSERTS')){
      $('asErr').textContent = 'That section already asserts that claim.'; return;
    }
    markChange('bind claim to section');
    m.edges.push({ id: uid('e'), from:ch, to:c, rel:'ASSERTS', note:'' });
    saveModels(); closeModals(); render();
  };
}

let logicNetwork = null;
function teardownLogicGraph(){ if(logicNetwork){ try{ logicNetwork.destroy(); }catch(e){} logicNetwork = null; } }

/* ═══════════════════════════════════════════════════════════════════════════
   DOCCRITIQUE

   The forensic reading of a document, drawn the way the James workstation drew
   it: the document on the left, its chapters down the middle in reading order,
   and the agents that check them on the right, with one line drawn per thing an
   agent is responsible for.

   Three decisions worth writing down, because each one is a place this page
   could have lied.

   1. IT IS READ-ONLY, AND NOT IN THE WEAK SENSE. There is no control on this
      page that writes to the model — no add, no rename, no drag-to-persist, no
      filter that hides a chapter and then reports a count over what is left.
      Fit view and hover are the whole interaction surface. The reason is that
      every other page in this build edits, so a page that both edits and
      judges would leave the reader unsure which of the two they had just done.
      Layout is not saved either: drag a node and it stays where you put it
      until you leave, and the model on disk is byte-identical.

   2. EVERY STATUS IS DERIVED, NONE IS DECLARED. James received "status":
      "BLOCKED" as a string in its payload, from an analyser that had already
      run. Nothing has run here. So a chapter's state is computed from
      docCoverage(), which is the same arithmetic the Document page already
      shows in a list: a blocker finding against a chapter, or against a claim
      that chapter asserts, or an obligation one of those claims imposes, makes
      the chapter blocked. Nothing is coloured because it looked important.

   3. AGENTS ARE ONE GLYPH, NOT TEN. INSPECTOR_META carries a per-analyzer icon
      and the Analyzers page uses it, correctly — there the icon is how you find
      the row you want in a library of ten. Here it would be ten unrelated
      symbols on one canvas, which asks the reader to learn a legend before they
      can see the shape of anything. One silhouette, repeated, reads as "these
      are all the same kind of thing" at a glance, which is true and is the
      point. Which agent it is, is on the node's label and in its tooltip.
   ═══════════════════════════════════════════════════════════════════════════ */

/* fa-user-secret. The same glyph James used, for the same reason. */
const AGENT_GLYPH = '\uf21b';
/* fa-file. The document, and the only node on the canvas that is not a chapter
   or an agent. */
const DOC_GLYPH   = '\uf15b';

const DC_STATE = {
  blocked: { label:'Blocked', rank:3, light:'#B3261E', dark:'#FF6B6B' },
  warn   : { label:'Open questions', rank:2, light:'#E2B007', dark:'#E2B007' },
  note   : { label:'Notes only', rank:1, light:'#86868B', dark:'#8E8E93' },
  clear  : { label:'Clear', rank:0, light:'#2E7D32', dark:'#4CAF50' }
};
const DC_SEV_STATE = { blocker:'blocked', warn:'warn', note:'note' };
function dcColour(k){ const s = DC_STATE[k] || DC_STATE.clear; return state.dark ? s.dark : s.light; }

/* The whole page's data, computed once. Everything below reads this and nothing
   recomputes from the model, so the graph, the counts and the list underneath
   cannot disagree with each other. */
function docCritique(m){
  const d = docModel(m);
  const cov = docCoverage(m);
  const N = m.nodes || [], E = m.edges || [];
  const byId = id => N.find(n => n.id === id);

  /* Findings are attached to a node. To colour a chapter, findings have to be
     rolled up to the chapter that owns the node they are about: a claim to the
     chapters that ASSERT it, and an obligation to the claims that IMPOSE it and
     then on to their chapters. Anything that rolls up to nothing stays in the
     unattached list rather than being quietly assigned to chapter one. */
  const chapterOfClaim = {};
  d.claims.forEach(c => { chapterOfClaim[c.node.id] = c.from.map(x => x.id); });
  const chapterOfOblig = {};
  d.obligations.forEach(o => {
    const owners = E.filter(e => e.to === o.id && e.rel === 'IMPOSES').map(e => e.from);
    const chs = [];
    owners.forEach(cl => (chapterOfClaim[cl] || []).forEach(ch => { if(!chs.includes(ch)) chs.push(ch); }));
    chapterOfOblig[o.id] = chs;
  });
  const chaptersFor = nodeId => {
    if(!nodeId) return [];
    const n = byId(nodeId);
    if(!n) return [];
    if(n.kind === 'chapter')    return [n.id];
    if(n.kind === 'claim')      return chapterOfClaim[n.id] || [];
    if(n.kind === 'obligation') return chapterOfOblig[n.id] || [];
    return [];
  };

  const findingsBy = {}; const unattached = [];
  cov.forEach(f => {
    const chs = chaptersFor(f.nodeId);
    if(!chs.length){ unattached.push(f); return; }
    chs.forEach(ch => { (findingsBy[ch] = findingsBy[ch] || []).push(f); });
  });

  const chapters = d.chapters.map((ch, i) => {
    const fs = findingsBy[ch.id] || [];
    const worst = fs.reduce((a, f) => {
      const k = DC_SEV_STATE[f.sev] || 'note';
      return DC_STATE[k].rank > DC_STATE[a].rank ? k : a;
    }, 'clear');
    const asserts = E.filter(e => e.from === ch.id && e.rel === 'ASSERTS')
                     .map(e => byId(e.to)).filter(Boolean);
    return { id:ch.id, label:ch.label, seq:i + 1, node:ch,
             state:worst, findings:fs, asserts };
  });

  /* An agent is a node of kind 'analyzer'. Its CHECKS edges are what it is
     responsible for; each one is resolved to the chapter or chapters that own
     the target, which is what gets drawn. An analyzer wired to nothing is kept
     and shown as idle rather than hidden — a checker that checks nothing is
     exactly the thing the Document page's coverage list exists to surface, and
     dropping it here would contradict that. */
  const agents = N.filter(n => n.kind === 'analyzer').map(a => {
    const meta = INSPECTOR_META[(a.props || {}).analyzerId] || null;
    const targets = E.filter(e => e.from === a.id && e.rel === 'CHECKS').map(e => e.to);
    const links = [];
    targets.forEach(t => {
      const sev = cov.filter(f => f.nodeId === t)
                     .reduce((x, f) => { const k = DC_SEV_STATE[f.sev] || 'note';
                       return DC_STATE[k].rank > DC_STATE[x].rank ? k : x; }, 'clear');
      chaptersFor(t).forEach(ch => {
        const at = links.find(l => l.chapter === ch);
        if(at){ if(DC_STATE[sev].rank > DC_STATE[at.state].rank) at.state = sev; }
        else links.push({ chapter:ch, state:sev });
      });
    });
    return { id:a.id, label:(meta && meta.alias) || a.label,
             formal:(meta && meta.label) || a.label, meta, links,
             idle: targets.length === 0 };
  });

  const counts = { blocker:0, warn:0, note:0 };
  cov.forEach(f => { if(counts[f.sev] !== undefined) counts[f.sev]++; });

  return { doc:d.doc, chapters, agents, coverage:cov, counts, unattached,
           claims:d.claims, obligations:d.obligations, evidence:d.evidence, model:d };
}

let dcNet = null;
function teardownCritiqueGraph(){ if(dcNet){ try{ dcNet.destroy(); }catch(e){} dcNet = null; } }

function buildCritiqueGraph(dc, m){
  const el = $('dccanvas');
  if(!el) return;
  if(!visReady('dccanvas')) return;
  teardownCritiqueGraph();
  const dark  = state.dark;
  const ink   = dark ? '#F2F2F5' : '#0A0A0A';
  const paper = dark ? '#141416' : '#FFFFFF';
  const soft  = dark ? '#5A5A62' : '#B4B4BC';
  const hair  = dark ? '#2E2E32' : '#E3E3E3';
  const brand = dark ? '#FF3B30' : '#D40000';
  const ghost = dark ? 'rgba(242,242,245,.13)' : 'rgba(10,10,16,.13)';

  const chs  = dc.chapters.filter(c => !state.dcHideCh.includes(c.id));
  const ags  = dc.agents.filter(a => !state.dcHideAg.includes(a.id));
  const pick = state.dcPick;
  /* When one agent is being followed, everything it is not responsible for goes
     to ghost. Not removed — removed would change the shape of the document,
     and the point of following one agent is to see how little of the document
     it touches. */
  const lit = id => !pick || id === pick ||
    (ags.find(a => a.id === pick) || { links:[] }).links.some(l => l.chapter === id);

  const N = [], E = [];

  /* The document. No label: the page is headed with its name in 21px, and a
     second copy in 11px monospace sat on top of the glyph in every screenshot
     of this page so far. One name per thing. */
  N.push({ id:'__doc', shape:'icon', x:-360, fixed:{ x:true, y:false },
    icon:{ face:'"Font Awesome 6 Free"', code:DOC_GLYPH, size:30,
           color: pick ? ghost : ink, weight:'900' },
    title:(dc.doc ? dc.doc.label : m.name) + '\nDocument' });

  /* Chapters. Ink by default and red only when blocked.

     The four-colour scale this replaces — red, amber, grey, green — spent the
     whole palette on a status nobody asked to see, and made "clear" and "notes
     only" as loud as "blocked". buildGraph() on the Structure page settled this
     argument already, in a comment worth repeating: colour is reserved for the
     things worth shouting about, and everything else is ink. Here there is
     exactly one thing worth shouting about. The rest of the state is in the
     count on the right of the label and in the list below the canvas. */
  chs.forEach((ch, i) => {
    const y  = (i - (chs.length - 1) / 2) * 58;
    const on = lit(ch.id);
    const blocked = ch.state === 'blocked';
    N.push({ id:ch.id, shape:'box', x:-40, y, fixed:{ x:true, y:true },
      label: ch.seq + '.  ' + ch.label + (ch.findings.length ? '   ' + ch.findings.length : ''),
      title: ch.label + '\n' + DC_STATE[ch.state].label
           + '\n' + ch.findings.length + ' finding' + (ch.findings.length === 1 ? '' : 's')
           + ' · asserts ' + ch.asserts.length,
      color:{ background: paper,
              border: !on ? hair : blocked ? brand : soft,
              highlight:{ background: dark ? '#1C1C1F' : '#FAFAFA', border: ink } },
      font:{ color: on ? ink : ghost, size:11, face:'monospace',
             bold:{ color: on ? ink : ghost, size:11, face:'monospace', mod:'bold' } },
      margin:{ top:9, bottom:9, left:12, right:12 },
      borderWidth: blocked && on ? 2 : 1,
      shapeProperties:{ borderRadius:2 } });
    E.push({ from:'__doc', to:ch.id, width:1, smooth:false,
      color:{ color: on ? hair : ghost, highlight:soft } });
    if(i) E.push({ from: chs[i-1].id, to: ch.id, width:1, dashes:[2,4], smooth:false,
      color:{ color: hair, highlight:soft } });
  });

  /* Agents. One glyph each, as before, but no standing label — ten monospace
     captions at 8px in a 46px column is what the screenshot showed and it was
     unreadable. The name is in the list beside the canvas, on hover, and in the
     panel a click opens. Selected agent goes red; unselected go ink; hidden are
     not drawn; everything dims when another is being followed. */
  ags.forEach((a, i) => {
    const y  = (i - (ags.length - 1) / 2) * 40;
    const on = !pick || a.id === pick;
    N.push({ id:a.id, shape:'icon', x:300, y, fixed:{ x:true, y:true },
      icon:{ face:'"Font Awesome 6 Free"', code:AGENT_GLYPH, size:19,
             color: !on ? ghost : a.id === pick ? brand : a.idle ? soft : ink, weight:'900' },
      title:a.label + '\n' + a.formal
          + (a.idle ? '\nChecks nothing in this model'
                    : '\nResponsible for ' + a.links.length + ' section' + (a.links.length===1?'':'s')) });
    a.links.forEach(l => {
      if(!chs.some(c => c.id === l.chapter)) return;
      const hot = pick && a.id === pick;
      E.push({ from:a.id, to:l.chapter, width: hot ? 1.6 : 1, dashes:[3,4], smooth:false,
        color:{ color: !on ? ghost : hot ? brand : soft, highlight:ink },
        arrows:{ to:{ enabled:true, scaleFactor:.35 } } });
    });
  });

  try {
    dcNet = new vis.Network(el, { nodes:new vis.DataSet(N), edges:new vis.DataSet(E) }, {
      physics:{ enabled:false },
      layout:{ hierarchical:{ enabled:false } },
      interaction:{ hover:true, dragNodes:true, zoomView:true, dragView:true,
                    tooltipDelay:150, selectable:true, multiselect:false }
    });
  } catch(err){ graphFail('dccanvas', 'vis-network threw while drawing the critique.', err && err.message); return; }
  dcNet.on('click', p => {
    if(!p.nodes.length) return;
    const ch = dc.chapters.find(x => x.id === p.nodes[0]);
    if(ch) return dcChapterModal(ch);
    const ag = dc.agents.find(x => x.id === p.nodes[0]);
    /* Clicking an agent follows it rather than opening a box. Following is the
       thing you want nine times out of ten, and the box is still one click away
       on the i beside its name in the list. */
    if(ag){ state.dcPick = state.dcPick === ag.id ? null : ag.id; render(); }
  });
  setTimeout(() => { if(dcNet) dcNet.fit({ animation:false }); }, 60);
}

/* The critique, as a section of the Analyzers page rather than a page of its
   own. It moved because of an argument that is hard to disagree with once it is
   said out loud: this drawing shows which agent is responsible for which part of
   the document, and that is the Analyzers page's subject, not a second reading
   of the Document page. As its own tab it was a reduced copy of Document — same
   counts, same reading order, same coverage list, minus the two binding buttons
   Document has. As a lens on Analyzers it is the only picture in the build of
   what the library you just picked from will actually do.

   Show and hide only. Ticking a chapter off does not remove it from the model,
   following an agent does not bind anything, and there is no control here that
   writes. That was the rule when this was a page and it did not change on the
   way over. */
function critiqueSection(m){
  const dc = docCritique(m);
  const chs = dc.chapters, ags = dc.agents;
  const hidC = state.dcHideCh, hidA = state.dcHideAg, pick = state.dcPick;
  const shownC = chs.filter(c => !hidC.includes(c.id)).length;
  const shownA = ags.filter(a => !hidA.includes(a.id)).length;
  const picked = pick ? ags.find(a => a.id === pick) : null;

  return `
    <div class="section-rule">The document, and who is on it</div>
    <p class="lede" style="margin-bottom:10px;">Every agent in this model, drawn against the sections it is
      responsible for. Tick a section or an agent off to take it out of the picture, or follow one agent to
      see how much of the document it actually touches. Nothing here changes the model \u2014 the bindings
      themselves are edited on <b>Structure</b>, and listed on <b>Document</b>.</p>

    <div class="dcgrid">
      <div class="dcside">
        <div class="dcside-h">Sections
          <button class="linkbtn" data-dcall="ch">${hidC.length ? 'all' : 'none'}</button></div>
        ${chs.map(c => `<label class="dctog${hidC.includes(c.id) ? ' off' : ''}">
          <input type="checkbox" data-dcch="${esc(c.id)}"${hidC.includes(c.id) ? '' : ' checked'}>
          <span class="sq" style="background:${c.state === 'blocked' ? 'var(--brand)' : 'transparent'};
                border:1px solid ${c.state === 'blocked' ? 'var(--brand)' : 'var(--line-strong)'};"></span>
          <span class="nm">${esc(c.seq + '. ' + c.label)}</span>
          ${c.findings.length ? `<span class="ct">${c.findings.length}</span>` : ''}
        </label>`).join('')}

        <div class="dcside-h" style="margin-top:14px;">Agents
          <button class="linkbtn" data-dcall="ag">${hidA.length ? 'all' : 'none'}</button></div>
        ${ags.map(a => `<div class="dctog${hidA.includes(a.id) ? ' off' : ''}${pick === a.id ? ' on' : ''}">
          <input type="checkbox" data-dcag="${esc(a.id)}"${hidA.includes(a.id) ? '' : ' checked'}>
          <button class="nm" data-dcpick="${esc(a.id)}" title="Follow this agent">
            <i class="fas fa-user-secret"></i> ${esc(a.label)}</button>
          <span class="ct">${a.idle ? '\u2014' : a.links.length}</span>
          <button class="linkbtn i" data-dcinfo="${esc(a.id)}" title="What it checks">i</button>
        </div>`).join('')}
      </div>

      <div class="gbox" style="margin:0;">
        <div class="gbar">
          <span class="t">${picked ? 'Following \u00b7 ' + esc(picked.label) : 'All agents'}</span>
          <span style="font-size:10px;color:var(--muted);">${shownC}/${chs.length} sections \u00b7 ${shownA}/${ags.length} agents</span>
          <div style="flex:1;"></div>
          ${pick ? `<button class="btn ghost sm" id="dcClear" style="margin:0;">
            <i class="fas fa-xmark"></i> Stop following</button>` : ''}
          <button class="btn ghost sm" id="dcFit" style="margin:0;"><i class="fas fa-expand"></i> Fit view</button>
        </div>
        <div id="dccanvas"></div>
        <div class="gfoot">
          <span class="gkey"><span style="width:9px;height:9px;border-radius:2px;background:var(--brand);
            display:inline-block;"></span> blocked section</span>
          <span class="gkey"><i class="fas fa-user-secret"></i> agent</span>
          <span class="gkey">Number after a section name is its open findings.</span>
          <span class="gkey">Click a section to read it, an agent to follow it.</span>
        </div>
      </div>
    </div>

    ${dc.unattached.length ? `<div class="note warn" style="margin-top:12px;">
      <b>${dc.unattached.length} finding${dc.unattached.length===1?'':'s'} sit under no section.</b>
      Whatever ${dc.unattached.length===1?'it is':'they are'} about is not asserted by one, so
      ${dc.unattached.length===1?'it is':'they are'} not drawn above rather than being pinned to a section
      that does not own ${dc.unattached.length===1?'it':'them'}. They are listed in full on Document.</div>` : ''}

    <p class="fineprint">Colour is spent on one thing here, deliberately: a blocked section. The rest is ink,
      because a four-colour status scale made \u201cclear\u201d as loud as \u201cblocked\u201d and left no colour
      free to mean anything. Every agent carries one silhouette for the same reason \u2014 ten symbols would
      need a legend before the picture could be read at all.</p>`;
}

/* Kept so an old link or bookmark still lands somewhere sensible. The page is
   gone; the drawing is a lens on Analyzers, so that is where this goes. */
function viewDocCritique(root){
  state.anView = 'critique';
  try{ history.replaceState(null, '', '#/analyzers'); }catch(e){ location.hash = '#/analyzers'; }
  return viewAnalyzers(root);
}

function wireAnalyzerLens(root){
  on('[data-anview]','click', e => {
    state.anView = e.currentTarget.dataset.anview;
    /* Leaving the drawing drops what was being followed. Coming back to a graph
       still dimmed from a session two pages ago reads as a rendering fault. */
    if(state.anView !== 'critique') state.dcPick = null;
    render();
  }, root);
}

/* Every handler here writes to state and nothing else. There is no call to
   saveModels(), markChange() or save() in this function, which is the whole
   guarantee the page makes. */
function wireCritique(root, m){
  const toggle = (list, id) => {
    const at = list.indexOf(id);
    if(at >= 0) list.splice(at, 1); else list.push(id);
  };
  on('[data-dcch]','change', e => { toggle(state.dcHideCh, e.currentTarget.dataset.dcch); render(); }, root);
  on('[data-dcag]','change', e => {
    const id = e.currentTarget.dataset.dcag;
    toggle(state.dcHideAg, id);
    /* Hiding the agent you are following left every node on the canvas ghosted
       against a subject that was no longer drawn — a graph dimmed in deference
       to something invisible, which reads as a rendering fault rather than a
       filter. Hiding it stops the following. */
    if(state.dcPick === id && state.dcHideAg.includes(id)) state.dcPick = null;
    render();
  }, root);
  on('[data-dcpick]','click', e => {
    const id = e.currentTarget.dataset.dcpick;
    /* And the mirror: following an agent that is hidden un-hides it, because
       the alternative is a button that appears to do nothing. */
    const at = state.dcHideAg.indexOf(id);
    if(at >= 0) state.dcHideAg.splice(at, 1);
    state.dcPick = state.dcPick === id ? null : id;
    render();
  }, root);
  on('[data-dcinfo]','click', e => {
    const dc = docCritique(m);
    const ag = dc.agents.find(a => a.id === e.currentTarget.dataset.dcinfo);
    if(ag) dcAgentModal(ag, dc);
  }, root);
  on('[data-dcall]','click', e => {
    const which = e.currentTarget.dataset.dcall;
    const dc = docCritique(m);
    if(which === 'ch') state.dcHideCh = state.dcHideCh.length ? [] : dc.chapters.map(c => c.id);
    else { state.dcHideAg = state.dcHideAg.length ? [] : dc.agents.map(a => a.id); state.dcPick = null; }
    render();
  }, root);
  const c = $('dcClear'); if(c) c.onclick = () => { state.dcPick = null; render(); };
  const f = $('dcFit');   if(f) f.onclick = () => { if(dcNet) dcNet.fit({ animation:true }); };
  afterLayout(() => buildCritiqueGraph(docCritique(m), m));
}
function viewLogic(root){
  const m = model();
  if(!m){ root.innerHTML = page('logic', `<div class="eyebrow">Logic</div>
    <h1>No model open.</h1><p class="lede">Open one from Models first.</p>`); wireChrome(root); return; }
  const L = logicOf(m);
  const issues = validateLogic(L);
  const ord = logicOrder(L);
  const blockers = issues.filter(i => i.sev === 'blocker');
  const byId = Object.fromEntries(L.steps.map(x => [x.id, x]));

  const stepRow = st => {
    const k = STEP_KINDS[st.kind] || STEP_KINDS.transform;
    const needs = L.edges.filter(e => e.to === st.id && e.rel === 'needs').length;
    const after = L.edges.filter(e => e.to === st.id && e.rel === 'after').length;
    const bad   = issues.some(i => i.stepId === st.id && i.sev === 'blocker');
    return `<div class="nrow${bad ? ' bad' : ''}" data-step="${esc(st.id)}" style="cursor:pointer;">
      <i class="fas ${k.icon}" style="color:${k.color};width:18px;margin-top:2px;"></i>
      <div class="nm"><b>${esc(st.name)}</b>
        <p>${esc(k.label)}${st.intent ? ' \u00b7 ' + esc(st.intent.slice(0,90)) : ''}</p>
        <p style="opacity:.75;">${needs ? needs + ' hard dependenc' + (needs===1?'y':'ies') : 'no dependencies'}${after ? ' \u00b7 ' + after + ' ordering preference' + (after===1?'':'s') : ''}${(st.produces||[]).length ? ' \u00b7 produces ' + esc(st.produces.join(', ')) : ''}</p>
      </div>
    </div>`;
  };

  root.innerHTML = page('logic', `
    <div class="eyebrow">Logic</div>
    <h1>What has to happen before what.</h1>
    <p class="lede">Structure says what things are. It says nothing about order, and order is where a
      pipeline goes wrong quietly: an extraction that runs after the check which needed it produces an
      answer that reads perfectly and is invented. This page is a directed graph of steps with two kinds of
      edge — a hard dependency that makes an order <em>necessary</em>, and a preference that makes one
      merely <em>better</em>. Everything on it is arithmetic over that graph. Nothing here calls a model.</p>

    <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0;">
      <button class="btn sm brand" id="lgAdd"><i class="fas fa-plus"></i> Add step</button>
      <button class="btn sm ghost" id="lgLink"><i class="fas fa-link"></i> Connect</button>
      <!-- No wand. This reads the analyzers already in the open model and writes
           the steps they imply; it makes no request and needs no key. The wand is
           now reserved for the four controls that send text to a model. -->
      <button class="btn sm ghost" id="lgSeed"><i class="fas fa-seedling"></i> Seed from analyzers</button>
      <button class="btn sm ghost" id="lgPlan"><i class="fas fa-list-ol"></i> Execution plan</button>
      <span style="flex:1;"></span>
      <span style="font-size:10.5px;color:var(--muted);">${L.steps.length} step${L.steps.length===1?'':'s'} \u00b7
        ${L.edges.length} edge${L.edges.length===1?'':'s'} \u00b7
        ${ord.ok ? ord.levels.length + ' stage' + (ord.levels.length===1?'':'s') : 'no valid order'}</span>
    </div>

    <div class="row" style="margin-bottom:16px;">
      <input class="in" id="lgGoal" placeholder="What is this pipeline for? e.g. decide whether the proposal is deliverable"
             value="${esc(L.goal||'')}" style="width:100%;max-width:none;">
    </div>

    ${!L.steps.length ? `<div class="note"><b>Nothing here yet.</b> Add steps, or press
      <b>Seed from analyzers</b> to turn every analyzer node in this model into a step and let you draw the
      order between them. Seeding creates the steps; it deliberately does not guess the dependencies,
      because guessing them is exactly the judgement this page exists to record.</div>` : `

    <div class="section-rule">Order</div>
    ${ord.ok
      ? `<div class="stats" style="margin-bottom:14px;">
           ${ord.levels.map((lvl,i) => `<div><b>${lvl.length}</b><span>stage ${i+1}</span></div>`).join('')}
         </div>
         <p class="lede" style="margin-bottom:14px;">Steps inside a stage do not depend on each other and
           can run together. ${ord.levels.length} stage${ord.levels.length===1?'':'s'} for ${L.steps.length}
           step${L.steps.length===1?'':'s'} means ${L.steps.length - ord.levels.length} of them need not wait.</p>`
      : `<div class="note bad" style="margin-bottom:14px;"><b>No valid order exists.</b>
           ${ord.stuck.length} step(s) sit inside a circular dependency and cannot be placed:
           ${esc(ord.stuck.map(x => (byId[x]||{}).name || x).join(', '))}.</div>`}

    ${ord.ok ? ord.levels.map((lvl,i) => `
      <div class="op-sub">Stage ${i+1}</div>
      <div class="grid c3" style="margin-bottom:10px;">
        ${lvl.map(id => byId[id] ? stepRow(byId[id]) : '').join('')}
      </div>`).join('') : `<div class="grid c3">${L.steps.map(stepRow).join('')}</div>`}

    <div class="section-rule">Graph</div>
    <div id="lgcanvas" style="height:420px;border:1px solid var(--line);border-radius:8px;"></div>
    <div class="gfoot">
      <span class="gkey" style="opacity:.7;">solid line = needs output of \u00b7 dashed = should run after
        \u00b7 red = blocks execution</span>
    </div>`}

    <div class="section-rule">What the graph says</div>
    ${issues.length ? issues.map(i => `
      <div class="note ${i.sev==='blocker'?'bad':(i.sev==='warn'?'warn':'')}" style="margin-bottom:8px;">
        <b>${i.sev==='blocker'?'Blocks execution':(i.sev==='warn'?'Worth checking':'Note')}.</b>
        ${esc(i.msg)}<br><span style="opacity:.8;">${esc(i.fix)}</span></div>`).join('')
      : `<div class="note"><b>Nothing to report.</b> No cycles, every consumed value is produced by something
          upstream, and the pipeline terminates. That is all this page can tell you — it says the order is
          possible, not that it is right.</div>`}

    ${openPointsHTML(m)}
  `);
  wireChrome(root);

  $('lgGoal').onchange = e => { L.goal = e.target.value; saveModels(); };
  $('lgAdd').onclick   = () => openStep(null);
  $('lgLink').onclick  = () => openLogicLink();
  $('lgPlan').onclick  = () => showText('Execution plan', compileLogic(m),
                            (m.id||'model') + '-plan.md', 'text/markdown');
  $('lgSeed').onclick  = () => seedLogicFromAnalyzers(m);
  on('[data-step]','click', e => openStep(e.currentTarget.dataset.step), root);
  if(L.steps.length) afterLayout(() => buildLogicGraph(m));
}

/* Seeding creates a step per analyzer node and stops there. It does not invent
   edges: which analyzer needs which other one is the judgement being recorded,
   and a guess would be indistinguishable from a decision once it is on screen. */
function seedLogicFromAnalyzers(m){
  const L = logicOf(m);
  const have = new Set(L.steps.map(s => s.srcNode).filter(Boolean));
  const added = [];
  (m.nodes||[]).filter(n => n.kind === 'analyzer' && !have.has(n.id)).forEach(n => {
    L.steps.push({ id: uid('st'), name: n.label, kind:'analyzer', srcNode: n.id,
                   intent: n.note || '', prompt:'', consumes:[], produces:[] });
    added.push(n.label);
  });
  if(added.length) markChange('seed steps');
  if(!added.length){ showBig('Seed from analyzers',
    `<div class="note">No analyzer nodes in this model that are not already steps. Add analyzer nodes on
      the Structure page, or add steps here by hand.</div>`); return; }
  saveModels(); render();
}

function openStep(id){
  const m = model(), L = logicOf(m);
  const st = id ? L.steps.find(x => x.id === id) : null;
  const isNew = !st;
  const d = st || { id: uid('st'), name:'', kind:'analyzer', intent:'', prompt:'', consumes:[], produces:[] };
  /* Held outside d until Save, so an abandoned modal leaves the step alone. */
  let stOpen = openOf(d);
  const repaint = () => { closeModals(); openStep(id); };
  showBig(isNew ? 'Add step' : 'Step', `
    <div class="row"><input class="in" id="stName" placeholder="What this step does, in a few words"
      value="${esc(d.name)}" style="width:100%;max-width:none;"></div>
    <div class="row" style="margin-top:10px;">
      <select class="in" id="stKind">
        ${Object.keys(STEP_KINDS).map(k =>
          `<option value="${k}" ${d.kind===k?'selected':''}>${esc(STEP_KINDS[k].label)}</option>`).join('')}
      </select>
      <span id="stHint" style="font-size:10.5px;color:var(--muted);flex:1;">${esc(STEP_KINDS[d.kind].hint)}</span>
    </div>
    <div class="row" style="margin-top:10px;">
      <input class="in" id="stIntent" placeholder="Why it exists — one sentence"
        value="${esc(d.intent||'')}" style="width:100%;max-width:none;"></div>

    <div class="section-rule" style="margin-top:16px;">Inputs and outputs</div>
    <p style="font-size:11px;color:var(--muted);margin:0 0 8px;">Comma separated names. These are what the
      validator checks: a step consuming something no earlier step produces is the failure this page is for.</p>
    <div class="row"><input class="in" id="stCons" placeholder="consumes: e.g. extracted obligations, party list"
      value="${esc((d.consumes||[]).join(', '))}" style="width:100%;max-width:none;"></div>
    <div class="row" style="margin-top:8px;"><input class="in" id="stProd" placeholder="produces: e.g. proportionality verdict"
      value="${esc((d.produces||[]).join(', '))}" style="width:100%;max-width:none;"></div>

    <div class="section-rule" style="margin-top:16px;">Prompt</div>
    <textarea class="in" id="stPrompt" rows="5" placeholder="Optional. Carried into the execution plan verbatim."
      style="width:100%;max-width:none;font-family:var(--mono);font-size:11px;">${esc(d.prompt||'')}</textarea>

    ${openFieldsetHTML(stOpen, 'st')}

    <div class="row" style="margin-top:16px;display:flex;gap:8px;">
      <button class="btn sm brand" id="stSave"><i class="fas fa-check"></i> ${isNew?'Add':'Save'}</button>
      ${isNew ? '' : `<button class="btn sm ghost" id="stDel" style="color:var(--red);">
        <i class="fas fa-trash"></i> Delete step</button>`}
    </div>`);

  $('stKind').onchange = e => { $('stHint').textContent = STEP_KINDS[e.target.value].hint; };
  /* Changing what an open point resolves to swaps which third field is shown, so
     the modal is re-opened. The typed name and intent are carried onto d first,
     or a re-paint mid-edit would discard them. */
  wireOpenFieldset('st', stOpen, v => {
    d.name   = (($('stName')   || {}).value || d.name);
    d.intent = (($('stIntent') || {}).value || d.intent);
    if(v) d.open = v; else delete d.open;
    repaint();
  });
  $('stSave').onclick = () => {
    markChange('edit step');
    const list = v => String(v||'').split(',').map(x => x.trim()).filter(Boolean);
    d.name     = $('stName').value.trim() || 'Untitled step';
    d.kind     = $('stKind').value;
    d.intent   = $('stIntent').value.trim();
    d.prompt   = $('stPrompt').value;
    d.consumes = list($('stCons').value);
    d.produces = list($('stProd').value);
    if(stOpen) d.open = stOpen; else delete d.open;
    if(isNew) L.steps.push(d);
    saveModels(); closeModals(); render();
  };
  const del = $('stDel');
  if(del) del.onclick = () => {
    markChange('delete step');
    L.steps = L.steps.filter(x => x.id !== d.id);
    L.edges = L.edges.filter(e => e.from !== d.id && e.to !== d.id);
    saveModels(); closeModals(); render();
  };
}

function openLogicLink(){
  const m = model(), L = logicOf(m);
  if(L.steps.length < 2){ showBig('Connect', `<div class="note">Two steps are needed before one can
    depend on another.</div>`); return; }
  const opts = L.steps.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
  showBig('Connect two steps', `
    <div class="note">Pick the direction carefully: the edge runs <b>from the step that goes first</b> to
      the step that waits for it.</div>
    <div class="row" style="margin-top:12px;flex-wrap:wrap;gap:8px;">
      <select class="in" id="lkFrom">${opts}</select>
      <select class="in" id="lkRel">
        ${Object.keys(LOGIC_RELS).map(k =>
          `<option value="${k}">${esc(LOGIC_RELS[k].label)}</option>`).join('')}
      </select>
      <select class="in" id="lkTo">${opts}</select>
      <button class="btn sm brand" id="lkGo">Connect</button>
    </div>
    <p id="lkHint" style="font-size:10.5px;color:var(--muted);margin-top:8px;">${esc(LOGIC_RELS.needs.hint)}</p>
    <div id="lkErr" style="font-size:11px;color:var(--red);margin-top:6px;"></div>

    ${L.edges.length ? `<div class="section-rule" style="margin-top:18px;">Existing</div>
      <table class="t"><tbody>${L.edges.map(e => {
        const f = L.steps.find(x=>x.id===e.from), t = L.steps.find(x=>x.id===e.to);
        return `<tr><td>${esc((f||{}).name||e.from)}</td>
          <td style="width:150px;color:var(--muted);">${esc(LOGIC_RELS[e.rel].label)}</td>
          <td>${esc((t||{}).name||e.to)}</td>
          <td style="width:40px;"><button class="btn sm ghost" data-unlink="${esc(e.id)}"
            style="color:var(--red);"><i class="fas fa-xmark"></i></button></td></tr>`;
      }).join('')}</tbody></table>` : ''}`);

  $('lkRel').onchange = e => { $('lkHint').textContent = LOGIC_RELS[e.target.value].hint; };
  $('lkGo').onclick = () => {
    const from = $('lkFrom').value, to = $('lkTo').value, rel = $('lkRel').value;
    if(from === to){ $('lkErr').textContent = 'A step cannot depend on itself.'; return; }
    if(L.edges.some(e => e.from===from && e.to===to && e.rel===rel)){
      $('lkErr').textContent = 'That edge already exists.'; return; }
    markChange('connect steps');
    L.edges.push({ id: uid('le'), from, to, rel });
    saveModels(); closeModals(); render();
  };
  on('[data-unlink]','click', e => {
    markChange('remove connection');
    L.edges = L.edges.filter(x => x.id !== e.currentTarget.dataset.unlink);
    saveModels(); closeModals(); render();
  }, $('bigBody'));
}

/* Hierarchical left-to-right, because a pipeline read left to right is the one
   shape everybody already knows how to read. */
function buildLogicGraph(m){
  teardownLogicGraph();
  const el = $('lgcanvas');
  if(!el){ console.warn('[logic graph] #lgcanvas not in the DOM yet'); return; }
  if(!visReady('lgcanvas')) return;
  const L = logicOf(m);
  const issues = validateLogic(L);
  /* Same discipline as the structure graph: shape for the kind of step, and the
     only colour on the canvas is a step that blocks execution. */
  const dark2 = state.dark;
  const ink2  = dark2 ? '#F2F2F2' : '#111111';
  const paper2= dark2 ? '#141416' : '#FFFFFF';

  const nodes = L.steps.map(st => {
    const bad = issues.some(i => i.stepId === st.id && i.sev === 'blocker');
    const op = isOpen(st);
    return { id: st.id, label: st.name, shape:'dot', value: 2,
             title: st.name + (op ? '\nOPEN POINT — ' + (openOf(st).owner || 'unassigned') : ''),
             color:{ background: op ? paper2 : bad ? '#B3261E' : ink2,
                     border:     bad ? '#B3261E' : ink2,
                     highlight:{ background: dark2 ? '#FFFFFF' : '#000000', border:'var(--brand)' } },
             borderWidth: op ? 1.6 : 1,
             /* shapeProperties must always be a full object. vis-network reads
                this.options.shapeProperties.borderDashes unconditionally in
                Node.getFormattingValues(), and node options are merged with
                selectiveNotDeepExtend, which copies an explicit `undefined`
                straight over the library default instead of leaving it alone.
                The old ternary therefore deleted the defaults for every step
                that is not an open point and threw
                "Cannot read properties of undefined (reading 'borderDashes')"
                on the first draw, taking the whole canvas with it. Same form as
                the structure graph above: object always, value conditional. */
             shapeProperties:{ borderDashes: op ? [2,3] : false },
             font:{ color: bad ? '#FFFFFF' : paper2, size:12, strokeWidth:0,
                    face:'Inter, system-ui, sans-serif' } };
  });
  const edges = L.edges.map(e => ({
    id: e.id, from: e.from, to: e.to, arrows:'to',
    dashes: e.rel === 'after',
    color:{ color: e.rel === 'needs' ? (state.dark ? '#8A8A92' : '#5A5A62')
                                      : (state.dark ? '#44444C' : '#B9B9BF') },
    width: e.rel === 'needs' ? 2 : 1
  }));
  try {
    logicNetwork = new vis.Network(el, { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) }, {
      layout:{ hierarchical:{ enabled:true, direction:'LR', sortMethod:'directed',
                              levelSeparation:190, nodeSpacing:110 } },
      physics:false,
      interaction:{ hover:true, dragNodes:true, zoomView:true }
    });
    logicNetwork.on('doubleClick', p => { if(p.nodes.length) openStep(p.nodes[0]); });
  } catch(err){ graphFail('lgcanvas', 'vis-network threw while building the plan graph.', err && err.message); }
}

    state.anonRules.push({ find:f.value, replace: reps[i] || f.replacement, cat:f.cat, regex:false });

  }, root);
  on('[data-rf]','input', e => { state.anonRules[+e.currentTarget.dataset.rf].find = e.currentTarget.value; saveAnon(); }, root);
  on('[data-rr]','input', e => { state.anonRules[+e.currentTarget.dataset.rr].replace = e.currentTarget.value; saveAnon(); }, root);
  on('[data-rc]','change', e => { state.anonRules[+e.currentTarget.dataset.rc].cat = e.currentTarget.value; saveAnon(); }, root);
  on('[data-rx]','change', e => { state.anonRules[+e.currentTarget.dataset.rx].regex = e.currentTarget.checked; saveAnon(); }, root);
  on('[data-rd]','click', e => { state.anonRules.splice(+e.currentTarget.dataset.rd,1); saveAnon(); render(); }, root);
