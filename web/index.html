/* ═══════════════════════════════════════════════════════════════════════════
   ANONYMISER

   The point of the whole product is that the logic is portable and the data
   is not. A model that carries a real operator name, a real mailbox and a
   real ticket reference cannot be pasted into a hosted model, shown to a
   vendor, or committed to a repository somebody outside the team can read.

   Two halves. The scanner looks at the model you have built. The scratchpad
   takes raw notes — an incident write-up, a chat log, a paragraph out of a
   handover document — and gives back the same text with the identifiers
   replaced, so what you paste into the model is already clean.

   The mapping is kept locally and is never part of an export. Exporting the
   mapping is a separate, deliberate action.
   ═══════════════════════════════════════════════════════════════════════════ */
const DETECTORS = [
  { id:'email',  label:'Email address', cat:'contact',
    re:/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g,  rep:() => 'PLACEHOLDER_MAILBOX' },
  { id:'url',    label:'URL',           cat:'location',
    re:/https?:\/\/[^\s<>"')]+/g,                          rep:() => 'PLACEHOLDER_URL' },
  { id:'host',   label:'Host or bolt URL', cat:'system',
    re:/\b(?:bolt|jdbc|ldaps?|amqps?):\/\/[^\s<>"')]+/gi,  rep:() => 'PLACEHOLDER_ENDPOINT' },
  { id:'ip',     label:'IPv4 address',  cat:'system',
    re:/\b(?:\d{1,3}\.){3}\d{1,3}\b/g,                     rep:() => 'PLACEHOLDER_ADDRESS' },
  { id:'ticket', label:'Ticket or issue key', cat:'identifier',
    re:/\b[A-Z][A-Z0-9]{1,9}-\d{1,6}\b/g,                  rep:() => 'PLACEHOLDER_TICKET' },
  { id:'msisdn', label:'Long number (subscriber or account)', cat:'identifier',
    re:/\b(?:\+|00)?\d{9,15}\b/g,                          rep:() => 'PLACEHOLDER_IDENTIFIER' },
  { id:'iban',   label:'IBAN-like string', cat:'identifier',
    re:/\b[A-Z]{2}\d{2}[A-Z0-9]{10,26}\b/g,                rep:() => 'PLACEHOLDER_ACCOUNT' }
];
const ANON_CATS = ['organisation','person','system','product','identifier','contact','location'];

function scanText(text){
  const hits = [];
  DETECTORS.forEach(d => {
    const re = new RegExp(d.re.source, d.re.flags);
    let m;
    while((m = re.exec(String(text||''))) !== null){
      hits.push({ detector:d.id, label:d.label, cat:d.cat, value:m[0], replacement:d.rep(m) });
      if(m.index === re.lastIndex) re.lastIndex++;
    }
  });
  /* dedupe by value, keeping the first detector that claimed it */
  const seen = new Set();
  return hits.filter(h => seen.has(h.value) ? false : (seen.add(h.value), true));
}
function modelText(m){
  const out = [];
  out.push(m.name, m.domain, m.question, m.summary);
  (m.layers||[]).forEach(l => out.push(l.name, l.role));
  (m.nodes||[]).forEach(n => { out.push(n.label, n.note);
    Object.entries(n.props||{}).forEach(([k,v]) => out.push(k+' '+v)); });
  (m.edges||[]).forEach(e => out.push(e.note));
  return out.filter(Boolean).join('\n');
}
function applyRules(text, rules){
  let t = String(text||'');
  (rules||[]).forEach(r => {
    if(!r.find) return;
    try{
      const re = r.regex ? new RegExp(r.find, 'g')
                         : new RegExp(r.find.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
      t = t.replace(re, r.replace || 'PLACEHOLDER');
    }catch(err){ /* an invalid regex must not take the whole export down */ }
  });
  return t;
}
function anonymiseModel(m, rules){
  const c = clone(m);
  const f = s => applyRules(s, rules);
  c.name = f(c.name); c.domain = f(c.domain); c.question = f(c.question); c.summary = f(c.summary);
  (c.layers||[]).forEach(l => { l.name = f(l.name); l.role = f(l.role); });
  (c.nodes||[]).forEach(n => {
    n.label = f(n.label); n.note = f(n.note);
    Object.keys(n.props||{}).forEach(k => { n.props[k] = f(n.props[k]); });
  });
  (c.edges||[]).forEach(e => { e.note = f(e.note); });
  c.anonymised = true;
  return c;
}

/* ═══════════════════════════════════════════════════════════════════════════
   WORKED EXAMPLE — a document template, with analyzers attached to it

   This is the other shape a knowledge model takes, and it is the one that
   feeds the companion product. Layer 1 is the template: a document and the
   chapters it must contain. Layer 2 is what each chapter has to say. Layer 3
   is which analyzer is responsible for checking it.

   The document at the top is a mock. The chapters are a generic ten-chapter
   business-requirements template — the same one the analyzer prompts were
   written against, which is why the chapter references inside those prompts
   line up with the nodes here.

   Two rules are joined by CONTRADICTS, drawn in red and dashed. That is what
   a contradiction looks like once the definition is a graph rather than a
   document, and it is the finding the Cross-Examiner exists to raise.
   ═══════════════════════════════════════════════════════════════════════════ */
function layerIdx(m, id){ return (m.layers||[]).findIndex(l => l.id === id); }
function layerOf(m, id){ return (m.layers||[]).find(l => l.id === id) || { id:'?', name:'unassigned' }; }
function layerColor(m, id){ const i = layerIdx(m, id); return LAYER_COLORS[(i < 0 ? 0 : i) % LAYER_COLORS.length]; }
function nodeById(m, id){ return (m.nodes||[]).find(n => n.id === id) || null; }
function nodesIn(m, layerId){ return (m.nodes||[]).filter(n => n.layer === layerId); }
function edgesOf(m, id){ return (m.edges||[]).filter(e => e.from === id || e.to === id); }
function crossLayerEdges(m){
  return (m.edges||[]).filter(e => {
    const a = nodeById(m, e.from), b = nodeById(m, e.to);
    return a && b && a.layer !== b.layer;
  });
}
function relLabel(e, m){
  const a = nodeById(m, e.from), b = nodeById(m, e.to);
  return (a ? a.label : e.from) + ' —' + e.rel + '→ ' + (b ? b.label : e.to);
}

/* Cheapest directed path.

   Breadth-first would be wrong here, and it is worth saying why. Two nodes are
   often joined both by the route a thing actually travels and by the reason it
   is allowed to travel — a rule that validates a channel is a shorter hop than
   the four processes that produce the message. Counting hops picks the
   justification and calls it the path.

   So relationships that move something cost 1, and relationships that explain,
   govern or own something cost 5. The answer is then the route, and the
   structural edges are still reachable when there is no other way through.

   Undirected fallback is deliberate: a model in progress usually has one edge
   pointing the wrong way, and refusing to answer teaches nobody that. */
const REL_COST = {
  FLOWS_TO:1, TRIGGERS:1, CALLS:1, SENDS_VIA:1, LISTENS_TO:1,
  READS_FROM:1, WRITES_TO:1, SOLD_VIA:1,
  VALIDATES:5, IMPLEMENTS:5, GOVERNS:5, OWNED_BY:5, MONITORS:5,
  DEPENDS_ON:5, CAUSED_BY:5, CONTRADICTS:9, USED_IN:5
};
function tracePath(m, fromId, toId){
  if(!fromId || !toId || fromId === toId) return null;
  const build = both => {
    const adj = {};
    (m.edges||[]).forEach(e => {
      const c = REL_COST[e.rel] || 3;
      (adj[e.from] = adj[e.from] || []).push({ to:e.to, cost:c, e, rev:false });
      if(both) (adj[e.to] = adj[e.to] || []).push({ to:e.from, cost:c + 0.5, e, rev:true });
    });
    return adj;
  };
  const dijkstra = adj => {
    const dist = { [fromId]:0 }, prev = {}, done = new Set();
    while(true){
      let u = null, best = Infinity;
      Object.keys(dist).forEach(k => { if(!done.has(k) && dist[k] < best){ best = dist[k]; u = k; } });
      if(u === null) return null;
      if(u === toId) break;
      done.add(u);
      (adj[u] || []).forEach(x => {
        const nd = dist[u] + x.cost;
        if(dist[x.to] === undefined || nd < dist[x.to]){ dist[x.to] = nd; prev[x.to] = { from:u, x }; }
      });
    }
    const path = [toId], hops = [];
    let cur = toId;
    while(cur !== fromId){
      const p = prev[cur]; if(!p) return null;
      hops.unshift({ from:p.from, to:cur, rel:p.x.e.rel, reversed:p.x.rev });
      path.unshift(p.from); cur = p.from;
    }
    return { nodes:path, hops };
  };
  let r = dijkstra(build(false));
  if(r) return { ...r, directed:true };
  r = dijkstra(build(true));
  return r ? { ...r, directed:false } : null;
}

/* Findings the gap audit perspective is built on. Computed here so the app can
   show them on screen and the export can carry the same list. */
function auditModel(m){
  const out = [];
  const linked = new Set();
  (m.edges||[]).forEach(e => { linked.add(e.from); linked.add(e.to); });
  (m.nodes||[]).forEach(n => { if(!linked.has(n.id)) out.push({ sev:'medium', node:n.id, text:'"'+n.label+'" has no relationships. Nothing reaches it and it reaches nothing.' }); });
  (m.nodes||[]).filter(n => ['app','process','control','product'].includes(n.kind)).forEach(n => {
    const owned = (m.edges||[]).some(e => e.from === n.id && e.rel === 'OWNED_BY');
    if(!owned) out.push({ sev:'low', node:n.id, text:'"'+n.label+'" has no owner. Nobody is named for it.' });
  });
  /* A rule is covered if something below it executes it, or if an analyzer is
     responsible for checking it. Those are two different kinds of coverage —
     a runtime model has the first, a document template has the second — and
     demanding IMPLEMENTS from a template produced a finding on every rule in
     it, which is the fastest way to teach somebody to ignore an audit. */
  (m.nodes||[]).filter(n => n.kind === 'rule').forEach(n => {
    const impl    = (m.edges||[]).some(e => e.to === n.id && e.rel === 'IMPLEMENTS');
    const checked = (m.edges||[]).some(e => e.to === n.id && e.rel === 'CHECKS');
    if(!impl && !checked) out.push({ sev:'high', node:n.id,
      text:'Rule "'+n.label+'" is neither implemented by anything below it nor checked by an analyzer. Nothing enforces it.' });
  });
  /* An analyzer pointed at nothing is a prompt nobody runs. */
  (m.nodes||[]).filter(n => n.kind === 'analyzer').forEach(n => {
    const checks = (m.edges||[]).filter(e => e.from === n.id && e.rel === 'CHECKS').length;
    if(!checks) out.push({ sev:'medium', node:n.id,
      text:'Analyzer "'+n.label+'" is not linked to any chapter or rule. It would run against nothing.' });
  });
  /* A chapter nobody checks will pass review by default. */
  (m.nodes||[]).filter(n => n.kind === 'chapter').forEach(n => {
    const checked = (m.edges||[]).some(e => e.to === n.id && e.rel === 'CHECKS');
    const hasRule = (m.edges||[]).some(e => e.to === n.id && e.rel === 'DEPENDS_ON');
    if(!checked && !hasRule) out.push({ sev:'medium', node:n.id,
      text:'Chapter "'+n.label+'" has no rule stated for it and no analyzer checking it. It passes by default.' });
  });
  (m.layers||[]).forEach((l, i) => {
    if(i === m.layers.length - 1) return;
    const next = m.layers[i+1].id;
    const crosses = (m.edges||[]).some(e => {
      const a = nodeById(m, e.from), b = nodeById(m, e.to);
      if(!a || !b) return false;
      return (a.layer === l.id && b.layer === next) || (b.layer === l.id && a.layer === next);
    });
    if(!crosses) out.push({ sev:'high', node:l.id, text:'Layer "'+l.name+'" has no relationship crossing into "'+m.layers[i+1].name+'". The two are separate models sharing a file.' });
  });
  (m.edges||[]).filter(e => e.rel === 'CONTRADICTS').forEach(e => {
    out.push({ sev:'high', node:e.from, text:'Contradiction: '+relLabel(e, m) });
  });
  return out;
}

/* ═══════════════════════════════════════════════════════════════════════════
   EXPORTERS — five artefacts from one model.

   1. system prompt (.md)   what a model is told before it is asked anything
   2. knowledge pack (.md)  the model itself, readable and re-importable
   3. bundle (.json)        the machine format, versioned and validated
   4. mcp manifest (.json)  a client config plus the tool surface it implies
   5. graph (.cypher)       the same thing as statements for a graph database
   ═══════════════════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════════════════
   UNDO

   People explore when mistakes are cheap. There is version history on the
   server, but a restore is a deliberate act with a dialogue in front of it —
   that is the wrong weight for "I did not mean to delete that node".

   This is a stack of snapshots of the models array, taken before each mutation.
   Deep copies, capped at 30, held in memory only: a reload starts fresh, which
   is correct, because the server-side history is what survives a reload.
   ═══════════════════════════════════════════════════════════════════════════ */
const undoStack = [];
const UNDO_MAX = 30;
function snapshot(label){
  undoStack.push({ label: label || 'change', models: clone(state.models), at: Date.now() });
  if(undoStack.length > UNDO_MAX) undoStack.shift();
}
function canUndo(){ return undoStack.length > 0; }
function undo(){
  const snap = undoStack.pop(); if(!snap) return false;
  state.models = snap.models;
  if(!state.models.some(x => x.id === state.modelId))
    state.modelId = state.models[0] ? state.models[0].id : null;
  store.set('models', state.models);
  return true;
}
/* Every mutation already funnels through saveModels(), so that is the one place
   the snapshot has to be taken — before the change is written, not after. */
/* saveModels() is called after the mutation has already happened in memory, so
   the snapshot cannot be taken there. It is taken by markChange(), which every
   editing action calls first. */
function markChange(label){ snapshot(label); }

/* ═══════════════════════════════════════════════════════════════════════════
   LOGIC — execution order, as a directed acyclic graph

   The structure model says what things ARE and how they relate. It says nothing
   about what has to happen before what, and that is the failure this page
   exists for: an extraction that runs after the check that needed it produces
   output which is fluent and wrong.

   A logic model is a list of STEPS and two kinds of edge between them:

     needs   a hard data dependency. B cannot run until A has produced its
             output. This is what makes an order NECESSARY.
     after   a soft ordering preference. B could run first; it should not.
             Cheap filter before expensive analysis, cheapest refusal first.

   Keeping them apart is the whole point. Merge them and you can no longer tell
   an impossible pipeline from a merely wasteful one.

   Everything below is a pure function of the model. Nothing here calls a model,
   sends a request or reads a document — it decides an order and writes it down.
   ═══════════════════════════════════════════════════════════════════════════ */

const STEP_KINDS = {
  perspective : { label:'Perspective', color:'#7E57C2', icon:'fa-glasses',
                  hint:'Compile the model through a lens and ask the question it frames.' },
  analyzer    : { label:'Analyzer',    color:'#00695C', icon:'fa-vial',
                  hint:'Run a checker with a prompt and a skill list against the output so far.' },
  proportions : { label:'Proportion gate', color:'#00838F', icon:'fa-scale-balanced',
                  hint:'Evaluate the four laws against what has been produced. Reports; does not branch.' },
  extract     : { label:'Extract',     color:'#0288D1', icon:'fa-filter',
                  hint:'Pull a named set of facts out of the input so later steps can rely on them.' },
  transform   : { label:'Transform',   color:'#8D6E63', icon:'fa-arrow-right-arrow-left',
                  hint:'Reshape what an earlier step produced. No new judgement.' },
  human       : { label:'Human',       color:'#D81B60', icon:'fa-user-check',
                  hint:'A person decides. The pipeline stops here until they do.' }
};
const LOGIC_RELS = {
  needs : { label:'needs output of', hard:true,
            hint:'B cannot run until A has produced its output. Makes the order necessary.' },
  after : { label:'should run after', hard:false,
            hint:'B could run first but should not. Makes the order preferred, not required.' }
};

function emptyLogic(){ return { steps: [], edges: [], goal: '' }; }
function logicOf(m){ if(!m.logic) m.logic = emptyLogic(); return m.logic; }

/* ── validation ─────────────────────────────────────────────────────────────
   Four questions, each answerable from the graph alone:
     1. is there a cycle          (the pipeline cannot run at all)
     2. is anything unreachable   (a step nothing leads to and which leads nowhere)
     3. is an input unsatisfied   (a step declares an input no step produces)
     4. is the goal reachable     (does anything actually end at the answer)  */
function validateLogic(L){
  const issues = [];
  const byId = Object.fromEntries(L.steps.map(s => [s.id, s]));
  const hard = L.edges.filter(e => e.rel === 'needs');

  /* 1. cycles — depth-first with a colour mark. Reports the actual loop rather
        than the fact that one exists, because "there is a cycle somewhere" is
        not something anyone can act on. */
  const colour = {}, stack = [], cycles = [];
  const adj = {};
  L.edges.forEach(e => { (adj[e.from] = adj[e.from] || []).push(e.to); });
  function walk(id){
    colour[id] = 'grey'; stack.push(id);
    for(const nxt of (adj[id] || [])){
      if(colour[nxt] === 'grey'){
        const at = stack.indexOf(nxt);
        cycles.push(stack.slice(at).concat(nxt).map(x => (byId[x]||{}).name || x));
      } else if(!colour[nxt]) walk(nxt);
    }
    stack.pop(); colour[id] = 'black';
  }
  L.steps.forEach(st => { if(!colour[st.id]) walk(st.id); });
  cycles.forEach(c => issues.push({ sev:'blocker', code:'cycle',
    msg:'Circular dependency: ' + c.join(' → '),
    fix:'One of these edges is wrong. Ask which step could actually run first if the others had never existed.' }));

  /* 2. islands. A step declared open is allowed to be connected to nothing: that
        is what "Marko checks the nJAMS logs, and we do not model what happens
        next" looks like in a graph. Reported as an open point elsewhere, not as
        a defect here. */
  const touched = new Set();
  L.edges.forEach(e => { touched.add(e.from); touched.add(e.to); });
  L.steps.filter(st => !touched.has(st.id) && !isOpen(st)).forEach(st => issues.push({
    sev:'warn', code:'island', stepId:st.id,
    msg:'“' + st.name + '” is connected to nothing.',
    fix:'Either it runs first and something should depend on it, or it is left over. If it is a deliberate handoff, mark it as an open point instead.' }));

  /* 3. unsatisfied inputs — the failure the user described: a step that needs a
        fact nobody upstream produces will invent one. */
  const producedBy = {};
  L.steps.forEach(st => (st.produces || []).forEach(x => {
    (producedBy[x.trim().toLowerCase()] = producedBy[x.trim().toLowerCase()] || []).push(st.id); }));
  const ancestors = id => {
    const seen = new Set(), q = hard.filter(e => e.to === id).map(e => e.from);
    while(q.length){ const n = q.pop(); if(seen.has(n)) continue; seen.add(n);
      hard.filter(e => e.to === n).forEach(e => q.push(e.from)); }
    return seen;
  };
  L.steps.forEach(st => (st.consumes || []).forEach(raw => {
    const want = raw.trim().toLowerCase(); if(!want) return;
    const makers = producedBy[want] || [];
    if(!makers.length){
      issues.push({ sev:'blocker', code:'nosource', stepId:st.id,
        msg:'“' + st.name + '” consumes “' + raw + '”, which no step produces.',
        fix:'Add a step that produces it, or stop asking for it. A model handed a name nothing defined will invent a definition.' });
      return;
    }
    const up = ancestors(st.id);
    if(!makers.some(mk => up.has(mk))){
      issues.push({ sev:'blocker', code:'unordered', stepId:st.id,
        msg:'“' + st.name + '” consumes “' + raw + '”, produced by ' +
            makers.map(mk => '“' + (byId[mk]||{}).name + '”').join(' or ') + ' — but not before it.',
        fix:'Add a “needs output of” edge from the producing step, or the value will not exist when this runs.' });
    }
  }));

  /* 4. terminal */
  const outgoing = new Set(L.edges.map(e => e.from));
  const ends = L.steps.filter(st => !outgoing.has(st.id));
  if(L.steps.length && !ends.length)
    issues.push({ sev:'blocker', code:'noend', msg:'Every step feeds another. Nothing produces the final answer.',
      fix:'One step has to be last. If they all feed each other, that is the cycle above.' });
  if(ends.length > 1)
    issues.push({ sev:'note', code:'multiend',
      msg: ends.length + ' steps end the pipeline: ' + ends.map(e => '“' + e.name + '”').join(', ') + '.',
      fix:'That is fine if the answer is genuinely several outputs. If not, one of them should feed the other.' });
  return issues;
}

/* ── topological order, by level ─────────────────────────────────────────────
   Kahn's algorithm taken a level at a time rather than one node at a time. The
   level is the useful part: everything inside one has no dependency on anything
   else inside it, so those steps can run together. On a real pipeline that is
   the difference between six sequential calls and three rounds. */
function logicOrder(L){
  const indeg = {}, adj = {};
  L.steps.forEach(st => { indeg[st.id] = 0; adj[st.id] = []; });
  L.edges.forEach(e => {
    if(!(e.from in indeg) || !(e.to in indeg)) return;
    adj[e.from].push(e.to); indeg[e.to]++;
  });
  const levels = [];
  let ready = L.steps.filter(st => indeg[st.id] === 0).map(st => st.id);
  const done = new Set();
  while(ready.length){
    levels.push(ready.slice());
    const next = [];
    ready.forEach(id => {
      done.add(id);
      adj[id].forEach(n => { if(--indeg[n] === 0) next.push(n); });
    });
    ready = next;
  }
  /* Anything left is inside a cycle. Returned separately rather than dropped —
     silently omitting steps from a plan is how a plan becomes a lie. */
  const stuck = L.steps.filter(st => !done.has(st.id)).map(st => st.id);
  return { levels, stuck, ok: stuck.length === 0 };
}

/* ── compile to a chained prompt ────────────────────────────────────────────
   The artefact. Each step names its inputs by the step that produced them, so
   whoever runs it cannot silently reorder the chain. */
function compileLogic(m, opts){
  const o = opts || {}, L = logicOf(m), ord = logicOrder(L);
  const byId = Object.fromEntries(L.steps.map(s => [s.id, s]));
  const P = [];
  P.push('# Execution plan — ' + m.name);
  if(L.goal) P.push('', '**Goal.** ' + L.goal);
  P.push('', 'Run the stages in order. Steps inside one stage are independent of each other',
             'and may run together. Do not reorder stages: each one consumes what the',
             'previous stage produced, and running them out of order produces output that',
             'reads correctly and is not.', '');
  if(!ord.ok){
    P.push('> **This plan is incomplete.** ' + ord.stuck.length + ' step(s) sit inside a circular',
           '> dependency and have no position in any order. Fix the cycle before running it.', '');
  }
  ord.levels.forEach((lvl, i) => {
    P.push('## Stage ' + (i+1) + (lvl.length > 1 ? ' — ' + lvl.length + ' independent steps' : ''));
    P.push('');
    lvl.forEach(id => {
      const st = byId[id]; if(!st) return;
      const kind = STEP_KINDS[st.kind] || STEP_KINDS.transform;
      P.push('### ' + st.name + '  \u00b7  ' + kind.label);
      if(st.intent) P.push('', st.intent);
      const needs = L.edges.filter(e => e.to === id && e.rel === 'needs')
                           .map(e => (byId[e.from]||{}).name).filter(Boolean);
      if(needs.length) P.push('', '**Requires the output of:** ' + needs.map(n => '“'+n+'”').join(', '));
      if((st.consumes||[]).length) P.push('**Consumes:** ' + st.consumes.join(', '));
      if((st.produces||[]).length) P.push('**Produces:** ' + st.produces.join(', '));
      if(st.kind === 'proportions')
        P.push('', 'Evaluate the four laws against what has been produced so far and report each',
                   'as pass or fail with the number that decided it. Do not continue past a failure',
                   'without stating it.');
      if(st.kind === 'human')
        P.push('', 'Stop. A person decides this. Present what is needed for the decision and wait.');
      if(st.prompt) P.push('', '```', st.prompt, '```');
      P.push('');
    });
  });
  if(o.includeIssues !== false){
    const iss = validateLogic(L).filter(x => x.sev === 'blocker');
    if(iss.length){
      P.push('---', '', '## Unresolved before this can run', '');
      iss.forEach(x => P.push('- ' + x.msg));
      P.push('');
    }
  }
  return P.join('\n');
}

function exportSystemPrompt(m, persp, o){
  const p = persp, L = [];
  L.push('# System prompt — ' + m.name);
  L.push('');
  L.push('<!-- Generated by ' + APP.full + ' ' + APP.build + '. Perspective: ' + p.name + '. -->');
  L.push('');
  L.push('## Role');
  L.push('');
  L.push('You answer questions about one domain, using one model of it. ' + p.purpose);
  L.push('');
  L.push('The model is layered. A layer is a level of description, not a level of detail: the same fact');
  L.push('does not appear twice at different resolutions. Every answer is given in every layer, because a');
  L.push('question asked at one layer is almost always caused at another.');
  L.push('');
  L.push('## The layers, in order');
  L.push('');
  m.layers.forEach((l, i) => L.push((i+1) + '. **' + l.name + '** — ' + (l.role || '')));
  L.push('');
  L.push('Traversal order for this perspective: ' +
    (p.order === 'bottom-up' ? 'start at the last layer and work up.'
   : p.order === 'top-down'  ? 'start at the first layer and work down.'
   : 'start at the subject and move outward in both directions.'));
  L.push('');
  L.push('## Vocabulary');
  L.push('');
  L.push('Node kinds used in this model:');
  L.push('');
  const usedKinds = Array.from(new Set(m.nodes.map(n => n.kind)));
  usedKinds.forEach(k => L.push('- `' + k + '` — ' + (KINDS[k] ? KINDS[k].label + '. ' + KINDS[k].hint : '')));
  L.push('');
  L.push('Relationship types used in this model:');
  L.push('');
  Array.from(new Set(m.edges.map(e => e.rel))).forEach(r =>
    L.push('- `' + r + '` — ' + (RELS[r] ? RELS[r].hint : '')));
  L.push('');
  L.push('## Method');
  L.push('');
  p.steps.forEach((s, i) => L.push((i+1) + '. ' + s));
  L.push('');
  L.push('## Answer contract');
  L.push('');
  CONTRACT_BASE.concat(p.contract || []).forEach(c => L.push('- ' + c));
  L.push('');
  L.push('## Boundary');
  L.push('');
  L.push('The model holds structure, not instances. It does not contain any individual customer, any log');
  L.push('line, any delivery report or any measurement. When the question needs one of those, name the');
  L.push('system that holds it and stop — do not estimate it and do not describe what it probably says.');
  const providers = m.nodes.filter(n => n.kind === 'provider');
  if(providers.length){
    L.push('');
    L.push('Outside the model boundary: ' + providers.map(n => '**' + n.label + '**').join(', ') + '.');
  }
  /* OPEN POINTS. The most load-bearing paragraph in the whole prompt, and the one
     that did not exist. Everything above tells a model what is known. Without this,
     everything NOT said reads as an omission rather than a boundary — so a model
     fills it in, fluently, and the invention is indistinguishable from the parts
     that were written on purpose. Naming the handoffs turns the largest
     hallucination surface in the artefact into a declared edge. */
  const opens = openPoints(m);
  if(opens.length){
    L.push('');
    L.push('## Open points — do not fill these in');
    L.push('');
    L.push('The following are deliberately unspecified. They are not omissions and not defects:');
    L.push('somebody has decided that this model does not describe them. Do not infer what happens at');
    L.push('these points, do not invent a mechanism for them, and do not treat them as gaps to be');
    L.push('closed. If the question depends on one, say which open point it depends on and who holds');
    L.push('it, then stop.');
    L.push('');
    opens.forEach(o => {
      const who = o.open.owner ? ' — held by **' + o.open.owner + '**' : ' — nobody named yet';
      const what = o.open.resolves === 'model'
        ? 'described in a separate knowledge model: ' + (openTarget(o.open) || 'not chosen')
        : o.open.resolves === 'person' ? 'a person does this' + (o.open.ref ? ': ' + o.open.ref : '')
        : o.open.resolves === 'system' ? 'handled by ' + (o.open.ref || 'another system') + ', outside this model'
        : o.open.resolves === 'ask'    ? 'left to whoever is reading — ask rather than assume'
        : 'not decided yet' + (o.open.ref ? ': ' + o.open.ref : '');
      L.push('- **' + o.label + '** (' + o.kindLabel + ')' + who + '. ' + what + '.'
             + (o.open.note ? '  \n  ' + o.open.note : ''));
    });
  }
  L.push('');
  /* The ceilings belong in the prompt, not only in the tool. A model asked to
     propose anything will otherwise return something sized for an
     organisation that does not exist, and telling it the constraint up front
     is cheaper than checking the answer afterwards — though the check still
     runs, because a stated constraint is not an obeyed one. */
  if(o && o.proportions){
    const pr = o.proportions, cc = computeCeilings(pr);
    L.push('## Proportions — what this organisation can carry');
    L.push('');
    L.push('Profile: **' + pr.name + '**' + (pr.note ? ' — ' + pr.note : ''));
    L.push('');
    if((pr.variables || []).length){
      L.push('Measured:');
      L.push('');
      pr.variables.forEach(v => L.push('- ' + (v.label || v.key) + ': ' + v.value +
        (v.unit ? ' ' + v.unit : '') + '  `' + v.key + '`'));
      L.push('');
    }
    if((pr.ceilings || []).length){
      L.push('Do not propose anything that exceeds these. They are derived from the measurements above by');
      L.push('the expression shown, not chosen:');
      L.push('');
      cc.meta.forEach(x => {
        if(x.error){ L.push('- ' + (x.label || x.key) + ': not computable (' + x.error + ')'); return; }
        L.push('- ' + (x.label || x.key) + ': ' + (x.key === 'minMigrationWeeks' ? 'at least ' : 'at most ') +
          x.value + (x.unit ? ' ' + x.unit : '') + '  `' + x.expr + '`');
      });
      L.push('');
    }
    if(cc.items.length){
      L.push('Systems that already exist and stay switched on (total mass ' + cc.legacyMass + '):');
      L.push('');
      cc.items.forEach(s => L.push('- ' + s.name + ' — ' + s.ageYears + ' years old, ' +
        (COUPLING_LABEL[s.coupling]||'?').toLowerCase() + ', ' +
        (DATASCALE_LABEL[s.dataScale]||'?').toLowerCase() + ' data, mass ' + s.mass));
      L.push('');
      L.push('Nothing here can be started from scratch. It can only be moved.');
      L.push('');
    }
    const vetoes = (pr.influence||[]).filter(x => x.veto);
    if(vetoes.length){
      L.push('Anything proposed has to survive: ' + vetoes.map(x => x.name).join(', ') + '.');
      L.push('');
    }
    L.push('If the answer would breach any of these, say so and give the version that does not, rather than');
    L.push('giving the larger answer with a caveat attached to it.');
    L.push('');
  }

  /* Analyzer prompts, when the model points at any. Carrying the mapping
     without the prompts produces a file that looks complete and is not: the
     same rules run against different instructions and the same document
     scores differently. */
  const anIds = Array.from(new Set(m.nodes.filter(n => n.kind === 'analyzer')
    .map(n => (n.props||{}).analyzerId).filter(x => x && INSPECTOR_META[x])));
  if(anIds.length){
    L.push('## Analyzers referenced by this model');
    L.push('');
    L.push('Each analyzer node below carries a full prompt. When the question is about what a checker would');
    L.push('raise, use its prompt as the instruction rather than reasoning about its name.');
    L.push('');
    anIds.forEach(id => {
      const meta = INSPECTOR_META[id], sk = ANALYZER_SKILLS[id] || [];
      L.push('### ' + meta.alias + ' — `' + meta.label + '`');
      L.push('');
      L.push(meta.role);
      L.push('');
      if(sk.length){
        L.push('| Skill | Rule | Severity |');
        L.push('| --- | --- | --- |');
        sk.forEach(s => L.push('| ' + s.name + ' | ' + String(s.rule).replace(/\|/g,'/') + ' | ' + s.severity + ' |'));
        L.push('');
      }
      L.push('```text');
      L.push(ANALYZER_PROMPTS[id] || '');
      L.push('```');
      L.push('');
    });
  }

  L.push('## Knowledge');
  L.push('');
  L.push('The model follows. Treat it as the only source. If it is silent, say so.');
  L.push('');
  L.push(exportKnowledgePack(m, { headingLevel:3, embedded:true }));
  return L.join('\n');
}

function exportKnowledgePack(m, opts){
  const o = opts || {}, h = o.headingLevel || 1, H = n => '#'.repeat(Math.min(6, h + n)) + ' ';
  const L = [];
  L.push(H(0) + m.name);
  L.push('');
  if(!o.embedded){
    L.push('<!-- ' + SCHEMA.kind + ' v' + SCHEMA.version + ' · exported ' + new Date().toISOString() + ' -->');
    L.push('<!-- This file re-imports through Knowledge Engineering Studio → Models → Import. -->');
    L.push('');
  }
  L.push('- Domain: ' + (m.domain || '—'));
  L.push('- Question this model exists to answer: ' + (m.question || '—'));
  L.push('- Layers: ' + m.layers.length + ' · Nodes: ' + m.nodes.length + ' · Relationships: ' + m.edges.length);
  L.push('- Anonymised: ' + (m.anonymised ? 'yes' : 'no — this file may carry identifying values'));
  L.push('');
  if(m.summary){ L.push(m.summary); L.push(''); }

  m.layers.forEach((l, i) => {
    L.push(H(1) + 'Layer ' + (i+1) + ': ' + l.name);
    L.push('');
    if(l.role){ L.push('Role: ' + l.role); L.push(''); }
    const ns = nodesIn(m, l.id);
    if(!ns.length){ L.push('_No nodes in this layer._'); L.push(''); return; }
    ns.forEach(n => {
      L.push(H(2) + n.label + '  `' + n.kind + '`  `' + n.id + '`');
      L.push('');
      if(n.note){ L.push(n.note); L.push(''); }
      const pk = Object.keys(n.props || {});
      if(pk.length){
        L.push('| Property | Value |');
        L.push('| --- | --- |');
        pk.forEach(k => L.push('| ' + k + ' | ' + String(n.props[k]).replace(/\|/g,'/') + ' |'));
        L.push('');
      }
      const out = (m.edges||[]).filter(e => e.from === n.id);
      const inc = (m.edges||[]).filter(e => e.to === n.id);
      if(out.length){
        L.push('Outgoing:');
        out.forEach(e => { const t = nodeById(m, e.to);
          L.push('- ' + e.rel + ' → ' + (t ? t.label + ' (`' + t.id + '`, layer ' + (layerIdx(m, t.layer)+1) + ')' : e.to) + (e.note ? ' — ' + e.note : '')); });
        L.push('');
      }
      if(inc.length){
        L.push('Incoming:');
        inc.forEach(e => { const s = nodeById(m, e.from);
          L.push('- ' + (s ? s.label + ' (`' + s.id + '`)' : e.from) + ' → ' + e.rel); });
        L.push('');
      }
    });
  });

  const cross = crossLayerEdges(m);
  L.push(H(1) + 'Relationships that cross a layer');
  L.push('');
  if(!cross.length) L.push('_None. Every layer in this model is currently self-contained, which is itself a finding._');
  else cross.forEach(e => {
    const a = nodeById(m, e.from), b = nodeById(m, e.to);
    L.push('- L' + (layerIdx(m, a.layer)+1) + ' ' + a.label + ' —' + e.rel + '→ L' + (layerIdx(m, b.layer)+1) + ' ' + b.label + (e.note ? '  \n  ' + e.note : ''));
  });
  L.push('');
  const inc = m.nodes.filter(n => n.kind === 'incident');
  if(inc.length){
    L.push(H(1) + 'Recorded incidents');
    L.push('');
    inc.forEach(n => {
      const causes = (m.edges||[]).filter(e => e.from === n.id && e.rel === 'CAUSED_BY')
        .map(e => { const t = nodeById(m, e.to); return t ? t.label : e.to; });
      L.push('- **' + n.label + '** — ' + Object.entries(n.props||{}).map(([k,v]) => k+': '+v).join(', ') +
        (causes.length ? '. Caused by: ' + causes.join(', ') + '.' : '.'));
    });
    L.push('');
  }
  return L.join('\n');
}

function exportBundle(m){
  const u = auth.user() || {};
  return {
    kind: SCHEMA.kind,
    schemaVersion: SCHEMA.version,
    generator: { app: APP.full, build: APP.build, mock: APP.mock },
    exported: { at: new Date().toISOString(), by: u.name || 'anonymous', workspace: u.name || null },
    model: clone(m),
    perspectives: PERSPECTIVES.concat(state.customPerspectives).map(p => clone(p)),
    proportions: {
      profile: clone(state.proportions),
      ceilings: computeCeilings(state.proportions),
      note:'Ceilings are derived, not authored. They are carried so a reader can see what the profile implies without re-running the engine.'
    },
    analyzers: Array.from(new Set(m.nodes.filter(n => n.kind === 'analyzer')
      .map(n => (n.props||{}).analyzerId).filter(x => x && INSPECTOR_META[x])))
      .map(id => ({ id, ...INSPECTOR_META[id], prompt:ANALYZER_PROMPTS[id] || '', skills:clone(ANALYZER_SKILLS[id] || []),
                    discipline:(DISCIPLINES[disciplineOf(id)]||{}).name || null })),
    audit: auditModel(m),
    note: 'The mapping table used to anonymise this model is not included. It is exported separately and deliberately.'
  };
}

/* MCP manifest. Two halves: a client configuration block, and the tool
   surface the model implies. The second half is a specification — nothing in
   this build serves it. That is stated in the file rather than left to be
   discovered by whoever tries to start it. */
function exportMcp(m){
  const slug = (m.name || 'model').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
  return {
    _readme: [
      'Generated by ' + APP.full + ' ' + APP.build + '.',
      'mcpServers is a client configuration. tools is the surface a server for this model would expose.',
      'No server is included. This file describes one; it does not start one.',
      'The allow-list is the point: a client that only reads the model never receives a tool that can write it.'
    ].join(' '),
    mcpServers: {
      [slug]: {
        transport: 'stdio',
        command: '/opt/mcp/ke-knowledge',
        args: ['--model', './' + slug + '.json', '--read-only'],
        allowedTools: ['list_layers','get_node','search_nodes','neighbours','trace_path','list_incidents','get_perspective_prompt']
      }
    },
    resources: [
      { uri:'kes://' + slug + '/model',      mimeType:'application/json', description:'The model bundle.' },
      { uri:'kes://' + slug + '/knowledge',  mimeType:'text/markdown',    description:'The knowledge pack as Markdown.' }
    ],
    tools: [
      { name:'list_layers', description:'The layers of this model, in order, with the role of each.',
        inputSchema:{ type:'object', properties:{}, required:[] } },
      { name:'get_node', description:'One node with its properties and every relationship it takes part in.',
        inputSchema:{ type:'object', properties:{ id:{ type:'string' } }, required:['id'] } },
      { name:'search_nodes', description:'Nodes whose label or properties match a string, optionally filtered by layer or kind.',
        inputSchema:{ type:'object', properties:{ q:{ type:'string' }, layer:{ type:'string' }, kind:{ type:'string', enum:KIND_IDS } }, required:['q'] } },
      { name:'neighbours', description:'Everything within N hops of a node.',
        inputSchema:{ type:'object', properties:{ id:{ type:'string' }, depth:{ type:'integer', minimum:1, maximum:4 } }, required:['id'] } },
      { name:'trace_path', description:'The path from one node to another, as an ordered list of hops with their relationship types.',
        inputSchema:{ type:'object', properties:{ from:{ type:'string' }, to:{ type:'string' } }, required:['from','to'] } },
      { name:'list_incidents', description:'Recorded incidents with their windows and causes. Use to test whether a reported date falls inside a known window.',
        inputSchema:{ type:'object', properties:{ on:{ type:'string', description:'ISO date' } }, required:[] } },
      { name:'get_perspective_prompt', description:'The system prompt for a named perspective over this model.',
        inputSchema:{ type:'object', properties:{ perspective:{ type:'string', enum:PERSPECTIVES.map(p=>p.id) } }, required:['perspective'] } }
    ],
    model: { id:m.id, name:m.name, layers:m.layers.length, nodes:m.nodes.length, edges:m.edges.length, anonymised:!!m.anonymised }
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   ASSISTANT TARGETS

   The system prompt exporter produces one block of prose. That is the right
   artefact for a chat window and the wrong one for a coding assistant, which
   wants a file in a known location with a known name.

   These write that file. Same content, target-specific framing: each assistant
   has a convention about where instructions live and how it reads them, and
   getting the filename wrong is the difference between a file that is loaded
   and a file that sits in the repository doing nothing.

   No target here calls anything. They write text you paste or commit.
   ═══════════════════════════════════════════════════════════════════════════ */
const ASSISTANT_TARGETS = {
  copilot: {
    name  : 'GitHub Copilot',
    file  : '.github/copilot-instructions.md',
    icon  : 'fa-code-branch',
    note  : 'Committed at the repository root, Copilot picks it up for every chat and completion in that repo. Keep it short — it is prepended to a context window that is already crowded.',
    wrap  : (body, m) => body
  },
  claude: {
    name  : 'Claude Code',
    file  : 'CLAUDE.md',
    icon  : 'fa-terminal',
    note  : 'Read from the working directory at the start of a session. Nested CLAUDE.md files apply to their subtree, so a large repository can carry one model per area.',
    wrap  : (body, m) => body
  },
  cursor: {
    name  : 'Cursor',
    file  : '.cursor/rules/' + 'domain.mdc',
    icon  : 'fa-i-cursor',
    note  : 'Cursor reads .mdc rule files with a small front-matter block. alwaysApply keeps it in context rather than waiting for a filename match.',
    wrap  : (body, m) => '---\ndescription: ' + (m.name || 'Domain model') +
                         '\nalwaysApply: true\n---\n\n' + body
  },
  chatgpt: {
    name  : 'ChatGPT / custom GPT',
    file  : 'instructions.txt',
    icon  : 'fa-comment-dots',
    note  : 'Paste into the instructions box of a custom GPT or a project. There is a character ceiling there, so this target drops the worked examples and keeps the rules.',
    wrap  : (body, m) => body
  },
  generic: {
    name  : 'Plain system prompt',
    file  : 'system-prompt.md',
    icon  : 'fa-file-lines',
    note  : 'No framing, no front matter. For an API call, a playground, or an assistant not listed here.',
    wrap  : (body, m) => body
  }
};

/* A skill is one analyzer, standing alone: what it is for, when it fires, what
   it must not do. Assistants that support reusable instruction modules take one
   of these per file; everything else takes them concatenated. */
function exportSkills(m, o){
  const opts = o || {};
  const analyzers = (m.nodes||[]).filter(n => n.kind === 'analyzer');
  const L = logicOf(m), ord = logicOrder(L);
  const P = [];
  P.push('# Skills — ' + m.name);
  P.push('');
  P.push('Each section below is one checker, written to stand on its own. Give an assistant');
  P.push('one of them and it can run that check without the rest of the model.');
  P.push('');
  if(!analyzers.length){
    P.push('_This model defines no analyzer nodes. Add nodes of kind “Analyzer” on the Structure');
    P.push('page and link them to what they check with a CHECKS relationship._');
    return P.join('\n');
  }
  analyzers.forEach(a => {
    const checks = (m.edges||[]).filter(e => e.from === a.id && e.rel === 'CHECKS')
      .map(e => (m.nodes.find(n => n.id === e.to)||{}).label).filter(Boolean);
    const step = L.steps.find(x => x.srcNode === a.id);
    P.push('## ' + a.label);
    P.push('');
    if(a.note) P.push(a.note, '');
    if(checks.length) P.push('**Responsible for:** ' + checks.join(', '), '');
    if(step){
      const stage = ord.levels.findIndex(l => l.includes(step.id));
      if(stage >= 0) P.push('**Runs at stage ' + (stage+1) + '** of the execution plan.', '');
      const needs = L.edges.filter(e => e.to === step.id && e.rel === 'needs')
        .map(e => (L.steps.find(x=>x.id===e.from)||{}).name).filter(Boolean);
      if(needs.length) P.push('**Do not run this before:** ' + needs.join(', ') + '.', '');
      if((step.consumes||[]).length) P.push('**Expects to be given:** ' + step.consumes.join(', ') + '.', '');
      if((step.produces||[]).length) P.push('**Must return:** ' + step.produces.join(', ') + '.', '');
      if(step.prompt) P.push('```', step.prompt, '```', '');
    }
    Object.keys(a.props||{}).forEach(k => P.push('- **' + k + '**: ' + a.props[k]));
    P.push('');
  });
  P.push('---');
  P.push('');
  P.push('Order matters between these. Running a check before the step that produces');
  P.push('its input does not fail loudly — it produces a confident answer about');
  P.push('something that was never established. See the execution plan.');
  return P.join('\n');
}

/* One assistant file: the domain rules, the execution order, and the skills,
   framed for wherever it is going. */
function exportForAssistant(m, target, persp){
  const t = ASSISTANT_TARGETS[target] || ASSISTANT_TARGETS.generic;
  const P = [];
  /* The purpose changes what this file IS, so it is stated at the top rather
     than left for the reader to infer from the content. */
  if(m.docPurpose === 'template'){
    P.push('# Review template \u2014 ' + (m.name || 'Document'));
    P.push('');
    P.push('This describes what a document of this type must contain. You are being given it so');
    P.push('that you can review a DIFFERENT document against it. Nothing below is a fact about');
    P.push('the document you are reviewing \u2014 it is what that document is required to establish.');
    P.push('For each claim, find where the document under review makes it, or report that it does not.');
    P.push('');
  } else if(m.docPurpose === 'knowledge'){
    P.push('# ' + (m.name || 'Domain model'));
    P.push('');
    P.push('This is drawn from one particular document and describes what is true in this area.');
    P.push('Treat the claims below as established where evidence is named, and as asserted but');
    P.push('unverified where it is not. Say which when you rely on one.');
    P.push('');
  } else {
    P.push('# ' + (m.name || 'Domain model'));
  }
  P.push('');
  P.push('_Generated by Knowledge Engineering Studio. Structure, order and checks for');
  P.push('this domain. Regenerate rather than editing by hand — the model is the source._');
  P.push('');
  if(m.question){ P.push('**The question this exists to answer.** ' + m.question); P.push(''); }
  if(m.summary){ P.push(m.summary); P.push(''); }

  P.push('---');
  P.push('');
  P.push(exportSystemPrompt(m, persp, { includeProportions: state.includeProportions }));

  const L = logicOf(m);
  if(L.steps.length){
    P.push('');
    P.push('---');
    P.push('');
    P.push(compileLogic(m, { includeIssues:true }));
  }

  const skills = exportSkills(m);
  if(skills){
    P.push('');
    P.push('---');
    P.push('');
    P.push(skills);
  }
  return t.wrap(P.join('\n'), m);
}

function exportCypher(m){
  const L = [], q = s => "'" + String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'") + "'";
  L.push('// ' + m.name + ' — generated by ' + APP.full + ' ' + APP.build);
  L.push('// Anonymised: ' + (m.anonymised ? 'yes' : 'NO — review before loading into a shared database'));
  L.push('');
  m.layers.forEach((l, i) => L.push('MERGE (:Layer {id:' + q(l.id) + ', name:' + q(l.name) + ', ord:' + (i+1) + ', role:' + q(l.role) + '});'));
  L.push('');
  m.nodes.forEach(n => {
    const label = (KINDS[n.kind] ? KINDS[n.kind].label : n.kind).replace(/[^A-Za-z]/g,'');
    const props = ['id:' + q(n.id), 'label:' + q(n.label), 'layer:' + q(n.layer), 'kind:' + q(n.kind)]
      .concat(Object.entries(n.props||{}).map(([k,v]) => '`' + String(k).replace(/`/g,'') + '`:' + q(v)))
      .concat(n.note ? ['note:' + q(n.note)] : []);
    L.push('MERGE (n:' + label + ' {id:' + q(n.id) + '}) SET n += {' + props.join(', ') + '};');
  });
  L.push('');
  m.nodes.forEach(n => L.push('MATCH (n {id:' + q(n.id) + '}), (l:Layer {id:' + q(n.layer) + '}) MERGE (n)-[:IN_LAYER]->(l);'));
  L.push('');
  m.edges.forEach(e => L.push('MATCH (a {id:' + q(e.from) + '}), (b {id:' + q(e.to) + '}) MERGE (a)-[r:' + e.rel + ']->(b)' + (e.note ? ' SET r.note = ' + q(e.note) : '') + ';'));
  return L.join('\n');
}

/* Markdown import — the round trip for the knowledge pack. It reads what this
   build writes. A file written by hand in the same shape also works; anything
   it cannot place is reported rather than dropped. */
function importKnowledgePack(md){
  const lines = String(md||'').replace(/\r/g,'').split('\n');
  const m = { id:uid('m'), name:'Imported model', domain:'', question:'', summary:'',
              anonymised:false, layers:[], nodes:[], edges:[], createdAt:Date.now() };
  const warn = [];
  let curLayer = null, curNode = null, mode = null;
  const pendingEdges = [];
  for(const raw of lines){
    const t = raw.trim();
    if(!t) continue;
    if(/^<!--/.test(t)) continue;
    let mm;
    if((mm = t.match(/^#\s+(.+)$/))){ m.name = mm[1].trim(); continue; }
    if((mm = t.match(/^##\s+Layer\s+\d+:\s*(.+)$/i))){
      curLayer = { id:'l'+(m.layers.length+1), name:mm[1].trim(), role:'' };
      m.layers.push(curLayer); curNode = null; mode = null; continue;
    }
    if(/^##\s+Relationships that cross/i.test(t)){ curLayer = null; curNode = null; mode = 'cross'; continue; }
    if(/^##\s+Recorded incidents/i.test(t)){ curLayer = null; curNode = null; mode = 'inc'; continue; }
    if((mm = t.match(/^###\s+(.+?)\s+`([a-z_]+)`\s+`([^`]+)`\s*$/))){
      curNode = { id:mm[3], layer: curLayer ? curLayer.id : (m.layers[0]||{}).id, kind:mm[2],
                  label:mm[1].trim(), props:{}, note:'' };
      m.nodes.push(curNode); mode = 'node'; continue;
    }
    if((mm = t.match(/^-\s+Domain:\s*(.*)$/i))){ m.domain = mm[1].trim(); continue; }
    if((mm = t.match(/^-\s+Question this model exists to answer:\s*(.*)$/i))){ m.question = mm[1].trim(); continue; }
    if((mm = t.match(/^-\s+Anonymised:\s*(\w+)/i))){ m.anonymised = /^yes/i.test(mm[1]); continue; }
    if((mm = t.match(/^Role:\s*(.+)$/)) && curLayer && !curNode){ curLayer.role = mm[1].trim(); continue; }
    if(/^Outgoing:/.test(t)){ mode = 'out'; continue; }
    if(/^Incoming:/.test(t)){ mode = 'in'; continue; }
    if((mm = t.match(/^\|\s*([^|]+?)\s*\|\s*([^|]*?)\s*\|$/)) && curNode){
      const k = mm[1].trim(), v = mm[2].trim();
      if(/^-+$/.test(k) || /^property$/i.test(k)) continue;
      curNode.props[k] = v; continue;
    }
    if(mode === 'out' && curNode && (mm = t.match(/^-\s+([A-Z_]+)\s+→\s+.*?`([^`]+)`/))){
      pendingEdges.push({ from:curNode.id, rel:mm[1], to:mm[2] }); continue;
    }
    if(mode === 'in') continue;                       /* incoming is derived, not authored */
    if(mode === 'node' && curNode && !/^[-|]/.test(t)){ curNode.note = (curNode.note ? curNode.note + ' ' : '') + t; continue; }
    if(!curLayer && !curNode && !mode && !/^[-|]/.test(t) && !m.summary){ m.summary = t; continue; }
  }
  pendingEdges.forEach(p => {
    if(!m.nodes.some(n => n.id === p.from) || !m.nodes.some(n => n.id === p.to)){
      warn.push('Relationship ' + p.from + ' —' + p.rel + '→ ' + p.to + ' names a node that is not in the file. Skipped.');
      return;
    }
    m.edges.push({ id:uid('e'), from:p.from, to:p.to, rel:p.rel, note:'' });
  });
  if(!m.layers.length) warn.push('No layers found. Layers are read from "## Layer N: name" headings.');
  if(!m.nodes.length)  warn.push('No nodes found. Nodes are read from "### Label `kind` `id`" headings.');
  return { model:m, warnings:warn };
}

/* ═══════════════════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════════════════ */
/* `state` is a live object other modules close over, so it is mutated in place
   rather than reassigned. rebuildState() re-reads everything the store owns and
   is called once after the workspace arrives from the server, and again after a
   purge or a sample load.

   The workspace ships EMPTY. The three example models used to be instantiated
   here, which meant every new workspace was born with somebody else's data in
   it. They now live in samples/ and arrive only when asked for. */
const state = {
  models   : [],
  modelId  : null,
  /* A set, not a value. Filtering to one layer and then wanting a second one
     alongside it is the normal case — a cross-layer question is the only kind
     worth asking here — and a single-select filter makes that impossible
     without clearing first. Empty means everything. */
  filterLayers : [],
  filterKind  : null,
  search   : '',
  perspId  : 'triage',
  showGraph: true,
  llm      : { enabled:false, baseUrl:'', model:'', temperature:0.2 },
  lensId   : null,                                  /* perspective applied to the view, not to an export */
  lensAll  : false,                                 /* show lenses this model has nothing for */

  /* Filled by syncProportions() once state.modelId is known. Both were
     store.get('proportions') and store.get('propProfiles') - workspace keys, one
     profile for every model in the folder - which is why a new model opened
     holding the previous one's variables and stakeholder weights. A proportions
     profile is a statement about the organisation a PARTICULAR document belongs
     to, so it is keyed by model. */
  proportions : null,
  propProfiles: null,
  propDraft: '',
  discId   : 'linguistic',
  /* DocCritique view state. None of it touches the model — these are show/hide
     and focus, the same class of thing as a filter box, and they are held here
     rather than in the model file for exactly that reason. anView switches the
     Analyzers page between the library and the critique drawing; dcHideCh and
     dcHideAg are the unticked boxes; dcPick is the one agent being followed,
     which dims everything it is not responsible for. */
  anView   : 'library',
  perspAsk : '',
  perspAnswer: null,
  dcHideCh : [],
  dcHideAg : [],
  dcPick   : null,
  includeProportions: store.get('includeProportions', true),
  lastValidation: null,
  propReading   : null,
  anonAi        : null,
  brain         : null,
  customPerspectives : store.get('perspectives', []),
  anonRules: store.get('anonRules', []),
  anonOnExport : store.get('anonOnExport', true),
  scratch  : '',
  traceFrom: null,
  traceTo  : null,
  dark     : store.get('dark', false)
};
/* No normaliseProportions() here any more: the profile is keyed by model and
   state.modelId is still null at this point, so there is nothing to key on.
   syncProportions() does it from render(), which cannot run before boot(). */
/* Re-read every store-owned field. Anything not listed here is view state that
   deliberately does not survive a reload — filters, search, the scratch pad. */
function rebuildState(){
  state.models             = store.get('models', []) || [];
  state.modelId            = store.get('modelId', null) || (state.models[0] ? state.models[0].id : null);
  state.showGraph          = FLAGS.graph && store.get('showGraph', true);
  /* Null, not a read: the keys are per model and the model may have changed with
     the workspace. Forcing propModelId to null makes the next render() re-read
     against whatever state.modelId now is. */
  propModelId = null;
  state.includeProportions = store.get('includeProportions', true);
  state.customPerspectives = store.get('perspectives', []);
  state.perspId            = store.get('perspId', 'triage');
  state.anonRules          = store.get('anonRules', []);
  state.anonOnExport       = store.get('anonOnExport', true);
  state.dark               = store.get('dark', false);
  state.llm                = Object.assign(clone(LLM_DEFAULT), store.get('llm', {}) || {});
  /* Session state that belongs to the workspace being left, not the one
     arriving. propNew already cleared these three; rebuildState did not, so a
     purge or a sign-out-and-in showed the previous workspace's pasted proposal
     and its verdict underneath the new workspace's ceilings. A verdict outliving
     the profile that produced it is the same lie the propPick comment is about,
     one level up. */
  state.propDraft      = '';
  state.lastValidation = null;
  state.propReading    = null;
  document.body.classList.toggle('dark', !!state.dark);
}

async function loadWorkspace(){
  const ws = await api.workspace();
  store.hydrate(ws || {});
  rebuildState();
}

/* Sample data is fetched, never inlined. Loading is additive by default: it
   will not silently replace a model you have edited. */
async function loadSamples(replace){
  const list = await api.samples();
  const loaded = [];
  for(const s of list){
    const m = await api.sample(s.file);
    if(!m || !m.id) continue;
    const at = state.models.findIndex(x => x.id === m.id);
    if(at >= 0){ if(replace) state.models[at] = m; else continue; }
    else state.models.push(m);
    loaded.push(m.name || m.id);
  }
  if(!state.modelId && state.models.length) state.modelId = state.models[0].id;
  saveModels(); store.set('modelId', state.modelId);
  return loaded;
}

/* Purge means the files go. There is no server-side copy because there is no
   server beyond the one writing your volume. History is removed too — a purge
   that leaves .history/ behind is not a purge. */
async function purgeWorkspace(){
  await store.flush().catch(() => {});
  await api.purge();
  store.hydrate({});
  rebuildState();
}

function model(){ return state.models.find(m => m.id === state.modelId) || state.models[0]; }
function saveModels(){ store.set('models', state.models); }

/* Keyboard undo. Ignored while typing, because Ctrl-Z inside a text field
   should undo the typing, not the last node you deleted. */
window.addEventListener('keydown', e => {
  if(!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'z' || e.shiftKey) return;
  const t = e.target && e.target.tagName;
  if(t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
  if(!canUndo()) return;
  e.preventDefault();
  if(undo()) render();
});
function savePersp(){ store.set('perspectives', state.customPerspectives); }
function saveAnon(){ store.set('anonRules', state.anonRules); store.set('anonOnExport', state.anonOnExport); }
/* The model the open profile belongs to. Not on `state`, because nothing outside
   these two functions has any business reading it. */
let propModelId = null;

/* A DASH, not a colon. The server validates a workspace key with the same
   store.ValidName() it uses for profile names, and the sign-in dialogue states
   that rule as "letters, digits, dash and underscore" - so `proportions:m_ab12cd`
   is refused with 400 "invalid key" and the write is silently lost apart from a
   console line. A model id is uid('m'), i.e. m_ plus six base36 characters, so
   `proportions-m_ab12cd` is 20 characters of [A-Za-z0-9_-] and safe on every
   filesystem too.

   Worth knowing: STORAGE.md section 3 recommends keying models individually as
   `models:<id>`. That form has exactly this problem and would have to use a dash
   as well, or change the validator. */
const PROP_KEY = 'proportions-';
const PROF_KEY = 'propProfiles-';

/* Called from render(), which runs on every navigation, so it covers every route
   that can change state.modelId - opening a card, creating, deleting, undoing, a
   sample load - without each of those having to remember to call it. Cheap: it
   returns immediately unless the model actually changed.

   Legacy adoption. A workspace written by an earlier build has un-keyed
   `proportions` and `propProfiles`. They are adopted ONCE, by whichever model is
   open when the upgraded build first runs, and the old keys are left in place
   rather than deleted - that profile was written for some model in this folder
   and this is the least surprising guess, but it IS a guess, so nothing is
   destroyed in the making of it. */
function syncProportions(){
  const id = state.modelId || '';
  if(propModelId === id) return;
  propModelId = id;
  let p  = store.get(PROP_KEY + id, null);
  let ps = store.get(PROF_KEY + id, null);
  if(!p && store.get('proportions', null)){
    p  = store.get('proportions', null);
    ps = store.get('propProfiles', null);
    console.log('[proportions] adopted the workspace-wide profile for model ' + id +
                '; the old keys are left on disk');
  }
  state.proportions  = p;
  state.propProfiles = ps;
  /* A verdict belongs to the profile that produced it, and the profile just
     changed. Same reason propPick and propNew clear these. */
  state.propDraft = ''; state.lastValidation = null; state.propReading = null;
  normaliseProportions();
}
function saveProps(){
  const id = state.modelId || '';
  store.set(PROP_KEY + id, state.proportions);
  store.set(PROF_KEY + id, state.propProfiles);
}
/* The model as it would leave the building. Everything the export section
   shows is this, not the raw model — so what you preview is what you ship. */
function promptOpts(){ return { proportions: state.includeProportions ? state.proportions : null }; }
function exportModel(){
  const m = model();
  return state.anonOnExport && state.anonRules.length ? anonymiseModel(m, state.anonRules) : m;
}

   but two lists in different orders is how one of them ends up wrong. */
const ROUTES = {
  '/'            : { view: viewLanding,      guard:false },
  '/models'      : { view: viewModels,       guard:true  },
  '/structure'   : { view: viewBuild,        guard:true, role:'knowledge' },
  '/logic'       : { view: viewLogic,        guard:true, role:'knowledge' },
  '/document'    : { view: viewDocument,     guard:true, role:'knowledge' },
  '/doccritique' : { view: viewDocCritique,  guard:true, role:'knowledge' },
  '/analyzers'   : { view: viewAnalyzers,    guard:true, role:'knowledge' },
  '/proportions' : { view: viewProportions,  guard:true, role:'knowledge' },
  '/anonymise'   : { view: viewAnonymise,    guard:true, role:'knowledge' },
  '/perspectives': { view: viewPerspectives, guard:true, role:'knowledge' },
  '/export'      : { view: viewExport,       guard:true, role:'knowledge' },
  '/profile'     : { view: viewProfile,      guard:true, role:'any'       },
  '/admin'       : { view: viewAdmin,        guard:true, role:'admin'     }
};
function navigate(p){ if(location.hash !== '#'+p) location.hash = '#'+p; else render(); }

/* The way out of a workspace is logging out of it, and it is the only way.
   Landing is a front door: it has a sign-in button, a wordmark and nothing you
   can do, so dropping a signed-in user onto it — which the brand lock-up in
   the topbar did, because it carries data-nav="/" — left them looking at a
   page offering the one thing they had already done. It also read as a way
   back that was not one: the workspace was still open, still saving, and the
   only route onward was the button they had already pressed.

   So '/' is no longer a page a signed-in session can occupy. Asking for it
   asks to leave, which is a question, so it is asked rather than assumed —
   press Leave and the logout happens and the front door appears; press Stay
   and nothing has changed. This is also what the browser Back button now
   does, which is correct: Back out of an open workspace is exactly the moment
   to be asked. */
function promptLeaveWorkspace(){
  showBig('Leave this workspace?', `
    <p style="font-size:12.5px;line-height:1.8;max-width:66ch;">The front page is the sign-in screen, so
      going there means closing <b>${esc((auth.user()||{}).name || 'this workspace')}</b>. Everything is
      already written to disk — leaving loses no work, and opening the same profile again brings all of it
      back.</p>
    <div class="row" style="margin-top:16px;">
      <button class="btn brand" id="lvGo"><i class="fas fa-arrow-right-from-bracket"></i> Leave</button>
      <button class="btn ghost" id="lvStay">Stay signed in</button>
    </div>`);
  const g = $('lvGo');   if(g) g.onclick = () => { closeModals(); auth.logout(); navigate('/'); render(); };
  const s = $('lvStay'); if(s) s.onclick = () => closeModals();
}

function render(){
  syncProportions();
  let path = (location.hash || '#/').slice(1) || '/';
  /* Signed in and pointed at the landing page. Correct the hash with replace
     rather than push, or Back would ping-pong between here and /models.

     The prompt is skipped on the very first render — lastRenderedPath is still
     null then — because arriving with no hash at all is how a reload of an open
     workspace looks, and being asked whether you meant to leave every time you
     refresh is not a safeguard, it is a nuisance. */
  if(path === '/' && auth.isIn()){
    const deliberate = lastRenderedPath !== null;
    try{ history.replaceState(null, '', '#/models'); }catch(e){ location.hash = '#/models'; }
    path = '/models';
    if(deliberate) afterLayout(() => promptLeaveWorkspace());
  }
  const r = ROUTES[path] || ROUTES['/'];
  if(r.guard && !auth.isIn()){ openSignIn(path); navigate('/'); return; }
  /* A route belonging to the other mode switches the mode rather than refusing.
     Bouncing the user back to the landing page for clicking a link they can see
     was the old behaviour and it was never anything but confusing. */
  if(r.role && !auth.has(r.role)){ auth.setMode(r.role); }
  teardownGraph();
  teardownLogicGraph();
  teardownCritiqueGraph();
  teardownLanding();
  /* render() is called after every edit, not only on navigation, so scrolling to
     the top unconditionally threw you back up the page every time you clicked a
     node — which on the graph page is constant. Position is kept unless the
     route actually changed. */
  const sameRoute = path === lastRenderedPath;
  const keepY = sameRoute ? (window.scrollY || window.pageYOffset || 0) : 0;
  lastRenderedPath = path;
  $('root').innerHTML = '';
  r.view($('root'));
  if(keepY) afterLayout(() => window.scrollTo(0, keepY));
  else window.scrollTo(0, 0);
}
let lastRenderedPath = null;
window.addEventListener('hashchange', render);

function topbar(active){
  const u = auth.user();
  const ke = auth.has('knowledge'), ad = auth.has('admin');
  const link = (id, path, label, icon) =>
    `<button class="topbar-link ${active===id?'on':''}" data-nav="${path}"><i class="fas ${icon}"></i> ${label}</button>`;
  /* Order is the argument the bar is making, so it follows the actual sequence
     of work: describe the domain, order it, check it, strip it, decide who is
     reading — then hand it over.

     Perspectives moved from the middle to second-to-last, immediately before
     Export. It was sitting between Document and Analyzers, which put a
     question about the reader in the middle of a run of pages about the
     model, and it left the one page that consumes a perspective four tabs
     away from the page that defines one. Choosing the reader is the last
     decision before the artefact is written, and it now reads that way. */
  const links = !auth.isIn() ? ''
    : (ke ? link('models','/models','Knowledge models','fa-cubes') +
            link('build','/structure','Structure','fa-diagram-project') +
            link('logic','/logic','Logic','fa-code-branch') +
            /* Only when there is a document to draw. A system model has no use
               for this page and an empty tab is worse than no tab. */
            (isDocModel(model()) ? link('doc','/document','Document','fa-file-lines') : '') +
            link('anal','/analyzers','Analyzers','fa-vial') +
            link('prop','/proportions','Proportions','fa-scale-balanced') +
            link('anon','/anonymise','Anonymise','fa-user-secret') +
            link('export','/export','Export','fa-file-export') : '')
    + (ad ? link('admin','/admin','Admin','fa-gauge-high') : '');
  /* The mode toggle is a view switch, not a privilege change. Both modes are
     available to whoever opened the workspace; keeping them apart stops the
     builder screens and the housekeeping screens from arguing over the same
     page. */
  const modeBtn = auth.isIn()
    ? `<button class="topbar-link" id="btnMode" title="Switch mode">
         <i class="fas ${MODES.find(x => x.key === auth.mode()).icon}"></i>
         ${esc(MODES.find(x => x.key === auth.mode()).label)}</button>` : '';
  const who = auth.isIn()
    ? `<div class="who">
         ${canUndo() ? `<button class="topbar-link" id="btnUndo" title="Undo the last change (Ctrl+Z)">
             <i class="fas fa-rotate-left"></i> Undo</button>` : ''}
         <span id="saveState" style="font-size:10px;display:flex;align-items:center;gap:4px;"></span>
         <div class="avatar">${esc(initials(u.name))}</div>
         <button class="topbar-link" data-nav="/profile" title="Profile"
                 style="flex-direction:column;align-items:flex-start;gap:0;line-height:1.3;">
           <strong style="font-size:11px;">${esc(u.name)}</strong>
           <span style="font-size:9px;color:var(--muted);">profile</span></button>
         <button class="topbar-link" id="btnOut" title="Close this workspace"><i class="fas fa-arrow-right-from-bracket"></i> Leave</button></div>`
    : `<button class="btn" id="btnIn">Open a workspace</button>`;
  return `
  <!-- This button used to be labelled with the build string, matching the front
       door. The front door's copy is gone entirely - it has "About this build"
       in the footer and did not need a second door. This bar has no footer entry,
       so the door stays and only the label changes: the word About, which says
       what pressing it does. The build number is inside the box it opens, and in
       the Admin build table, which is where somebody looking for a version
       number goes. -->
  <div class="topbar">${LOCKUP(20, 12, null)}<button class="topbar-link" id="btnAbout" title="About, licence and what is included" style="font-size:9px;font-weight:700;letter-spacing:.5px;opacity:.85;">About</button>${links}<div class="spacer"></div>
    ${modeBtn}
    <button class="topbar-link" id="btnTheme" title="Toggle dark mode"><i class="fas fa-${state.dark?'sun':'moon'}"></i> ${state.dark?'Light':'Dark'}</button>
    ${who}</div>`;
}
function wireChrome(root){
  on('[data-nav]','click', e => navigate(e.currentTarget.dataset.nav), root);
  wireHelp(root);
  wireAssist(root, currentPageKey());
  const ab = $('btnAbout'); if(ab) ab.onclick = () => openAbout();
  const un = $('btnUndo');  if(un) un.onclick = () => { if(undo()) render(); };
  const i = $('btnIn');  if(i) i.onclick = () => openSignIn('/models');
  const o = $('btnOut'); if(o) o.onclick = () => { auth.logout(); navigate('/'); render(); };
  const t = $('btnTheme'); if(t) t.onclick = () => {
    state.dark = !state.dark; store.set('dark', state.dark);
    document.body.classList.toggle('dark', state.dark);
    render();
  };
  const md = $('btnMode'); if(md) md.onclick = () => {
    const next = auth.mode() === 'knowledge' ? 'admin' : 'knowledge';
    auth.setMode(next);
    navigate(next === 'admin' ? '/admin' : '/models');
    render();
  };
  on('[data-close]','click', () => closeModals(), document);
  paintSaveState();
}
document.body.classList.toggle('dark', state.dark);

/* ═══════════════════════════════════════════════════════════════════════════
   THE ASSISTANT BOX

   The reason this exists: the hard part of this tool was never the graph, the
   validation or the export. It was the blank page. Being asked to name 30 things
   about your own domain from nothing, in a vocabulary of 22 node kinds you have
   not learned yet, is a wall — and every other feature is behind it.

   Two rules make it trustworthy rather than merely convenient:

   1. IT PROPOSES ONE CHANGE AT A TIME. Not a model you take or leave. One card
      per addition, each accepted or rejected on its own. Three good suggestions
      out of five is a good outcome; a wholesale apply would make that a bad one.

   2. IT IS TOLD WHERE THE MODEL IS GOING. The prompt carries not just the
      current state but what the EXPORT needs to be worth anything: nodes with no
      relationships are orphans, claims with no evidence cannot be checked, an
      analyzer that checks nothing is decoration, layers that are not genuinely
      distinct make the cross-layer links meaningless. So it steers towards a
      model that exports well rather than one that merely looks plausible.

   Everything it returns is still checked by the same arithmetic as anything you
   typed by hand. A proposed order goes through the cycle detector like any
   other. That is the point: the model suggests, the validator judges, you decide.
   ═══════════════════════════════════════════════════════════════════════════ */

/* Compact enough to leave room for an answer; complete enough to reason over. */
function modelDigest(m){
  if(!m) return 'No model is open.';
  const L = logicOf(m);
  const byLayer = (m.layers||[]).map(l => {
    const ns = (m.nodes||[]).filter(n => n.layer === l.id);
    return '  ' + l.id + ' "' + l.name + '" (' + (l.role||'no role stated') + ')\n' +
      (ns.length ? ns.map(n => '    - [' + n.kind + '] ' + n.label +
        (n.note ? ' — ' + n.note.slice(0,80) : '')).join('\n') : '    (empty)');
  }).join('\n');
  const edges = (m.edges||[]).slice(0,60).map(e => {
    const f = (m.nodes||[]).find(n => n.id === e.from), t = (m.nodes||[]).find(n => n.id === e.to);
    return '  ' + ((f||{}).label||e.from) + ' --' + e.rel + '--> ' + ((t||{}).label||e.to);
  }).join('\n');
  const gaps = auditModel(m).slice(0,12).map(x => '  - ' + (x.msg || x)).join('\n');
  return [
    'MODEL: ' + m.name,
    m.question ? 'QUESTION IT ANSWERS: ' + m.question : 'QUESTION IT ANSWERS: (not stated)',
    '', 'LAYERS AND NODES:', byLayer || '  (none)',
    '', 'RELATIONSHIPS:', edges || '  (none)',
    L.steps.length ? '\nLOGIC STEPS: ' + L.steps.map(x => x.name + ' [' + x.kind + ']').join(', ') : '',
    gaps ? '\nGAPS THE VALIDATOR ALREADY FOUND:\n' + gaps : ''
  ].filter(Boolean).join('\n');
}
