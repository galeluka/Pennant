  $('aOn').onchange = e => { state.anonOnExport = e.target.checked; saveAnon(); };
  $('aMapDl').onclick = () => {
    if(!state.anonRules.length) return;
    download(slug(m.name) + '-mapping.json', JSON.stringify({
      warning:'This file reverses the anonymisation. Store it where the anonymised model is not stored.',
      model:m.name, generatedAt:new Date().toISOString(), rules:state.anonRules
    }, null, 2), 'application/json');
  };
  const run = keep => {
    const raw = $('aIn').value;
    state.scratch = raw;
    const hits = scanText(raw);
    let out = applyRules(raw, state.anonRules);
    const extra = [];
    hits.forEach(h => {
      if(state.anonRules.some(r => r.find === h.value)) return;
      extra.push({ find:h.value, replace:h.replacement, cat:h.cat, regex:false });
    });
    out = applyRules(out, extra);
    $('aOut').value = out;
    $('aMsg').textContent = hits.length
      ? hits.length + ' value' + (hits.length===1?'':'s') + ' replaced' + (keep ? ' — ' + extra.length + ' new rule(s) kept.' : '. Nothing was saved.')
      : 'No detector matched. Check by eye for names the patterns cannot see.';
    if(keep && extra.length){ state.anonRules = state.anonRules.concat(extra); saveAnon(); }
  };
  $('aRun').onclick   = () => run(false);
  $('aRules').onclick = () => run(true);
  $('aClear').onclick = () => { $('aIn').value = ''; $('aOut').value = ''; state.scratch = ''; $('aMsg').textContent = ''; };
}

/* ═══════════════════════════════════════════════════════════════════════════
   VISUALISE THE MODEL — the glimpse before the export

   The export page used to hand over six files and a manifest of counts. Counts
   are not a picture: "31 nodes, 38 relationships" tells you the size of the thing
   and nothing about its shape, and shape is what determines whether the prompt
   will be any good.

   So this draws the whole model on one screen, in the layout that answers the
   only question worth asking at this point: is it thin anywhere? Layers as bands
   in reading order, nodes as marks sized by how connected they are, and the
   relationships that cross a layer drawn on top — because those are what the
   prompt is actually made of. A node with no line touching it contributes
   nothing, and here it is visibly alone rather than buried in a gap audit.

   Hand-drawn SVG. No library, so it renders regardless.
   ═══════════════════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════════════
   THE BRAIN — what the model actually knows, read back to you

   The map above shows the shape. The readiness list counts the gaps. Neither
   tells you the thing you most want to know before handing this to a model:
   given only what is in here, what could it actually answer, and where would it
   have to guess?

   Nobody can judge that by reading their own model. You know what you meant, so
   you read the intention rather than the text, and the omission that will sink
   the prompt is invisible to you specifically. A model reading it cold has
   exactly the advantage of not knowing what you meant.

   So this is not a summary for decoration. It is a rehearsal: the same content
   the export will carry, read by something with no context, reporting what it
   understood, what it could answer, and what it would be forced to invent. The
   last of those is the useful one.
   ═══════════════════════════════════════════════════════════════════════════ */
function brainSystem(){
  return [
    'You are shown a structured knowledge model that somebody is about to hand to a',
    'language model as instructions. You have no other context and you must not',
    'acquire any: do not use outside knowledge about the domain, industry or the',
    'systems named. Everything you say has to come from the text you were given.',
    '',
    'Report, in this order:',
    '1. What this model is about, in two or three sentences, as you understand it',
    '   from the content alone. If you have misunderstood it, that misunderstanding',
    '   is the most valuable thing in your reply \u2014 it is what the real model will',
    '   also misunderstand.',
    '2. Three to six questions this model could answer well, phrased the way',
    '   somebody would actually ask them.',
    '3. Three to six questions it would be asked and could NOT answer, with what is',
    '   missing in each case. Be specific: name the node or relationship that is',
    '   absent, not "more detail".',
    '4. Anything in it that contradicts something else in it, or reads two ways.',
    '',
    'Do not be encouraging. A model that says everything looks good is useless here.',
    'If it is thin, say where. If you cannot tell what something means, say so',
    'rather than choosing a reading.',
    '',
    'Reply with JSON only. No prose outside it, no markdown fence.',
    '{"understood":"two or three sentences",',
    ' "canAnswer":[{"q":"...","why":"what in the model supports it"}],',
    ' "cannotAnswer":[{"q":"...","missing":"the specific node or relationship absent"}],',
    ' "ambiguous":[{"what":"...","readings":"the two ways it can be read"}],',
    ' "wouldGuess":"the single thing it is most likely to invent, and why"}'
  ].join('\n');
}

async function runBrain(){
  const m = exportModel();
  if(!m) return;
  state.brain = { busy:true };
  render();
  try {
    /* Deliberately the SAME text the export carries, anonymiser included. There
       is no point rehearsing something other than what will actually be sent. */
    const body = exportSystemPrompt(m, perspectiveById(state.perspId), promptOpts());
    const raw = await llmAsk(brainSystem(), body.slice(0, 28000));
    const cleaned = String(raw).replace(/^[\s\S]*?```(?:json)?/, '').replace(/```[\s\S]*$/, '').trim()
                    || String(raw).trim();
    let parsed;
    try { parsed = JSON.parse(cleaned); }
    catch(e){ parsed = JSON.parse(String(raw).slice(String(raw).indexOf('{'), String(raw).lastIndexOf('}')+1)); }
    state.brain = { busy:false, at:Date.now(), ...parsed };
  } catch(e){ state.brain = { busy:false, error:e.message }; }
  render();
}

function brainHTML(m){
  const b = state.brain;
  if(!llmOn()) return `<div class="note"><b>This part needs AI assistance.</b> The map above is arithmetic
    and works without it. This is the other half: handing the export to something with no context and asking
    what it understood \u2014 which is the one judgement you cannot make about your own model, because you
    know what you meant and read the intention rather than the text.
    <button class="lnk" data-nav="/admin">Turn it on in Admin <i class="fas fa-arrow-right"></i></button></div>`;
  if(!b) return `<div class="note"><b>A rehearsal, not a summary.</b> The exact text the export will carry is
    read by a model with no other context, which then reports what it understood, what it could answer, and
    what it would be forced to invent. The last of those is the point \u2014 the omission that will sink a
    prompt is invisible to the person who wrote it.
    <div class="row" style="margin-top:11px;"><button class="btn sm ai" id="brRun">
      <i class="fas fa-brain"></i> Read it back to me</button></div></div>`;
  if(b.busy) return `<div class="abox-msg"><i class="fas fa-arrows-rotate"></i> Reading the whole model\u2026</div>`;
  if(b.error) return `<div class="note bad"><b>That did not work.</b> ${esc(b.error)}
    <div class="row" style="margin-top:10px;"><button class="btn sm ghost" id="brRun">Try again</button></div></div>`;
  return `
    ${b.understood ? `<div class="brain">
      <div class="brain-k">What it understood</div>
      <p>${esc(b.understood)}</p>
      <p class="brain-n">If that is wrong, it is the most useful line on this page \u2014 the real model will
        misunderstand it the same way.</p>
    </div>` : ''}

    <div class="grid c2" style="margin-top:14px;">
      <div class="opt"><div class="oh"><i class="fas fa-circle-check" style="color:var(--green);"></i>
        Could answer</div>
        ${(b.canAnswer||[]).length ? `<ul class="brl">${b.canAnswer.map(x =>
          `<li><b>${esc(x.q)}</b><span>${esc(x.why||'')}</span></li>`).join('')}</ul>`
          : '<p>Nothing confidently.</p>'}</div>
      <div class="opt"><div class="oh"><i class="fas fa-circle-xmark" style="color:var(--red);"></i>
        Could not answer</div>
        ${(b.cannotAnswer||[]).length ? `<ul class="brl">${b.cannotAnswer.map(x =>
          `<li><b>${esc(x.q)}</b><span>Missing: ${esc(x.missing||'')}</span></li>`).join('')}</ul>`
          : '<p>Nothing obvious.</p>'}</div>
    </div>

    ${(b.ambiguous||[]).length ? `<div class="op-sub" style="margin-top:18px;">Reads two ways</div>
      ${b.ambiguous.map(x => `<div class="note warn" style="margin-bottom:7px;">
        <b>${esc(x.what)}</b><br><span style="opacity:.85;">${esc(x.readings||'')}</span></div>`).join('')}` : ''}

    ${b.wouldGuess ? `<div class="note bad" style="margin-top:14px;">
      <b>What it would most likely invent.</b> ${esc(b.wouldGuess)}
      <br><span style="opacity:.8;">A model given a name nothing defines will define it. That is not a
      failure of the model; it is a gap in the instructions it was handed.</span></div>` : ''}

    <div class="row" style="margin-top:12px;">
      <button class="btn sm ghost" id="brRun"><i class="fas fa-rotate"></i> Read it again</button>

function wireBrain(root){
  const b = document.getElementById('brRun');
  if(b) b.onclick = () => runBrain();

function visualiseModel(m, o){
  const opt = o || {};
  const W = 780, padX = 118, padY = 26;
  const layers = m.layers || [], nodes = m.nodes || [], edges = m.edges || [];
  if(!layers.length || !nodes.length) return '';

  const bandH = Math.max(58, Math.min(96, Math.round(360 / Math.max(1, layers.length))));
  const H = padY * 2 + bandH * layers.length;
  const deg = {};
  edges.forEach(e => { deg[e.from] = (deg[e.from]||0)+1; deg[e.to] = (deg[e.to]||0)+1; });

  /* Position: layer decides the row, and within a row nodes are spread evenly in
     the order they were created. Deterministic, so the picture does not dance
     about between renders — which a force layout would. */
  const pos = {};
  layers.forEach((l, li) => {
    const inLayer = nodes.filter(n => n.layer === l.id);
    const usable = W - padX - 34;
    inLayer.forEach((n, i) => {
      const t = inLayer.length === 1 ? 0.5 : i / (inLayer.length - 1);
      pos[n.id] = { x: padX + 16 + t * (usable - 32),
                    y: padY + li * bandH + bandH / 2,
                    layer: li, deg: deg[n.id] || 0 };
    });
  });

  const cross = edges.filter(e => pos[e.from] && pos[e.to] && pos[e.from].layer !== pos[e.to].layer);
  const flat  = edges.filter(e => pos[e.from] && pos[e.to] && pos[e.from].layer === pos[e.to].layer);
  const orphans = nodes.filter(n => !(deg[n.id] || 0));

  const line = (e, colour, w, dash) => {
    const a = pos[e.from], b = pos[e.to]; if(!a || !b) return '';
    const my = (a.y + b.y) / 2;
    return `<path d="M${a.x} ${a.y} C${a.x} ${my} ${b.x} ${my} ${b.x} ${b.y}"
      fill="none" stroke="${colour}" stroke-width="${w}" ${dash?'stroke-dasharray="3 3"':''}
      opacity="${dash?'.55':'.75'}"/>`;
  };

  const mark = n => {
    const pt = pos[n.id]; if(!pt) return '';
    const r = 3.4 + Math.min(4.2, pt.deg * 0.62);
    const lone = !pt.deg;
    const fill = lone ? 'none' : 'var(--ink)';
    const stroke = lone ? 'var(--red)' : 'var(--ink)';
    const g = `<circle cx="${pt.x}" cy="${pt.y}" r="${r}"/>`;
    return `<g fill="${fill}" stroke="${stroke}" stroke-width="${lone?1.4:0}">${g}
      <title>${esc(n.label)} \u2014 ${esc((KINDS[n.kind]||{}).label || n.kind)}${
        lone ? ' \u00b7 nothing connects to this' : ' \u00b7 ' + pt.deg + ' link' + (pt.deg===1?'':'s')}</title></g>`;
  };

  return `
  <div class="vmap">
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;">
      ${layers.map((l, li) => `
        <g>
          <rect x="0" y="${padY + li*bandH}" width="${W}" height="${bandH}"
                fill="${li % 2 ? 'var(--card)' : 'transparent'}"/>
          <line x1="0" y1="${padY + li*bandH}" x2="${W}" y2="${padY + li*bandH}"
                stroke="var(--line)" stroke-width="1"/>
          <text x="12" y="${padY + li*bandH + bandH/2 - 3}" class="vml">${esc(l.name)}</text>
          <text x="12" y="${padY + li*bandH + bandH/2 + 9}" class="vmc">${
            nodes.filter(n => n.layer === l.id).length} things</text>
        </g>`).join('')}
      <line x1="0" y1="${padY + layers.length*bandH}" x2="${W}" y2="${padY + layers.length*bandH}"
            stroke="var(--line)" stroke-width="1"/>
      ${flat.map(e => line(e, 'var(--line-strong)', 1, true)).join('')}
      ${cross.map(e => line(e, 'var(--brand)', 1.5, false)).join('')}
      ${nodes.map(mark).join('')}
    </svg>
    <div class="vmleg">
      <span><i class="vk brand"></i> ${cross.length} relationship${cross.length===1?'':'s'} crossing a layer
        \u2014 this is what the prompt is made of</span>
      <span><i class="vk soft"></i> ${flat.length} inside one layer</span>
      ${orphans.length ? `<span class="bad"><i class="vk hollow"></i> ${orphans.length} thing${
        orphans.length===1?'':'s'} nothing connects to \u2014 ${esc(orphans.slice(0,3).map(n=>n.label).join(', '))}${
        orphans.length>3?' and '+(orphans.length-3)+' more':''}</span>` : ''}
      <span style="opacity:.6;">bigger circle = more connected \u00b7 hollow = nothing connects to it</span>
    </div>
  </div>`;
}

/* What the export will and will not be able to answer, from the shape alone. */
function modelReadiness(m){
  const nodes = m.nodes || [], edges = m.edges || [], layers = m.layers || [];
  const deg = {}; edges.forEach(e => { deg[e.from]=(deg[e.from]||0)+1; deg[e.to]=(deg[e.to]||0)+1; });
  const posOf = {}; nodes.forEach(n => { posOf[n.id] = (layers.findIndex(l => l.id === n.layer)); });
  const cross = edges.filter(e => posOf[e.from] !== undefined && posOf[e.to] !== undefined
                                  && posOf[e.from] !== posOf[e.to]).length;
  const orphans = nodes.filter(n => !(deg[n.id]||0)).length;
  /* 'actor' is the kind key for an owner in this build — not 'owner'. Guessing
     it produced a warning on every model including the ones that do name owners.
     Ownership can also be carried by a relationship rather than a node kind, so
     both count. */
  const OWNER_KINDS = ['actor','owner','role','person','team','unit'];
  const OWNER_RELS  = ['OWNED_BY','ACCOUNTABLE_FOR','ESCALATES_TO','GOVERNED_BY','OPERATES_ON'];
  const owners = nodes.filter(n => OWNER_KINDS.includes(n.kind)).length
               + (nodes.some(n => OWNER_KINDS.includes(n.kind)) ? 0
                  : edges.filter(e => OWNER_RELS.includes(e.rel)).length ? 1 : 0);
  const out = [];
  if(cross === 0) out.push({ sev:'bad', t:'No relationship crosses a layer.',
    d:'The prompt will describe three separate lists rather than one connected domain, and no question of the form "why does this happen" can be answered from it. Cross-layer links are the entire value of the layering.' });
  else if(cross < nodes.length / 4) out.push({ sev:'warn', t:'Few relationships cross a layer.',
    d:'Only ' + cross + ' of ' + edges.length + '. The layers are probably describing similar kinds of thing, or the links between them have not been drawn yet.' });
  else out.push({ sev:'ok', t:cross + ' relationships cross a layer.',
    d:'That is what lets an answer move from what a customer sees to the job that actually runs.' });

  if(orphans) out.push({ sev:'warn', t:orphans + ' thing' + (orphans===1?'':'s') + ' nothing connects to.',
    d:'They appear in the prompt as a list entry and contribute nothing to any answer. Either link them or remove them.' });
  if(!owners) out.push({ sev:'warn', t:'Nobody owns anything.',
    d:'"Who decides this" is the question a prompt gets asked most and answers worst. Without owner or role nodes the export cannot answer it at all.' });
  else out.push({ sev:'ok', t:owners + ' owner' + (owners===1?'':'s') + ' named.',
    d:'The export can say who to go to when the model runs out of answers.' });
  if(layers.length < 2) out.push({ sev:'warn', t:'One layer.',
    d:'Nothing can cross. Two or three layers holding genuinely different kinds of thing is what makes this a model rather than a list.' });
  return out;
}

      if(!FLAGS.mcpExport) return showBig('MCP definition', `<div class="note warn">
        <b>Hidden in this build.</b> The exporter still works and is unchanged — the artefact it writes mixes
        a client configuration block with a server's tool surface, which is descriptive rather than
        conformant with any published MCP revision. Set <code>FLAGS.mcpExport = true</code> to show it.</div>`);
      return showText('MCP definition', JSON.stringify(exportMcp(m), null, 2), base + '-mcp.json', 'application/json');
    }
    if(w === 'cypher') return showText('Cypher', exportCypher(m), base + '.cypher', 'text/plain;charset=utf-8');
    if(w === 'plan')   return showText('Execution plan', compileLogic(m), base + '-plan.md', 'text/markdown;charset=utf-8');
    if(w === 'all'){
      const L = [];
      L.push('# ' + m.name + ' — everything');
      L.push('');
      L.push('Generated by ' + APP.full + ' ' + APP.build + ' on ' + new Date().toISOString() + '.');
      L.push('Perspective: ' + p.name + '. Anonymiser: ' + (anonActive ? state.anonRules.length + ' rule(s) applied' : 'not applied') + '.');
      L.push('');
      L.push('---');
      L.push('');
      L.push(exportSystemPrompt(m, p, promptOpts()));
      L.push('');
      L.push('---');
      L.push('');
      if(FLAGS.mcpExport){
        L.push('# MCP definition');
        L.push('');
        L.push('```json');
        L.push(JSON.stringify(exportMcp(m), null, 2));
        L.push('```');
        L.push('');
      }
      L.push('# Cypher');
      L.push('');
      L.push('```cypher');
      L.push(exportCypher(m));
      L.push('```');
      return showText('Everything', L.join('\n'), base + '-everything.md', 'text/markdown;charset=utf-8');
    }
  }, root);
}

/* ═══════════════════════════════════════════════════════════════════════════
   BOOT

   Asynchronous, because the workspace now comes from the server rather than
   from localStorage. Order matters: paint something immediately so a slow or
   dead backend does not show a blank page, then hydrate, then re-render.
   ═══════════════════════════════════════════════════════════════════════════ */
function bootError(msg, detail){
  document.getElementById('root').innerHTML = `
    <div class="page"><div class="eyebrow">Startup</div>
      <h1>The workspace service did not answer.</h1>
      <p class="lede">${esc(msg)}</p>
      <pre class="box">${esc(detail || '')}</pre>
      <p class="lede">This build is served by its own container and saves to the volume you mounted.
        Opening <code>index.html</code> straight from disk will not work — there is nothing behind it to
        write to. Start the container and load <code>http://localhost:8080</code>.</p>
    </div>`;
}

console.log('%c' + APP.full + ' ' + APP.build + ' \u00b7 ' + APP.licence + ' \u00b7 \u00a9 2026 ' + APP.by, 'font-weight:700');

(async function boot(){
  document.body.classList.toggle('dark', !!store.get('dark', false));
  /* Restore the profile chosen last time before anything asks the server for
     a workspace — every /api call is scoped by it. */
  if(auth.user()) api.profile = auth.user().name;

  try{
    const info = await api.info();
    WS.dir = info.dataDir || ''; WS.version = info.version || ''; WS.writable = info.writable !== false;
    if(info.llm) WS.llm = Object.assign(WS.llm, info.llm);
  }catch(e){ bootError('Could not reach /api/info on the origin that served this page.', e.message); return; }

  if(!WS.writable){
    bootError('The data directory is not writable by the container.',
      WS.dir + '\n\nCheck the ownership of the host directory you bind-mounted, and that it was mounted ' +
      'with :Z if SELinux is enforcing.');
    return;
  }

  /* Sample counts for the landing page. Decorative: a failure here must not
     stop the app, so it is deliberately not awaited into the critical path. */
  api.samples().then(list => {
    (list || []).forEach(s => { if(s.key) SAMPLE_STATS[s.key] = s; });
    if((location.hash || '#/') === '#/' || location.hash === '') render();
  }).catch(() => {});

  if(auth.isIn()){
    try{ await loadWorkspace(); }
    catch(e){
      /* The profile in localStorage points at a directory the server no longer
         has — most likely purged or renamed on disk. Drop it and start over
         rather than looping on a 404. */
      console.warn('[boot] stale profile, clearing:', e.message);
      auth.logout();
    }
  }
  render();
})();
</script>
