<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pennant — a knowledge engineering studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231D1D1F'/%3E%3Crect x='6' y='4' width='3' height='24' rx='1.5' fill='%23F5F5F5'/%3E%3Cpath d='M10 6.5h16.5L10 14z' fill='%23D40000'/%3E%3Cpath d='M10 17.5h16.5L10 25z' fill='%23D40000'/%3E%3C/svg%3E">
<!-- Vendored locally. Nothing on this page reaches an external network; that claim
     is only true because these two are served from the same container. -->
<script src="vendor/vis-network.min.js"></script>
<link rel="stylesheet" href="vendor/fontawesome.min.css">
<style>
  :root{
    --bg:#FFFFFF; --panel:#FFFFFF; --ink:#0A0A0A; --muted:#6E6E73; --line:#E3E3E3; --card:#F7F7F7;
    --line-strong:#B9B9BF;
    /* Red is the brand. Severity therefore uses crimson and amber rather than
       plain red, so "this is the product" and "this is a problem" stay apart. */
    --brand:#D40000;
    /* And --ai is the third meaning that was borrowing red: an action that sends
       text to a language model. Slate-navy rather than a plain blue on purpose -
       KINDS has already spent the blues, and #3949AB is Application, #0288D1 is
       Process, #00838F is Ceiling, #7E57C2 is Rule. An AI button in any of those
       reads as a node kind when it is sitting next to the graph. This one reads
       as chrome, which is what it is. */
    --ai:#1E2A5A; --ai-hi:#2C3D7E;
    --red:#B3261E; --orange:#FF6B00; --amber:#E2B007; --green:#2E7D32; --info:#5B8DEF; --grey:#86868B;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  body.dark{
    --bg:#0A0A0A; --panel:#121212; --ink:#F5F5F5; --muted:#8E8E93; --line:#262626; --card:#161616;
    --line-strong:#4A4A50;
    --brand:#FF3B30;
    --ai:#7C8CD8; --ai-hi:#95A3E4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  ::selection{background:var(--brand);color:#fff;}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

  /* ── chrome ─────────────────────────────────────────────────────────── */
  .mockbar{background:var(--ink);color:#fff;font-size:10px;font-weight:700;letter-spacing:.4px;
    padding:6px 18px;text-align:center;}
  .topbar{display:flex;align-items:center;gap:6px;padding:10px 18px;background:var(--panel);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;flex-wrap:wrap;}
  .brand-lockup{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;}
  .brand-lockup .wm{display:flex;flex-direction:column;line-height:1;}
  /* Uppercase, and therefore positive tracking. -.4px was a mixed-case
     correction: caps have no descenders or narrow lowercase to close up, so the
     same value jams them together. One rule, and LOCKUP's two call sites - the
     app bar and the front-door bar - both follow it. */
  .brand-lockup .nm{font-weight:300;letter-spacing:.06em;text-transform:uppercase;}
  .brand-lockup .nm b{font-weight:800;}
  .brand-lockup .sub{color:var(--muted);font-weight:800;}
  /* Landing. White, and light-only on purpose: it is the one screen in this build
     that is not a working surface. It scrolls, and it ends in a black site footer.

     Left half is the drawing - one light pole hard against the edge with two
     tapered flags hoisted on it. Right of that, starting at --type-x, the
     wordmark, the strapline and Sign in as one column. The drawing is the thing
     that is looked at and the button is the thing that is pressed, so in a
     left-to-right reading order the button comes last and the eye arrives at it.
     The flags also read better on the left: they hang from a hoist at their left
     edge and open rightwards, so on the right they were opening off the screen.

     The bar is .topbar - the app's own - and its right-hand end is empty, because
     there is a Sign in in the middle of the page at 62px of type.

     This comment has been wrong three times. It said "one screen, no scroll"
     after the footer was added, "the lock-up sits against the RIGHT edge" after
     it moved to --type-x, and "the drawing is flags only, the poles were the
     loudest thing" after one pole came back. If you change the page, change this. */
  /* --type-x is where the type begins, and it is the SAME EDGE as the end of the
     longer flag: initLandingArt puts bands[0] at about 0.13W with len 0.42W, so
     the fly lands near 0.55W. Below that the headline is printed over the mesh;
     far above it there is a hole in the middle of the page, which is what a 46%
     column pinned to the right edge produced on a wide screen. Change
     bands[0].len and change this with it - one edge, described twice.

     overflow-x rather than overflow: the page has to scroll now, because it ends
     in a footer below the fold. #lHoist is position:fixed, so the drawing stays
     put and the black block travels up over it. */
  .lwrap{position:relative;min-height:100vh;display:flex;flex-direction:column;
    overflow-x:hidden;background:#FFFFFF;color:#0A0A0A;--type-x:56%;}
  /* The front door uses .topbar, .topbar-link, .spacer and .brand-lockup - the
     working bar every other page in this build renders - rather than a second set
     of chrome classes. There was one: .ltop, .lbrand, .lnav, .lnav-l, a hand copy
     that had drifted to 58px against ~46, sentence-case 12.5px links against
     uppercase letterspaced 9.5px ones, and no mark and no build string at all.
     One bar and one stylesheet is the only arrangement in which the front door
     cannot fall out of step with the app.

     Two overrides, and only two. This is the one screen in the build that is not
     a working surface and it is light-only, while .topbar reads var(--panel) and
     var(--line), which follow the theme. Left in place rather than folded into
     .lwrap so it is obvious what is being forced and why. */
  .lwrap .topbar{background:#FFFFFF;border-bottom:1px solid #E3E3E3;}
  .lwrap .topbar-link{color:#3C3C41;}
  .lwrap .topbar-link:hover{background:#F7F7F7;color:#0A0A0A;}
  .lbtn{font-family:var(--mono);background:#0A0A0A;border:1px solid #0A0A0A;border-radius:3px;
    cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:#fff;padding:13px 26px;}
  .lbtn:hover{background:var(--brand);border-color:var(--brand);}
  #lHoist{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
  /* No top padding: .topbar is sticky and therefore in flow, so it takes its own
     58px worth of room rather than being reserved for. #lHoist is still fixed and
     still starts at the viewport top - the bar has an opaque background and sits
     over it, and initLandingArt's HEADER is unchanged at 58, which now leaves a
     few pixels of pole visible under the bar rather than none. */
  .lmid{position:relative;z-index:1;flex:1;padding:0 26px;display:flex;align-items:center;
    justify-content:flex-start;}
  /* Offset, not margin-left:auto. auto means "as far right as there is room",
     which is a different place on every screen and on a wide one is nowhere near
     the drawing. The cap stops the column sprawling once there is more width than
     a headline needs. */
  .llock{max-width:min(40%,560px);margin-left:var(--type-x);padding:0 0 6vh;text-align:left;}
  /* letter-spacing puts its gap AFTER the last glyph too, so a left-aligned
     letterspaced line starts half a space in from where it looks like it should.
     text-indent of the same size is the correction. The right-aligned version
     this replaces needed a negative right margin instead, for the mirror-image
     reason, and that is why these two lines changed with the alignment. */
  .lword{font-size:clamp(30px,5vw,62px);font-weight:800;letter-spacing:.16em;
    text-indent:.16em;margin:0;text-transform:uppercase;line-height:1;}
  .lunder{font-size:clamp(11px,1.35vw,17px);font-weight:700;letter-spacing:.26em;
    text-indent:.26em;text-transform:uppercase;color:#6E6E73;margin:18px 0 0;}
  .lcta{display:flex;justify-content:flex-start;margin-top:34px;}
  /* The end of the site. .lmid is flex:1 inside a min-height:100vh wrapper, so
     this begins exactly at the fold and is reached by scrolling - which is the
     only reason .lwrap had to stop clipping its overflow. */
  .lsite{position:relative;z-index:1;background:#0A0A0A;color:#C9C9CE;padding:66px 26px 0;}
  .lsite-in{display:flex;gap:64px;flex-wrap:wrap;padding-bottom:54px;}
  .lsite-brand{max-width:310px;}
  .lsite-brand .nm{display:block;font-size:15px;font-weight:800;letter-spacing:.20em;
    text-transform:uppercase;color:#FFFFFF;}
  .lsite-brand .sub{display:block;font-size:7.5px;font-weight:800;letter-spacing:.22em;
    text-transform:uppercase;color:#8E8E93;margin-top:5px;}
  .lsite-brand p{font-size:12px;line-height:1.75;color:#8E8E93;margin:18px 0 0;}
  .lsite-col h3{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:#8E8E93;margin:0 0 15px;}
  .lsite-col a,.lsite-col button{display:block;background:none;border:0;padding:0;
    margin:0 0 11px;cursor:pointer;font:inherit;font-size:12.5px;color:#C9C9CE;
    text-align:left;text-decoration:none;}
  .lsite-col a:hover,.lsite-col button:hover{color:#FFFFFF;}
  .lsoc-row{display:flex;gap:11px;flex-wrap:wrap;}
  .lsoc{width:38px;height:38px;border-radius:50%;background:#00838F;color:#FFFFFF;
    display:inline-flex;align-items:center;justify-content:center;font-size:15px;
    text-decoration:none;}
  a.lsoc:hover{background:#00A5B4;}
  /* The ones with no account behind them are spans, so they are inert without
     being visibly broken. They deliberately do NOT dim: the brief was that the
     row reads as a real product's row. The cost of that is a click that does
     nothing, which some readers will call a bug - the fix is a real URL in the
     array below, or hiding the row behind a FLAG until there is one. */
  span.lsoc{cursor:default;}
  .lsite-bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    border-top:1px solid #262626;padding:20px 0 24px;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:#6E6E73;}
  .lsite-bar a{color:#6E6E73;text-decoration:none;}
  .lsite-bar a:hover{color:#C9C9CE;}
  .lsite-bar .sp{margin-left:auto;}
  @media(max-width:620px){ .lsite-in{gap:34px;} .lsite-bar .sp{margin-left:0;} }
  /* Below 900px the drawing drops underneath the text and fades back, so there
     is no left half to balance against and the lock-up goes back to reading
     left-aligned — which means text-indent again rather than a negative margin. */
  @media(max-width:900px){
    /* .topbar already wraps and already has a narrow padding of its own, so the
       three rules that used to be here - .ltop, .lnav, .lnav-l - went with the
       classes they were adjusting. */
    .lmid{justify-content:flex-start;}
    .llock{max-width:100%;padding-top:6vh;margin-left:0;text-align:left;}
    .lword{letter-spacing:.12em;text-indent:.12em;margin-right:0;}
    .lunder{letter-spacing:.18em;text-indent:.18em;margin-right:0;}
    .lcta{justify-content:flex-start;}
  }
  /* The section links used to be hidden outright below 620px. .topbar wraps
     instead, which is what it does everywhere else in the build. */
  .hero{border-bottom:1px solid var(--line);padding:74px 24px 62px;background:var(--panel);}
  .hero-in{max-width:760px;margin:0 auto;text-align:center;}
  .hero-mark{display:flex;justify-content:center;margin-bottom:22px;}
  .hero-h{font-size:40px;font-weight:800;letter-spacing:-1.4px;margin:0;line-height:1.05;color:var(--ink);}
  .hero-h span{display:block;font-size:15px;font-weight:600;letter-spacing:3.4px;text-transform:uppercase;
    color:var(--brand);margin-top:12px;}
  .hero-p{font-size:14.5px;line-height:1.75;color:var(--muted);max-width:52ch;margin:20px auto 0;}
  .hero-cta{margin-top:30px;}
  .howto{max-width:780px;margin:0 auto;padding:12px 0 40px;}
  .howto-h{font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);
    padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:8px;}
  .howto-row{display:flex;gap:18px;padding:20px 0;border-bottom:1px solid var(--line);}
  .howto-row:last-child{border-bottom:0;}
  .howto-n{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;
    font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;}
  .howto-b b{font-size:14px;font-weight:700;letter-spacing:-.2px;display:block;margin-bottom:5px;}
  .howto-b p{font-size:12.5px;line-height:1.8;color:var(--muted);margin:0;max-width:66ch;}
  .lnk{background:none;border:0;padding:0;margin-top:9px;cursor:pointer;font:inherit;font-size:11.5px;
    font-weight:700;color:var(--brand);display:inline-flex;align-items:center;gap:6px;}
  .lnk:hover{text-decoration:underline;}
  /* Document view. Three columns in reading order with curved connectors drawn
     over them, so the eye follows the document rather than the graph. */
  .dstats{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;
    overflow:hidden;margin:20px 0 26px;background:var(--card);}
  .dstats>div{flex:1;min-width:96px;padding:13px 16px;border-right:1px solid var(--line);}
  .dstats>div:last-child{border-right:0;}
  .dstats b{display:block;font-size:21px;font-weight:800;letter-spacing:-.8px;line-height:1;color:var(--ink);}
  .dstats span{display:block;font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
    color:var(--muted);margin-top:5px;}
  .dstats>div.bad b{color:var(--red);}
  .dstats>div.warn b{color:var(--amber);}

  .dwrap{position:relative;margin-bottom:30px;}
  .dlines{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:visible;}
  .dhead{display:grid;grid-template-columns:.95fr 1.15fr .95fr .95fr;gap:20px;padding-bottom:9px;
    border-bottom:1px solid var(--line);margin-bottom:6px;}
  .dhead>div{font-size:9px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);}
  .drow{display:grid;grid-template-columns:.95fr 1.15fr .95fr .95fr;gap:20px;padding:9px 0;align-items:start;
    position:relative;z-index:1;}
  .dcol{display:flex;flex-direction:column;gap:9px;min-width:0;}

  .dcard{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 13px;
    cursor:pointer;transition:border-color .12s,box-shadow .12s;}
  .dcard:hover{border-color:var(--muted);box-shadow:0 1px 6px rgba(0,0,0,.06);}
  .dcard b{font-size:13px;font-weight:700;letter-spacing:-.2px;color:var(--ink);display:block;line-height:1.4;}
  .dcard p{font-size:11px;line-height:1.65;color:var(--muted);margin:4px 0 0;}
  .dc-k{font-size:8.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);}
  .dc-h{display:flex;align-items:center;gap:7px;margin-bottom:4px;}

  .dchap{display:flex;gap:11px;align-items:flex-start;background:var(--card);}
  .dnum{flex-shrink:0;width:23px;height:23px;border-radius:6px;background:var(--ink);color:var(--panel);
    font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .dchap.floating{border-style:dashed;background:none;cursor:default;}
  .dchap.floating .dch-b b{color:var(--muted);}

  .dclaim{border-left:3px solid var(--brand);}
  .dclaim.blocker{border-left-color:var(--red);}
  .dclaim.warn{border-left-color:var(--amber);}
  .dempty{border-style:dashed;background:none;cursor:default;font-size:11px;color:var(--muted);
    padding:9px 13px;}

  .dgap{margin-left:auto;font-size:8px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
    padding:2px 6px;border-radius:3px;}
  .dgap.blocker{background:var(--red);color:#fff;}
  .dgap.warn{background:var(--amber);color:#241E00;}
  .dgap.note{background:var(--line);color:var(--muted);}

  .dobl{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .dob{font-size:10px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);
    border-radius:4px;padding:3px 7px;display:inline-flex;align-items:center;gap:5px;}
  .dob i{font-size:8px;color:var(--muted);}
  .dob.blocker{border-color:var(--red);color:var(--red);}
  .dob.blocker i{color:var(--red);}

  .dc-f{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);}
  .dchk{font-size:9.5px;font-weight:700;letter-spacing:.2px;color:var(--muted);display:inline-flex;
    align-items:center;gap:5px;}
  .dchk i{font-size:8px;}
  .dchk.none{color:var(--red);}

  .devgroup{display:flex;flex-direction:column;gap:6px;}
  .devid{background:var(--card);border-style:solid;}
  .devid b{font-size:12px;}
  .devid.none{border-style:dashed;background:none;cursor:default;font-size:11px;color:var(--amber);
    display:flex;align-items:center;gap:7px;padding:9px 13px;}

  .dchkcol{display:flex;flex-direction:column;gap:6px;}
  .dachk{background:var(--card);position:relative;padding-right:26px;}
  .dachk b{font-size:12px;}
  .dunbind{position:absolute;top:6px;right:7px;background:none;border:0;cursor:pointer;font:inherit;
    font-size:14px;line-height:1;color:var(--muted);padding:2px 4px;}
  .dunbind:hover{color:var(--red);}
  .dadd{width:100%;background:none;border:1px dashed var(--line);border-radius:8px;cursor:pointer;
    font:inherit;font-size:10.5px;font-weight:700;color:var(--muted);padding:8px 10px;text-align:left;}
  .dadd:hover{border-color:var(--brand);color:var(--brand);}
  .dadd i{font-size:8px;margin-right:5px;}
  .dchecks{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:9px;}
  .dcheck{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-radius:9px;padding:11px 13px;cursor:pointer;}
  .dcheck:hover{border-color:var(--muted);}
  .dcheck>i{color:var(--brand);margin-top:2px;font-size:12px;}
  .dcheck b{font-size:12.5px;font-weight:700;display:block;}
  .dcheck p{font-size:10.5px;line-height:1.6;color:var(--muted);margin:3px 0 0;}
  .dcheck.idle{border-style:dashed;}
  .dcheck.idle>i{color:var(--amber);}

  @media(max-width:900px){
    .dhead{display:none;}
    .drow{grid-template-columns:1fr;gap:9px;padding:14px 0;border-bottom:1px solid var(--line);}
    .dlines{display:none;}
  }
  /* Model map on the export page. */
  .brain{border-left:3px solid var(--brand);background:var(--card);border-radius:0 8px 8px 0;
    padding:13px 16px;}
  .brain-k{font-size:8.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;}
  .brain p{font-size:13px;line-height:1.8;margin:0;color:var(--ink);}
  .brain .brain-n{font-size:10.5px;color:var(--muted);margin-top:8px;}
  .brl{list-style:none;margin:4px 0 0;padding:0;}
  .brl li{padding:7px 0;border-bottom:1px solid var(--line);}
  .brl li:last-child{border-bottom:0;}
  .brl b{display:block;font-size:12px;font-weight:600;color:var(--ink);line-height:1.5;}
  .brl span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.6;}
  .vmap{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);}
  .vmap svg text.vml{font:700 9.5px/1 var(--sans);fill:var(--ink);letter-spacing:.2px;}
  .vmap svg text.vmc{font:600 8px/1 var(--sans);fill:var(--muted);letter-spacing:.6px;text-transform:uppercase;}
  .vmleg{display:flex;flex-wrap:wrap;gap:16px;padding:11px 14px;border-top:1px solid var(--line);
    background:var(--card);font-size:10.5px;color:var(--muted);align-items:center;}
  .vmleg .bad{color:var(--red);font-weight:600;}
  .vk{display:inline-block;width:14px;height:2px;margin-right:6px;vertical-align:middle;}
  .vk.brand{background:var(--brand);height:2px;}
  .vk.soft{background:var(--line-strong);height:2px;}
  .vk.hollow{width:7px;height:7px;border:1.4px solid var(--red);background:none;border-radius:1px;}
  .abox{border:1px solid var(--line);border-radius:10px;background:var(--card);margin:0 0 26px;padding:14px 16px;}
  .abox-h{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.2px;
    color:var(--ink);margin-bottom:8px;}
  .abox-h i{color:var(--ai);}
  .abox-off{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
    color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:2px 6px;}
  .abox-intro{font-size:12.5px;line-height:1.75;color:var(--muted);margin:0 0 12px;max-width:78ch;}
  .abox-in{display:flex;gap:8px;align-items:flex-end;}
  .abox-in textarea{flex:1;font:inherit;font-size:12.5px;line-height:1.6;padding:9px 11px;resize:vertical;
    border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);}
  .abox-in textarea:focus{outline:2px solid var(--ai);outline-offset:-1px;}
  .abox-msg{font-size:11.5px;color:var(--muted);margin-top:12px;}
  .abox-comment{font-size:12.5px;line-height:1.75;margin:14px 0 4px;color:var(--ink);}
  .abox-note{font-size:11px;color:var(--muted);margin:0 0 10px;}
  /* The confirmation shown after a suggestion is accepted. It had no rule at
     all, so it inherited the document default — 16px next to neighbours set at
     11 to 12.5, which is why accepting a suggestion appeared to blow the type
     size up. Everything else in .abox states its own size; this now does too. */
  .abox-landed{display:flex;align-items:center;flex-wrap:wrap;gap:8px;
    font-size:11.5px;line-height:1.6;font-weight:600;color:var(--ink);
    margin:12px 0 10px;padding:8px 11px;border:1px solid var(--line);
    border-radius:7px;background:var(--panel);}
  .abox-landed i{color:var(--green);}
  .abox-landed .lnk{margin-top:0;}
  .apr{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);
    border-radius:7px;background:var(--panel);margin-bottom:6px;}
  .apr-b{flex:1;min-width:0;}
  .apr-b b{display:block;font-size:9px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
    color:var(--brand);margin-bottom:2px;}
  .apr-b span{font-size:12.5px;font-weight:600;color:var(--ink);}
  .apr-b p{font-size:11px;line-height:1.6;color:var(--muted);margin:3px 0 0;}
  .apr.done{opacity:.5;}
  .apr.done i{color:var(--muted);}
  .apr.done em{margin-left:auto;font-size:10px;font-style:normal;color:var(--muted);}
  .pagehelp{border:1px solid var(--line);border-radius:8px;background:var(--card);margin:0 0 26px;overflow:hidden;}
  .ph-toggle{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;
    padding:11px 14px;font:inherit;font-size:11.5px;font-weight:700;color:var(--ink);text-align:left;}
  .ph-toggle i:first-child{color:var(--brand);}
  .ph-body{padding:0 14px 14px;font-size:12.5px;line-height:1.75;color:var(--muted);max-width:78ch;}
  .pagehelp.shut .ph-body{display:none;}
  .topbar-link{background:none;border:none;font-family:inherit;font-size:11.5px;font-weight:600;
    color:var(--muted);padding:7px 11px;border-radius:5px;cursor:pointer;}
  .topbar-link:hover{background:var(--card);color:var(--ink);}
  /* Uppercase everywhere. It is a workstation, and the labels read as controls
     rather than prose. The active page is filled rather than underlined — an
     inset shadow disappears against a light background at a glance, and knowing
     which page you are on should not require one. */
  .topbar-link{text-transform:uppercase;letter-spacing:1.1px;font-weight:700;font-size:9.5px;}
  .topbar-link.on{color:#FFFFFF;background:var(--brand);box-shadow:none;border-radius:5px;}
  .topbar-link.on i{color:#FFFFFF;}
  .topbar-link.on:hover{filter:brightness(1.1);background:var(--brand);}
  h1{text-transform:uppercase;letter-spacing:-.4px;}
  .section-rule{text-transform:uppercase;letter-spacing:1.4px;}
  .op-sub{text-transform:uppercase;letter-spacing:1.2px;}
  .oh{text-transform:uppercase;letter-spacing:.8px;}
  .spacer{flex:1;}
  .who{display:flex;align-items:center;gap:8px;font-size:10px;line-height:1.4;}
  .who div strong{display:block;font-size:11px;}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:flex;
    align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;}

  .page{max-width:1180px;margin:0 auto;padding:26px 20px 40px;}
  .page.wide{max-width:1500px;}
  .eyebrow{font-size:9.5px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;
    color:var(--brand);margin-bottom:8px;}
  h1{font-size:30px;font-weight:800;letter-spacing:-.4px;margin:0 0 12px;line-height:1.15;}
  h2{font-size:20px;font-weight:700;letter-spacing:-.4px;margin:0 0 8px;}
  h3{font-size:14px;font-weight:700;margin:0 0 6px;}
  .lede{font-size:13px;line-height:1.75;color:var(--muted);max-width:74ch;margin:0 0 18px;}
  .lede b,.lede strong{color:var(--ink);}
  .section-rule{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
    color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:7px;margin:34px 0 14px;
    display:flex;align-items:center;gap:9px;}
  .section-rule::before{content:'';width:14px;height:2px;background:var(--brand);flex:0 0 auto;}
  .fineprint{font-size:10px;line-height:1.7;color:var(--muted);margin-top:26px;
    border-top:1px solid var(--line);padding-top:14px;}
  code{font-family:var(--mono);font-size:.88em;background:var(--card);border:1px solid var(--line);
    border-radius:3px;padding:1px 4px;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;}
  .card .title{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
  .grid{display:grid;gap:12px;}
  .grid.c2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
  .grid.c3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));}
  .grid.c4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

  .btn{padding:9px 18px;background:var(--ink);color:var(--bg);border:none;border-radius:5px;
    font-family:inherit;font-weight:700;cursor:pointer;font-size:11.5px;}
  .btn:hover{opacity:.86;}
  .btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);}
  .btn.ghost:hover{background:var(--card);opacity:1;}
  .btn.brand{background:var(--brand);color:#fff;}
  /* Colour is never the only signal - every .btn.ai also carries the wand and
     says what it does in words, because a third of readers cannot rely on hue. */
  .btn.ai{background:var(--ai);color:#fff;}
  .btn.ai:hover{background:var(--ai-hi);opacity:1;}
  .btn.sm{padding:6px 12px;font-size:10.5px;}
  .btn:disabled{opacity:.38;cursor:not-allowed;}
  .linkbtn{background:none;border:none;color:var(--brand);font-family:inherit;font-size:10.5px;
    font-weight:700;cursor:pointer;padding:0;text-align:left;}
  .linkbtn:hover{text-decoration:underline;}
  .linkbtn.danger{color:var(--red);}

  input[type=text],input[type=number],input[type=password],select,textarea{
    font-family:inherit;font-size:11.5px;padding:7px 9px;border:1px solid var(--line);border-radius:5px;
    background:var(--panel);color:var(--ink);width:100%;}
  textarea{font-family:var(--mono);font-size:11px;line-height:1.6;resize:vertical;}
  label.f{display:block;font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
    color:var(--muted);margin:0 0 4px;}
  .field{margin-bottom:10px;}

  .note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--brand);
    border-radius:0 6px 6px 0;padding:10px 12px;font-size:11px;line-height:1.7;margin:0 0 14px;}
  .note.warn{border-left-color:var(--amber);}
  .note.bad{border-left-color:var(--red);}
  .note.good{border-left-color:var(--green);}

  .chip{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:800;
    letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:20px;
    border:1px solid var(--line);background:var(--panel);color:var(--muted);}
  .chip.solid{color:#fff;border-color:transparent;}
  .kind-dot{width:9px;height:9px;border-radius:2px;display:inline-block;flex:0 0 auto;}

  .stats{display:flex;gap:16px;flex-wrap:wrap;padding:10px 0;}
  .stats > div{display:flex;flex-direction:column;}
  .stats b{font-size:19px;font-weight:800;letter-spacing:-.5px;}
  .stats span{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}

  .empty{border:1px dashed var(--line);border-radius:8px;text-align:center;padding:30px 20px;color:var(--muted);}
  .empty i{font-size:20px;display:block;margin-bottom:8px;opacity:.5;}
  .empty b{display:block;font-size:12px;color:var(--ink);margin-bottom:4px;}
  .empty p{font-size:11px;margin:0;line-height:1.6;}

  pre.box{font-family:var(--mono);font-size:10.5px;line-height:1.62;background:var(--card);
    border:1px solid var(--line);border-radius:6px;padding:12px;overflow:auto;max-height:60vh;
    white-space:pre-wrap;word-break:break-word;margin:0;}

  /* ── the layer spine — the signature element ─────────────────────────── */
  .spine{position:sticky;top:64px;}
  .spine-h{font-size:9.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px;}
  .band{position:relative;border:1px solid var(--line);border-left:6px solid var(--lc,var(--brand));
    background:var(--panel);border-radius:0 6px 6px 0;padding:9px 11px;margin-bottom:2px;cursor:pointer;}
  .band:hover{background:var(--card);}
  .band.on{box-shadow:0 0 0 2px var(--lc,var(--brand)) inset;}
  .band.muted{opacity:.42;}
  .band .bn{font-size:8.5px;font-weight:800;letter-spacing:1.4px;color:var(--lc,var(--brand));}
  .band .bl{font-size:12px;font-weight:700;letter-spacing:-.2px;display:block;margin:1px 0 2px;}
  .band .bd{font-size:9.5px;color:var(--muted);line-height:1.5;}
  .band .bc{position:absolute;top:9px;right:10px;font-size:9px;font-weight:800;color:var(--muted);}
  .band-link{height:14px;margin-left:14px;border-left:2px dotted var(--line);}

  /* ── node list ───────────────────────────────────────────────────────── */
  .nrow{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);
    border-radius:6px;background:var(--panel);margin-bottom:5px;cursor:pointer;}
  .nrow:hover{border-color:var(--brand);}
  .nrow.sel{box-shadow:0 0 0 2px var(--brand) inset;}
  .nrow .nm{flex:1;min-width:0;}
  .nrow .nm b{font-size:12px;font-weight:700;display:block;}
  .nrow .nm p{font-size:10px;color:var(--muted);margin:2px 0 0;line-height:1.5;
    overflow-wrap:anywhere;}
  .nrow .lay{font-size:8.5px;font-weight:800;letter-spacing:1px;color:var(--muted);flex:0 0 auto;}

  /* ── graph ───────────────────────────────────────────────────────────── */
  .gbox{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);}
  .gbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;
    border-bottom:1px solid var(--line);background:var(--card);}
  .gbar .t{font-size:9.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);}
  #gcanvas{height:520px;background:var(--panel);}
  /* ── doccritique ─────────────────────────────────────────────────────────
     Taller than #gcanvas because this graph is laid out in three fixed columns
     rather than a force field, so its height is the chapter count times the row
     pitch and it does not compress the way a physics graph does. */
  #dccanvas{height:580px;background:var(--panel);}
  /* ── open points ──────────────────────────────────────────────────────── */
  .openfs{border:1px dashed var(--line-strong);border-radius:8px;padding:11px 12px;margin:0 0 14px;}
  .openfs.on{border-style:solid;border-color:var(--brand);background:var(--card);}
  .openfs-h{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;line-height:1.6;cursor:pointer;}
  .openfs-h input{width:auto;margin:2px 0 0;flex:0 0 auto;accent-color:var(--brand);}
  .openfs-h i{color:var(--muted);}
  .openfs.on .openfs-h i{color:var(--brand);}
  .openfs-i{font-size:10.5px;line-height:1.65;color:var(--muted);margin:7px 0 9px;}
  .openfs-i b{color:var(--ink);}

  /* ── perspective picker + ladder ──────────────────────────────────────── */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px;}
  .pcard{display:flex;flex-direction:column;gap:4px;text-align:left;font-family:inherit;cursor:pointer;
    border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:11px 12px;}
  .pcard:hover{border-color:var(--line-strong);}
  .pcard.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);}
  .pcard .ph{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink);}
  .pcard .ph i{color:var(--muted);font-size:10px;}
  .pcard.on .ph i{color:var(--brand);}
  .pcard .ph .chip{margin-left:auto;}
  .pcard .pp{font-size:10.5px;line-height:1.55;color:var(--muted);}
  .pcard .pf{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:2px;}
  .pcard.on .pf{color:var(--brand);}
  .plad{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:12px 14px;}
  .plad-h{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.3px;
    color:var(--ink);margin-bottom:10px;}
  .plad-h i{color:var(--brand);}
  .plad-foot{display:flex;gap:14px;flex-wrap:wrap;font-size:9.5px;color:var(--muted);
    border-top:1px solid var(--line);margin-top:10px;padding-top:9px;}
  .plad-foot .mono{font-family:var(--mono);}
  .pdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;}
  .pdot.brand{background:var(--brand);}
  .dcgrid{display:grid;grid-template-columns:230px 1fr;gap:12px;align-items:start;}
  @media (max-width:820px){ .dcgrid{grid-template-columns:1fr;} }
  .dcside{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 11px;}
  .dcside-h{display:flex;align-items:center;font-size:9px;font-weight:800;letter-spacing:1.4px;
    text-transform:uppercase;color:var(--muted);margin:0 0 6px;}
  .dcside-h .linkbtn{margin-left:auto;font-size:9px;letter-spacing:0;text-transform:none;}
  .dctog{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:11px;line-height:1.5;}
  .dctog.off{opacity:.4;}
  .dctog.on .nm{color:var(--brand);font-weight:700;}
  .dctog input{margin:0;flex:0 0 auto;accent-color:var(--brand);}
  .dctog .sq{width:8px;height:8px;border-radius:2px;flex:0 0 auto;}
  .dctog .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    background:none;border:0;padding:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;}
  .dctog .nm i{font-size:9px;color:var(--muted);margin-right:3px;}
  .dctog .nm:hover{color:var(--brand);}
  .dctog .ct{font-family:var(--mono);font-size:9.5px;color:var(--muted);flex:0 0 auto;}
  .dctog .linkbtn.i{flex:0 0 auto;font-size:9px;width:14px;text-align:center;}
  .gfoot{display:flex;gap:12px;flex-wrap:wrap;padding:8px 10px;border-top:1px solid var(--line);
    font-size:9px;color:var(--muted);}
  .gkey{display:flex;align-items:center;gap:4px;}

  /* ── perspective lens bar ────────────────────────────────────────────── */
  .lens{display:flex;gap:4px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);
    background:var(--card);border-radius:8px;padding:6px;margin-bottom:12px;}
  .lens-t{font-size:9px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--muted);padding:0 6px;}
  .lens-b{border:1px solid transparent;background:transparent;font-family:inherit;font-size:10.5px;
    font-weight:700;color:var(--muted);padding:5px 10px;border-radius:5px;cursor:pointer;}
  .lens-b:hover{background:var(--panel);color:var(--ink);}
  .lens-b.on{background:var(--brand);color:#fff;}
  .lens-note{flex-basis:100%;font-size:10.5px;line-height:1.6;color:var(--muted);padding:6px 8px 2px;}
  .lens-note b{color:var(--ink);}

  /* ── analyzers ───────────────────────────────────────────────────────── */
  .disc{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:14px;margin-bottom:10px;}
  .disc.on{border-color:var(--brand);}
  .disc-h{display:flex;align-items:center;gap:9px;cursor:pointer;}
  .disc-h i.di{width:20px;color:var(--brand);}
  .disc-h b{font-size:13px;font-weight:700;flex:1;}
  .disc p{font-size:11px;line-height:1.65;color:var(--muted);margin:7px 0 0;}
  /* `dl.kv` is used by the About dialog and had no rule anywhere in this file, so
     it fell back to the browser default for a definition list: dt on one line,
     dd indented on the next, nothing aligned with anything. A two-column grid is
     what the markup always meant. */
  dl.kv{display:grid;grid-template-columns:150px 1fr;gap:7px 16px;margin:0;font-size:11.5px;
    line-height:1.6;}
  dl.kv dt{color:var(--muted);font-weight:600;}
  dl.kv dd{margin:0;color:var(--ink);}
  @media (max-width:560px){ dl.kv{grid-template-columns:1fr;gap:2px 0;} dl.kv dd{margin-bottom:9px;} }

  /* flex-wrap is load-bearing, not cosmetic. `.why` below asks for flex:0 0 100%
     so it can sit on its own line under the other three children. In a nowrap
     container that basis is honoured on the *same* line and cannot shrink, so
     the row overflows and every shrinkable sibling — `.am`, which has min-width:0 —
     collapses toward zero width. The visible symptom is an analyzer that does not
     apply to the model rendering its description one word per line. */
  .an-row{display:flex;flex-wrap:wrap;gap:10px 10px;align-items:flex-start;
    border:1px solid var(--line);border-radius:6px;
    background:var(--card);padding:9px 11px;margin-top:7px;}
  .an-row i.ai{width:16px;text-align:center;color:var(--brand);margin-top:2px;}
  /* A basis rather than flex:1 with basis 0. Now that the row wraps, a row too
     narrow to hold text and chips side by side puts them on two lines instead of
     grinding the text column down to one word wide. */
  .an-row .am{flex:1 1 240px;min-width:0;}
  .an-row .am b{font-size:12px;display:block;}
  .an-row .am .lbl{font-family:var(--mono);font-size:9.5px;color:var(--muted);}
  .an-row .am p{font-size:10.5px;line-height:1.6;color:var(--muted);margin:3px 0 0;}
  .an-row .aa{display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex:0 0 auto;}
  /* An analyzer that does not apply to this model is shown, not hidden. Hiding it
     raises the question "where did the other six go"; greying it and saying why
     answers the question the user was about to ask. */
  .an-row.off{opacity:.62;border-style:dashed;}
  .an-row .why{flex:0 0 100%;font-size:10px;line-height:1.55;color:var(--muted);
    border-top:1px dashed var(--line);margin-top:0;padding-top:6px;}
  .an-row .why b{color:var(--ink);}

  /* ── proportions ─────────────────────────────────────────────────────── */
  .ceil{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0;}
  .ceil > div{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:9px 11px;}
  .ceil b{font-size:19px;font-weight:800;letter-spacing:-.5px;display:block;}
  .ceil span{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);}
  .ceil > div.over{border-color:var(--red);}
  .law{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:0 6px 6px 0;
    background:var(--panel);padding:11px 13px;margin-bottom:8px;}
  .law.pass{border-left-color:var(--green);} .law.warn{border-left-color:var(--amber);}
  .law.fail{border-left-color:var(--red);}   .law.info{border-left-color:var(--info);}
  .law-h{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;margin-bottom:5px;}
  .law-h i{color:var(--muted);}
  .law p{font-size:11px;line-height:1.7;margin:0;}
  .law pre{font-family:var(--mono);font-size:9.5px;line-height:1.6;color:var(--muted);
    white-space:pre-wrap;margin:7px 0 0;}
  .verdict{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);padding:13px 15px;margin-bottom:12px;flex-wrap:wrap;}
  .verdict .vs{font-size:30px;font-weight:800;letter-spacing:-1.5px;}
  .verdict .vv{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;}

  /* ── tables ──────────────────────────────────────────────────────────── */
  table.t{width:100%;border-collapse:collapse;font-size:11px;}
  table.t th{text-align:left;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
    color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px;}
  table.t td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top;}
  table.t tr:hover td{background:var(--card);}
  table.t td.mono{font-family:var(--mono);font-size:10px;}

  /* ── modal ───────────────────────────────────────────────────────────── */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;
    align-items:center;justify-content:center;padding:20px;}
  .overlay.open{display:flex;}
  .modal{background:var(--panel);border-radius:10px;max-width:760px;width:100%;max-height:88vh;

     A masthead, not a hero. It names the product at the size a masthead needs

  /* The name identifies the product; the thesis is what the page is for, so the
     thesis stays the largest thing on it. */
  .hero h1{font-size:clamp(26px,3.8vw,38px);letter-spacing:-1.1px;max-width:19ch;}

  /* ── landing ─────────────────────────────────────────────────────────── */
  .hero{display:grid;grid-template-columns:1.15fr .85fr;gap:34px;align-items:center;

  .pathcard{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:14px;}
  .pstep{display:flex;gap:10px;align-items:center;padding:7px 9px;border-radius:6px;

    border-radius:3px;padding:2px 5px;flex:0 0 auto;}

<script>
/* ═══════════════════════════════════════════════════════════════════════════

/* ═══════════════════════════════════════════════════════════════════════════
   KNOWLEDGE ENGINEERING STUDIO — community edition.

   What this is
   ------------
   A model of a domain, written in layers, exported as something a language
   model or an MCP client can actually use. The product is the export, not the
   answer: you build the structure once, and every perspective you define
   turns that same structure into a different prompt.

   What it is not
   --------------
   It does not read documents and it does not critique them.

   Where the data lives
   --------------------
   Nothing reaches an external network. The page talks to exactly one origin —
   the container that served it — and that container writes plain JSON files
   into a directory you mounted. Every save also lands a timestamped copy in
   .history/, so an edit you regret is recoverable.

   The `store` object below is the only thing that knows this. It keeps the
   whole workspace in memory and writes back on a debounce, which is why every
   other line in this file can still call store.get() synchronously and stay
   exactly as it was.

   Naming: APP.name / APP.by set the wordmark. Change them
   below and the whole build follows.
   ═══════════════════════════════════════════════════════════════════════════ */

const APP = {
  name     : 'Pennant',
  suite    : '',
  /* One field, because "name + suite" grew a trailing space the moment the
     suite was dropped. Everything that signs its own output uses APP.full. */
  full     : 'Pennant',
  /* Attribution lives in LICENSE, NOTICE and the admin build table. It is
     deliberately not rendered on the landing page: a tool you run for yourself
     does not need a byline over the door. */
  by       : 'Luka Gale',
  strapline: 'Structure, logic and proportion for knowledge you hand to a model.',
  tagline  : 'Knowledge engineering studio',
  build    : '0.14.1',
  licence  : 'MIT',
  mock     : false,
  companion: { name:'', url:'', note:'' }
};

/* Feature flags. A flag is not a paywall — everything here is in the build and
   MIT-licensed. These exist so a half-finished surface can be hidden without
   deleting code that will be wanted back. */
const FLAGS = {
  mcpExport : false,   /* The MCP artefact is descriptive, not spec-conformant yet.
                          Set true to show the card; the exporter is unchanged. */
  graph     : true,    /* vis-network canvas on the build page. Vendored locally. */
  history   : true     /* Version history panel, backed by the server's .history/ dir. */
};
/* ═══════════════════════════════════════════════════════════════════════════
   ONE EDITION

   There used to be a PLANS table here: five tiers, seven entitlement keys, a
   local override, an upsell string generator and a comparison matrix on the
   Admin page. All of it is gone, and it is worth recording what it was actually
   doing before it went, because the audit was more damning than the decision.

   Of the seven entitlement keys, five — exportAll, fileTargets, history, sso,
   audit — gated nothing whatsoever. Not one call site between them. They
   existed to be printed in a matrix.

   crossModel gated a single line of text on the Profile page reading "not on
   this plan". There was no cross-model vocabulary feature anywhere in the
   build: it was five booleans and two labels. The tier system advertised a
   feature that did not exist and then withheld it.

   can('ai') was the only gate with any effect, and the default plan set
   ai:true, so it never fired.

   And the block on the Profile page holding both of those gates was inside
   `plan().hosted ? … : …`, with hosted:false on the default plan — so it never
   rendered at all. The net observable effect of the whole apparatus, on the
   only build anybody runs, was to hand `plan().licence` to the About dialogue,
   which printed AGPL-3.0 over a repository whose LICENSE file says MIT.

   The comment that used to sit here said the tiers existed "to find out
   whether a tier makes sense before anyone is charged for it". That experiment
   ran to completion and returned no. Keeping the code after that is keeping a
   finished experiment running.

   What is left is one fact, stated once. FLAGS stays, because it answers a
   different and honest question — does this surface exist in this build yet —
   and hiding an unfinished screen is not the same act as withholding a
   finished one.
   ═══════════════════════════════════════════════════════════════════════════ */
const EDITION = {
  label   : 'Self-hosted',
  licence : 'MIT',
  note    : 'The whole tool, on your own machine. Nothing is withheld, nothing is capped, and nothing phones home.'
};

/* Total nodes across every model. No longer a cap — it maps to what the
   workspace costs on disk and in history retention, which is worth showing for
   its own sake. */
function workspaceNodes(){ return (state.models || []).reduce((a,m) => a + ((m.nodes||[]).length), 0); }

/* A ceiling on an imported file. Not a security control — see the import handler
   — but the difference between a refusal and a locked-up tab. */
const IMPORT_MAX_BYTES = 8 * 1024 * 1024;
const SCHEMA = { kind:'doccritique.knowledge-model', version:'1.1' };

/* Brand mark — two red pennants on a mast: the gale warning signal.

   Two, not one. One red pennant is a small craft advisory; two is a gale. The
   count is the meaning, so the mark keeps both.

   Why this and not the two-nodes-and-an-edge mark it replaces: a flag raised
   over a claim is what this tool does, and the two previous comment blocks here
   disagreed with each other about whether the accent was teal or red. It is
   red (--brand, #D40000 light / #FF3B30 dark), and the mast takes currentColor
   so the mark needs no second asset for the dark theme.

   Drawn rather than borrowed, so it costs no icon font and scales to any
   height. */
const MARK = h => `
<svg viewBox="0 0 32 24" height="${h}" width="${(h*32/24).toFixed(0)}" aria-hidden="true"
     style="display:block;flex-shrink:0;">
  <line x1="5" y1="2.5" x2="5" y2="21.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".55"/>
  <path d="M6.2 4.2h19.6L6.2 9.6z" fill="var(--brand)"/>
  <path d="M6.2 12.4h19.6L6.2 17.8z" fill="var(--brand)"/>
</svg>`;

/* Mark, then one word, then nothing. The lockup this replaces stacked the full
   product name over a letterspaced tagline immediately beside a graph canvas —
   two pieces of chrome competing with the content they are supposed to frame.

   `sub` is kept in the signature so every existing call site still works, but it
   is now opt-in: pass a string only where a second line is actually wanted. Pass
   an empty wordmark by calling LOCKUP(h, 0) if you want the mark alone. */
const LOCKUP = (iconH, size, sub) => `
<span class="brand-lockup" data-nav="/">${MARK(iconH)}${size ? `<span class="wm">
  <span class="nm" style="font-size:${size}px;"><b>Pennant</b></span>
  ${sub ? `<span class="sub" style="font-size:${Math.max(6.5,Math.round(size*0.42))}px;letter-spacing:${(size*0.115).toFixed(1)}px;margin-top:${Math.round(size*0.22)}px;">${esc(sub)}</span>` : ''}
</span>` : ''}</span>`;

/* ── tiny helpers ───────────────────────────────────────────────────────── */
const $   = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = p => p + '_' + Math.random().toString(36).slice(2,8);
function on(sel, ev, fn, root){ (root||document).querySelectorAll(sel).forEach(el => el.addEventListener(ev, fn)); }
function initials(n){ return String(n||'?').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase(); }
function download(name, text, mime){
  try{
    const b = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const u = URL.createObjectURL(b), a = document.createElement('a');
    a.href = u; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 400);
    return true;
  } catch(e){ return false; }
}

/* ═══════════════════════════════════════════════════════════════════════════
   AUTH — mock. Two roles and nothing else: the person who builds the model,
   and the person who runs the installation. There is no paid tier here; a
   feature is either in the build or it is not.
   ═══════════════════════════════════════════════════════════════════════════ */
/* PROFILES, not accounts.

   There is no password and there is deliberately no pretence of one. A profile
   separates one person's models from another's on a shared machine; it does not
   protect them. Anyone who can reach this page can pick any profile, and anyone
   with the data directory can read every file in it regardless. If you need the
   models actually protected, that is filesystem permissions or a real identity
   provider — not a name field in a browser.

   The two-method shape (login / logout) is kept on purpose. Swapping this block
   for OIDC authorization-code + PKCE changes this block and nothing else. */
const MODES = [
  { key:'knowledge', label:'Knowledge engineer', icon:'fa-diagram-project',
    blurb:'Build and edit models, write perspectives, run the laws, export every artefact.' },
  { key:'admin',     label:'Administrator',      icon:'fa-screwdriver-wrench',
    blurb:'Inspect what is stored, restore from history, purge the workspace.' }
];
/* The current profile is the one piece of state that cannot live in the
   workspace, because it selects which workspace to load. It is the only
   localStorage key this build still uses, and it holds a name and nothing else. */
const auth = (() => {
  let user = null;
  try { user = JSON.parse(localStorage.getItem('ke.profile') || 'null'); } catch(e){ user = null; }
  return {
    user: () => user,
    isIn: () => !!user,
    /* Both modes are available to whoever is signed in — this is a local tool,
       not an installation with a security boundary. The split is kept because
       running the workspace and deciding what is true in it are different jobs,
       and mixing those two screens made both worse. */
    has : r => !!user && (user.mode === r || r === 'any'),
    mode: () => user ? user.mode : null,
    setMode(m){ if(!user) return; user.mode = m; localStorage.setItem('ke.profile', JSON.stringify(user)); },
    login(name, mode){
      const n = String(name || '').trim(); if(!n) return false;
      user = { name:n, mode: mode || 'knowledge', sub:'local|'+n };
      localStorage.setItem('ke.profile', JSON.stringify(user));
      api.profile = n;
      return true;
    },
    logout(){ store.beacon(); user = null; api.profile = null;
              localStorage.removeItem('ke.profile'); store.hydrate({}); }
  };
})();
/* api.profile is NOT set here. `api` is a const declared below this block, so
   touching it at module level from up here hits the temporal dead zone and
   throws before a single line of UI renders. It is set in boot() instead,
   which runs after every declaration in the file. */

/* ═══════════════════════════════════════════════════════════════════════════
   STORE — server-backed, namespaced. Nothing leaves this origin.
   ═══════════════════════════════════════════════════════════════════════════ */
/* The whole workspace is pulled once at boot and held in `mem`. Reads are
   synchronous against that map — which is the entire reason the other four
   thousand lines of this file did not have to change. Writes go into `mem`
   immediately and are flushed to the server on a short debounce, so a burst of
   edits is one request rather than forty.

   The debounce is the one place this can lose data: close the tab inside the
   window and the last write is gone. beforeunload flushes synchronously with
   sendBeacon to close most of that gap. It is not a transaction and does not
   pretend to be. */
const api = {
  base: '',
  profile: null,
  async call(method, path, body){
    const opt = { method, headers:{} };
    if(body !== undefined){ opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    const q = this.profile ? (path.indexOf('?') < 0 ? '?' : '&') + 'profile=' + encodeURIComponent(this.profile) : '';
    const r = await fetch(this.base + path + q, opt);
    if(!r.ok) throw new Error(method + ' ' + path + ' → ' + r.status + ' ' + (await r.text()).slice(0,200));
    const t = await r.text();
    return t ? JSON.parse(t) : null;
  },
  profiles()          { return this.call('GET',  '/api/profiles'); },
  createProfile(name) { return this.call('POST', '/api/profiles', { name }); },
  workspace()         { return this.call('GET',  '/api/workspace'); },
  putKey(k, v)        { return this.call('PUT',  '/api/workspace/' + encodeURIComponent(k), { value: v }); },
  delKey(k)           { return this.call('DELETE','/api/workspace/' + encodeURIComponent(k)); },
  purge()             { return this.call('DELETE','/api/workspace'); },
  history(k)          { return this.call('GET',  '/api/history/' + encodeURIComponent(k)); },
  historyAt(k, stamp) { return this.call('GET',  '/api/history/' + encodeURIComponent(k) + '/' + encodeURIComponent(stamp)); },
  samples()           { return this.call('GET',  '/api/samples'); },
  sample(name)        { return this.call('GET',  '/api/samples/' + encodeURIComponent(name)); },
  info()              { return this.call('GET',  '/api/info'); },
  llmModels(baseUrl)  { return this.call('GET',  '/api/llm/models' +
                          (baseUrl ? '?baseUrl=' + encodeURIComponent(baseUrl) : '')); }
};

const store = {
  mem   : {},                 /* key (unprefixed) -> parsed value */
  dirty : new Set(),
  timer : null,
  state : 'idle',             /* idle | saving | error — surfaced in the topbar */
  lastError : null,

  get(k, d){ return (k in this.mem) ? this.mem[k] : d; },
  set(k, v){ this.mem[k] = v; this.dirty.add(k); this.schedule(); },
  del(k){ delete this.mem[k]; this.dirty.delete(k); api.delKey(k).catch(e => this.fail(e)); },
  keys(){ return Object.keys(this.mem).map(k => 'ke.' + k).sort(); },
  raw(k){ const bare = k.indexOf('ke.') === 0 ? k.slice(3) : k;
          try{ return JSON.stringify(this.mem[bare]); }catch(e){ return ''; } },
  bytes(){ return this.keys().reduce((a,k) => a + (this.raw(k)||'').length, 0); },

  schedule(){
    if(this.timer) clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 400);
  },
  async flush(){
    if(!this.dirty.size) return;
    const batch = Array.from(this.dirty); this.dirty.clear();
    this.state = 'saving'; paintSaveState();
    try{
      for(const k of batch) await api.putKey(k, this.mem[k]);
      this.state = 'idle'; this.lastError = null;
    }catch(e){ this.dirty = new Set(batch.concat(Array.from(this.dirty))); this.fail(e); }
    paintSaveState();
  },
  fail(e){
    this.state = 'error'; this.lastError = e && e.message ? e.message : String(e);
    console.error('[store]', e); paintSaveState();
  },
  /* Best-effort flush on tab close. sendBeacon is fire-and-forget and cannot
     report failure, which is why the debounce above is short. */
  beacon(){
    if(!this.dirty.size || !navigator.sendBeacon) return;
    const q = api.profile ? '?profile=' + encodeURIComponent(api.profile) : '';
    for(const k of this.dirty){
      try{
        navigator.sendBeacon(api.base + '/api/workspace/' + encodeURIComponent(k) + q,
          new Blob([JSON.stringify({ value:this.mem[k] })], { type:'application/json' }));
      }catch(e){}
    }
    this.dirty.clear();
  },
  hydrate(obj){ this.mem = obj || {}; this.dirty.clear(); this.state = 'idle'; }
};
window.addEventListener('beforeunload', () => store.beacon());

function paintSaveState(){
  const el = document.getElementById('saveState'); if(!el) return;
  const m = { idle:['fa-circle-check','var(--green)','Saved'],
              saving:['fa-arrows-rotate','var(--muted)','Saving…'],
              error:['fa-triangle-exclamation','var(--red)','Not saved'] }[store.state];
  el.innerHTML = `<i class="fas ${m[0]}" style="color:${m[1]};"></i> <span style="color:${m[1]};">${m[2]}</span>`;
  el.title = store.state === 'error' ? ('Last error: ' + (store.lastError || '')) : 'Workspace: ' + (api.profile || '—');
}

/* ═══════════════════════════════════════════════════════════════════════════
   VOCABULARY — node kinds and relationship types.

   This is the part that has to stay small. A vocabulary nobody can hold in
   their head produces a model where two people label the same thing
   differently, and the export is then worse than no export.
   ═══════════════════════════════════════════════════════════════════════════ */
const KINDS = {
  product   : { label:'Product',     color:'#2E7D32', shape:'box',      hint:'Something a customer buys or is entitled to.' },
  channel   : { label:'Channel',     color:'#7CB342', shape:'box',      hint:'Where a product is sold, offered or delivered.' },
  rule      : { label:'Rule',        color:'#7E57C2', shape:'ellipse',  hint:'A condition that decides an outcome. Eligibility, pricing, policy.' },
  actor     : { label:'Owner',       color:'#D81B60', shape:'ellipse',  hint:'A person, team or role that owns or approves something.' },
  capability: { label:'Capability',  color:'#00897B', shape:'box',      hint:'A business capability, independent of the system that implements it.' },
  control   : { label:'Control',     color:'#546E7A', shape:'box',      hint:'A requirement, standard or governance artefact.' },
  process   : { label:'Process',     color:'#0288D1', shape:'box',      hint:'A runtime flow, job, timer or procedure.' },
  app       : { label:'Application', color:'#3949AB', shape:'box',      hint:'A deployed application or service.' },
  integration:{ label:'Interface',   color:'#8D6E63', shape:'box',      hint:'A feed, bus, queue, file drop or API boundary.' },
  datastore : { label:'Data store',  color:'#6D4C41', shape:'database', hint:'A database, index, object store or file share.' },
  provider  : { label:'Provider',    color:'#F4511E', shape:'box',      hint:'A third party outside your control.' },
  event     : { label:'Event',       color:'#F9A825', shape:'diamond',  hint:'Something that happens and starts a chain.' },
  term      : { label:'Term',        color:'#A1887F', shape:'text',     hint:'A defined word. Put it here once, reference it everywhere.' },
  incident  : { label:'Incident',    color:'#B3261E', shape:'star',     hint:'A recorded failure, with a window and a cause.' },
  chapter   : { label:'Chapter',     color:'#2E7D32', shape:'box',      hint:'A section of a document template. What a document must contain, not what one does.' },
  analyzer  : { label:'Analyzer',    color:'#00695C', shape:'hexagon',  hint:'A checker with a prompt. Link it to the chapter or rule it is responsible for.' },
  variable  : { label:'Variable',    color:'#116466', shape:'ellipse',  hint:'A measured fact about the organisation. Something you can look up, not estimate.' },
  ceiling   : { label:'Ceiling',     color:'#00838F', shape:'diamond',  hint:'A limit derived from variables by an expression. Not a target — the point past which nobody can operate the result.' },
  /* Document modelling. A document is a graph too: sections that must exist,
     claims those sections make, obligations the claims create, and the evidence
     that would settle whether a claim is true. Modelling it this way is what
     lets an analyzer be pointed at a specific obligation rather than at "the
     document", which is the difference between a finding and an impression. */

/* ═══════════════════════════════════════════════════════════════════════════

   The disciplines below are a grouping, not a property of the analyzers. An

   ═══════════════════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════════════════
   WHAT AN ANALYZER IS FOR

   Every analyzer used to be offered on every model. That is wrong in a way that
   is easy to miss: an analyzer is only meaningful pointed at a specific node of
   a specific kind, so offering "Add to model" on a model containing no claim and
   no chapter produces a node nobody can wire to anything.

   Two declarations fix it, and both are data rather than code so they can be
   argued with:

     domains      which kind of review this analyzer belongs to
     targetKinds  what a CHECKS edge from it is allowed to land on

   The mapping below is a first pass and is meant to be edited. It was derived
   from each analyzer's own stated role, not from measurement, so treat any row
   you disagree with as a row to change rather than as a fact.
   ═══════════════════════════════════════════════════════════════════════════ */
const REVIEW_DOMAINS = {
  'document-review': {
    label:'Document review',
    blurb:'A document modelled as a graph: sections that must exist, claims they make, obligations those create, evidence that would settle them.',
    marks:['document','chapter','claim','obligation','evidence'] },
  'source-review': {
    label:'Source review against knowledge',
    blurb:'A source checked against what you already hold to be true here: rules, controls, defined terms and measured variables.',
    marks:['rule','control','term','variable','ceiling'] },
  'system': {
    label:'System or domain model',
    blurb:'What exists and what runs between it. Nothing here makes a checkable assertion, so no analyzer applies yet.',
    marks:['app','integration','datastore','process','provider','capability'] }
};
const REVIEW_DOMAIN_IDS = Object.keys(REVIEW_DOMAINS);

const ANALYZER_SCOPE = {
  v_contradiction:{ domains:['document-review','source-review'], targetKinds:['claim','chapter','rule','control'] },
  v_vague        :{ domains:['document-review','source-review'], targetKinds:['claim','chapter','rule','variable','ceiling'] },
  v_timeline     :{ domains:['document-review'],                 targetKinds:['chapter','obligation','process'] },
  v_placeholder  :{ domains:['document-review'],                 targetKinds:['document','chapter'] },
  v_stakeholder  :{ domains:['document-review'],                 targetKinds:['chapter','obligation','actor'] },
  v_dependency   :{ domains:['document-review','source-review'], targetKinds:['chapter','integration','app','datastore','capability'] },
  v_collision    :{ domains:['source-review','document-review'], targetKinds:['capability','control','actor','rule'] },
  v_ownership    :{ domains:['document-review'],                 targetKinds:['claim','obligation','chapter'] },
  v_deviation    :{ domains:['document-review'],                 targetKinds:['document','chapter'] },
  v_regulatory   :{ domains:['document-review','source-review'], targetKinds:['claim','chapter','integration','datastore','control'] }
};
function analyzerScope(id){
  return ANALYZER_SCOPE[id] || { domains:REVIEW_DOMAIN_IDS, targetKinds:KIND_IDS };
}

/* The review domain is inferred from what is in the model, and overridable,
   because inference is a guess and the person looking at the model is not. An
   explicit choice is stored on the model as reviewDomain and always wins. */
function modelDomain(m){
  if(!m) return 'system';
  if(m.reviewDomain && REVIEW_DOMAINS[m.reviewDomain]) return m.reviewDomain;
  const has = k => (m.nodes||[]).some(n => n.kind === k);
  if(has('document') || has('chapter') || has('claim')) return 'document-review';
  if(has('rule') || has('control') || has('term')) return 'source-review';
  return 'system';
}

/* Two independent questions, answered separately so the reason is specific:
   is this analyzer written for this kind of review, and is there anything in
   this particular model for it to be pointed at? */
function analyzerFits(id, m){
  const sc = analyzerScope(id), dom = modelDomain(m);
  if(sc.domains.indexOf(dom) < 0){
    return { ok:false, reason:'Written for ' + sc.domains.map(d => REVIEW_DOMAINS[d].label).join(' and ') +
             '. This model reads as ' + REVIEW_DOMAINS[dom].label.toLowerCase() + '.' };
  }
  const present = sc.targetKinds.filter(k => (m.nodes||[]).some(nd => nd.kind === k));
  if(!present.length){
    return { ok:false, reason:'Nothing here to point it at. It checks ' +
             sc.targetKinds.map(k => (KINDS[k]||{label:k}).label.toLowerCase()).join(', ') +
             ' — add one of those first.' };
  }
  return { ok:true, reason:'', targets:present };
}

/* A CHECKS edge landing on a kind the analyzer does not check is the model
   equivalent of an impression: the check cannot mean anything specific about
   that node. Reported rather than prevented, because the wiring is edited on
   another page and a model half-built is a normal state to be in. */
function checksViolations(m){
  if(!m) return [];
  const N = m.nodes || [];
  const byId = {};
  N.forEach(nd => { byId[nd.id] = nd; });
  const out = [];
  (m.edges||[]).forEach(e => {
    if(e.rel !== 'CHECKS') return;
    const from = byId[e.from], to = byId[e.to];
    if(!from || !to || from.kind !== 'analyzer') return;
    const aid = (from.props||{}).analyzerId;
    if(!aid || !ANALYZER_SCOPE[aid]) return;
    const allowed = analyzerScope(aid).targetKinds;
    if(allowed.indexOf(to.kind) < 0){
      out.push({ analyzer:from.label || aid, target:to.label || to.id,
                 kind:(KINDS[to.kind]||{label:to.kind}).label, allowed:allowed });
    }
  });
  return out;
}

/* ── the expression engine ────────────────────────────────────────────────
   A ceiling is written, not coded. That is the whole point of this rewrite:
   the numbers in here are heuristics about one kind of organisation, and
   anybody whose organisation is a different kind needs to change the formula,
   not fork the file.

   So expressions are parsed rather than evaluated as JavaScript. A recursive
   descent parser over numbers, variable names, + - * / % ^, comparisons and
   a fixed function list is about sixty lines and cannot do anything except
   arithmetic. eval() would have been shorter and would have handed whoever
   opens a shared profile the ability to run code in the reader's browser.

   Available: min max round ceil floor abs sqrt if
   if(condition, then, else) — comparisons return 1 or 0.
   ─────────────────────────────────────────────────────────────────────── */
const EXPR_FUNCS = {
  min:(...a)=>Math.min(...a), max:(...a)=>Math.max(...a), round:a=>Math.round(a),
  ceil:a=>Math.ceil(a), floor:a=>Math.floor(a), abs:a=>Math.abs(a),
  sqrt:a=>Math.sqrt(a), if:(c,a,b)=> c ? a : b
};
const EXPR_HELP = 'min · max · round · ceil · floor · abs · sqrt · if(condition, then, else) · + - * / % ^ · > >= < <= == !=';

function evalExpr(src, scope){
  const s = String(src == null ? '' : src);
  let i = 0;
  const refs = [];
  const ws  = () => { while(i < s.length && /\s/.test(s[i])) i++; };
  const eat = t => { ws(); if(s.startsWith(t, i)){ i += t.length; return true; } return false; };
  const fail = m => { throw new Error(m); };

  function primary(){
    ws();
    if(eat('(')){ const v = expr(); if(!eat(')')) fail('missing )'); return v; }
    if(eat('-')) return -primary();
    if(eat('+')) return primary();
    ws();
    let m = /^\d+(\.\d+)?/.exec(s.slice(i));
    if(m){ i += m[0].length; return parseFloat(m[0]); }
    m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(s.slice(i));
    if(!m) fail('unexpected "' + (s[i] || 'end of expression') + '"');
    i += m[0].length;
    const id = m[0];
    if(eat('(')){
      const args = [];
      if(!eat(')')){
        do { args.push(expr()); } while(eat(','));
        if(!eat(')')) fail('missing ) after ' + id);
      }
      const f = EXPR_FUNCS[id.toLowerCase()];
      if(!f) fail('there is no function called ' + id);
      return f.apply(null, args);
    }
    if(refs.indexOf(id) < 0) refs.push(id);
    if(!(id in scope)) fail('nothing is called ' + id);
    return Number(scope[id]) || 0;
  }
  function pow(){ let v = primary(); while(eat('^')) v = Math.pow(v, primary()); return v; }
  function term(){ let v = pow(); for(;;){
    if(eat('*')) v *= pow();
    else if(eat('/')){ const x = pow(); v = x === 0 ? 0 : v / x; }
    else if(eat('%')){ const x = pow(); v = x === 0 ? 0 : v % x; }
    else return v; } }
  function add(){ let v = term(); for(;;){
    if(eat('+')) v += term(); else if(eat('-')) v -= term(); else return v; } }
  function expr(){ let v = add(); for(;;){
    if(eat('>=')) v = v >= add() ? 1 : 0;
    else if(eat('<=')) v = v <= add() ? 1 : 0;
    else if(eat('==')) v = v == add() ? 1 : 0;
    else if(eat('!=')) v = v != add() ? 1 : 0;
    else if(eat('>'))  v = v >  add() ? 1 : 0;
    else if(eat('<'))  v = v <  add() ? 1 : 0;
    else return v; } }

  if(!s.trim()) return { ok:false, value:0, refs:[], error:'empty expression' };
  try {
    const v = expr(); ws();
    if(i < s.length) return { ok:false, value:0, refs, error:'cannot read "' + s.slice(i, i+14) + '"' };
    if(!isFinite(v)) return { ok:false, value:0, refs, error:'does not come out as a finite number' };
    return { ok:true, value:v, refs, error:null };
  } catch(e){ return { ok:false, value:0, refs, error:e.message }; }
}

/* ═══════════════════════════════════════════════════════════════════════════
   PROPORTIONS — a layer, not a form.

   What it is for: ask a language model for a solution and it returns the
   Hollywood version. Every organisation gets a service mesh, every migration
   takes a fortnight, every roadmap has a hundred APIs on it. That output is
   fluent, internally consistent, and sized for a company that does not exist.
   It is the most obvious kind of hallucination there is, and the reason it
   survives review is that nobody has written down the number it violates.

   This layer is that number. It is deliberately not a fixed company profile:
   the variables, the ceilings, the detectors and the phrase lists are all
   data, and a ceiling is an expression over the variables rather than a line
   of code. PROPORTION_EXAMPLE below reproduces the original DocCritique
   arithmetic exactly — 1.5 integrations per IT head, six mass-units of legacy
   per week — and every one of those coefficients is a heuristic that should be
   replaced by somebody who has measured their own.

   It is an EXAMPLE and never a default. It used to be both, and a new
   workspace therefore opened the Proportions page already holding a twenty-
   person procurement office with an AS/400, three named stakeholders and a
   9,000-a-month budget — none of which is a fact about whoever installed
   this. Every ceiling on the page was then arithmetic over invented inputs,
   and the export manifest reported it as the profile in force. That is the
   same fault the Structure page fixed for layers, and the comment there
   states the rule this now follows too: a guessed default does not read as a
   suggestion, it reads as a fact about your organisation. A new workspace
   starts empty — see starterProportions() — and this profile arrives only
   when somebody presses the button that names it.

   Four laws, in the order they are enforced:
     1  Scale        quantity against capacity
     2  Gravity      legacy mass against proposed duration
     3  Signal       what changes the structure vs what is only being said
     4  Constraint   were the constraints mapped before generating?
   ═══════════════════════════════════════════════════════════════════════════ */
