  '   {"op":"addStep","name":"...","kind":"perspective|analyzer|proportions|extract|transform|human",',
  '    "intent":"...","consumes":["..."],"produces":["..."]},',
  '   {"op":"addLogicEdge","from":"<step name>","rel":"needs|after","to":"<step name>"},',
  '   {"op":"addPerspective","name":"...","purpose":"who reads this and what they need",',
  '    "order":"top-down|bottom-up|both","steps":["do this first","then this"],',
  '    "contract":["what the answer must not do"]},',
  '   {"op":"addAnalyzer","label":"...","note":"the one specific thing it checks","layer":"<layer id or name>"},',
  '   {"op":"addVariable","key":"engineers","label":"Engineers available","value":6,"unit":"people"},',
  '   {"op":"addCeiling","key":"max_weeks","label":"Longest duration","expr":"engineers * 2","unit":"weeks"},',
  '   {"op":"note","text":"an observation that is not a change"}',
  ' ]}',
  '',
  'Rules: 3 to 8 proposals, never more. Order them so that anything referenced by a',
  'later proposal is created by an earlier one. Use exact labels when referring to',
  'things that already exist. If the request is unclear, return one "note" proposal',
  'asking the single question that would unblock you — do not guess.'
].join('\n');

function assistSystemPrompt(page){
  return [
    'You help someone build a structured model of an area of their work. You are',
    'careful and you say what you are unsure of. You do not invent specifics about',
    'their organisation — where a detail is needed and unknown, propose the shape and',
    'say in the note that they must fill it in.',
    '',
    PAGE_BRIEF[page] || PAGE_BRIEF.build,
    '',
    EXPORT_CONTRACT,
    '',
    'AVAILABLE NODE KINDS (use the key, not the label):',
    Object.keys(KINDS).map(k => '  ' + k + ' — ' + KINDS[k].label + ': ' + KINDS[k].hint).join('\n'),
    '',
    'AVAILABLE RELATIONSHIPS:',
    Object.keys(RELS).map(k => '  ' + k + ' — ' + RELS[k].hint).join('\n'),
    '',
    PROPOSAL_SCHEMA
  ].join('\n');
}

/* ── the box ─────────────────────────────────────────────────────────────── */
let assistState = { open:false, busy:false, comment:'', proposals:[], error:'', page:'', landed:null };

/* Route -> page key. The nav ids and the route paths were never the same list,
   so this is the one place the mapping lives. */
const ROUTE_PAGE = { '/profile':'profile', '/structure':'build', '/document':'doc', '/doccritique':'anal', '/logic':'logic', '/export':'export',
                     '/proportions':'prop', '/analyzers':'anal', '/perspectives':'export',
                     '/models':'models', '/anonymise':'anon', '/admin':'admin' };
function currentPageKey(){ return ROUTE_PAGE[(location.hash||'#/').slice(1)] || ''; }

function assistBox(page){
  const h = PAGE_HELP[page];
  if(!h && page !== 'build' && page !== 'logic') return '';
  const off = !llmOn();
  return `<div class="abox">
    <div class="abox-h">
      <i class="fas fa-wand-magic-sparkles"></i>
      <span>${esc(h ? h.title.replace('What this page is for','Ask for help with this page') : 'Ask for help with this page')}</span>
      ${off ? '<span class="abox-off">AI assistance is off</span>' : ''}
    </div>
    ${h ? `<p class="abox-intro">${h.body}</p>` : ''}
    ${off
      ? `<p class="abox-intro" style="margin-top:0;">Everything on this page works without it — you can build
          all of this by hand. Switching it on lets you describe what you want in ordinary sentences instead.
          <button class="lnk" data-nav="/admin">Turn it on in Admin <i class="fas fa-arrow-right"></i></button></p>`
      : `<div class="abox-in">
          <textarea id="axIn" rows="2" placeholder="${esc(
            page === 'logic'
              ? 'e.g. the extraction has to finish before anything is checked, and the proportion gate is last'
              : 'e.g. we sell prepaid mobile plans; billing runs nightly and legal owns the pricing rules')}"></textarea>
          <button class="btn ai" id="axGo" style="width:auto;padding:10px 20px;margin:0;">
            <i class="fas fa-wand-magic-sparkles"></i> Ask</button>
        </div>
        <div id="axOut">${assistState.page === page ? assistRender() : ''}</div>`}
  </div>`;
}

function assistRender(){
  const st = assistState;
  if(st.busy) return `<div class="abox-msg"><i class="fas fa-arrows-rotate"></i> Thinking\u2026</div>`;
  if(st.error) return `<div class="note bad" style="margin:12px 0 0;"><b>That did not work.</b> ${esc(st.error)}</div>`;
  if(!st.proposals.length) return '';
  const live = st.proposals.filter(p => !p.done);
  return `
    ${st.landed ? `<div class="abox-landed"><i class="fas fa-circle-check"></i>
      Added ${esc(st.landed[0])}.
      <button class="lnk" data-nav="${esc(st.landed[1])}">See it <i class="fas fa-arrow-right"></i></button>
      </div>` : ''}
    ${st.comment ? `<p class="abox-comment">${esc(st.comment)}</p>` : ''}
    ${live.length ? `<p class="abox-note">${live.length} suggestion${live.length===1?'':'s'}.
      Accept the ones that are right; reject the rest. Nothing is written to your model until you do.
      Anything you accept can be undone with Ctrl+Z.</p>` : ''}
    ${st.proposals.map((p,i) => p.done
      ? `<div class="apr done"><i class="fas fa-${p.done==='ok'?'check':'xmark'}"></i>
           <span>${esc(assistLabel(p))}</span>
           <em>${p.done==='ok'?'added':'rejected'}</em></div>`
      : `<div class="apr">
           <div class="apr-b"><b>${esc(assistOpName(p.op))}</b>
             <span>${esc(assistLabel(p))}</span>
             ${p.note || p.role || p.intent ? `<p>${esc(p.note || p.role || p.intent)}</p>` : ''}
             ${p.text ? `<p>${esc(p.text)}</p>` : ''}</div>
           ${p.op === 'note' ? `<button class="btn sm ghost" data-ax-rej="${i}">Dismiss</button>`
             : `<button class="btn sm brand" data-ax-acc="${i}"><i class="fas fa-check"></i> Accept</button>
                <button class="btn sm ghost" data-ax-rej="${i}">Reject</button>`}
         </div>`).join('')}
    ${live.length > 1 ? `<div class="row" style="margin-top:8px;">
      <button class="btn sm ghost" id="axAll">Accept all ${live.length}</button>
      <button class="btn sm ghost" id="axNone">Reject all</button></div>` : ''}`;
}
/* Where an accepted proposal actually shows up. Not always the page you are on:
   a perspective accepted from the Structure page lands under Perspectives. */
function assistWhere(p){
  return { addPerspective:['a new perspective','/perspectives'],
           addAnalyzer   :['a new check in this model','/structure'],
           addVariable   :['a new variable','/proportions'],
           addCeiling    :['a new ceiling','/proportions'],
           addStep       :['a new step','/logic'],
           addLogicEdge  :['a new dependency','/logic'],
           addLayer      :['a new layer','/structure'],
           addNode       :['a new thing','/structure'],
           addEdge       :['a new relationship','/structure'] }[p.op] || null;
}
function assistOpName(op){
  return { addLayer:'New layer', addNode:'New thing', addEdge:'New relationship',
           addStep:'New step', addLogicEdge:'New dependency', addPerspective:'New perspective',
           addAnalyzer:'New check', addVariable:'New variable', addCeiling:'New ceiling',
           note:'Observation' }[op] || op;
}
function assistLabel(p){
  if(p.op === 'addPerspective') return p.name;
  if(p.op === 'addAnalyzer')   return 'Analyzer \u00b7 ' + (p.label || p.name || '');
  if(p.op === 'addVariable')   return (p.label || p.key) + ' = ' + p.value + ' ' + (p.unit||'');
  if(p.op === 'addCeiling')    return (p.label || p.key) + ' = ' + p.expr;
  if(p.op === 'addLayer')     return p.name;
  if(p.op === 'addNode')      return (KINDS[p.kind] ? KINDS[p.kind].label : p.kind) + ' \u00b7 ' + p.label;
  if(p.op === 'addEdge')      return p.from + ' \u2192 ' + p.rel + ' \u2192 ' + p.to;
  if(p.op === 'addStep')      return p.name + ' \u00b7 ' + (STEP_KINDS[p.kind] ? STEP_KINDS[p.kind].label : p.kind);
  if(p.op === 'addLogicEdge') return p.from + ' \u2192 ' + p.rel + ' \u2192 ' + p.to;
  return p.text || '';
}

/* Applying one proposal. Resolution is by label rather than id because the model
   never saw our ids — and a label it invented one line earlier is resolvable,
   which is why the schema demands ordered proposals. */
function assistApply(p){
  const m = model(); if(!m) throw new Error('No model is open.');
  const L = logicOf(m);
  const findNode  = lbl => (m.nodes||[]).find(n =>
    n.label.toLowerCase() === String(lbl||'').toLowerCase().trim());
  const findStep  = nm  => L.steps.find(x =>
    x.name.toLowerCase() === String(nm||'').toLowerCase().trim());
  const findLayer = ref => (m.layers||[]).find(l =>
    l.id === ref || l.name.toLowerCase() === String(ref||'').toLowerCase().trim());

  if(p.op === 'addLayer'){
    m.layers.push({ id: uid('l'), name: p.name || 'New layer', role: p.role || '' });
  } else if(p.op === 'addNode'){
    const layer = findLayer(p.layer) || m.layers[0];
    if(!layer) throw new Error('There are no layers yet — accept a layer first.');
    if(!KINDS[p.kind]) throw new Error('Unknown kind "' + p.kind + '".');
    const nd = { id: uid('n'), layer: layer.id, kind: p.kind,
                 label: p.label || 'Untitled', props: p.props || {}, note: p.note || '' };
    /* Reading order is meaning in a document and nowhere else, so only chapters
       carry a sequence. Falling back to a multiple of ten leaves room to insert
       something between two of them later without renumbering. */
    if(p.kind === 'chapter')
      nd.seq = typeof p.seq === 'number' ? p.seq
             : ((m.nodes||[]).filter(x => x.kind === 'chapter').length + 1) * 10;
    m.nodes.push(nd);
  } else if(p.op === 'addEdge'){
    const f = findNode(p.from), t = findNode(p.to);
    if(!f) throw new Error('No node called "' + p.from + '" — accept it first.');
    if(!t) throw new Error('No node called "' + p.to + '" — accept it first.');
    if(!RELS[p.rel]) throw new Error('Unknown relationship "' + p.rel + '".');
    m.edges.push({ id: uid('e'), from: f.id, to: t.id, rel: p.rel, note:'' });
  } else if(p.op === 'addStep'){
    L.steps.push({ id: uid('st'), name: p.name || 'Untitled step',
                   kind: STEP_KINDS[p.kind] ? p.kind : 'analyzer',
                   intent: p.intent || '', prompt:'',
                   consumes: p.consumes || [], produces: p.produces || [] });
  } else if(p.op === 'addLogicEdge'){
    const f = findStep(p.from), t = findStep(p.to);
    if(!f) throw new Error('No step called "' + p.from + '".');
    if(!t) throw new Error('No step called "' + p.to + '".');
    L.edges.push({ id: uid('le'), from: f.id, to: t.id,
                   rel: p.rel === 'after' ? 'after' : 'needs' });
  } else if(p.op === 'addPerspective'){
    if(!p.name) throw new Error('A perspective needs a name.');
    state.customPerspectives.push({
      id: uid('pv'), name: p.name, icon: 'fa-glasses',
      purpose: p.purpose || '', entry: p.entry || 'first',
      order: ['top-down','bottom-up','both'].includes(p.order) ? p.order : 'top-down',
      kinds: null, rels: null, focus: Array.isArray(p.focus) ? p.focus : [],
      steps: Array.isArray(p.steps) && p.steps.length ? p.steps : ['State what the reader needs to know first.'],
      contract: Array.isArray(p.contract) ? p.contract : [],
      custom: true
    });
    store.set('perspectives', state.customPerspectives);
  } else if(p.op === 'addAnalyzer'){
    /* An analyzer is a node, so it lands in the model like any other thing and
       can be linked to what it checks with a CHECKS edge. */
    const layer = findLayer(p.layer) || m.layers[m.layers.length-1] || m.layers[0];
    if(!layer) throw new Error('There are no layers yet — accept a layer first.');
    m.nodes.push({ id: uid('n'), layer: layer.id, kind: 'analyzer',
                   label: p.label || p.name || 'Untitled check',
                   props: p.props || {}, note: p.note || p.intent || '' });
  } else if(p.op === 'addVariable'){
    if(!p.key) throw new Error('A variable needs a key.');
    state.proportions.variables = state.proportions.variables || [];
    state.proportions.variables.push({
      key: String(p.key).replace(/[^A-Za-z0-9_]/g,'_'),
      label: p.label || p.key, value: Number(p.value) || 0,
      unit: p.unit || '', note: p.note || '' });
    store.set('proportions', state.proportions);
  } else if(p.op === 'addCeiling'){
    if(!p.key || !p.expr) throw new Error('A ceiling needs a key and an expression.');
    state.proportions.ceilings = state.proportions.ceilings || [];
    state.proportions.ceilings.push({
      key: String(p.key).replace(/[^A-Za-z0-9_]/g,'_'),
      label: p.label || p.key, expr: p.expr,
      unit: p.unit || '', note: p.note || '' });
    store.set('proportions', state.proportions);
  } else if(p.op === 'note'){
    return; /* nothing to apply */
  } else throw new Error('Unknown proposal type.');
}

async function assistAsk(page){
  const m = model();
  assistState = { open:true, busy:true, comment:'', proposals:[], error:'', page };
  const box = document.getElementById('axOut'); if(box) box.innerHTML = assistRender();
  const wanted = (document.getElementById('axIn')||{}).value || '';
  try {
    const raw = await llmAsk(assistSystemPrompt(page),
      [ 'WHAT THEY ASKED FOR:', wanted, '',
        'CURRENT STATE OF THEIR MODEL:', modelDigest(m) ].join('\n'));
    /* Models wrap JSON in a fence however firmly you ask them not to. */
    const cleaned = String(raw).replace(/^[\s\S]*?```(?:json)?/, '').replace(/```[\s\S]*$/, '').trim()
                    || String(raw).trim();
    let parsed;
    try { parsed = JSON.parse(cleaned); }
    catch(e){ parsed = JSON.parse(String(raw).slice(String(raw).indexOf('{'),
                                              String(raw).lastIndexOf('}') + 1)); }
    assistState.busy = false;
    assistState.comment = parsed.comment || '';
    assistState.proposals = Array.isArray(parsed.proposals) ? parsed.proposals : [];
    if(!assistState.proposals.length) assistState.error = 'It replied, but proposed nothing actionable.';
  } catch(e){
    assistState.busy = false;
    assistState.error = e.message;
  }
  render();
}

function wireAssist(root, page){
  const go = document.getElementById('axGo');
  if(go) go.onclick = () => assistAsk(page);
  const inp = document.getElementById('axIn');
  if(inp) inp.onkeydown = e => {
    if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)) assistAsk(page);
  };
  const accept = i => {
    const p = assistState.proposals[i]; if(!p || p.done) return;
    try {
      markChange('accept suggestion'); assistApply(p); p.done = 'ok'; saveModels();
      /* "Accept" used to apply silently, and if the thing it created lived on a
         different page than the one you were on, nothing visibly happened. */
      assistState.landed = assistWhere(p);
    }
    catch(err){ p.error = err.message; assistState.error = err.message; }
    render();
  };
  on('[data-ax-acc]','click', e => accept(+e.currentTarget.dataset.axAcc), root);
  on('[data-ax-rej]','click', e => {
    const p = assistState.proposals[+e.currentTarget.dataset.axRej];
    if(p) p.done = 'no';
    render();
  }, root);
  const all = document.getElementById('axAll');
  if(all) all.onclick = () => {
    markChange('accept all suggestions');
    assistState.proposals.forEach(p => {
      if(p.done) return;
      try { assistApply(p); p.done = 'ok'; } catch(err){ p.done = 'no'; p.error = err.message; }
    });
    saveModels(); render();
  };
  const none = document.getElementById('axNone');
  if(none) none.onclick = () => {
    assistState.proposals.forEach(p => { if(!p.done) p.done = 'no'; });
    render();
  };
}

function helpPanel(active){

    <button class="ph-toggle" data-helptoggle="${esc(active)}">

function wireHelp(root){

function page(active, inner, wide){
  /* The assistant box sits where the help panel used to, and carries the same
     plain-English description as its intro — so it still explains the page even
     when AI assistance is switched off. */
  const top = ['build','logic','doc','export','prop','anal','persp'].includes(active)
    ? assistBox(active) : helpPanel(active);
  return `${topbar(active)}<div class="page${wide?' wide':''}">${top}${inner}</div>${footer()}`;
}

function openModal(id){ $(id).classList.add('open'); }
function closeModals(){ document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open')); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModals(); });
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if(e.target === o) closeModals(); }));

/* Populated once at boot from /api/info and /api/samples. Both are decorative —
   every screen must render correctly when they are still empty. */
const WS = { dir:'', version:'', writable:true,
  /* What the server says about AI assistance. `locked` means the operator pinned
     the endpoint with KE_LLM_BASE_URL, in which case this page may not change it
     — see the comment on llmBase(). */
  llm: { keyPresent:false, baseUrl:'', model:'', locked:false } };
const SAMPLE_STATS = {};

/* ── version history ─────────────────────────────────────────────────────────
   The server keeps a timestamped copy of every value it has written. This is
   the reader for it. Restoring writes the old value back through the normal
   save path, which means the restore is itself versioned — so restoring the
   wrong thing is also undoable. */
async function openHistory(key){
  showBig('History — ' + key, '<div class="note">Reading…</div>');
  let vs = [];
  try { vs = (await api.history(key)) || []; }
  catch(e){ $('bigBody').innerHTML = `<div class="note bad">${esc(e.message)}</div>`; return; }

  if(!vs.length){
    $('bigBody').innerHTML = `<div class="note">No earlier versions of <code>${esc(key)}</code> yet.
      A copy is written on every save, so this fills up as you work.</div>`;
    return;
  }
  $('bigBody').innerHTML = `
    <div class="note">Every save writes a copy into <code>.history/</code>. Restoring replaces the current
      value and is itself recorded here, so this operation is also reversible.</div>
    <table class="t"><thead><tr><th>Written</th><th style="width:100px;">Size</th>
      <th style="width:190px;"></th></tr></thead><tbody>
      ${vs.map(v => `<tr><td class="mono">${esc(v.stamp)}</td>
        <td>${(v.bytes/1024).toFixed(2)} kB</td>
        <td><button class="btn sm ghost" data-view="${esc(v.stamp)}">View</button>
            <button class="btn sm ghost" data-restore="${esc(v.stamp)}">Restore</button></td></tr>`).join('')}
    </tbody></table>
    <div id="hMsg" style="font-size:11px;color:var(--muted);margin-top:10px;"></div>`;

  on('[data-view]','click', async e => {
    try{
      const v = await api.historyAt(key, e.currentTarget.dataset.view);
      showText(key + ' @ ' + e.currentTarget.dataset.view, JSON.stringify(v, null, 2),
               key + '-' + e.currentTarget.dataset.view + '.json', 'application/json');
    }catch(err){ $('hMsg').textContent = err.message; }
  }, $('bigBody'));

  on('[data-restore]','click', async e => {
    const stamp = e.currentTarget.dataset.restore;
    try{
      const v = await api.historyAt(key, stamp);
      store.set(key, v);
      await store.flush();
      rebuildState();
      closeModals(); render();
    }catch(err){ $('hMsg').textContent = err.message; }
  }, $('bigBody'));
}

function showBig(title, html){ $('bigTitle').textContent = title; $('bigBody').innerHTML = html; openModal('ovBig'); }

/* ═══════════════════════════════════════════════════════════════════════════
   VIEW — landing
   The hero is the thing itself: one question, answered in three layers. That
   is the whole product argument, so it is the first thing on the page rather
   than a paragraph about it.
   ═══════════════════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════════════
   AI ASSISTANCE — an addon, off by default

   Everything in this build works with no model behind it. The graphs, the
   validation, the ordering, the exports are all arithmetic over what you typed.
   That is deliberate and it stays true: nothing below is on a critical path.

   When switched on, this adds a "suggest" affordance in a few places where a
   blank page is the hard part. It never edits the model on its own — it
   proposes, you accept.

   The key never touches the browser. The page calls its own server, which
   forwards to whatever OpenAI-compatible endpoint you configured (LiteLLM,
   Ollama, vLLM, a hosted API). The address is stored with your workspace; the
   key is an environment variable on the server and is never sent to the page,
   never written to a model file and never included in an export.

   Turning this on changes the honesty of the "nothing reaches a network"
   claim, and the app says so on the page where you turn it on. */
const LLM_DEFAULT = { enabled:false, baseUrl:'', model:'', temperature:0.2 };

/* Where the endpoint actually comes from.

   If the operator set KE_LLM_BASE_URL, that wins and this page cannot override
   it. That is not tidiness, it is the fix for a real hole: this server attaches
   KE_LLM_KEY to whatever address the browser names, so a browser-chosen address
   is a way to post somebody's API key to an attacker's host — and there is no
   authentication in front of any of this. Pinning the endpoint server-side means
   the key can only ever travel to the one place the operator chose.

   With no key set there is nothing to steal, so the typed address still works —
   which is the normal case for Ollama on your own machine. */
function llmBase(){
  if(WS.llm && WS.llm.locked && WS.llm.baseUrl) return WS.llm.baseUrl;
  return (state.llm && state.llm.baseUrl) || '';
}
function llmModel(){ return (state.llm && state.llm.model) || (WS.llm && WS.llm.model) || ''; }
/* One answer to "is AI available", so no surface can disagree with another about
   it. This used to also check `can('ai')` against the plan table; there is no
   plan table now, and there was never a plan in it that set ai:false on a build
   anybody ran. What is left is the only question that was ever real: has
   somebody configured an endpoint and a model, and switched it on.

   Off means the suggest buttons are absent, exactly as they are when no endpoint
   is configured. Nothing is hidden that turning it on would not reveal. */
function llmOn(){ return !!(state.llm && state.llm.enabled && llmBase() && llmModel()); }

async function llmAsk(system, user){
  if(!llmOn()) throw new Error('AI assistance is off. Turn it on on the Profile page.');
  const r = await api.call('POST', '/api/llm/chat', {
    baseUrl: llmBase(), model: llmModel(),
    temperature: state.llm.temperature,
    messages: [{ role:'system', content:system }, { role:'user', content:user }]
  });
  return (r && r.content) || '';
}

/* ── the AI panel ────────────────────────────────────────────────────────────
   One panel, on the Profile page, because this is a preference belonging to the
   person using the workspace rather than a separate administrative surface.

   Model discovery: anything OpenAI-compatible answers GET /models with the list
   it will accept. LiteLLM answers it with every model_name in its own config, so
   after a provider is added there — a new key, a different vendor, a local
   model — the list here changes with no edit to this build. The names go into a
   datalist rather than a select so an endpoint that refuses to list its models
   does not stop you typing one.
   ──────────────────────────────────────────────────────────────────────────── */

function wireLlmPanel(root){
  const lo = $('llmOn');
  if(!lo) return;
  const readUrl = () => $('llmUrl') ? $('llmUrl').value.trim().replace(/\/+$/,'') : (state.llm.baseUrl||'');
  const readTemp = () => {
    const v = parseFloat($('llmTemp').value);
    return isNaN(v) ? 0.2 : Math.min(2, Math.max(0, v));
  };

  $('llmSave').onclick = () => {
    state.llm = { enabled: lo.checked, baseUrl: readUrl(),
                  model: $('llmModel').value.trim(), temperature: readTemp() };
    store.set('llm', state.llm);
    $('llmMsg').textContent = llmOn() ? 'Saved. Suggest buttons are now available.'
                                      : 'Saved. AI assistance is off.';
    render();
  };

  $('llmList').onclick = async () => {
    $('llmListMsg').textContent = 'Asking the endpoint\u2026';
    try{
      const r = await api.llmModels(readUrl());
      LLM_MODELS.list = (r && r.models) || [];
      LLM_MODELS.err = LLM_MODELS.list.length ? '' : 'The endpoint answered, but offered no models.';
      LLM_MODELS.at = Date.now();
    }catch(e){
      LLM_MODELS.list = [];
      LLM_MODELS.err = e.message;
    }
    render();
  };

  $('llmTest').onclick = async () => {
    $('llmMsg').textContent = 'Testing\u2026';
    const saved = state.llm;
    /* Test what is on screen, not what was last saved — otherwise the button
       cannot tell you whether the change you just typed works. */
    state.llm = { enabled:true, baseUrl:readUrl(), model:$('llmModel').value.trim(), temperature:0 };
    const t0 = Date.now();
    try{
      const out = await llmAsk('Reply with exactly: ok', 'ok');
      $('llmMsg').textContent = (Date.now()-t0) + ' ms \u00b7 answered: ' + String(out).slice(0,60);
    }catch(e){ $('llmMsg').textContent = e.message; }
    state.llm = saved;
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   VIEW — LANDING

   A front door, not a brochure. Three things and nothing else: the mark, how to
   use the thing, and a way in.

   What used to be here — sample statistics, "what you can model", a feature
   grid, the four-laws teaser, paragraphs about a companion product — was copy
   written to sell something. Nobody who read it knew what to do first, which is
   the only job a landing page has.
   ═══════════════════════════════════════════════════════════════════════════ */
/* THE LANDING PAGE

   White, and almost empty, and matches the studio's own front door (see
   landing.html) rather than the working chrome the rest of this build uses. No
   headline, no explanation, no how-to. It is the only screen in the build that
   is not a working surface, so it is the only one allowed to be a piece of
   design rather than an instrument.

   The reasoning: everyone who reaches this page either knows what the tool is
   or is about to be shown by using it. A page of copy explaining a workstation
   to someone who is one click from opening it is a page nobody reads. So the
   wordmark sits centred over a generative drawing — a pole, a second pole
   crossing it, and two flags made only of nodes and the links between them —
   and the only thing to do here is sign in. */
/* ── the pole, the baseline, and two flags ───────────────────────────────
   Ported from the studio's own landing mock (landing.html) so the no-login
   front door matches it exactly: one smooth cubic pole from the top left,
   a second lighter pole crossing it, and two flags made only of nodes and
   the links between them — no border, no image, no library.

   initLandingArt(canvas) starts the loop and returns a stop() function.
   This route is one screen inside a single-page app rather than its own
   document, so the loop must not keep ticking once the user navigates
   away — teardownLanding() below is called from render() on every route
   change, the same way teardownGraph()/teardownLogicGraph() already are. */
function initLandingArt(cv){
  const ctx = cv && cv.getContext ? cv.getContext('2d') : null;
  if(!ctx) return function(){};

  const INK = '#0A0A0A', DOT = '#D2D4D5';
  let RED = '#D40000';
  try{ RED = getComputedStyle(document.documentElement).getPropertyValue('--brand').trim() || RED; }catch(e){}

  /* Identical to landing.html except HEADER, which is real chrome: 58px of top
     bar here, 46 there. Every other number in this function is the same one, and
     if you change one file you are changing both or they drift again. */
  const STEP = 13, COARSE = 2, NODE_R = 5.2, AMP = 11, WAVES = 1.15, SPEED = 1.05, FPS = 30,
        TIP = 0.06, HEADER = 58, GAP = 12, BOLD = 19;

  /* One pole, the lighter of the two. Both were off, and the reason given was
     that they were the heaviest ink on a page that exists to get somebody to one
     button — which was true of the bold one at alpha 1 and full width, and is not
     true of this one at alpha 0.5 and 0.72 width. The bold curve is still
     computed and still not drawn; putting it back is one entry in the array at
     the end of build(). */
  const DRAW_POLES = true;

  let reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}

  let W = 0, H = 0, dpr = 1, poleSamples = [], pole2Samples = [], bands = [], lattice = [], flags = [],
      stroke = null, raf = 0, last = 0, t0 = 0;

  function cubic(p0,p1,p2,p3,n){
    const pts = [];
    for(let i=0;i<=n;i++){
      const t=i/n, a=(1-t)*(1-t)*(1-t), b=3*(1-t)*(1-t)*t, c=3*(1-t)*t*t, d=t*t*t;
      pts.push([a*p0[0]+b*p1[0]+c*p2[0]+d*p3[0], a*p0[1]+b*p1[1]+c*p2[1]+d*p3[1]]);
    }
    return pts;
  }
  function xOn(s,y){
    if(!s.length) return 0;
    if(y<=s[0][1]) return s[0][0];
    for(let i=1;i<s.length;i++){
      if(s[i][1]>=y){
        const a=s[i-1], b=s[i], f=(y-a[1])/Math.max(0.001,b[1]-a[1]);
        return a[0]+f*(b[0]-a[0]);
      }
    }
    return s[s.length-1][0];
  }
  /* Samples the drawn pole across the whole band, not at its two edges: the
     curve bulges, and at GAP 12 a bulge between two end samples would put nodes
     on the stroke. */
  function clearOf(y0,y1){
    const lo = Math.min(y0,y1), hi = Math.max(y0,y1);
    let max = -Infinity;
    for(let i=0;i<pole2Samples.length;i++){
      if(pole2Samples[i][1] >= lo && pole2Samples[i][1] <= hi)
        max = Math.max(max, pole2Samples[i][0]);
    }
    if(max === -Infinity) max = Math.max(xOn(pole2Samples,lo), xOn(pole2Samples,hi));
    return max + GAP;
  }
  /* A pennant: full band height at the hoist, closing to TIP at the fly. The
     swallowtail this replaces cut the MIDDLE of the fly back instead, which made
     the flag widest at its top and bottom edges. Same function as landing.html. */
  function taper(u){ return 1 - (1-TIP)*Math.max(0, Math.min(1, u)); }
  function wave(u,t){
    const ph = 6.2832*WAVES*u - SPEED*t;
    return [-0.34*AMP*u*Math.cos(ph), AMP*Math.pow(u,1.5)*Math.sin(ph)];
  }

  function build(){
    W = Math.max(320, window.innerWidth || 1280);
    H = Math.max(560, window.innerHeight || 800);
    const topY = HEADER + 0.02*H;
    poleSamples = cubic([0.095*W,topY], [0.010*W,0.55*H], [0.045*W,1.06*H], [1.03*W,0.90*H], 130);
    pole2Samples = cubic([0.030*W,HEADER], [0.250*W,0.10*H], [0.012*W,0.50*H], [0.060*W,1.01*H], 110);

    /* The flags are hoisted on the pole again, so the hoist is a reading off the
       curve rather than a fraction of the width. On a wide screen that puts them
       hard left and they open rightwards into the left half, clear of the
       lock-up's 46% column which begins at 0.54W — the longer band reaches about
       0.13W + 0.42W and tapers, so only its mid-line nodes get near that.
       Lengthen either band and the headline gets printed over a field of dots.

       Below 900px there is no left half to sit in: they drop under the text and
       fade back. The narrow figures are unchanged, and the narrow hoist is still
       a width fraction, because down there the pole is behind the type and
       hanging the flags on it would put the mesh through the words. */
    const narrow = W < 900;
    bands = [
      { y: Math.round((narrow ? 0.50 : 0.15)*H), h: Math.round((narrow ? 0.18 : 0.20)*H),
        len: Math.round((narrow ? 0.62 : 0.42)*W), alpha: narrow ? 0.5  : 1 },
      { y: Math.round((narrow ? 0.74 : 0.49)*H), h: Math.round((narrow ? 0.15 : 0.17)*H),
        len: Math.round((narrow ? 0.44 : 0.30)*W), alpha: narrow ? 0.25 : 0.45 }
    ];
    bands.forEach((b,i) => {
      b.x0 = narrow ? Math.round((0.24 + i*0.045)*W) : clearOf(b.y, b.y + b.h);
    });

    /* Symmetric about the band's mid-line so the taper closes from both edges at
       once. Testing b.y and b.y + b.h first, as the rectangle did, admits every
       point in the band's full height and then only clips the length. */
    function inBand(x,y,b){
      if(x < b.x0 || x > b.x0 + b.len) return false;
      const half = 0.5*b.h*taper((x - b.x0)/b.len);
      return Math.abs(y - (b.y + 0.5*b.h)) <= half;
    }

    lattice = [];
    flags = bands.map(b => ({ nodes:{}, links:[], alpha:b.alpha }));

    const cols = Math.ceil(W/STEP), rows = Math.ceil(H/STEP);
    for(let c=0;c<=cols;c++){
      for(let r=0;r<=rows;r++){
        const x=c*STEP+5, y=r*STEP+7;
        if(x>W || y>H) continue;
        let claimed = false;
        for(let b=0;b<bands.length;b++){
          if(inBand(x,y,bands[b])){
            claimed = true;
            if(c%COARSE===0 && r%COARSE===0){
              flags[b].nodes[c+','+r] = { x:x, y:y, u:(x-bands[b].x0)/bands[b].len };
            }
            break;
          }
        }
        if(!claimed) lattice.push({ x:x, y:y, ph:c*0.7+r*1.3 });
      }
    }
    flags.forEach(f => {
      Object.keys(f.nodes).forEach(k => {
        const p = k.split(','), c=+p[0], r=+p[1];
        [[c+COARSE,r],[c,r+COARSE]].forEach(nb => {
          const key = nb[0]+','+nb[1];
          if(f.nodes[key]) f.links.push([k,key]);
        });
      });
    });

    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    stroke = DRAW_POLES ? drawStroke([{ pts:pole2Samples, w:BOLD*0.72, a:0.5 }]) : null;
  }

  function drawStroke(poles){
    const off = document.createElement('canvas');
    if(!off || !off.getContext) return null;
    off.width = cv.width; off.height = cv.height;
    const o = off.getContext('2d');
    if(!o) return null;
    o.setTransform(dpr,0,0,dpr,0,0);
    o.strokeStyle = INK; o.lineCap = 'round'; o.lineJoin = 'round';
    poles.forEach(pole => {
      [[0,1,1],[2.6,0.40,0.42],[-2.1,0.26,0.3]].forEach(p => {
        o.globalAlpha = p[2]*pole.a;
        o.lineWidth = Math.max(1.2, pole.w*p[1]);
        o.beginPath();
        o.moveTo(pole.pts[0][0]+p[0], pole.pts[0][1]);
        for(let i=1;i<pole.pts.length;i++) o.lineTo(pole.pts[i][0]+p[0], pole.pts[i][1]);
        o.stroke();
      });
    });
    return off;
  }

  function rgba(hex,a){
    let h = String(hex).replace('#','');
    if(h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    const v = parseInt(h,16);
    return 'rgba('+((v>>16)&255)+','+((v>>8)&255)+','+(v&255)+','+a+')';
  }

  function draw(t){
    ctx.clearRect(0,0,W,H);
    if(stroke) ctx.drawImage(stroke,0,0,W,H);

    const fx = W*(0.5+0.34*Math.sin(t*0.19)), fy = H*(0.5+0.28*Math.sin(t*0.26+1.1));
    const R = Math.max(90, Math.min(W,H)*0.30), R2 = R*R;

    for(let i=0;i<lattice.length;i++){
      const n = lattice[i], dy = 0.7*Math.sin(t*0.6+n.ph);
      const ddx = n.x-fx, ddy = n.y-fy, near = Math.max(0, 1-(ddx*ddx+ddy*ddy)/R2);
      ctx.fillStyle = near>0.02 ? rgba(INK, 0.07+0.22*near*near) : rgba(DOT, 0.5);
      ctx.beginPath();
      ctx.arc(n.x, n.y+dy, 1.1+0.9*near*near, 0, 6.2832);
      ctx.fill();
    }

    for(let f=0;f<flags.length;f++){
      const fl = flags[f], pos = {};
      for(const k in fl.nodes){ const p = fl.nodes[k], d = wave(p.u,t); pos[k] = [p.x+d[0], p.y+d[1]]; }
      ctx.strokeStyle = rgba(RED, 0.30*fl.alpha);
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for(let L=0;L<fl.links.length;L++){
        const a = pos[fl.links[L][0]], b2 = pos[fl.links[L][1]];
        ctx.moveTo(a[0],a[1]); ctx.lineTo(b2[0],b2[1]);
      }
      ctx.stroke();
      /* No border. The flags are nodes, and only nodes: the shape is where
         the nodes stop. */
      ctx.fillStyle = rgba(RED, fl.alpha);
      for(const k in pos){ ctx.beginPath(); ctx.arc(pos[k][0], pos[k][1], NODE_R, 0, 6.2832); ctx.fill(); }
    }
  }

  function frame(now){
    raf = requestAnimationFrame(frame);
    if(now-last < 1000/FPS) return;
    last = now;
    draw((now-t0)/1000);
  }
  function start(){
    if(raf){ cancelAnimationFrame(raf); raf = 0; }
    if(reduce){ draw(0.6); return; }   /* one deflected frame, no motion */
    raf = requestAnimationFrame(now => { t0 = now; last = 0; frame(now); });
  }

  let resizeTimer = 0;
  const onResize = () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { build(); start(); }, 150); };
  /* A front page must not spin a fan in a background tab. */
  const onVis = () => { if(document.hidden){ if(raf){ cancelAnimationFrame(raf); raf = 0; } } else start(); };
  window.addEventListener('resize', onResize);
  document.addEventListener('visibilitychange', onVis);

  build();
  start();

  return function stop(){
    if(raf) cancelAnimationFrame(raf);
    clearTimeout(resizeTimer);
    window.removeEventListener('resize', onResize);
    document.removeEventListener('visibilitychange', onVis);
  };
}

   steps and only one of them happens in this app, which is why it needed saying
   out loud: the Models page offered "Empty model" and "Import a bundle" and left
   the reader to work out that the interesting route runs through a chat window
   in another tab.

   Nothing here calls a model. There is no request, no key and no answer rendered
   — it is a prompt written on a page with a copy button, and the round trip
   happens wherever the reader already works. That keeps this page working with
   AI assistance off, which is the default.

   The envelope, the node kinds and the relationships are interpolated from
   SCHEMA, KINDS and RELS rather than typed out. Those three are exactly what the
   import handler refuses a file over, so a prompt built from them cannot ask a
   model for something this build would then reject. The prose rules are written
   here because there is nothing in the build to derive judgement from.

   `prompts/generate-model.md` in the repository is the longer canonical version.
   It is deliberately not read at runtime: the server embeds `all:web` and
   `samples/*.json` and nothing else, so a container user has no route to that
   file. Serving it would be a one-line `//go:embed prompts/*.md` plus a handler,
   and at that point this function should fetch it instead of carrying its own
   copy. Until then this is the short version, and it says so. */
function pathPrompt(){
  const kinds = Object.keys(KINDS);
  const rels  = Object.keys(RELS);
  const wrap = (arr, per) => {
    const out = [];
    for(let i = 0; i < arr.length; i += per) out.push('  ' + arr.slice(i, i + per).join('  '));
    return out;
  };
  return [
    'You turn source material into a Pennant knowledge model: one JSON file that',
    'describes a domain as layers of typed nodes joined by typed edges.',
    '',
    'Return ONLY the JSON. No prose before or after it, no markdown fence, no',
    'commentary. If you cannot produce valid JSON, return nothing.',
    '',
    '== ENVELOPE ==',
    '',
    'The importer checks these two fields and that model.layers is an array before',
    'it looks at anything else. Get them wrong and the file is refused outright.',
    '',
    '{',
    '  "kind": "' + SCHEMA.kind + '",',
    '  "schemaVersion": "' + SCHEMA.version + '",',
    '  "model": { ... the model, as below ... }',
    '}',
    '',
    'Note: the OUTER schemaVersion is the string "' + SCHEMA.version + '" and is the pack format.',
    'INSIDE "model" there is a second field also called schemaVersion, and it is the',
    'number 2. They are different fields and neither substitutes for the other.',
    '',
    '== MODEL ==',
    '',
    '  "schemaVersion": 2,',
    '  "id":         "m_<short_slug>",',
    '  "name":       "<short human name>",',
    '  "domain":     "<the subject in three or four words>",',
    '  "question":   "<the one question this model exists to answer>",',
    '  "summary":    "<3-5 sentences: what is modelled, and what it deliberately leaves out>",',
    '  "anonymised": false,',
    '  "layers":     [ { "id": "l1", "name": "<name>", "role": "<what belongs here, and what does not>" } ],',
    '  "nodes":      [ { "id": "<slug>", "layer": "l1", "kind": "<kind>", "label": "<short label>",',
    '                    "props": {}, "note": "<a sentence or two, or empty>" } ],',
    '  "edges":      [ { "id": "e_0001", "from": "<node id>", "to": "<node id>", "rel": "<REL>", "note": "" } ]',
    '',
    '== LAYERS ==',
    '',
    'Three to five. A layer is a level of description, not a folder: the same fact',
    'must not appear in two of them. In "role", say what does NOT belong in that',
    'layer — that sentence is what stops the model sprawling.',
    '',
    'For a document: what it must contain / what it commits to / what would settle',
    'it. For a system: what customers meet / what the business owns / what runs.',
    '',
    '== NODE KINDS — use only these ==',
    ''
  ].concat(wrap(kinds, 6)).concat([
    '',
    '== RELATIONSHIPS — use only these ==',
    ''
  ]).concat(wrap(rels, 4)).concat([
    '',
    '== RULES ==',
    '',
    '1. Every node.layer must be the id of a declared layer.',
    '2. Every edge.from and edge.to must be the id of a node you actually emitted.',
    '3. Prefer edges that cross layers. Those are the point of the model; edges',
    '   inside one layer are usually restating a list.',
    '4. Do not invent. If the source does not say who owns something, or when it is',
    '   due, leave the field out rather than filling it. A missing owner is a',
    '   finding; a guessed owner is a lie the reader cannot see.',
    '5. Anything you inferred rather than read, say so in that node\'s "note",',
    '   starting with the word INFERRED.',
    '6. A claim with no evidence behind it is not a mistake — emit it anyway and',
    '   leave it unevidenced. That gap is usually the reason the model is worth',
    '   building.',
    '',
    '== THEN ==',
    '',
    'Below this line is the material. Read it and return the JSON.',
    '',
    '---'
  ]).join('\n');
}

function openPath(){
  const prompt = pathPrompt();
  showBig('The path — from a document to a model', `
    <p class="lede">Four steps, and only step three happens in here. Nothing on this page calls a language
      model: the prompt is text, you take it to whichever assistant you already use, and you bring the answer
      back as a file.</p>

    <div class="howto">
      <div class="howto-row"><div class="howto-n">1</div><div class="howto-b">
        <b>Copy the prompt.</b>
        <p>It is written below, and the button copies it. It tells the model exactly which envelope, which
          node kinds and which relationships this build accepts — all three lists are generated from this
          build, so they cannot drift out of step with what the importer allows.</p></div></div>
      <div class="howto-row"><div class="howto-n">2</div><div class="howto-b">
        <b>Paste it into an assistant, then your material after it.</b>
        <p>A document, a specification, a set of notes, a wiki page. Any model capable of holding a long
          document and returning strict JSON will do. Ask for the JSON only — the prompt already says so, and
          most of the failures at this step are a model wrapping it in a code fence or adding a friendly
          sentence first. Strip those.</p></div></div>
      <div class="howto-row"><div class="howto-n">3</div><div class="howto-b">
        <b>Save it as a <code>.json</code> and import it.</b>
        <p><b>Knowledge models → Import a bundle → Open .json.</b> Not <i>Import a knowledge pack</i> — that
          one reads the <code>.md</code> this build writes. The importer refuses rather than repairs: wrong
          <code>kind</code>, wrong <code>schemaVersion</code>, no layers, a node kind or a relationship this
          build does not know, and it tells you which. A refusal here is the prompt or the model's obedience,
          not your material.</p></div></div>
      <div class="howto-row"><div class="howto-n">4</div><div class="howto-b">
        <b>Then edit it, because the first draft is a draft.</b>
        <p>This is the part that matters and the part the assistant cannot do for you. Open <b>Structure</b>
          and check the layers are levels rather than folders. Look for the edges that cross a layer — if
          there are almost none, the model is a list and needs work. Read every note starting
          <code>INFERRED</code> and either confirm it or delete it. Then <b>Analyzers</b>, <b>Logic</b> and
          <b>Proportions</b> as the domain needs them, and <b>Export</b> when it is worth handing on.</p></div></div>
    </div>

    <div class="note"><b>The model that writes this is not the model that checks it.</b> That is the whole
      arrangement: something fluent does the reading, and this holds the structure and runs the checks
      against it. Which is why step four is not optional — an imported draft is a claim about your material,
      and nothing has verified it yet.</div>

    <div class="section-rule">The prompt</div>
    <div class="row" style="margin-bottom:10px;">
      <button class="btn brand" id="pathCopy"><i class="fas fa-copy"></i> Copy the prompt</button>
      <button class="btn ghost" id="pathDl"><i class="fas fa-download"></i> Download .md</button>
      <span id="pathMsg" style="font-size:10px;color:var(--muted);"></span>
    </div>
    <pre class="box" style="max-height:340px;">${esc(prompt)}</pre>
    <p class="fineprint">This is the short version. <code>prompts/generate-model.md</code> in the repository is
      the longer canonical one — it covers the logic pipeline and the review domains as well — and it is worth
      reading even if you use this. It is not shown here because the server does not serve it: only
      <code>web/</code> and <code>samples/*.json</code> are embedded in the binary.</p>`);
  const c = $('pathCopy');
  if(c) c.onclick = async () => {
    try{ await navigator.clipboard.writeText(prompt); $('pathMsg').textContent = 'Copied.'; }
    catch(e){ $('pathMsg').textContent = 'Clipboard is blocked here. Select the text below instead.'; }
  };
  const d = $('pathDl');
  if(d) d.onclick = () => {
    if(!download('pennant-model-prompt.md', prompt, 'text/markdown;charset=utf-8'))
      $('pathMsg').textContent = 'Download is blocked here. Copy instead.';
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   TEMPLATES

   This function did not exist. `$('mTpl').onclick = () => openTemplates()` has
   been wired to it on the Models page all along, so pressing "Browse templates"
   threw ReferenceError and did nothing visible — the one button on the page
   that is supposed to be the easiest way in.

   The card above it also described six templates: a document reviewer, a
   business analysis path, onboarding, an HR companion, a system landscape, and
   three blank layers. None of the six exists anywhere in the tree. What ships
   is one template in `templates/` and the embedded sample models, so that is
   what this offers. Writing the other five to match the copy would have been
   the exact failure this tool exists to catch: fluent, confident and not
   checkable against anything.

   The import path is deliberately not reimplemented here. It closes this
   dialogue and clicks the file input on the Models page, so a template goes
   through the same six refusals — size, JSON, object, kind, schema version,
   vocabulary — that any other pack does.
   ═══════════════════════════════════════════════════════════════════════════ */
async function openTemplates(){
  const intro = `
    <p class="lede">A template is an ordinary model file. Nothing here distinguishes one from a model you
      made yesterday, which is the point: if it opens, it is a template — and sharing one is sharing a
      <code>.json</code>.</p>
    <p class="lede">What arrives is <b>structure</b>: named layers, the role each plays, and what belongs in
      them. What does not arrive is your content, because nobody else can write that for you.</p>
    <pre class="box">{ "kind": "${esc(SCHEMA.kind)}", "schemaVersion": "${esc(SCHEMA.version)}", "model": { ... } }</pre>
    <p class="fineprint">Two fields called <code>schemaVersion</code> are in play and they are not the same
      field. The outer one is the pack format, checked on the way in. The one inside <code>model</code> is the
      graph schema.</p>`;

  showBig('Templates', intro + `<div class="note">Reading what this build ships\u2026</div>`);

  let list = null, err = null;
  try{ list = await api.samples(); }catch(e){ err = e; }
  /* The dialogue may have been closed while that was in flight. Writing into a
     hidden node is harmless; writing into a node that is no longer there is not. */
  if(!$('bigBody')) return;

  const rows = (list || []).map(s => `
    <tr><td><b>${esc(s.name || s.file)}</b><br><span class="fineprint mono">${esc(s.file)}</span></td>
      <td class="mono">${s.layers}</td><td class="mono">${s.nodes}</td><td class="mono">${s.edges}</td>
      <td class="mono">${s.crossLayer}</td></tr>`).join('');

  $('bigBody').innerHTML = intro + `
    <div class="section-rule">Ships with this build</div>
    ${err
      ? `<div class="note warn"><b>Could not read the sample index.</b> ${esc(err.message)}<br>
          The two buttons below still work; only this list needed the server.</div>`
      : rows
        ? `<p class="lede">These are finished models with invented content \u2014 there to be read rather than
             built on. Loading them is additive and never overwrites a model you have edited.</p>
           <table class="t"><thead><tr><th>Model</th><th>Layers</th><th>Nodes</th><th>Links</th>
             <th>Crossing</th></tr></thead><tbody>${rows}</tbody></table>`
        : `<div class="note warn"><b>No samples are embedded in this build.</b></div>`}
    <div class="row" style="margin-top:14px;">
      <button class="btn brand sm" id="tplSamples"><i class="fas fa-flask"></i> Load the worked examples</button>
      <button class="btn ghost sm" id="tplImport"><i class="fas fa-file-import"></i> Import a template pack (.json)</button>
    </div>
    <div id="tplMsg" style="font-size:11px;color:var(--muted);margin-top:9px;"></div>

    <div class="section-rule">Community templates</div>
    <p class="lede">One worked template ships in <code>templates/</code>:
      <code>change-proposal-review.json</code> \u2014 a change proposal as a graph, with five sections, four
      claims, three obligations, four pieces of evidence and four analyzers wired with <code>CHECKS</code>. It
      carries one deliberately unevidenced claim, the load-bearing one, because that is the finding it exists
      to teach.</p>
    <p class="lede">Contributing one has four requirements, and they are listed in
      <code>templates/README.md</code>: it must be anonymised using the Anonymise page, it must pass
      <code>tools/model-v2.py --check</code> and <code>tools/test_import.js</code>, it must carry a summary a
      stranger can act on, and it must add a line to the table in that file.</p>

    <div class="section-rule">Or generate one from your own material</div>
    <p class="lede">Point a capable model at <code>prompts/generate-model.md</code> and import what it writes.
      That prompt puts the division of labour the right way round \u2014 the big model reads, this holds the
      structure and runs the checks \u2014 and it makes the model declare which parts it inferred rather than
      read.</p>`;

  const sb = $('tplSamples');
  if(sb) sb.onclick = async () => {
    sb.disabled = true; $('tplMsg').textContent = 'Loading\u2026';
    try{
      const names = await loadSamples(false);
      await store.flush();
      $('tplMsg').textContent = names.length ? 'Loaded: ' + names.join(', ') + '.'
                                             : 'Nothing to add \u2014 every example is already here.';
      render();
    }catch(e){ $('tplMsg').textContent = 'Could not load: ' + e.message; sb.disabled = false; }
  };
  const ib = $('tplImport');
  if(ib) ib.onclick = () => {
    const f = $('fJson');
    if(!f) return void ($('tplMsg').textContent =
      'The file picker lives on the Knowledge models page \u2014 open that page and use "Import a bundle".');
    closeModals(); f.click();
  };
}

    }catch(e){ $('wsMsg').textContent = 'Could not load samples: ' + e.message; b.disabled = false; }
  };
  $('wsHist').onclick = () => openHistory('models');
  $('wsPurge').onclick = () => {
    showBig('Purge this workspace', `
      <div class="note bad"><b>This deletes files, and it is not recoverable.</b>
        Every model, perspective, proportion profile and anonymisation rule in
        <code>profiles/${esc((auth.user()||{}).name || '?')}/</code> goes, along with the whole of

      <p style="font-size:12px;">Type the workspace name to confirm.</p>
      <div class="row"><input class="in" id="pgName" placeholder="${esc((auth.user()||{}).name || '')}"
        style="max-width:220px;" autocomplete="off">
        <button class="btn sm" id="pgGo" style="background:var(--red);border-color:var(--red);color:#fff;">
          Purge</button></div>
      <div id="pgMsg" style="font-size:11px;color:var(--red);margin-top:8px;"></div>`);
    $('pgGo').onclick = async () => {
      if($('pgName').value.trim() !== ((auth.user()||{}).name || '')){
        $('pgMsg').textContent = 'Name does not match.'; return;
      }
      try{ await purgeWorkspace(); closeModals(); navigate('/models'); render(); }
      catch(e){ $('pgMsg').textContent = e.message; }
    };
  };
  on('[data-open]','click', e => { state.modelId = e.currentTarget.dataset.open; store.set('modelId', state.modelId); navigate('/structure'); }, root);
  on('[data-dup]','click', e => {
    const src = state.models.find(m => m.id === e.currentTarget.dataset.dup);
    const c = clone(src); c.id = uid('m'); c.name = src.name + ' (copy)'; c.createdAt = Date.now();
    state.models.push(c); saveModels(); render();
  }, root);
  on('[data-del]','click', e => {
    const id = e.currentTarget.dataset.del;
    state.models = state.models.filter(m => m.id !== id);
    if(state.modelId === id){ state.modelId = state.models[0].id; store.set('modelId', state.modelId); }
    saveModels(); render();
  }, root);
  $('mPath').onclick = () => openPath();
  $('mTpl').onclick = () => openTemplates();
  $('mNew').onclick = () => {
    /* No pre-filled layers. They used to arrive named "Customer & sales",
       "Business" and "Technical runtime" — invented, telco-flavoured and nothing
       to do with whoever is using this. Worse, the assistant reads the current
       model as its context, so it saw those three names and built a domain to fit
       them regardless of what was actually typed. A guessed default does not read
       as a suggestion; it reads as a fact about your organisation.

       Layers are the one decision that shapes everything after them, so they
       belong to the person whose domain it is. */
    const m = { id:uid('m'), name:'New model', domain:'', question:'', summary:'', anonymised:false,
      layers:[], nodes:[], edges:[], createdAt:Date.now() };
    state.models.push(m); state.modelId = m.id; saveModels(); store.set('modelId', m.id); navigate('/structure');
  };
  $('mJson').onclick = () => $('fJson').click();
  $('fJson').onchange = e => readFile(e, txt => {
    /* Six checks, cheapest first, and every one of them refuses rather than
       repairs. The `accept=".json"` on the input above is a file-picker filter and
       nothing more — it is trivially bypassed by drag-and-drop or a renamed file,
       so it is a convenience, never a control. None of this is a security boundary
       either: it runs in the browser, where the person supplying the file also
       controls the code checking it. A hosted build must repeat all of it
       server-side and treat the browser's verdict as advisory. */
    if(txt.length > IMPORT_MAX_BYTES)
      return showBig('Import refused', noteBad('That file is ' + (txt.length/1048576).toFixed(1) +
        ' MB. The ceiling is ' + (IMPORT_MAX_BYTES/1048576) + ' MB. A knowledge model that large is ' +
        'almost always an export of something else that happens to be JSON.'));
    let o = null;
    try{ o = JSON.parse(txt); }catch(err){ return showBig('Import refused', noteBad('That file is not valid JSON. ' + esc(err.message))); }
    if(o === null || typeof o !== 'object' || Array.isArray(o))
      return showBig('Import refused', noteBad('Valid JSON, but not an object. A pack is <code>{ kind, schemaVersion, model }</code>.'));
    if(o.kind !== SCHEMA.kind) return showBig('Import refused', noteBad('Unexpected kind: <code>' + esc(String(o.kind)) + '</code>. This build reads <code>' + esc(SCHEMA.kind) + '</code>.'));
    if(o.schemaVersion !== SCHEMA.version) return showBig('Import refused', noteBad('Schema <code>' + esc(String(o.schemaVersion)) + '</code>. This build reads <code>' + esc(SCHEMA.version) + '</code>.'));
    if(!o.model || !Array.isArray(o.model.layers)) return showBig('Import refused', noteBad('The file has no model, or the model has no layers.'));
    if(!Array.isArray(o.model.nodes) || !Array.isArray(o.model.edges))
      return showBig('Import refused', noteBad('The model has no <code>nodes</code> array or no <code>edges</code> array.'));
    /* Vocabulary. `test_import.js` has always asserted that templates use only
       known kinds and relationships; the runtime import path never checked, so a
       file could load carrying a kind this build cannot draw and a relationship it
       cannot price. Refuse and name them, rather than loading a model that renders
       as blank shapes. */
    const badKinds = Array.from(new Set(o.model.nodes.map(n => n && n.kind).filter(k => !KINDS[k])));
    const badRels  = Array.from(new Set(o.model.edges.map(e => e && e.rel).filter(r => !RELS[r])));
    if(badKinds.length || badRels.length)
      return showBig('Import refused', noteBad('This build does not know:' +
        (badKinds.length ? '<br>node kinds \u2014 <code>' + badKinds.map(esc).join('</code> <code>') + '</code>' : '') +
        (badRels.length  ? '<br>relationships \u2014 <code>' + badRels.map(esc).join('</code> <code>') + '</code>' : '') +
        '<br>A mismatch is refused rather than half-applied, which is what the Models page promises.'));
    const m = o.model; m.id = uid('m');
    state.models.push(m); state.modelId = m.id; saveModels(); store.set('modelId', m.id);
    (o.perspectives || []).filter(p => !PERSPECTIVES.some(x => x.id === p.id)).forEach(p => {
      if(!state.customPerspectives.some(x => x.id === p.id)) state.customPerspectives.push(p);
    });
    savePersp();
    showBig('Model loaded', `<div class="note good"><b>Loaded.</b> ${esc(m.name)} — ${m.layers.length} layers,
      ${m.nodes.length} nodes, ${m.edges.length} relationships.</div>`);
    setTimeout(() => { closeModals(); navigate('/structure'); }, 900);
  });
  $('mMd').onclick = () => $('fMd').click();
  $('fMd').onchange = e => readFile(e, txt => {
    const r = importKnowledgePack(txt);
    if(!r.model.layers.length && !r.model.nodes.length)
      return showBig('Import refused', noteBad('Nothing recognisable in that file.<br>' + r.warnings.map(esc).join('<br>')));
    state.models.push(r.model); state.modelId = r.model.id; saveModels(); store.set('modelId', r.model.id);
    showBig('Knowledge pack loaded', `
      <div class="note good"><b>Loaded.</b> ${esc(r.model.name)} — ${r.model.layers.length} layers,
        ${r.model.nodes.length} nodes, ${r.model.edges.length} relationships.</div>
      ${r.warnings.length ? '<div class="note warn"><b>Not everything was placed.</b><br>' +
        r.warnings.map(esc).join('<br>') + '</div>' : ''}`);
  });
}
function noteBad(html){ return `<div class="note bad"><b>Import refused.</b> ${html}</div>`; }
function readFile(e, cb){
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => cb(String(r.result || ''));
  r.readAsText(f); e.target.value = '';
}

/* Every page except Models and Admin operates on an open model. With none open
   they used to run straight into m.nodes.map(...) on undefined, throw, and leave

/* Only offer a lens that would actually read something.

   This bar used to list every perspective that declared a focus, on every model.
   The code even warned you afterwards that "every node is outside it, which means
   this perspective would read nothing" — which is a warning about an option that
   should not have been offered. Same fault as the analyzer palette, same fix:
   applicability is a property of the model in front of you, not of the library.

   `state.lensAll` shows the rest anyway, for the case where you are about to add
   the nodes a lens wants. */
function lensReads(p, m){
  const kinds = Array.from(new Set([].concat(p.focus || [], p.kinds || [])));
  if(!kinds.length) return true;                       /* reads everything */
  return kinds.some(k => (m.nodes||[]).some(n => n.kind === k));
}
function lensBarHTML(){
  const m0 = model();
  const every = PERSPECTIVES.concat(state.customPerspectives).filter(p => (p.focus||[]).length);
  const fits = every.filter(p => lensReads(p, m0));
  const all = state.lensAll ? every : fits;
  const cur = state.lensId ? perspectiveById(state.lensId) : null;
  const m = model();
  const kinds = lensKinds();
  const hidden = kinds ? m.nodes.filter(n => !kinds.includes(n.kind)).length : 0;
  return `<div class="lens">
    <span class="lens-t">Lens</span>
    <button class="lens-b ${state.lensId?'':'on'}" data-lens="">Everything</button>
    ${all.map(p => `<button class="lens-b ${state.lensId===p.id?'on':''}" data-lens="${esc(p.id)}">
      <i class="fas ${esc(p.icon||'fa-glasses')}"></i> ${esc(p.name)}</button>`).join('')}
    ${fits.length < every.length ? `<button class="lens-b" id="lensAll" style="color:var(--muted);">
      ${state.lensAll ? 'hide' : '+' + (every.length - fits.length)} not read by this model</button>` : ''}
    <div class="lens-note">${cur
      ? `<b>${esc(cur.name)}.</b> ${esc(cur.purpose)} This lens reads
         ${kinds.map(k => (KINDS[k]?KINDS[k].label:k).toLowerCase()).join(', ')} —
         ${hidden} node${hidden===1?'':'s'} of ${m.nodes.length} are outside it and are hidden here.
         ${hidden === m.nodes.length ? '<b style="color:var(--red);">Every node is outside it, which means this perspective would read nothing from this model.</b>' : ''}`
      : `A perspective narrowed to what it actually reads. Applying one here changes the screen only —
         it does not touch the model, and the export is chosen separately on the Export page.`}</div>
  </div>`;
}

function nodeOptions(m, sel){
  return m.layers.map(l => `<optgroup label="L${layerIdx(m,l.id)+1} · ${esc(l.name)}">` +
    nodesIn(m, l.id).map(n => `<option value="${esc(n.id)}" ${sel===n.id?'selected':''}>${esc(n.label)}</option>`).join('') +
    '</optgroup>').join('');
}
/* The lens is a perspective applied to the screen rather than to an export.
   A perspective already declares which kinds of node it reads; showing that
   on the model while you are building it is the only way to find out that the
   perspective reads nothing, which is a real and common mistake. */
function lensKinds(){
  if(!state.lensId) return null;
  const p = perspectiveById(state.lensId);
  const set = Array.from(new Set([].concat(p.focus || [], p.kinds || [])));
  return set.length ? set : null;
}
function visibleNodes(m){
  const q = state.search.trim().toLowerCase();
  const lens = lensKinds();
  return m.nodes.filter(n => {
    if(state.filterLayers.length && !state.filterLayers.includes(n.layer)) return false;
    if(state.filterKind  && n.kind  !== state.filterKind)  return false;
    if(lens && !lens.includes(n.kind)) return false;
    if(!q) return true;
    return (n.label + ' ' + n.kind + ' ' + n.note + ' ' +
      Object.entries(n.props||{}).map(([k,v])=>k+' '+v).join(' ')).toLowerCase().includes(q);
  });
}
function nodeListHTML(m){
  const ns = visibleNodes(m);
  if(!ns.length) return `<div class="empty"><i class="fas fa-cube"></i><b>Nothing here</b>
    <p>${m.nodes.length ? 'No node matches the current filter.' : 'Add the first node — start with the thing the customer actually sees.'}</p></div>`;
  return m.layers.map(l => {
    const in_ = ns.filter(n => n.layer === l.id);
    if(!in_.length) return '';
    return `<div class="spine-h" style="margin:14px 0 6px;color:${layerColor(m,l.id)};">
        L${layerIdx(m,l.id)+1} · ${esc(l.name)}</div>` +
      in_.map(n => {
        const deg = edgesOf(m, n.id).length;
        return `<div class="nrow" data-node="${esc(n.id)}">
          <span class="kind-dot" style="background:${KINDS[n.kind]?KINDS[n.kind].color:'#999'};margin-top:4px;"></span>
          <div class="nm"><b>${esc(n.label)}</b>
            <p>${esc(KINDS[n.kind]?KINDS[n.kind].label:n.kind)} · ${deg} link${deg===1?'':'s'}${
              Object.keys(n.props||{}).length ? ' · ' + Object.entries(n.props).slice(0,3).map(([k,v]) => esc(k)+': '+esc(v)).join(' · ') : ''}</p></div>
          <span class="lay">${esc(n.id)}</span></div>`;
      }).join('');
  }).join('');
}
function wireList(root){
  on('[data-node]','click', e => openNode(e.currentTarget.dataset.node), root);
}
function traceHTML(m, t){
  if(!t) return `<div class="note bad"><b>No path.</b> Nothing joins those two nodes in either direction.
    Either a relationship is missing, or they belong to two models that happen to share a file.</div>`;
  const rows = t.nodes.map((id, i) => {
    const n = nodeById(m, id), li = layerIdx(m, n.layer);
    const hop = i ? t.hops[i-1] : null;
    return `${hop ? `<div class="parrow">${esc(hop.rel)}${hop.reversed ? ' (against the arrow)' : ''} <i class="fas fa-chevron-down"></i></div>` : ''}
      <div class="pstep" style="--lc:${layerColor(m, n.layer)};">
        <span class="pl">L${li+1}</span>
        <span style="flex:1;"><b>${esc(n.label)}</b> <span>${esc(KINDS[n.kind]?KINDS[n.kind].label:n.kind)}</span></span></div>`;
  }).join('');
  return `${t.directed ? '' : `<div class="note warn"><b>Only reachable against the arrows.</b>
      There is no directed path, so this was found ignoring direction. Usually that means one relationship
      points the wrong way.</div>`}
    <div class="pathcard">${rows}</div>`;
}
function auditHTML(m){
  const a = auditModel(m);
  if(!a.length) return `<div class="note good"><b>Nothing found.</b> Every node is connected, every rule is
    implemented somewhere below it, every layer reaches the next, and everything that can have an owner has one.</div>`;
  const col = { high:'var(--red)', medium:'var(--amber)', low:'var(--muted)' };
  return `<table class="t"><thead><tr><th style="width:70px;">Severity</th><th>Finding</th><th style="width:110px;">Node</th></tr></thead><tbody>
    ${a.map(f => `<tr><td><span class="chip solid" style="background:${col[f.sev]};">${esc(f.sev)}</span></td>
      <td>${esc(f.text)}</td><td class="mono">${esc(f.node)}</td></tr>`).join('')}</tbody></table>`;
}

          <div class="field"><input type="text" data-ln="${i}" value="${esc(l.name)}" placeholder="Layer name"></div>
          <div class="field" style="margin:0;"><textarea data-lr="${i}" rows="2"
            placeholder="What kind of statement belongs in this layer?">${esc(l.role||'')}</textarea></div>
        </div>`).join('')}
      ${m.layers.length >= LAYER_COLORS.length ? `<div class="note warn"><b>Six is the ceiling here.</b>
        The colour scheme runs out, and in practice a model that needs a seventh layer usually has two that
        are really one.</div>` : `<button class="btn ghost sm" id="lAdd"><i class="fas fa-plus"></i> Add a layer</button>`}`;
    on('[data-ln]','input', e => { m.layers[+e.currentTarget.dataset.ln].name = e.currentTarget.value; }, $('nodeBody'));
    on('[data-lr]','input', e => { m.layers[+e.currentTarget.dataset.lr].role = e.currentTarget.value; }, $('nodeBody'));
    on('[data-up]','click', e => { const i = +e.currentTarget.dataset.up;
      m.layers.splice(i-1, 0, m.layers.splice(i,1)[0]); paint(); }, $('nodeBody'));
    on('[data-down]','click', e => { const i = +e.currentTarget.dataset.down;
      m.layers.splice(i+1, 0, m.layers.splice(i,1)[0]); paint(); }, $('nodeBody'));
    on('[data-rm]','click', e => {
      const i = +e.currentTarget.dataset.rm, l = m.layers[i], used = nodesIn(m, l.id).length;
      if(m.layers.length === 1) return;
      if(used){
        const to = m.layers[i === 0 ? 1 : i-1];
        m.nodes.forEach(n => { if(n.layer === l.id) n.layer = to.id; });
      }
      m.layers.splice(i,1); paint();
    }, $('nodeBody'));
    const a = $('lAdd');
    if(a) a.onclick = () => { m.layers.push({ id:uid('l'), name:'New layer', role:'' }); paint(); };
  };
  $('nodeTitle').textContent = 'Layers';
  $('nodeFoot').innerHTML = `<button class="btn ghost" data-close>Cancel</button><button class="btn brand" id="lSave">Save layers</button>`;
  paint();
  $('lSave').onclick = () => { m.layers.forEach(l => { if(!l.name.trim()) l.name = 'Unnamed layer'; }); saveModels(); closeModals(); render(); };
  on('[data-close]','click', closeModals, $('nodeFoot'));
  openModal('ovNode');
}

     entry to a string, so it is held out here and written back on save. Leaving

  let props = Object.entries(n.props || {}).filter(([k]) => k !== 'open');

    $('nodeBody').innerHTML = `

        <div class="field" style="flex:2;min-width:200px;"><label class="f">Label</label>

          <select id="nLayer">${m.layers.map((l,i) => `<option value="${esc(l.id)}" ${n.layer===l.id?'selected':''}>L${i+1} · ${esc(l.name)}</option>`).join('')}</select></div>
        <div class="field" style="flex:1;min-width:130px;"><label class="f">Kind</label>

      </div>

      ${n.kind === 'analyzer' && INSPECTOR_META[(n.props||{}).analyzerId] ? `
        <div class="note"><b>${esc(INSPECTOR_META[n.props.analyzerId].alias)}</b> —
          <code>${esc(INSPECTOR_META[n.props.analyzerId].label)}</code>.
          The prompt is held in the library, not in this node, so a prompt that changes in one place changes
          everywhere. Link this node to the chapters and rules it is responsible for using
          <code>CHECKS</code>.
          <button class="linkbtn" id="nPrompt" style="display:block;margin-top:6px;">
            <i class="fas fa-code"></i> Read the prompt and skills</button></div>` : ''}

      <div class="field"><label class="f">Note</label>
        <textarea id="nNote" rows="3" placeholder="Why does this node matter to somebody reading the model? One or two sentences.">${esc(n.note||'')}</textarea></div>

      ${openFieldsetHTML(openDraft, 'n')}

      <label class="f">Properties</label>
      <div id="nProps">${props.map((p,i) => `

            <td class="mono" style="width:120px;">${esc(e.rel)}</td>
            <td>${esc(other ? other.label : '(missing node)')}
              ${e.note ? `<br><span style="color:var(--muted);font-size:10px;">${esc(e.note)}</span>` : ''}</td>
            <td style="width:60px;"><button class="linkbtn danger" data-ed="${esc(e.id)}">Remove</button></td></tr>`;
        }).join('')}</tbody></table>`
      : `<p style="font-size:11px;color:var(--muted);margin:0 0 8px;">${isNew ? 'Save the node first, then link it.' : 'Nothing links to this node yet. A node with no relationships is a fact nobody can reach.'}</p>`}
      ${isNew ? '' : `
      <div class="row" style="margin-top:8px;">
        <select id="rRel" style="width:auto;">${REL_IDS.map(r => `<option value="${r}">${r}</option>`).join('')}</select>
        <select id="rTo" style="flex:1;min-width:160px;">${nodeOptions(m, null)}</select>
        <button class="btn ghost sm" id="rAdd"><i class="fas fa-link"></i> Link</button>

    on('[data-pd]','click', e => { props.splice(+e.currentTarget.dataset.pd, 1); paint(); }, $('nodeBody'));

    on('[data-pv]','input', e => { props[+e.currentTarget.dataset.pv][1] = e.currentTarget.value; }, $('nodeBody'));

    wireOpenFieldset('n', openDraft, v => { openDraft = v; paint(); });

    }, $('nodeBody'));
    const ra = $('rAdd');
    if(ra) ra.onclick = () => {

      if(!to || to === n.id) return;

  };

  $('nodeTitle').textContent = isNew ? 'New node' : n.label || 'Node';
  $('nodeFoot').innerHTML = `
    ${isNew ? '' : `<button class="btn ghost" id="nDel" style="margin-right:auto;color:var(--red);"><i class="fas fa-trash"></i> Delete node</button>`}
    <button class="btn ghost" data-close>Cancel</button>

  on('[data-close]','click', closeModals, $('nodeFoot'));

  if(d) d.onclick = () => {
