    if(isNew) m.nodes.push(n);
    else {
      const i = m.nodes.findIndex(x => x.id === n.id);
      if(i > -1) m.nodes[i] = n;
    }
    saveModels(); closeModals(); render();
  };
  openModal('ovNode');
}

/* ═══════════════════════════════════════════════════════════════════════════
   GRAPH — hierarchical, one level per layer. The layer is the Y axis, which
   is the only layout decision here that carries meaning; everything else is
   the library's business.
   ═══════════════════════════════════════════════════════════════════════════ */
let gNet = null;
/* GRAPH DIAGNOSTICS

   Three different failures used to produce one identical symptom: an empty
   rectangle and a silent console. The library not loading, the container having
   no size, and the constructor throwing are not the same problem and should not
   look the same. Each now says which it is, on the page, where it happened. */
function graphFail(elId, what, detail){
  const el = document.getElementById(elId);
  console.error('[graph] ' + what, detail || '');
  if(!el) return;
  el.innerHTML = `<div style="padding:22px;font-size:12px;line-height:1.7;color:var(--muted);">
    <b style="color:var(--red);">The graph could not be drawn.</b><br>${esc(what)}
    ${detail ? '<br><code style="font-size:10.5px;">' + esc(String(detail)) + '</code>' : ''}
    <br><br>Open the browser console and the Network tab. <code>vendor/vis-network.min.js</code>
    must return <b>200</b> with content type <code>text/javascript</code>. A 404 means it is missing
    from the image; <code>text/html</code> means the server is answering with the page instead.</div>`;
}
function visReady(elId){
  if(typeof vis === 'undefined' || !vis || typeof vis.Network !== 'function'){
    graphFail(elId, 'The vis-network library did not load, so window.vis is not defined.',
              'typeof vis = ' + typeof vis);
    return false;
  }
  /* vis-network measures its container at construction, so a container with no
     width or height yields a canvas with no width or height — which looks
     exactly like a library that failed to load and is the harder of the two to
     guess at. Measured and reported rather than assumed. */
  const el = document.getElementById(elId);
  if(!el) return false;
  const r = el.getBoundingClientRect();
  if(r.width < 20 || r.height < 20){
    graphFail(elId, 'The container has no size, so there is nowhere to draw.',
              'measured ' + Math.round(r.width) + ' x ' + Math.round(r.height) + ' px');
    return false;
  }
  console.log('[graph] ' + elId + ' ' + Math.round(r.width) + 'x' + Math.round(r.height) + ' ok');
  return true;
}
/* Called straight after innerHTML the element exists but the browser has not
   necessarily laid it out. Two frames is enough and costs nothing. */
function afterLayout(fn){
  if(typeof requestAnimationFrame === 'function')
    requestAnimationFrame(() => requestAnimationFrame(fn));
  else setTimeout(fn, 0);
}

function teardownGraph(){ if(gNet){ try{ gNet.destroy(); }catch(e){} gNet = null; } }
function buildGraph(m){
  const el = $('gcanvas');
  if(!el){ console.warn('[graph] #gcanvas is not in the DOM'); return; }
  if(!visReady('gcanvas')) return;
  teardownGraph();
  const dark = state.dark;
  const show = new Set(visibleNodes(m).map(n => n.id));
  /* Black and white by default. Twenty-two kinds meant twenty-two colours, which
     is more hues than anyone can hold and left no colour free to mean anything.
     Shape now carries the kind, and colour is reserved for the two things worth
     shouting about: a contradiction and an incident cause. */
  const ink   = dark ? '#F2F2F2' : '#0A0A0A';
  const paper = dark ? '#141416' : '#FFFFFF';
  const soft  = dark ? '#5A5A62' : '#B4B4BC';
  const navy  = dark ? '#7C8CD8' : '#1E2A5A';
  /* Ink, navy, grey, and red for exactly one kind. The version this replaces
     handed every node its KINDS colour, which is twenty-two hues - and the
     comment already in this function had it right the first time: more than
     anyone can hold, and it leaves no colour free to mean anything. Two now mean
     something.

       actor           red   people, because a graph is usually read to find out
                             who has to do something
       control, rule   navy  governance: the requirement and the thing it is
                             written against, kept together

     Everything else is ink. If a third exception ever earns its place it goes in
     this map and nowhere else. */
  const HUE = { actor: dark ? '#FF3B30' : '#D40000', control: navy, rule: navy };
  const degOf = {};
  (m.edges||[]).forEach(e => { degOf[e.from]=(degOf[e.from]||0)+1; degOf[e.to]=(degOf[e.to]||0)+1; });
  /* Circles, all of them. Neo4j draws every node as a circle and it is right to:
     the eye reads position and connection instantly and shape not at all, so
     varying the shape spends attention without buying information. The kind is in
     the tooltip, where it can be read when it is wanted - there is no longer a
     label for it to be in. */
  const nodes = m.nodes.map(n => {
    const k = KINDS[n.kind] || {};
    const dim = show.size && !show.has(n.id);
    const shape = 'dot';
    /* Filled marks are the subject of the current view; hollow ones are context. */
    const solid = !dim;
    /* An open point reads as not filled in, which is what it is. Dashes cost
       nothing from the palette: the comment above is right that no colour is free
       to spend, and no shape is free either since every node is a disc on
       purpose. Dashes are the one channel still unused. */
    const openHere = isOpen(n);
    const val = 1 + (degOf[n.id] || 0);
    const hue = HUE[n.kind] || ink;
    /* No `label`, so nothing is drawn beside the disc. `title` instead: the graph
       is now shape and position, and the words arrive on hover.

       This pairing is not a preference. interaction.tooltipDelay has been set to
       150ms in the options below the whole time, against a title that was never
       populated - so hover did nothing. Remove the label without adding this and
       a node becomes unidentifiable short of double-clicking it, which is a worse
       page than the one with too much type on it. */
    const layerName = ((m.layers || []).find(l => l.id === n.layer) || {}).name || '';
    return {
      id:n.id, level:Math.max(0, layerIdx(m, n.layer)),
      title: n.label + '\n' + ((KINDS[n.kind] || {}).label || n.kind) +
             (layerName ? '  ·  ' + layerName : '') +
             (openHere ? '\nOPEN POINT — ' + (openOf(n).owner || 'unassigned') : ''),
      shape,
      value: val,
      color:{ background: solid ? hue : paper,
              border:     solid ? hue : soft,
              highlight:{ background: dark ? '#FFFFFF' : '#000000', border:'var(--brand)' } },
      borderWidth: openHere ? 1.6 : solid ? 1 : 1.4,
      shapeProperties:{ borderDashes: openHere ? [2,3] : solid ? false : [3,3] }
    };
  });
  const edges = m.edges.map(e => {
    const w = REL_WARN[e.rel];
    const col = w === 'bad' ? '#B3261E' : w === 'warn' ? '#E2B007' : (dark ? '#44444C' : '#B9B9BF');
    return { id:e.id, from:e.from, to:e.to, label:e.rel, arrows:'to',
      dashes: w === 'bad', width: w ? 2 : 1,
      color:{ color:col, highlight: dark?'#FFF':'#000' },
      font:{ size:8, color: dark?'#8A8A90':'#86868B', strokeWidth:3, strokeColor: dark?'#161618':'#FFFFFF', align:'middle' },
      smooth:{ type:'cubicBezier', forceDirection:'vertical', roundness:0.45 } };
  });
  try {
    gNet = new vis.Network(el, { nodes, edges }, {
      layout:{ hierarchical:{ enabled:true, direction:'UD', sortMethod:'directed',
        levelSeparation:135, nodeSpacing:150, treeSpacing:170, blockShifting:true, edgeMinimization:true } },
      physics:{ enabled:false },
      interaction:{ hover:true, dragNodes:true, zoomView:true, dragView:true, tooltipDelay:150 },
      /* label.enabled dropped with the labels. Size still scales with degree, so
         the load-bearing nodes are still visibly the load-bearing ones. */
      nodes:{ shadow:false, scaling:{ min:14, max:34 } },
    edges:{ shadow:false }
    });
  } catch(err){ graphFail('gcanvas', 'vis-network threw while building the graph.', err && err.message); return; }
  gNet.on('doubleClick', p => { if(p.nodes.length) openNode(p.nodes[0]); });
  gNet.on('click', p => {
    if(!p.nodes.length) return;
    state.traceFrom = state.traceFrom === p.nodes[0] ? state.traceFrom : (state.traceFrom || p.nodes[0]);
    const tf = $('tFrom'); if(tf) tf.value = p.nodes[0];
  });
  setTimeout(() => { if(gNet) gNet.fit({ animation:false }); }, 60);
}

/* ═══════════════════════════════════════════════════════════════════════════
   VIEW — perspectives
   ═══════════════════════════════════════════════════════════════════════════ */
/* The page is gone. Choosing a reader is the last decision before the artefact
   is written, and it was sitting two tabs away from the page that consumes it —
   so the cards, the editor and the new ladder all live on Export now. Kept as a
   redirect so an old link still lands where the thing it names went. */
function viewPerspectives(root){
  try{ history.replaceState(null, '', '#/export'); }catch(e){ location.hash = '#/export'; }
  return viewExport(root);
}

/* The answer from the try-it window. Held in state, not the model — it is a
   thing you looked at once, like a search result. */
function perspAnswerHTML(){
  const a = state.perspAnswer;
  if(!a) return '';
  if(a.busy) return `<div class="abox-msg"><i class="fas fa-arrows-rotate"></i> Asking\u2026</div>`;
  if(a.error) return `<div class="note bad"><b>That did not work.</b> ${esc(a.error)}</div>`;
  return `<div class="note"><b><i class="fas fa-glasses"></i> ${esc(a.persp)}</b>
    <div style="font-size:11.5px;line-height:1.8;margin-top:8px;white-space:pre-wrap;">${esc(a.text)}</div></div>`;
}
async function perspAskRun(m, p){
  const q = String(state.perspAsk || '').trim();
  if(!q) return;
  state.perspAnswer = { busy:true };
  const host = document.getElementById('pxOut');
  if(host) host.innerHTML = '<div class="abox-msg"><i class="fas fa-arrows-rotate"></i> Asking\u2026</div>';
  try {
    /* exportModel(), not model() — so the anonymiser is applied if it is on and
       the question is answered against exactly what would leave the building. */
    const sys = exportSystemPrompt(exportModel(), p, promptOpts());
    const text = await llmAsk(sys, q);
    state.perspAnswer = { busy:false, text:String(text||'').trim() || '(empty answer)', persp:p.name };
  } catch(e){ state.perspAnswer = { busy:false, error:e.message }; }
  render();
}

function slug(s){ return String(s||'model').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48) || 'model'; }

function perspectiveReach(m, p){
  const layers = m.layers || [];
  const kinds  = p.kinds && p.kinds.length ? p.kinds : null;
  const focus  = p.focus && p.focus.length ? p.focus : [];
  const rows = layers.map((l, i) => {
    const inLayer = (m.nodes || []).filter(n => n.layer === l.id);
    const read = inLayer.filter(n => !kinds || kinds.includes(n.kind));
    return { layer:l, idx:i, total:inLayer.length, read:read.length,
             focus: read.filter(n => focus.includes(n.kind)).length,
             nodes: inLayer.map(n => ({ kind:n.kind,
               on: !kinds || kinds.includes(n.kind),
               hot: focus.includes(n.kind) })) };
  });
  /* Nodes in no layer at all. Counted separately rather than dropped, because a
     model built in a hurry has them and a fraction that quietly ignores them is
     a fraction that does not add up. */
  const stray = (m.nodes || []).filter(n => !layers.some(l => l.id === n.layer));
  const readTotal = rows.reduce((a, r) => a + r.read, 0);
  const allTotal  = (m.nodes || []).length;
  /* Reading order. top-down is the layer order as written; bottom-up is its
     reverse; both starts at the subject and works outward, so no band is first
     and the ladder says so instead of inventing a sequence. */
  const seq = p.order === 'bottom-up' ? rows.slice().reverse()
            : p.order === 'both' ? null : rows;
  const cross = typeof crossLayerEdges === 'function' ? crossLayerEdges(m).length : 0;
  return { rows, stray:stray.length, readTotal, allTotal, seq, cross,
           kinds, focus, entry:p.entry, order:p.order };
}

function perspectiveLadder(m, p){
  const R = perspectiveReach(m, p);
  if(!R.rows.length) return `<div class="empty"><i class="fas fa-layer-group"></i>
    <b>No layers to read</b><p>A perspective walks the layers of a model. This one has none yet, so there is
    no order for a reader to follow. Add layers on the Structure page.</p></div>`;

  const W = 560, band = 42, gap = 7, padT = 8;
  const H = padT + R.rows.length * (band + gap) + 4;
  const ink = 'var(--ink)', muted = 'var(--muted)', line = 'var(--line)';

  const orderOf = r => {
    if(R.order === 'both') return '\u2194';
    const at = R.seq.findIndex(x => x.layer.id === r.layer.id);
    return String(at + 1);
  };
  /* The entry band. 'first' is the first band in reading order, so it moves when
     the order flips — which is the clearest single demonstration that order is
     not decoration. 'all' marks every band. 'node' marks none, because the entry
     is wherever the reader points and this drawing must not pretend to know. */
  const isEntry = r => R.entry === 'all' ? true
    : R.entry === 'node' ? false
    : R.order === 'both' ? false
    : R.seq[0] && R.seq[0].layer.id === r.layer.id;

  const bands = R.rows.map((r, i) => {
    const y = padT + i * (band + gap);
    const dotsPerRow = 26;
    const dots = r.nodes.slice(0, dotsPerRow).map((n, j) => {
      const cx = 210 + (j % dotsPerRow) * 12.4;
      return `<circle cx="${cx.toFixed(1)}" cy="${y + band/2}" r="${n.hot ? 4 : 3.2}"
        fill="${n.on ? (n.hot ? 'var(--brand)' : ink) : 'none'}"
        stroke="${n.on ? 'none' : line}" stroke-width="1"/>`;
    }).join('');
    const more = r.nodes.length > dotsPerRow
      ? `<text x="${210 + dotsPerRow * 12.4 + 4}" y="${y + band/2 + 3.5}" font-size="8.5" fill="${muted}"
           font-family="var(--mono)">+${r.nodes.length - dotsPerRow}</text>` : '';
    return `
      <rect x="0" y="${y}" width="${W}" height="${band}" rx="3"
            fill="${isEntry(r) ? 'var(--card)' : 'transparent'}" stroke="${line}" stroke-width="1"/>
      <circle cx="20" cy="${y + band/2}" r="9.5" fill="${isEntry(r) ? 'var(--brand)' : 'transparent'}"
              stroke="${isEntry(r) ? 'var(--brand)' : line}" stroke-width="1"/>
      <text x="20" y="${y + band/2 + 3.5}" text-anchor="middle" font-size="9.5" font-weight="700"
            font-family="var(--mono)" fill="${isEntry(r) ? '#fff' : muted}">${esc(orderOf(r))}</text>
      <text x="38" y="${y + band/2 - 2}" font-size="10.5" font-weight="700" fill="${ink}">${esc(r.layer.name)}</text>
      <text x="38" y="${y + band/2 + 10}" font-size="8.5" fill="${muted}" font-family="var(--mono)">${
        r.read === r.total ? r.total + ' read' : r.read + ' of ' + r.total + ' read'}</text>
      ${dots}${more}`;
  }).join('');

  const pct = R.allTotal ? Math.round(R.readTotal / R.allTotal * 100) : 0;
  return `
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
         aria-label="Which layers this perspective reads, in order">${bands}</svg>
    <div class="plad-foot">
      <span><b style="color:${pct < 50 ? 'var(--brand)' : 'inherit'};">${R.readTotal} of ${R.allTotal}</b>
        nodes read <span class="mono">(${pct}%)</span></span>
      <span>${R.entry === 'node' ? 'starts wherever you point it'
            : R.entry === 'all' ? 'reads every layer'
            : R.order === 'both' ? 'starts at the subject, works outward'
            : 'starts at ' + esc((R.seq[0]||{layer:{}}).layer.name || 'the first layer')}</span>
      <span>${R.order === 'both' ? 'both directions' : esc(R.order)}</span>
      ${R.kinds ? `<span>${R.kinds.length} of ${KIND_IDS.length} kinds let through</span>`
                : '<span>every kind let through</span>'}
      ${R.focus.length ? `<span><span class="pdot brand"></span>${R.focus.length} kind${R.focus.length===1?'':'s'} emphasised</span>` : ''}
      ${R.cross ? `<span>${R.cross} link${R.cross===1?'':'s'} cross a layer</span>` : ''}
      ${R.stray ? `<span style="color:var(--amber);">${R.stray} node${R.stray===1?'':'s'} in no layer \u2014 unread</span>` : ''}
    </div>`;
}

function openPerspective(id){
  const src = id ? perspectiveById(id) : null;
  const isBuiltIn = !!src && PERSPECTIVES.some(x => x.id === id);
  const p = src ? clone(src) : { id:uid('p'), name:'New perspective', icon:'fa-glasses', purpose:'',
    entry:'first', order:'top-down', kinds:null, rels:null, focus:[], steps:[''], contract:[''] };
  if(isBuiltIn){ p.id = uid('p'); p.name = src.name + ' (copy)'; }

  const paint = () => {
    $('nodeBody').innerHTML = `
      ${isBuiltIn ? `<div class="note"><b>Built-in perspectives are read-only.</b> This is a copy of
        “${esc(src.name)}”. Saving it adds a new one and leaves the original alone.</div>` : ''}
      <div class="row" style="gap:10px;">
        <div class="field" style="flex:2;min-width:200px;"><label class="f">Name</label>
          <input type="text" id="pName" value="${esc(p.name)}"></div>

          <select id="pOrder">
            <option value="top-down"  ${p.order==='top-down'?'selected':''}>First layer first</option>
            <option value="bottom-up" ${p.order==='bottom-up'?'selected':''}>Last layer first</option>
            <option value="both"      ${p.order==='both'?'selected':''}>Outward from the subject</option>
          </select></div>
      </div>
      <div class="field"><label class="f">Purpose — what question is this for?</label>
        <textarea id="pPurpose" rows="2">${esc(p.purpose)}</textarea></div>
      <label class="f">Method — the steps, in order</label>
      <div id="pSteps">${p.steps.map((s,i) => `<div class="row" style="margin-bottom:5px;">
        <span style="font-size:10px;color:var(--muted);width:14px;">${i+1}</span>
        <input type="text" data-st="${i}" value="${esc(s)}" style="flex:1;">
        <button class="linkbtn danger" data-sd="${i}">Remove</button></div>`).join('')}</div>
      <button class="btn ghost sm" id="pSAdd" style="margin-bottom:14px;"><i class="fas fa-plus"></i> Add a step</button>

        <input type="text" data-ct="${i}" value="${esc(c)}" style="flex:1;">
        <button class="linkbtn danger" data-cd="${i}">Remove</button></div>`).join('')}</div>
      <button class="btn ghost sm" id="pCAdd"><i class="fas fa-plus"></i> Add a rule</button>`;
    on('[data-st]','input', e => { p.steps[+e.currentTarget.dataset.st] = e.currentTarget.value; }, $('nodeBody'));
    on('[data-ct]','input', e => { p.contract[+e.currentTarget.dataset.ct] = e.currentTarget.value; }, $('nodeBody'));
    on('[data-sd]','click', e => { p.steps.splice(+e.currentTarget.dataset.sd,1); paint(); }, $('nodeBody'));
    on('[data-cd]','click', e => { p.contract.splice(+e.currentTarget.dataset.cd,1); paint(); }, $('nodeBody'));
    $('pSAdd').onclick = () => { p.steps.push(''); paint(); };
    $('pCAdd').onclick = () => { p.contract.push(''); paint(); };
  };
  $('nodeTitle').textContent = id ? (isBuiltIn ? 'Copy perspective' : 'Edit perspective') : 'New perspective';
  $('nodeFoot').innerHTML = `<button class="btn ghost" data-close>Cancel</button><button class="btn brand" id="pSave">Save</button>`;
  paint();
  on('[data-close]','click', closeModals, $('nodeFoot'));
  $('pSave').onclick = () => {
    p.name = $('pName').value.trim() || 'Untitled perspective';
    p.purpose = $('pPurpose').value.trim();

    if(!p.steps.length) p.steps = ['Describe the subject in every layer, in order.'];
    const i = state.customPerspectives.findIndex(x => x.id === p.id);
    if(i > -1) state.customPerspectives[i] = p; else state.customPerspectives.push(p);
    savePersp(); closeModals(); render();
  };
  openModal('ovNode');
}

/* ═══════════════════════════════════════════════════════════════════════════
   VIEW — analyzers

   The library is not editable here and that is deliberate. An analyzer is
   written while looking at the document that needed it, which happens in the
   companion product. This page is where the ten are read, grouped, and
   pointed at the chapters they are responsible for.

   Pointing one at a chapter is the part that belongs here: which checker owns
   which rule is a statement about the domain, not about any one document.
   ═══════════════════════════════════════════════════════════════════════════ */
function viewAnalyzers(root){
  const m = model();
  if(!m) return noModel(root, 'anal', 'Binding checks to what they are responsible for');

  const inModel = id => m.nodes.some(n => n.kind === 'analyzer' && (n.props||{}).analyzerId === id);
  const dom = modelDomain(m), dmeta = REVIEW_DOMAINS[dom];

  /* Two lenses on one page. The library is the ten analyzers and what each is
     for; the critique is the same set drawn against the document they are

        <i class="fas fa-microscope"></i> DocCritique</button>
      <span class="lens-note">${state.anView === 'critique'
        ? 'The same analyzers, drawn against the document. Show and hide only \u2014 nothing here writes to the model.'

    </div>` : '';

  const anRow = id => {
    const meta = INSPECTOR_META[id], sk = ANALYZER_SKILLS[id] || [];
    const here = inModel(id), fit = analyzerFits(id, m);
    return `<div class="an-row${fit.ok ? '' : ' off'}">
      <i class="fas ${esc(meta.icon)} ai"></i>
      <div class="am">
        <b>${esc(meta.alias)}</b>
        <span class="lbl">${esc(meta.label)}</span>
        <p>${esc(meta.role)}</p>
        <p style="margin-top:5px;"><b style="color:var(--ink);font-size:10px;">Checks:</b> ${meta.checks.map(esc).join(' · ')}</p>
        <p style="margin-top:3px;font-style:italic;">${esc(meta.impact)}</p>
      </div>
      <div class="aa">
        <span class="chip">${sk.length} skill${sk.length===1?'':'s'}</span>

        ${here ? '<span class="chip solid" style="background:var(--green);">In the model</span>'
               : fit.ok ? `<button class="linkbtn" data-add="${esc(id)}"><i class="fas fa-plus"></i> Add to model</button>`
                        : '<span class="chip">Not for this model</span>'}
      </div>
      ${fit.ok ? '' : `<div class="why"><b>Why not here:</b> ${esc(fit.reason)}</div>`}</div>`;
  };

  if(canDraw && state.anView === 'critique'){
    root.innerHTML = page('anal', `
      <div class="eyebrow">Analyzers \u00b7 DocCritique</div>
      <h1>Who is responsible for checking what.</h1>
      ${lens}
      ${critiqueSection(m)}`);
    wireChrome(root);
    wireAnalyzerLens(root);
    wireCritique(root, m);

  }
  root.innerHTML = page('anal', `
    <div class="eyebrow">Analyzers</div>

    <div class="note"><b>The library is read-only here.</b> An analyzer is written in front of the document

    <div class="section-rule">What this model is</div>
    <p class="lede">Analyzers are not general-purpose. Each one checks a particular kind of node, so which

    <div class="row" style="align-items:center;gap:8px;flex-wrap:wrap;">
      <label class="f" style="font-size:10px;">Treat this model as</label>
      <select class="in" id="anDom" style="max-width:320px;">
        ${REVIEW_DOMAIN_IDS.map(d => `<option value="${esc(d)}"${d === dom ? ' selected' : ''}>${esc(REVIEW_DOMAINS[d].label)}</option>`).join('')}
      </select>
      ${m.reviewDomain ? '<button class="linkbtn" id="anDomClear">back to inferred</button>'
                       : '<span style="font-size:10px;color:var(--muted);">inferred from the nodes in it</span>'}

    ${bad.length ? `<div class="note warn" style="margin-top:12px;"><b>${bad.length} CHECKS edge${bad.length===1?'':'s'} point somewhere the analyzer does not check.</b>

      <br>Repoint or remove them on the Build page. An analyzer aimed at the wrong kind of node produces an

    <div class="section-rule">Disciplines</div>
    ${DISCIPLINE_IDS.map(k => {
      const dd = DISCIPLINES[k], open = k === disc;
      return `<div class="disc ${open?'on':''}">

    <div class="section-rule">The template sample</div>

    <div class="row">

  on('[data-add]','click', e => {

      return;
    }
    /* markChange after the mutation would snapshot the model WITH the new node in
       it, so undo would not remove it. addAnalyzerNode has already mutated by the
       time we get here, which is why the snapshot is taken inside the picker for
       the edges and not at all for the node - a known gap, and the same one
       propLayer had before patch 1. Worth a follow-up. */
    saveModels();

  }, root);
  const dsel = $('anDom');
  if(dsel) dsel.onchange = () => { model().reviewDomain = dsel.value; saveModels(); render(); };

    }

  };
}
/* Returns { added, reason }. It used to return a bare false for both "already
   there" and "would not make sense", which is two different answers wearing the
   same hat — the caller could not tell the user which had happened. */
function addAnalyzerNode(m, id){
  if(m.nodes.some(n => n.kind === 'analyzer' && (n.props||{}).analyzerId === id))
    return { added:false, reason:'already in this model' };
  const fit = analyzerFits(id, m);
  if(!fit.ok) return { added:false, reason:fit.reason };
  const meta = INSPECTOR_META[id];
  /* The id is generated here, so it is returned here. The caller cannot ask the
     model for "the analyzer I just added" without guessing, and the old signature
     made it guess by label. */
  const nodeId = uid('an');
  m.nodes.push({ id:nodeId, layer:m.layers[m.layers.length-1].id, kind:'analyzer', label:meta.alias,
    props:{ analyzerId:id, label:meta.label, discipline:(DISCIPLINES[disciplineOf(id)]||{}).name || '—',
            sensitivity:(STRICTNESS[2]||{}).label, skills:String((ANALYZER_SKILLS[id]||[]).length) },
    note:meta.role });
  /* fit.targets is the kinds present in THIS model that this analyzer checks.
     analyzerFits has always computed it and this function has always discarded
     it, which is why an analyzer arrived checking nothing and the only mention of
     that was a warning on another page. */
  return { added:true, reason:'', nodeId, targets:fit.targets || [] };
}

/* Every node this analyzer could be pointed at and is not already pointed at.
   Pure, so it is worth testing on its own: the modal below is a thin skin over it.
   Reads the analyzer's own props.analyzerId rather than being told, so a caller
   cannot pass a node and a scope that disagree. */
function checkCandidates(m, analyzerNodeId){
  if(!m) return [];
  const an = (m.nodes || []).find(n => n.id === analyzerNodeId);
  if(!an) return [];
  const sc = analyzerScope((an.props || {}).analyzerId);
  const bound = new Set((m.edges || [])
    .filter(e => e.from === analyzerNodeId && e.rel === 'CHECKS').map(e => e.to));
  return (m.nodes || []).filter(n =>
    sc.targetKinds.indexOf(n.kind) > -1 && !bound.has(n.id));
}

/* Checkboxes, not a single select. One analyzer is normally responsible for
   several claims, and openBind's one-pair-at-a-time shape would send somebody
   round this modal five times - which is how you end up with a model where
   nothing is wired at all. */
function openCheckBind(analyzerNodeId){
  const m = model();
  const an = (m.nodes || []).find(n => n.id === analyzerNodeId);
  if(!an) return;
  const cand = checkCandidates(m, analyzerNodeId);
  const sc = analyzerScope((an.props || {}).analyzerId);
  if(!cand.length){
    showBig('Nothing to point it at', `<div class="note"><b>${esc(an.label)}</b> is in the model, and there
      is nothing here it checks. It looks for ${esc(sc.targetKinds.map(k => (KINDS[k]||{label:k}).label.toLowerCase()).join(', '))}.
      <p style="margin:6px 0 0;">Add one of those and bind it, or the analyzer will sit in the model and
      never fire — which the audit will keep telling you.</p></div>`);
    return;
  }
  showBig('What is it responsible for?', `
    <div class="note"><b>${esc(an.label)}</b> is in the model. An analyzer bound to nothing never fires, so
      this is the same question the audit would ask you later — asked now, while you know the answer.
      Tick everything it is responsible for.</div>
    <div style="max-height:46vh;overflow:auto;margin-top:14px;">
      ${cand.map(n => `<label style="display:flex;gap:9px;align-items:flex-start;padding:7px 2px;
          border-bottom:1px solid var(--line);cursor:pointer;">
        <input type="checkbox" data-ck="${esc(n.id)}" style="margin-top:3px;">
        <span><b style="font-size:12px;">${esc(n.label)}</b>
          <span style="font-size:10px;color:var(--muted);"> · ${esc((KINDS[n.kind]||{label:n.kind}).label)}</span>
        </span></label>`).join('')}
    </div>
    <div class="row" style="margin-top:12px;display:flex;gap:8px;">
      <button class="btn sm brand" id="ckGo">Bind</button>
      <button class="btn sm ghost" id="ckSkip">Not now</button>
    </div>
    <p style="font-size:10.5px;color:var(--muted);margin:9px 0 0;">Not now leaves it unbound. The Document
      page and the audit both report an analyzer that checks nothing, so it will not go quiet.</p>`);
  const skip = $('ckSkip'); if(skip) skip.onclick = () => { closeModals(); render(); };
  const go = $('ckGo');
  if(go) go.onclick = () => {
    const body = $('bigBody');
    const picked = body
      ? Array.prototype.slice.call(body.querySelectorAll('[data-ck]'))
          .filter(x => x.checked).map(x => x.getAttribute('data-ck'))
      : [];
    if(picked.length){
      markChange('bind analyzer');
      picked.forEach(id => m.edges.push({ id:uid('e'), from:analyzerNodeId, to:id, rel:'CHECKS', note:'' }));
      saveModels();
    }
    closeModals(); render();
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   VIEW — proportions

   The governor, carried over from DocCritique Studio with its arithmetic
   unchanged. It belongs here rather than there because it is a statement
   about the organisation, not about any one document: how many people, how
   much budget, how old the systems are, and who can say no.

   Two halves. The profile you write, and the check that runs against whatever
   a model produced. Every coefficient is a heuristic — stated openly in the
   source rather than buried — and the first thing you should replace with
   your own numbers.
   ═══════════════════════════════════════════════════════════════════════════ */
function viewProportions(root){
  const m = model();
  if(!m) return noModel(root, 'prop', 'Judging whether a plan is deliverable');
  const p = state.proportions, c = computeCeilings(p), v = state.lastValidation;
  root.innerHTML = page('prop', `
    <div class="eyebrow">Proportions</div>
    <h1>A layer for catching the obvious hallucination.</h1>
    <p class="lede">Ask a language model for a solution and it returns the Hollywood version: forty-eight
      microservices, six regions, a two-week migration of a twenty-year-old ledger. That output is fluent,
      internally consistent, and sized for a company that does not exist. It survives review because nobody
      has written down the number it violates.</p>
    <p class="lede">This is that number. It is <b>not a company profile</b> — it is a layer of the model, made
      of variables you name and ceilings you write as expressions over them.</p>
    <p class="lede">A new workspace starts with <b>an empty profile</b>, because a ceiling computed from
      figures nobody typed is the same failure this page exists to catch. Fill in what you looked up, or press
      <b>Load the worked example</b> for a profile with the original arithmetic in it — 1.5 integrations per IT
      head, six mass-units of legacy per week. Every coefficient in that example is a heuristic somebody should
      replace with one they have measured, and it is added as a separate profile so it never overwrites yours.</p>

    <div class="row" style="margin-bottom:14px;">
      <select id="propPick" style="width:auto;min-width:210px;">
        ${(() => {
          const idx = propIndexOf(state.propProfiles, p);
          /* If the open profile has been renamed but not saved, the stored
             name is not what the editor holds. Showing the stored one would
             be the same class of lie as showing the wrong profile. */
          const renamed = idx > -1 && state.propProfiles[idx].name !== p.name;
          const opts = state.propProfiles.map((x,i) =>
            `<option value="${i}"${i === idx ? ' selected' : ''}>${esc(
              i === idx && renamed ? (p.name || 'Untitled') + ' — unsaved name' : x.name)}</option>`).join('');
          /* Matching on name alone was the bug. "New, empty" installs a profile
             called "New profile" and does not add it to propProfiles, so no
             option matched, no `selected` was emitted, and the browser fell back
             to displaying the *first* option — telling the reader that the
             default profile was loaded while the editor held an empty one. The
             same happened after renaming and before saving. An explicit selected
             option is the only arrangement in which the control cannot lie about
             what is being edited. */
          return idx > -1 ? opts
            : `<option value="-1" selected>${esc(p.name || 'Untitled')} — unsaved</option>` + opts;
        })()}
      </select>
      <button class="btn ghost sm" id="propSave"><i class="fas fa-floppy-disk"></i> Save profile</button>
      <button class="btn ghost sm" id="propNew"><i class="fas fa-plus"></i> New, empty</button>
      <button class="btn ghost sm" id="propReset"
        title="Adds the worked example as a separate profile. Nothing you have open is replaced.">
        <i class="fas fa-flask"></i> Load the worked example</button>
      <div style="flex:1;"></div>
      <button class="btn brand sm" id="propLayer"><i class="fas fa-layer-group"></i> Add as a layer to “${esc(m.name)}”</button>
    </div>
    <div class="row" style="margin-bottom:6px;">
      <div class="field" style="flex:1;min-width:220px;margin:0;"><label class="f">Profile name</label>
        <input type="text" id="ppName" value="${esc(p.name)}"></div>
      <div class="field" style="flex:2;min-width:260px;margin:0;"><label class="f">What kind of place is this</label>
        <input type="text" id="ppNote" value="${esc(p.note||'')}"></div>
    </div>

    <div class="section-rule">Variables — what you looked up</div>
    <p class="lede" style="margin-bottom:8px;">Facts, not estimates. Each one gets a key that expressions can
      refer to. Rename a key and every ceiling that used it will say so rather than silently reading zero.</p>
    <div id="ppVars">${propVarsHTML()}</div>

    <div class="section-rule">Ceilings — what follows from them</div>
    <p class="lede" style="margin-bottom:8px;">A ceiling is not a target. It is the point past which the
      organisation is carrying something it cannot operate. Written as an expression, so changing the rule is
      editing a line rather than forking the tool.<br>
      <span style="font-family:var(--mono);font-size:10px;">available: ${esc(EXPR_HELP)}</span><br>
      <span style="font-family:var(--mono);font-size:10px;">built in: legacyMass · inventoryCount · vetoes · influencePower · influenceCount, plus every variable and every ceiling above this one.</span></p>
    <div id="ppCeil">${propCeilingsHTML()}</div>

    <div class="section-rule">Inventory — what already exists and stays switched on</div>
    <p class="lede" style="margin-bottom:8px;">Mass = age × coupling × data weight. A twenty-year
      load-bearing system with large data carries mass 72 on its own, which is what makes a two-week
      migration of it arithmetic rather than opinion. The total is available to expressions as
      <code>legacyMass</code>.</p>
    <div id="propInv">${propInvHTML()}</div>

    <div class="section-rule">Influence — who can say no</div>
    <div id="propInf">${propInfHTML()}</div>

    <div class="section-rule">Detectors — what law 1 looks for</div>
    <p class="lede" style="margin-bottom:8px;">Each row turns a list of nouns into a pattern, reads the largest
      number attached to any of them, and measures it against a ceiling. Add a row for anything your domain
      over-produces that this list does not name.</p>
    <div id="ppChecks">${propChecksHTML()}</div>

    <div class="section-rule">Phrase lists — what laws 1 to 3 read</div>
    <div class="grid c2" id="ppPhrases">${propPhrasesHTML()}</div>

    <div class="section-rule">Check something against it</div>
    <p class="lede" style="margin-bottom:8px;">Paste a proposal, a roadmap or a summary — the kind of thing a
      model returns. The parser is deliberately shallow: it reads counts and durations out of prose, because
      prose is what comes back.</p>
    <div class="row" style="margin-bottom:8px;">
      <button class="btn ghost sm" data-clear>Clear</button>
    </div>
    <textarea id="propText" rows="10" placeholder="Paste the proposal here.">${esc(state.propDraft)}</textarea>
    <div class="row" style="margin-top:8px;">
      ${llmOn() ? `<button class="btn ai" id="propRunAi">
        <i class="fas fa-wand-magic-sparkles"></i> Read and check</button>` : ''}
      <button class="btn ${llmOn()?'ghost':'brand'}" id="propRun">
        <i class="fas fa-scale-balanced"></i> ${llmOn()?'Pattern match only':'Check proportions'}</button>
    </div>
    ${llmOn() ? `<p style="font-size:10.5px;color:var(--muted);margin:8px 0 0;line-height:1.7;">
      <b>Read and check</b> hands the reading to a model and the judging to the same arithmetic as always
      \u2014 the model reports what the text commits to and never decides whether it passes.
      <b>Pattern match only</b> is the original word-list scan: no network, and no ability to tell
      \u201cwe will not add five\u201d from \u201cwe will add five\u201d.</p>` : ''}
    <div id="ppAiOut" style="margin-top:14px;">${propReadingHTML()}</div>
    <div id="propOut" style="margin-top:14px;">${v ? propResultHTML(v) : ''}</div>

    <p class="fineprint"><b>Expressions are parsed, not evaluated as JavaScript.</b> A recursive-descent
      parser over numbers, names, arithmetic, comparisons and a fixed function list cannot do anything except
      arithmetic. <code>eval()</code> would have been shorter and would have handed whoever opens a shared
      profile the ability to run code in the reader's browser.</p>
  `);
  wireChrome(root);
  wirePropForm(root);
}

/* Materialise the profile as real nodes in a real layer. Not a synthetic view:
   once it is in the model it participates in the graph, the trace, the audit
   and every export with no special-casing anywhere. What you see is the model. */
function addProportionsLayer(m, p){
  const c = computeCeilings(p);
  const existing = m.layers.find(l => l.name.indexOf('Proportions') === 0);
  const layer = existing || { id:uid('l'), name:'Proportions — ' + p.name,
    role:'What this organisation can carry. Variables are measured; ceilings are derived from them by expression.' };
  if(!existing) m.layers.push(layer);
  const keep = new Set();
  const put = (key, kind, label, props, note) => {
    const id = 'pp_' + key;
    keep.add(id);
    const found = m.nodes.find(n => n.id === id);
    const node = { id, layer:layer.id, kind, label, props, note:note||'' };
    if(found) Object.assign(found, node); else m.nodes.push(node);
    return id;
  };
  (p.variables || []).forEach(v => put(v.key, 'variable', v.label || v.key,
    { key:v.key, value:String(v.value), unit:v.unit || '', measured:'yes' }, v.note || ''));
  (p.ceilings || []).forEach(x => {
    const mm = c.meta.find(y => y.key === x.key) || {};
    put(x.key, 'ceiling', x.label || x.key,
      { key:x.key, expression:x.expr || '', value:String(mm.error ? 'error' : mm.value), unit:x.unit || '' },
      x.note || '');
    (mm.refs || []).forEach(r => {
      const from = 'pp_' + x.key, to = 'pp_' + r;
      if(!m.nodes.some(n => n.id === to)) return;
      if(m.edges.some(e => e.from === from && e.to === to && e.rel === 'DEPENDS_ON')) return;
      m.edges.push({ id:uid('e'), from, to, rel:'DEPENDS_ON', note:'' });
    });
  });
  /* anything the profile no longer defines leaves with it, edges included */
  const stale = m.nodes.filter(n => n.layer === layer.id && n.id.indexOf('pp_') === 0 && !keep.has(n.id)).map(n => n.id);
  if(stale.length){
    m.nodes = m.nodes.filter(n => stale.indexOf(n.id) < 0);
    m.edges = m.edges.filter(e => stale.indexOf(e.from) < 0 && stale.indexOf(e.to) < 0);
  }
  m.proportionsProfile = p.name;
  return { layerId:layer.id, variables:(p.variables||[]).length, ceilings:(p.ceilings||[]).length, replaced:!!existing };
}

function wirePropForm(root){
  const save = () => saveProps();
  const repaint = which => {
    const map = { vars:['ppVars', propVarsHTML], ceil:['ppCeil', propCeilingsHTML],
                  inv:['propInv', propInvHTML], inf:['propInf', propInfHTML], checks:['ppChecks', propChecksHTML] };
    Object.keys(map).forEach(k => {
      if(which && which !== k && k !== 'ceil' && k !== 'checks') return;
      const el = $(map[k][0]); if(el) el.innerHTML = map[k][1]();
    });
    save(); wireAll();
  };
  function wireAll(){
    /* variables */
    on('[data-vf]','change', e => {
      const i = +e.currentTarget.dataset.i, f = e.currentTarget.dataset.vf;
      state.proportions.variables[i][f] = f === 'value' ? (+e.currentTarget.value || 0) : e.currentTarget.value;
      repaint('vars');
    }, root);
    on('[data-vd]','click', e => { state.proportions.variables.splice(+e.currentTarget.dataset.vd,1); repaint('vars'); }, root);
    const va = $('vAdd'); if(va) va.onclick = () => {
      state.proportions.variables.push({ key:'newVariable', label:'New variable', value:1, unit:'', note:'' });
      repaint('vars');
    };
    /* ceilings */
    on('[data-cf]','change', e => {
      const i = +e.currentTarget.dataset.i, f = e.currentTarget.dataset.cf;
      state.proportions.ceilings[i][f] = e.currentTarget.value;
      repaint('ceil');
    }, root);
    on('[data-cd]','click', e => { state.proportions.ceilings.splice(+e.currentTarget.dataset.cd,1); repaint('ceil'); }, root);
    const ca = $('cAdd'); if(ca) ca.onclick = () => {
      state.proportions.ceilings.push({ key:'newCeiling', label:'New ceiling', expr:'1', unit:'', note:'' });
      repaint('ceil');
    };
    /* inventory */
    on('[data-lgf]','change', e => {
      const i = +e.currentTarget.dataset.i, f = e.currentTarget.dataset.lgf;
      state.proportions.inventory[i][f] = f === 'name' ? e.currentTarget.value : (+e.currentTarget.value || 0);
      repaint('inv');
    }, root);
    on('[data-lgd]','click', e => { state.proportions.inventory.splice(+e.currentTarget.dataset.lgd,1); repaint('inv'); }, root);
    const la = $('lgAdd'); if(la) la.onclick = () => {
      state.proportions.inventory.push({ id:uid('lg'), name:'New system', ageYears:5, coupling:2, dataScale:2 });
      repaint('inv');
    };
    /* influence */
    on('[data-inf]','change', e => {
      const i = +e.currentTarget.dataset.i, f = e.currentTarget.dataset.inf;
      state.proportions.influence[i][f] = f === 'name' ? e.currentTarget.value
        : f === 'veto' ? e.currentTarget.value === '1' : (+e.currentTarget.value || 0);
      repaint('inf');
    }, root);
    on('[data-ind]','click', e => { state.proportions.influence.splice(+e.currentTarget.dataset.ind,1); repaint('inf'); }, root);
    const ia = $('inAdd'); if(ia) ia.onclick = () => {
      state.proportions.influence.push({ id:uid('in'), name:'New stakeholder', weight:2, veto:false });
      repaint('inf');
    };
    /* detectors */
    on('[data-kf]','change', e => {
      const i = +e.currentTarget.dataset.i, f = e.currentTarget.dataset.kf;
      state.proportions.checks[i][f] = f === 'penalty' ? (+e.currentTarget.value || 0) : e.currentTarget.value;
      repaint('checks');
    }, root);
    on('[data-kd]','click', e => { state.proportions.checks.splice(+e.currentTarget.dataset.kd,1); repaint('checks'); }, root);
    const ka = $('kAdd'); if(ka) ka.onclick = () => {
      state.proportions.checks.push({ key:uid('k'), noun:'new thing', ceiling:(state.proportions.ceilings[0]||{}).key || '',
        penalty:14, words:'' });
      repaint('checks');
    };
  }
  wireAll();
  on('[data-ph]','change', e => {
    state.proportions.phrases = state.proportions.phrases || {};
    state.proportions.phrases[e.currentTarget.dataset.ph] =
      e.currentTarget.value.split('\n').map(x => x.trim().toLowerCase()).filter(Boolean);
    save();
  }, root);
  const nm = $('ppName'); if(nm) nm.onchange = () => { state.proportions.name = nm.value.trim() || 'Untitled profile'; save(); };
  const nt = $('ppNote'); if(nt) nt.onchange = () => { state.proportions.note = nt.value; save(); };

  /* A verdict belongs to the profile it was produced against. Switching,
     creating or resetting the profile therefore has to drop it, or the page
     goes on showing "WITHIN PROPORTION" underneath a set of ceilings that
     never produced it. */
  const clearCheck = () => { state.lastValidation = null; state.propReading = null; };

  const pick = $('propPick');
  if(pick) pick.onchange = () => {
    const i = +pick.value;
    if(i < 0) return;   /* the "unsaved" marker. There is nothing to load. */
    state.proportions = clone(state.propProfiles[i] || starterProportions());
    clearCheck(); save(); render();
  };
  const ps = $('propSave');
  if(ps) ps.onclick = () => {
    /* Keyed on name, this could not update a profile you had renamed: the
       lookup missed, the profile was unshifted as a second copy, and the
       original stayed in the list under its old name. */
    if(!state.proportions.id) state.proportions.id = uid('pp');
    const i = propIndexOf(state.propProfiles, state.proportions);
    if(i > -1) state.propProfiles[i] = clone(state.proportions);
    else state.propProfiles.unshift(clone(state.proportions));
    state.propProfiles = state.propProfiles.slice(0, 8);
    save(); render();
  };
  const pn = $('propNew');
  if(pn) pn.onclick = () => {
    /* Three faults lived in this handler.

       1. The new profile was installed into state.proportions but never added
          to state.propProfiles, so the picker had no option to select. With no
          `selected` attribute emitted the browser falls back to the first
          option, and the control reported that the default profile was loaded
          while the editor held an empty one. It is now in the list before the
          render, so the picker shows what is actually open.
       2. The name was the literal 'New profile' every time. Two presses gave
          two profiles the save button could not tell apart.
       3. The pasted proposal, the AI reading and the last verdict all survived
          the reset, so an empty profile opened carrying the previous one's
          text and result — the "old data" this was reported as. */
    const p = blankProportions(uniqueProfileName('New profile'));
    state.propProfiles.unshift(clone(p));
    state.propProfiles = state.propProfiles.slice(0, 8);
    state.proportions  = p;
    state.propDraft    = '';
    clearCheck();
    save(); render();
  };
  const pr = $('propReset');
  /* Loading the example is additive and never overwrites what is open: it goes
     into the list under its own name and is then selected, the same way
     "New, empty" does. The button this replaces was called "Reset to the
     default" and it silently replaced the open profile with the procurement
     office — which is how invented figures got into a workspace that had
     never asked for them. A second press re-selects the copy already there
     rather than stacking duplicates. */
  if(pr) pr.onclick = () => {
    const at = state.propProfiles.findIndex(x => x.id === PROPORTION_EXAMPLE.id);
    if(at > -1) state.proportions = clone(state.propProfiles[at]);
    else {
      const ex = clone(PROPORTION_EXAMPLE);
      ex.name = uniqueProfileName(ex.name);
      state.propProfiles.unshift(clone(ex));
      state.propProfiles = state.propProfiles.slice(0, 8);
      state.proportions  = ex;
    }
    state.propDraft = '';
    clearCheck(); save(); render();
  };
  const pl = $('propLayer');
  if(pl) pl.onclick = () => {
    /* Every other mutating handler snapshots first. This one did not, so the
       next Ctrl-Z restored a models array from before the layer existed and the
       layer went with it, silently. */
    markChange('add proportions layer');
    const r = addProportionsLayer(model(), state.proportions);
    saveModels();
    showBig('Proportions added as a layer', `
      <div class="note good"><b>${r.replaced ? 'Layer refreshed' : 'Layer added'}.</b>
        ${r.variables} variable node${r.variables===1?'':'s'} and ${r.ceilings} ceiling node${r.ceilings===1?'':'s'}
        are now part of “${esc(model().name)}”, with a <code>DEPENDS_ON</code> edge from each ceiling to every
        variable its expression reads.</div>
      <p class="lede">They are ordinary nodes from here on. They appear in the graph, they can be traced
        through, the audit sees them, and every export carries them. Change a variable here and press this
        button again — the layer is rewritten rather than duplicated, and anything the profile no longer
        defines is removed from it.</p>
      <div class="row"><button class="btn brand" data-nav="/structure">Open the model</button></div>`);
    on('[data-nav]','click', e => { closeModals(); navigate(e.currentTarget.dataset.nav); }, $('bigBody'));
  };

  const ta = $('propText');
  if(ta) ta.addEventListener('input', () => { state.propDraft = ta.value; });
  on('[data-clear]','click', () => {
    if(!ta) return;
    ta.value = ''; state.propDraft = ''; state.lastValidation = null;
    const o = $('propOut'); if(o) o.innerHTML = '';
  }, root);
  const runAi = $('propRunAi');
  if(runAi) runAi.onclick = () => { state.propDraft = ta ? ta.value : ''; propReadWithAI(); };
  const run = $('propRun');
  if(run) run.onclick = () => {
    state.propDraft = ta ? ta.value : '';
    state.propReading = null;
    state.lastValidation = validateProportions(state.propDraft, state.proportions);
    const o = $('propOut');
    if(o){ o.innerHTML = propResultHTML(state.lastValidation); o.scrollIntoView({ behavior:'smooth', block:'nearest' }); }
  };
}

/* THE OTHER READING PROBLEM

   The detectors above are regexes, and for the things that genuinely have a
   shape — an email address, a URL, a bolt endpoint, a ticket reference — a regex
   is the right tool and beats a model on both cost and reliability. Those stay.

   What a regex cannot do is tell a company from a product from a person from a
   department when all four are just capitalised words in a sentence. "Lamie",
   "TravelInsurance", "Infobip" and "BSS" look identical to a pattern matcher.
   That is the gap this fills, and it is the gap that matters, because the
   identifying detail in an architecture model is almost never in an email
   address — it is in the vendor names.

   Same discipline as everywhere else: it proposes, you accept one at a time,
   nothing is redacted without you saying so. And it is shown the model's own
   text, so if you are not comfortable with that leaving the machine, this is the
   button not to press. */
function anonAiSystem(){
  return [
    'You find identifying detail in technical text so it can be replaced before the',
    'text is shared. You do not rewrite anything; you list what you found.',
    '',
    'Look for what a pattern matcher cannot see: organisation and company names,',
    'vendor and product names, internal system and application names, team or',
    'department names, people, place names, and internal codes that identify a',
    'specific commercial thing (product codes, tariff codes, partner names).',
    '',
    'Do NOT list generic technical vocabulary. "database", "SFTP", "timer", "REST",',
    '"PostgreSQL", "Kafka" and "SMS" identify nobody. Naming them would replace a',
    'readable model with placeholder soup, which is worse than not anonymising: the',
    'structure has to survive for the model to still be worth anything.',
    '',
    'For each finding give a replacement that keeps the SHAPE of the original so',
    'the text still reads: a vendor becomes VENDOR_A, a second vendor VENDOR_B, a',
    'product PRODUCT_A, an application APP_A, a team TEAM_A, a person PERSON_A.',
    'Consistency matters more than cleverness \u2014 the same original must always get',
    'the same replacement, and two different originals must never share one.',
    '',
    'Reply with JSON only. No prose, no fence.',
    '{"findings":[{"find":"exact string as it appears","replace":"VENDOR_A",',
    '              "cat":"organisation|person|system|product|identifier|contact|location",',
    '              "why":"what it identifies"}],',
    ' "kept":["things you deliberately left alone, and why, briefly"]}'
  ].join('\n');
}

async function anonAskAI(){
  const m = model(); if(!m) return;
  state.anonAi = { busy:true };
  render();
  try {
    const raw = await llmAsk(anonAiSystem(), modelText(m).slice(0, 24000));
    const cleaned = String(raw).replace(/^[\s\S]*?```(?:json)?/, '').replace(/```[\s\S]*$/, '').trim()
                    || String(raw).trim();
    let parsed;
    try { parsed = JSON.parse(cleaned); }
    catch(e){ parsed = JSON.parse(String(raw).slice(String(raw).indexOf('{'), String(raw).lastIndexOf('}')+1)); }
    const have = new Set(state.anonRules.map(r => String(r.find).toLowerCase()));
    state.anonAi = { busy:false, kept: parsed.kept || [],
      findings: (parsed.findings || []).filter(f => f.find && !have.has(String(f.find).toLowerCase())) };
  } catch(e){ state.anonAi = { busy:false, error:e.message }; }
  render();
}

function anonAiHTML(){
  const a = state.anonAi;
  if(!llmOn()) return `<div class="note"><b>Pattern matching only.</b> The detectors below find things with a
    shape \u2014 addresses, URLs, endpoints, ticket references \u2014 and for those a pattern beats a model.
    What they cannot find is a vendor name, a product name or a team name, because those are just

  if(!a) return `<div class="note"><b>The detectors below cannot see names.</b> A company, a product, an

      <i class="fas fa-wand-magic-sparkles"></i> Find names a pattern cannot</button></div>`;

  if(a.error) return `<div class="note bad"><b>That did not work.</b> ${esc(a.error)}
    <div class="row" style="margin-top:10px;"><button class="btn sm ghost" id="anAi">Try again</button></div></div>`;
  if(!a.findings.length) return `<div class="note good"><b>Nothing further found.</b> Either the model is
    already anonymised, or every name in it is already covered by a rule below.
    <div class="row" style="margin-top:10px;"><button class="btn sm ghost" id="anAi">Look again</button></div></div>`;
  return `
    <div class="note"><b>${a.findings.length} name${a.findings.length===1?'':'s'} a pattern would have
      missed.</b> Accept the ones that identify something real. Each becomes a rule below, applied on every
      export while the anonymiser is on.</div>
    ${a.findings.map((f,i) => `
      <div class="apr">
        <div class="apr-b"><b>${esc(f.cat||'name')}</b>
          <span>${esc(f.find)} \u2192 <code>${esc(f.replace)}</code></span>
          ${f.why ? `<p>${esc(f.why)}</p>` : ''}</div>
        <button class="btn sm brand" data-anacc="${i}"><i class="fas fa-check"></i> Accept</button>
        <button class="btn sm ghost" data-anrej="${i}">Reject</button>
      </div>`).join('')}
    <div class="row" style="margin-top:8px;">
      <button class="btn sm ghost" id="anAiAll">Accept all ${a.findings.length}</button>
      <button class="btn sm ghost" id="anAiNone">Dismiss</button>
    </div>
    ${(a.kept||[]).length ? `<p style="font-size:10.5px;color:var(--muted);margin-top:12px;line-height:1.7;">
      <b>Deliberately left alone:</b> ${a.kept.map(k => esc(k)).join(' \u00b7 ')}. Replacing generic technical
      vocabulary would turn a readable model into placeholder soup, and the structure has to survive for the
      model to still be worth anything.</p>` : ''}`;
}

function wireAnonAi(root){
  const b = document.getElementById('anAi');
  if(b) b.onclick = () => anonAskAI();
  const acc = i => {
    const f = (state.anonAi && state.anonAi.findings || [])[i]; if(!f) return;
    state.anonRules.push({ find:f.find, replace:f.replace || 'PLACEHOLDER', cat:f.cat || 'organisation', regex:false });
    state.anonAi.findings.splice(i, 1);
    saveAnon(); render();
  };
  on('[data-anacc]','click', e => acc(+e.currentTarget.dataset.anacc), root);
  on('[data-anrej]','click', e => {
    state.anonAi.findings.splice(+e.currentTarget.dataset.anrej, 1); render();
  }, root);
  const all = document.getElementById('anAiAll');
  if(all) all.onclick = () => {
    (state.anonAi.findings || []).forEach(f => state.anonRules.push({
      find:f.find, replace:f.replace || 'PLACEHOLDER', cat:f.cat || 'organisation', regex:false }));
    state.anonAi.findings = []; saveAnon(); render();
  };
  const none = document.getElementById('anAiNone');
  if(none) none.onclick = () => { state.anonAi = null; render(); };
}

/* ═══════════════════════════════════════════════════════════════════════════
   VIEW — anonymise
   ═══════════════════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════════════
   DOCUMENT VIEW

   A second renderer over the same knowledge model. No new data model, no second
   application — a document model is nodes in layers with typed edges, exactly
   like any other. What differs is what the layers mean: L1 is the document
   itself, L2 is what it commits to, L3 is what would settle whether that is
   true.

   Why this is drawn by hand rather than by vis-network: a document is an ordered
   tree with cross-links, and a graph layout engine actively fights that. It will
   scatter chapter 3 away from chapter 2 to reduce edge crossings, and the
   sequence IS the meaning — an obligation introduced in the summary and
   contradicted in the cost section is a different problem depending which came
   first. Columns in reading order with connector lines is simply the right tool,
   and it costs no library.

   The coverage arithmetic below is the part worth having. It is deterministic,
   needs no model behind it, and answers the question nobody else answers: what
   have you asserted that nothing checks?
   ═══════════════════════════════════════════════════════════════════════════ */

const DOC_KINDS = ['document','chapter','claim','obligation','evidence','analyzer'];

/* A document model is one of two things, and conflating them is the mistake this
   flag exists to prevent.

   A REFERENCE TEMPLATE describes what a document of this type must contain. Its
   claims are claims any such document would have to make; its checks are checks
   you would run against any instance. It is a yardstick, and it is reusable —
   one template reviews many documents.

   A KNOWLEDGE SOURCE is one particular document whose content IS the knowledge.
   Its claims are that document's actual assertions, and its evidence is what
   actually backs them. It is a record of one thing, not a standard.

   The difference is not cosmetic. A template exports as review instructions —
   "check the document you are given for these things". A knowledge source
   exports as domain fact — "this is what is true here". Handing a model exported
   as one to something expecting the other produces confident nonsense, which is
   why this is asked once, plainly, rather than inferred. */
const DOC_PURPOSE = {
  template: { label:'Reference template', icon:'fa-ruler-combined',
    short:'A yardstick other documents are reviewed against.',
    long :'Its claims are the claims any document of this type must make, and its checks are what you would run against any instance. Reusable: one template reviews many documents.',
    exports:'Exports as review instructions \u2014 what to look for in a document you are handed.' },
  knowledge: { label:'Knowledge source', icon:'fa-book',
    short:'One document whose content is itself the knowledge.',
    long :'Its claims are what this particular document actually asserts and its evidence is what actually backs them. A record of one thing, not a standard.',
    exports:'Exports as domain fact \u2014 what is true in this area, drawn from this document.' }
};
/* ═══════════════════════════════════════════════════════════════════════════
   OPEN POINTS

   Everything above this line assumes that an unspecified node is an unfinished
   one. docCoverage reports obligations nobody owns and claims nothing checks;
   validateLogic reports steps connected to nothing; the gap-audit perspective
   hunts nodes with no relationship at all. All three are right most of the time
   and wrong in one specific, common case.

   "Marko checks the nJAMS logs" is not an unfinished model. It is a complete and
   correct statement that the flow hands off at this point and the model does not
   know what happens next — deliberately, because nJAMS is somebody else's system
   and Marko is a person, not a process anybody here can specify. Left as it was,
   the tool nagged about it forever: a permanent false positive, which is exactly
   how a validator earns the right to be ignored.

   So openness is declarable. A node or a step marked open is CLOSED as a
   modelling act while remaining OPEN as an implementation, and the checks say so
   rather than counting it as a defect.

   WHY A PROP AND NOT A KIND. Kinds are domain vocabulary — product, rule, actor,
   process. They say what a thing IS. Openness says how complete your model of it
   is, which is a fact about your relationship to the domain rather than about the
   domain, and putting it in KINDS would be the same category error the deleted
   PLANS table made when it conflated a billing tier with a capability. Three
   practical consequences settled it. A prop can declare an EXISTING obligation
   deliberately unowned, where a kind would force you to delete the obligation and
   replace it with something that is no longer one. docCoverage walks
   docModel()'s per-kind collections rather than enumerating kinds, so a 23rd kind
   would have been silently ignored by the very checks it needed to reach. And
   KINDS is already 22 against a comment in this file complaining that 22 is more
   than anyone can hold.

   THE POINT NOBODY ASKED FOR AND EVERYONE NEEDS. An open point is an instruction
   to a language model NOT TO FILL THE GAP IN. An unspecified area in an exported
   prompt is indistinguishable from an omission, so a model guesses, fluently, and
   the guess reads exactly like the rest of the document. Declaring the boundary is
   the same fight the Proportions layer picks, one level down.

   RESOLVES === 'model' IS KNOWLEDGE LINKING. It is not a second feature. A link
   to another model is one resolution kind of one primitive, which is why every
   earlier attempt to design it separately felt bolted on.
   ═══════════════════════════════════════════════════════════════════════════ */
/* One fieldset, two editors. A graph node and a logic step ask exactly the same
   four questions about a handoff, so they get the same control rather than two
   that drift apart. `pfx` keeps the element ids distinct between the two modals. */
function openFieldsetHTML(o, pfx){
  const on = !!o;
  const r  = on ? o.resolves : 'unknown';
  return `
    <div class="openfs${on ? ' on' : ''}">
      <label class="openfs-h">
        <input type="checkbox" id="${pfx}OpenOn" ${on ? 'checked' : ''}>
        <span><i class="fas fa-circle-half-stroke"></i> <b>This is an open point</b> \u2014 deliberately not
          specified further</span>
      </label>
      ${on ? `
        <p class="openfs-i">The checks will stop reporting this as a gap, and the export will tell a model
          <b>not to invent what happens here</b>. That is the point: an unspecified area in a prompt is
          indistinguishable from an omission, so a model fills it in fluently and the guess reads like the
          rest of the document.</p>
        <div class="row" style="gap:8px;">
          <div class="field" style="flex:1;min-width:150px;margin:0;"><label class="f">Who holds it</label>
            <input type="text" id="${pfx}OpenOwner" value="${esc(o.owner)}" placeholder="e.g. Marko"></div>
          <div class="field" style="flex:1;min-width:170px;margin:0;"><label class="f">What happens here</label>
            <select id="${pfx}OpenRes">${OPEN_RESOLVE_IDS.map(k =>
              `<option value="${k}"${r === k ? ' selected' : ''}>${esc(OPEN_RESOLVES[k].label)}</option>`).join('')}</select></div>
        </div>
        <p class="openfs-i" style="margin:6px 0 8px;">${esc(OPEN_RESOLVES[r].hint)}</p>
        ${r === 'model' ? `
          <div class="field" style="margin:0;"><label class="f">Which model describes it</label>
            <select id="${pfx}OpenRef">
              <option value="">\u2014 pick one \u2014</option>
              ${(state.models || []).filter(x => x.id !== (model()||{}).id).map(x =>
                `<option value="${esc(x.id)}"${o.ref === x.id ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}
            </select></div>
          <p class="openfs-i">This is the knowledge link. The export names the other model as where this point
            is described, instead of leaving a reader to guess that it is described anywhere at all.</p>`
        : r === 'ask' ? ''
        : `<div class="field" style="margin:0;"><label class="f">${
             r === 'person' ? 'What they do' : r === 'system' ? 'Which system' : 'What is undecided'}</label>
            <input type="text" id="${pfx}OpenRef" value="${esc(o.ref)}"
              placeholder="${r === 'system' ? 'e.g. nJAMS' : r === 'person' ? 'e.g. checks the nJAMS logs' : 'e.g. whether we keep the nightly job'}"></div>`}
        <div class="field" style="margin:8px 0 0;"><label class="f">Note \u2014 optional</label>
          <input type="text" id="${pfx}OpenNote" value="${esc(o.note)}"
            placeholder="Anything a reader needs to know about the handoff itself"></div>`
      : `<p class="openfs-i">Use this when something genuinely is not specified here and should not be: a
          person does it, another system does it, another model describes it, or it is simply not decided.
          Without it the checks will report it as a defect forever, which is how a check earns the right to be
          ignored.</p>`}
    </div>`;
}
/* Reads the fieldset back into an object, or null when the box is unticked.
   `onChange` re-paints, because switching what it resolves to changes which
   third field is shown. */
function wireOpenFieldset(pfx, current, onChange){
  const box = $(pfx + 'OpenOn');
  if(!box) return;
  const read = () => {
    if(!$(pfx + 'OpenOn') || !$(pfx + 'OpenOn').checked) return null;
    const g = id => { const el = $(pfx + id); return el ? el.value : ''; };
    return { owner:g('OpenOwner').trim(), resolves:g('OpenRes') || 'unknown',
             ref:g('OpenRef').trim(), note:g('OpenNote').trim() };
  };
  box.onchange = () => onChange(box.checked
    ? (current || { owner:'', resolves:'unknown', ref:'', note:'' }) : null);
  const res = $(pfx + 'OpenRes');
  if(res) res.onchange = () => onChange(read());
  ['OpenOwner','OpenRef','OpenNote'].forEach(k => {
    const el = $(pfx + k);
    /* Read on input rather than on blur: the Save button is outside this
       fieldset, and a value typed and then clicked away from was being lost. */
    if(el) el.addEventListener('input', () => { const v = read(); if(v) Object.assign(current || {}, v); });
  });
}
/* The list, wherever it is shown. Read-only: an open point is edited on the node

          ${p.open.note ? `<p style="margin:2px 0 0;font-size:10.5px;color:var(--muted);line-height:1.6;">${esc(p.open.note)}</p>` : ''}</td>
        <td style="font-size:11px;">${esc(p.open.owner || '\u2014')}</td>
