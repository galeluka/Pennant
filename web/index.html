/* ── profile identity ─────────────────────────────────────────────────────
   Three small functions, here rather than inline in the handlers, because the
   picker, the save button and the new button all have to agree on what makes
   two profiles the same thing. They did not, and that disagreement was the
   bug: name was the key in one place and id in another. */

/* A profile with nothing in it. Written once so "New, empty" and any future
   caller cannot drift apart on which keys a profile is expected to have —
   propVarsHTML and friends read every one of these and would render an empty
   state rather than throw, but computeCeilings would still be handed
   undefined. */
function blankProportions(name){
  return { id:uid('pp'), name:name || 'New profile', note:'',
           variables:[], ceilings:[], inventory:[], influence:[], checks:[],
           phrases:{ scale:[], greenfield:[], structural:[], narrative:[] } };
}

/* What a workspace that has never had a profile saved into it opens with: one
   empty profile, named so the picker has something to show, and carrying no
   variables, no ceilings, no inventory and no stakeholders. Nothing on the
   Proportions page then states anything the user did not type.

   The empty state is not a degraded one. The page renders every section from
   these arrays, computeCeilings() over no variables returns no ceilings, and
   the Export page already has the warning for "switched on and holds no
   ceilings" — which now fires for a new workspace, correctly, instead of
   staying silent while the manifest reported somebody else's ledger. */
function starterProportions(){ return blankProportions('Untitled profile'); }

/* Called once after the state literal and again from rebuildState(), because a
   profile-switch re-reads the store and must not fall back into the example
   either. The two fields have to agree: propPick selects by index into
   propProfiles, so an open profile that is in no list renders as "unsaved". */
function normaliseProportions(){
  if(!state.proportions) state.proportions = starterProportions();
  if(!Array.isArray(state.propProfiles) || !state.propProfiles.length)
    state.propProfiles = [clone(state.proportions)];
}

/* "New profile", then "New profile 2". Pressing the button twice used to make
   two profiles with one name, and the name-keyed save then overwrote the first
   with the second without saying so. */
function uniqueProfileName(base){
  const taken = new Set((state.propProfiles || []).map(x => x.name));
  if(!taken.has(base)) return base;
  let n = 2;
  while(taken.has(base + ' ' + n)) n++;
  return base + ' ' + n;
}

/* The id is the identity. The name comparison is a fallback for profiles
   written by a build that did not set one — without it those become
   unsaveable, because they would never match and would be re-added on every
   press until the eight-profile cap quietly ate the rest. */
function propIndexOf(list, p){
  if(!p) return -1;
  if(p.id){
    const i = list.findIndex(x => x.id === p.id);
    if(i > -1) return i;
  }
  return list.findIndex(x => !x.id && x.name === p.name);
}

/* ── the ceilings ─────────────────────────────────────────────────────────
   Variables first, then the built-ins derived from the tables, then each
   ceiling in the order it is written — so a ceiling may refer to one above
   it. A ceiling that will not parse reports its error and evaluates to zero
   rather than taking the page down with it. */
function computeCeilings(p){
  /* An empty profile, not the example. A missing argument is a caller bug, and
     answering it with invented variables produces ceilings that look computed
     and are not. */
  p = p || blankProportions();
  const scope = {}, errors = [];
  (p.variables || []).forEach(v => { if(v.key) scope[v.key] = Number(v.value) || 0; });

  const items = (p.inventory || []).map(s => ({ ...s,
    mass: +(((Number(s.ageYears)||0) * (Number(s.coupling)||1) *
             (0.6 + 0.2 * (Number(s.dataScale)||1))).toFixed(1)) }));
  const legacyMass = +items.reduce((a,s) => a + s.mass, 0).toFixed(1);
  const heaviest   = items.slice().sort((a,b) => b.mass - a.mass)[0] || null;
  const vetoes = (p.influence || []).filter(x => x.veto).length;
  const power  = (p.influence || []).reduce((a,x) => a + (Number(x.weight)||0), 0);

  /* built-ins, available to every expression and not editable as variables */
  scope.legacyMass      = legacyMass;
  scope.inventoryCount  = items.length;
  scope.vetoes          = vetoes;
  scope.influencePower  = power;
  scope.influenceCount  = (p.influence || []).length;

  const ceil = {}, meta = [];
  (p.ceilings || []).forEach(c => {
    if(!c.key) return;
    const r = evalExpr(c.expr, scope);
    if(!r.ok) errors.push({ key:c.key, error:r.error });
    const v = r.ok ? +r.value.toFixed(2) : 0;
    scope[c.key] = v; ceil[c.key] = v;
    meta.push({ ...c, value:v, refs:r.refs, error:r.error });
  });
  /* the scale law needs to be able to measure "engineers assumed" against a
     variable rather than a ceiling, so variables are addressable too */
  const named = k => (k in scope ? scope[k] : (k === 'itStaffVar' ? (scope.itStaff || 0) : 0));

  return {
    scope, ceil, meta, errors, items, legacyMass, heaviest, vetoes, power,
    /* names the rest of the build already uses — resolved, not hard-coded */
    it: scope.itStaff || 0, head: scope.orgHeadcount || 0,
    integrations: ceil.integrations, services: ceil.services, environments: ceil.environments,
    workstreams: ceil.workstreams, vendors: ceil.vendors, contexts: ceil.contexts,
    minMigrationWeeks: ceil.minMigrationWeeks, itRatio: ceil.itRatio,
    window: scope.changeWindowWeeks || 0, runRate: scope.budgetMonthly || 0,
    lookup: named
  };
}

/* Does the proposal actually name this system? Parenthesised aliases count —
   "Core ledger (AS/400)" is usually referred to by whichever half the author
   prefers. Short words are ignored so "Core" does not match "core team". */
function systemMentioned(name, low){
  const s = String(name || '').toLowerCase();
  const alias = s.match(/\(([^)]+)\)/);
  if(alias && alias[1].trim().length >= 3 && low.includes(alias[1].trim())) return true;
  return s.replace(/\([^)]*\)/g, ' ').split(/[^a-z0-9]+/)
          .filter(w => w.length >= 5).some(w => low.includes(w));
}
/* A detector's noun list becomes the same regex shape the original used:
   a number, optionally a couple of adjectives, then one of the nouns. */
function checkRegex(words){
  const list = String(words || '').split(',').map(w => w.trim()).filter(Boolean)
    .sort((a,b) => b.length - a.length)
    .map(w => w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+'));
  if(!list.length) return null;
  return new RegExp('(\\d[\\d,]*)\\s*(?:\\+\\s*)?(?:\\w+[\\s-]){0,2}?(' + list.join('|') + ')\\b', 'gi');
}

/* ── the check ───────────────────────────────────────────────────────────── */
/* THE READING PROBLEM

   Everything below the extraction step is real arithmetic: expressions over
   variables you set, evaluated by a parser, compared to counts. That part is
   trustworthy.

   The extraction was not. It scanned prose with word-list regexes, which means
   it could not tell "we will build five connectors" from "we will not build five
   connectors", could not see "up to five" as different from "five", and read
   anything numeric near a matching noun as a commitment. On a real proposal that
   is not a small inaccuracy — a conditional read as a commitment inverts the
   verdict.

   So the reading is now optional and can be handed to a model, which is the one
   thing a model is genuinely better at than a regex. The judging is untouched:
   the same ceilings, the same laws, the same arithmetic, applied to a better
   reading. The model never decides whether a proposal passes. */
function validateProportions(text, profile, opts){
  const p   = profile || blankProportions();
  const c   = computeCeilings(p);
  const raw = String(text || '');
  const low = raw.toLowerCase();
  const ph  = p.phrases || {};
  const out = { ceilings:c, laws:[], corrections:[], quantities:[], score:100,
                verdict:'WITHIN PROPORTION', checkedAt:Date.now(), chars:raw.length,
                readBy: (opts && opts.found) ? 'model' : 'pattern' };

  if(!raw.trim()){
    out.laws.push({ id:'empty', law:'Nothing to check', state:'info', icon:'fa-circle-info',
      text:'Paste a proposal, a roadmap or a summary above — or load one of the worked examples.', numbers:'' });
    out.verdict = 'NO INPUT'; out.score = 0;
    return out;
  }
  if(c.errors.length){
    out.laws.push({ id:'broken', law:'0 · Profile', state:'fail', icon:'fa-triangle-exclamation',
      text:'One or more ceilings will not evaluate, so the checks below are running against zeros. Fix the expression before reading anything else here.',
      numbers: c.errors.map(e => e.key + ': ' + e.error).join('\n') });
  }

  /* ── LAW 1 — scale ───────────────────────────────────────────────────── */
  const found = [];
  /* A reading supplied from outside replaces the regex scan entirely rather than
     adding to it. Mixing the two would double-count, and worse, would reinstate
     exactly the misreadings the extraction was handed over to avoid. */
  const supplied = opts && Array.isArray(opts.found) ? opts.found : null;
  if(supplied){
    supplied.forEach(f => {
      const rule = (p.checks || []).find(r => r.key === f.key);
      const n = parseInt(f.n, 10);
      if(!isFinite(n) || n <= 0) return;
      /* A key the profile does not define used to be dropped here, silently and
         without trace. On a new workspace that is EVERY key, because a starter
         profile carries checks:[] — so the model would read the text correctly,
         report six quantities, and this loop would throw all six away. Law 1
         then found nothing over its ceiling and announced that every quantity
         sat inside the capacity of the landscape, which is not a lenient
         reading of the text, it is a statement about an empty array. The same
         verdict came back for a forty-eight-microservice mesh and a shopping
         list.

         An unmatched key is now kept and marked uncalibrated: there is no
         ceiling to measure it against, so it cannot be an overrun and cannot
         cost a point, but it is carried into out.quantities and shown. The
         reader sees what was counted and that nothing has been set for it to
         be counted against, which is the actual state of affairs. */
      found.push(rule
        ? { key:f.key, noun:rule.noun, n, ceiling:c.lookup(rule.ceiling),
            penalty:+rule.penalty || 14, phrase:f.phrase || '',
            read:f.read || '', byModel:true }
        : { key:f.key, noun:(f.key || 'unnamed').replace(/_/g,' '), n, ceiling:Infinity,
            penalty:0, phrase:f.phrase || '',
            read:f.read || '', byModel:true, uncalibrated:true });
    });
  }
  if(!supplied) (p.checks || []).forEach(r => {
    const re = checkRegex(r.words); if(!re) return;
    let m;
    while((m = re.exec(raw)) !== null){
      const n = parseInt(String(m[1]).replace(/,/g,''), 10);
      if(!isFinite(n) || n <= 0) continue;
      /* A four-digit year next to a noun is a date, not a count. Without this
         guard "its 2019 connector reaches end of life" reads as a proposal for
         two thousand and nineteen connectors, which is the kind of confident
         nonsense this whole layer exists to stop. */
      if(n >= 1900 && n <= 2100) continue;
      if(n > 100000) continue;
      found.push({ key:r.key, noun:r.noun, n, ceiling:c.lookup(r.ceiling), penalty:+r.penalty || 14, phrase:m[0].trim() });
    }
  });
  /* one entry per kind, the largest claim wins — a proposal that says five
     APIs in one paragraph and a hundred in the next is a hundred-API proposal */
  const byKind = {};
  found.forEach(f => { if(!byKind[f.key] || f.n > byKind[f.key].n) byKind[f.key] = f; });
  out.quantities = Object.values(byKind);

  const overruns = out.quantities.filter(q => !q.uncalibrated && q.n > q.ceiling);
  const uncal    = out.quantities.filter(q => q.uncalibrated);
  const tells = (ph.scale || []).filter(t => low.includes(t));
  overruns.forEach(q => out.corrections.push({ kind:'clamp', noun:q.noun, was:q.n, now:q.ceiling,
    line:'Reverting from ' + q.n + ' ' + q.noun + ' to ' + q.ceiling + ' to stay inside what this landscape can operate.' }));
  tells.forEach(t => out.corrections.push({ kind:'strike', noun:t, was:t, now:'—',
    line:'"' + t + '" describes an operating model this landscape has nobody to run. Removed.' }));
  /* Three outcomes, not two. The third — quantities were read but this profile
     defines nothing to measure them against — used to be reported as the first,
     a pass, which is where the generic verdict came from. It is now its own
     state and says what is missing. */
  const noDetectors = !(p.checks || []).length;
  out.laws.push({
    id:'scale', law:'1 · Scale', icon:'fa-ruler-combined',
    state: overruns.length ? 'fail' : (uncal.length || (noDetectors && out.quantities.length)) ? 'info'
         : tells.length ? 'warn' : 'pass',
    text: overruns.length
      ? overruns.length + ' quantity claim' + (overruns.length===1?'':'s') + ' exceed' + (overruns.length===1?'s':'') + ' what this organisation can operate.'
      : uncal.length
      ? uncal.length + ' quantity claim' + (uncal.length===1?' was':'s were') + ' read out of the text, and this profile sets no ceiling for '
        + (uncal.length===1?'it':'them') + '. Nothing here has been judged — a number with nothing to measure it against is a number, not a finding. Add a detector row for '
        + uncal.map(q => q.key).slice(0,4).join(', ') + ' to make this law do anything.'
      : tells.length
      ? 'Quantities are in range, but ' + tells.length + ' phrase' + (tells.length===1?'':'s') + ' describe an operating model with nobody to run it.'
      : out.quantities.length
      ? 'Every quantity in the text sits inside the capacity of the landscape as described.'
      : 'No quantity claims were found in the text, so there is nothing for this law to measure.',
    numbers: ((p.checks || []).map(r => r.noun + ' ≤ ' + c.lookup(r.ceiling)).join(' · ') || 'no detectors defined in this profile')
      + (uncal.length ? '\nuncalibrated: ' + uncal.map(q => q.n + ' ' + q.noun).join(' · ') : '')
      + (tells.length ? '\nphrases flagged: ' + tells.join(', ') : '')
  });
  /* capped per law — an unbounded subtraction turns every bad proposal into a
     zero, and a score that is always zero has stopped being a measurement */
  out.score -= Math.min(40, overruns.reduce((a,q) => a + q.penalty, 0) + tells.length * 5);

  /* ── LAW 2 — gravity ─────────────────────────────────────────────────── */
  const durations = [];
  let dm; const dre = /(\d[\d,]*(?:\.\d+)?)\s*(week|weeks|wk|month|months|day|days|sprint|sprints|quarter|quarters)\b/gi;
  while((dm = dre.exec(raw)) !== null){
    const n = parseFloat(String(dm[1]).replace(/,/g,''));
    const u = dm[2].toLowerCase();
    const weeks = /day/.test(u) ? n/5 : /week|wk/.test(u) ? n : /sprint/.test(u) ? n*2
                : /month/.test(u) ? n*4.33 : n*13;
    durations.push({ weeks:+weeks.toFixed(1), phrase:dm[0].trim() });
  }
  const shortest = durations.slice().sort((a,b) => a.weeks - b.weeks)[0] || null;
  const greenfield = (ph.greenfield || []).filter(t => low.includes(t));
  const touchesLegacy = /migrat|replace|retire|decommission|cutover|cut over|port |rehost|refactor|upgrade|modernis|moderniz/i.test(raw);

  /* Which systems are actually in scope. Charging a proposal for the mass of
     the whole estate when it names one system is the same error in the other
     direction — it would fail every scoped, sensible plan. If the text names
     none of them, all of them are assumed in scope. */
  const named = c.items.filter(s => systemMentioned(s.name, low));
  const scope = named.length ? named : c.items;
  const scopeMass  = +scope.reduce((a,s) => a + s.mass, 0).toFixed(1);
  const perWeek = (() => {
    const mm = String((p.ceilings||[]).find(x => x.key === 'minMigrationWeeks') || {}).length;
    return 6;   /* the divisor lives in the minMigrationWeeks expression; scoped mass reuses it */
  })();
  const scopeFloor = Math.max(2, Math.ceil(scopeMass / perWeek));
  const scopeHeaviest = scope.slice().sort((a,b) => b.mass - a.mass)[0] || null;
  out.scope = { systems:scope.map(s => s.name), named:named.length > 0, mass:scopeMass, floorWeeks:scopeFloor };

  let gravityState = 'pass', gravityText;
  const gravityNums = 'in scope: ' + (scope.map(s => s.name).join(', ') || 'nothing')
    + (named.length ? '' : ' (no system named — whole inventory assumed)')
    + '\nmass ' + scopeMass + ' of ' + c.legacyMass + ' total'
    + (scopeHeaviest ? ' · heaviest: ' + scopeHeaviest.name + ' (' + scopeHeaviest.ageYears + 'y, ' + (COUPLING_LABEL[scopeHeaviest.coupling]||'?') + ', mass ' + scopeHeaviest.mass + ')' : '')
    + ' → minimum ' + scopeFloor + ' weeks'
    + (shortest ? ' · shortest duration in text: ' + shortest.phrase + ' (' + shortest.weeks + ' wk)' : ' · no duration stated');

  if(touchesLegacy && shortest && shortest.weeks < scopeFloor){
    gravityState = 'fail';
    gravityText = 'A ' + shortest.phrase + ' plan against ' + scopeMass + ' units of legacy mass is not optimistic, it is arithmetically impossible. The mass in scope requires ' + scopeFloor + ' weeks before anything is designed.';
    out.corrections.push({ kind:'stretch', noun:'migration duration', was:shortest.phrase, now:scopeFloor + ' weeks',
      line:'Timeline restated from ' + shortest.phrase + ' to ' + scopeFloor + ' weeks — the floor set by the weight of what already exists.' });
    out.score -= 25;
  } else if(greenfield.length){
    gravityState = 'fail';
    gravityText = 'The proposal reaches for a fresh start (' + greenfield.join(', ') + ') while ' + scope.length + ' system' + (scope.length===1?'':'s') + ' carrying ' + scopeMass + ' units of mass stay switched on. Nothing here can be started from scratch; it can only be moved.';
    out.corrections.push({ kind:'strike', noun:'greenfield framing', was:greenfield[0], now:'incremental strangler',
      line:'"' + greenfield[0] + '" replaced with an incremental path — the existing systems are load-bearing and stay up throughout.' });
    out.score -= 20;
  } else if(touchesLegacy && !shortest){
    gravityState = 'warn';
    gravityText = 'The proposal touches legacy systems but states no duration. With ' + scopeMass + ' units of mass in scope, ' + scopeFloor + ' weeks is the floor, not an estimate.';
    out.score -= 8;
  } else if(!touchesLegacy){
    gravityText = 'No migration, retirement or cutover claimed. The existing inventory is not in scope, so its mass does not constrain this proposal.';
  } else {
    gravityText = 'Stated duration clears the floor set by the inventory (' + scopeFloor + ' weeks minimum for ' + scopeMass + ' units of mass in scope).';
  }
  out.laws.push({ id:'gravity', law:'2 · Gravity', icon:'fa-weight-hanging',
    state:gravityState, text:gravityText, numbers:gravityNums });

  /* ── LAW 3 — signal to noise ─────────────────────────────────────────── */
  const sentences = raw.split(/(?<=[.!?;\n])\s+/).map(s => s.trim()).filter(s => s.length > 12);
  let structural = 0, narrative = 0;
  const noiseSamples = [];
  sentences.forEach(s => {
    const l = s.toLowerCase();
    const st = (ph.structural || []).some(t => l.includes(t));
    const nr = (ph.narrative  || []).some(t => l.includes(t));
    if(st) structural++;
    else if(nr){ narrative++; if(noiseSamples.length < 3) noiseSamples.push(s.slice(0, 92)); }
  });
  const classified = structural + narrative;
  const signalPct = classified ? Math.round(structural / classified * 100) : null;
  let snState = 'pass', snText;
  /* A ratio needs a quorum. Two classified sentences produce 0%, 50% or 100%
     and none of those three numbers mean anything. Below the quorum this law
     reports and does not judge. */
  if(classified > 0 && classified < 3){
    snState = 'info';
    snText = 'Only ' + classified + ' statement' + (classified===1?'':'s') + ' classified as either structural or narrative — too few for a ratio to mean anything. Reported, not judged.';
  } else if(signalPct === null){
    snText = 'Nothing in the text reads as either a structural change or a narrative claim. ' + sentences.length + ' sentence' + (sentences.length===1?'':'s') + ' passed through unclassified — this filter had nothing to remove.';
    snState = 'info';
  } else if(signalPct < 50){
    snState = 'fail';
    snText = narrative + ' of ' + classified + ' classified statements are narrative — funding, positioning, adjectives. Only ' + structural + ' change anything a delivery team would act on.';
    out.corrections.push({ kind:'drop', noun:'narrative statements', was:narrative + ' narrative lines', now:structural + ' structural lines',
      line:'Dropping ' + narrative + ' narrative statement' + (narrative===1?'':'s') + '. What survives is the ' + structural + ' that change an obligation or the influence network.' });
    out.score -= 15;
  } else if(signalPct < 70){
    snState = 'warn';
    snText = signalPct + '% signal. Usable, but ' + narrative + ' statement' + (narrative===1?'':'s') + ' are positioning rather than change.';
    out.score -= 6;
  } else {
    snText = signalPct + '% signal. ' + structural + ' statement' + (structural===1?'':'s') + ' change an obligation, a deadline or who holds power; ' + narrative + ' are narrative.';
  }
  out.laws.push({ id:'signal', law:'3 · Signal', icon:'fa-tower-broadcast',
    state:snState, text:snText,
    numbers: sentences.length + ' statements read · ' + structural + ' structural · ' + narrative + ' narrative'
      + (signalPct !== null ? ' · ' + signalPct + '% signal' : '')
      + (noiseSamples.length ? '\ndropped: ' + noiseSamples.map(s => '"' + s + '…"').join(' · ') : '') });

  /* ── LAW 4 — constraint-first ────────────────────────────────────────── */
  const missing = [];
  if(!(p.influence || []).length) missing.push('influence network');
  if(!(p.inventory || []).length) missing.push('inventory');
  if(!(p.variables || []).length) missing.push('variables');
  if(!(p.ceilings  || []).length) missing.push('ceilings');
  const cfState = missing.length ? 'fail' : c.vetoes === 0 ? 'warn' : 'pass';
  out.laws.push({
    id:'constraint', law:'4 · Constraint-first', icon:'fa-diagram-project',
    state:cfState,
    text: missing.length
      ? 'Generation ran before the constraints were mapped. Missing: ' + missing.join(', ') + '. Anything produced against an unmapped landscape is a guess wearing a plan\'s formatting.'
      : c.vetoes === 0
      ? 'Power and data constraints are mapped, but nobody in the influence network can say no. A network with no veto is a list of names, and it will not stop a proposal that should be stopped.'
      : 'Constraints were mapped before generation: ' + (p.influence||[]).length + ' in the influence network (' + c.vetoes + ' with a veto, ' + c.power + ' points of weight), ' + (p.inventory||[]).length + ' systems in the inventory, ' + (p.variables||[]).length + ' variables and ' + (p.ceilings||[]).length + ' derived ceilings.',
    numbers: 'order enforced: influence network → inventory → variables → ceilings → generation'
      + '\nveto holders: ' + ((p.influence||[]).filter(x=>x.veto).map(x=>x.name).join(', ') || 'none')
  });
  if(missing.length) out.score -= 20;
  else if(c.vetoes === 0) out.score -= 5;

  /* ── verdict ─────────────────────────────────────────────────────────── */
  out.score = Math.max(0, Math.min(100, Math.round(out.score)));
  const fails = out.laws.filter(l => l.state === 'fail');
  out.verdict = fails.some(l => l.id === 'gravity') ? 'MATHEMATICALLY IMPOSSIBLE'
              : fails.some(l => l.id === 'scale')   ? 'OVER-ENGINEERED'
              : fails.some(l => l.id === 'constraint') ? 'UNGOVERNED'
              : fails.length ? 'NARRATIVE'
              : out.laws.some(l => l.state === 'warn') ? 'PROPORTIONATE, WITH NOTES'
              : 'WITHIN PROPORTION';
  return out;
}

/* ── the level ────────────────────────────────────────────────────────────
   What the reader actually wants back from a proposal check, in one word,
   before any of the arithmetic: what KIND of document is this.

   The five keys are not a new taxonomy. Four of them are the four worked
   examples below, which were already written to fail in four distinct ways,
   and which already carry these names in the picker. The fifth exists because
   a model asked to choose between four boxes will always choose one, and a
   text that is none of them — a recipe, a contract, a status mail — must have
   somewhere honest to land.

   This is the model's opinion and is labelled as such wherever it is shown.
   The laws below stay arithmetic and are computed whatever the model says.
   The two disagreeing is information, not a bug: a proposal the model reads as
   proportionate that still breaks a ceiling is the more interesting of the two
   readings, and burying either one would be the wrong call. */
const PROPOSAL_LEVELS = {
  hollywood    : { label:'Hollywood', icon:'fa-clapperboard', tone:'var(--red)',
    blurb:'Sized for an organisation that does not exist. Fluent, internally consistent, and priced in headcount nobody has.' },
  impossible   : { label:'Arithmetically impossible', icon:'fa-hourglass-half', tone:'var(--red)',
    blurb:'Not optimistic — impossible. The duration is shorter than the weight of what already exists allows.' },
  narrative    : { label:'Narrative', icon:'fa-newspaper', tone:'var(--amber)',
    blurb:'Positioning rather than change. Little here alters an obligation, a date or who holds power.' },
  proportionate: { label:'Proportionate', icon:'fa-scale-balanced', tone:'var(--green)',
    blurb:'Scoped to what this place can carry, with the thing it is not doing stated out loud.' },
  other        : { label:'Not a proposal', icon:'fa-circle-question', tone:'var(--muted)',
    blurb:'None of the four fit. This does not read as a proposal, a roadmap or a plan at all.' }
};
const PROPOSAL_LEVEL_IDS = Object.keys(PROPOSAL_LEVELS);

/* ── worked examples ──────────────────────────────────────────────────────
   Four proposals written to fail in four different ways against the default

/* Ask a model to read the proposal and return quantities in the shape the
   judging engine already expects. Two fields do the work that regex could not:
   `read` is how the model understood the sentence, and it is shown next to the
   number so a misreading is visible rather than buried; and a commitment that
   is conditional or negated is expected to be omitted, with the reason given in
   `ignored`. */
function propReadSystem(profile){
  const p = profile || blankProportions();
  const checks = p.checks || [];
  /* A starter profile has no detectors. The heading used to be printed anyway,
     followed by nothing, which told the model to use a key from an empty list —
     so it either invented one or reported no quantities at all. Say what is
     actually true instead, and let it name its own key. Nothing downstream
     breaks: an unrecognised key is now carried as uncalibrated rather than
     dropped. */
  const kinds = checks.length
    ? ['THE KINDS OF THING BEING COUNTED (use the key exactly):',
       checks.map(r => '  ' + r.key + ' \u2014 ' + r.noun +
         ' (words that usually signal it: ' + (r.words||'') + ')').join('\n')]
    : ['THE KINDS OF THING BEING COUNTED: this profile defines none yet.',
       'Use a short lower_snake_case key of your own for each kind you count',
       '(services, apis, environments, regions, teams, vendors, integrations).'];
  return [
    'You read a proposal and extract only what it COMMITS TO, then say what kind',
    'of document it is. You do not judge whether it is acceptable \u2014 something',
    'else does that arithmetic. Your job is to report accurately, and accuracy',
    'here means not counting things that were not actually promised.',
    '',
    'Count a quantity only when the text commits to it. Do NOT count it when it is',
    'negated ("we will not add five"), hypothetical ("if we added five"), a range',
    'ceiling stated as a limit ("up to five" is at most five, so five), something',
    'already in place rather than proposed, a date, a version number, a monetary',
    'amount, or an example. When you decline to count something that looks like a',
    'quantity, say so in "ignored" with the reason \u2014 that list is as useful as the',
    'counts.',
    '',
    ...kinds,
    '',
    'THE LEVEL. Pick exactly one key, on what the text is, not on whether you',
    'approve of it:',
    '  hollywood     \u2014 sized for an organisation that does not exist: large counts',
    '                  of services, regions, teams, environments or vendors, and an',
    '                  operating model nobody named is staffed to run.',
    '  impossible    \u2014 the duration cannot hold the work: a big-bang cutover, a',
    '                  rewrite or a migration of something old and load-bearing,',
    '                  scheduled in weeks or a single weekend.',
    '  narrative     \u2014 positioning rather than change: funding, partnerships,',
    '                  rebrands, awards, adjectives. Little that alters an',
    '                  obligation, a date or who decides.',
    '  proportionate \u2014 scoped to what the place can carry, and usually says out',
    '                  loud what it is deliberately NOT doing this time.',
    '  other         \u2014 none of the four. Not a proposal, roadmap or plan at all.',
    'If two fit, choose the one a reader would be most damaged by missing:',
    'impossible outranks hollywood, and both outrank narrative.',
    '',
    'Reply with JSON only. No prose, no markdown fence.',
    '{"summary":"one sentence on what this proposal is asking for",',
    ' "level":"<one of: ' + PROPOSAL_LEVEL_IDS.join(' | ') + '>",',
    ' "levelWhy":"one sentence, quoting or naming the thing in the text that decided it",',
    ' "confidence":"high | medium | low",',
    ' "found":[{"key":"<a key as described above>","n":5,',
    '           "phrase":"the words in the text that carry it",',
    '           "read":"how you understood that sentence"}],',
    ' "ignored":[{"phrase":"...","why":"negated / conditional / already exists / a date"}],',
    ' "duration":{"weeks":0,"phrase":"","read":""},',
    ' "unclear":["anything you could not resolve and would ask about"]}'
  ].join('\n');
}

async function propReadWithAI(){
  const text = state.propDraft || '';
  if(!text.trim()) return;
  state.propReading = { busy:true };
  const host = document.getElementById('ppAiOut');
  if(host) host.innerHTML = '<div class="abox-msg"><i class="fas fa-arrows-rotate"></i> Reading\u2026</div>';
  try {
    const raw = await llmAsk(propReadSystem(state.proportions), text);
    const cleaned = String(raw).replace(/^[\s\S]*?```(?:json)?/, '').replace(/```[\s\S]*$/, '').trim()
                    || String(raw).trim();
    let parsed;
    try { parsed = JSON.parse(cleaned); }
    catch(e){ parsed = JSON.parse(String(raw).slice(String(raw).indexOf('{'), String(raw).lastIndexOf('}')+1)); }
    state.propReading = { busy:false, ...parsed };
    /* Judge the model's reading with the same engine, untouched. */
    state.lastValidation = validateProportions(text, state.proportions,
                                               { found: parsed.found || [] });
    render();
  } catch(e){
    state.propReading = { busy:false, error:e.message };
    render();
  }
}
